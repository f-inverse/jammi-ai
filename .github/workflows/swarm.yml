name: Swarm gates

# No `paths:` filter on EITHER job below — every gate here always runs on
# every PR and push to main, whether it is a toolchain-free pure-Python (or
# git-diff) check (`swarm-gates`) or one that resolves against a real `syn`
# parse via `ci/tools/symbol-index` (`symbol-index-gates`, its own job so a
# Rust build never taxes the fast, toolchain-free lane the header comment
# above `swarm-gates`'s own steps still describes truthfully). A
# path-filtered workflow that is later set as a required status check would
# hang unrelated PRs (the check never reports) — this is the #245 trap. The
# TOUCHED guards below therefore detect their own touched set *inside* the
# job (via `git diff`), never via a workflow `paths:` filter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swarm-${{ github.ref }}
  # Same rationale as ci.yml's own concurrency block: a PR ref cancels its
  # own superseded runs, but a run on `main` is evidence (the only thing a
  # ledger closure's "green on main since <sha>" can cite) and must be
  # allowed to finish rather than being cancelled by the next merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: every gate here only reads the checkout; nothing publishes.
permissions:
  contents: read

jobs:
  swarm-gates:
    name: Guard (swarm constitution + boundary)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the PR base ref is present for the git-diff-scoped
      # guards and the diff-scoped governance tripwire.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Always-run gates (fail-closed; pure-Python, no toolchain) ----------

      # Total-ownership bijection over crates/ (authored separately).
      - name: Assert the swarm domain manifests partition crates/ exactly
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_swarm_bijection.py

      # Every typed anchor in the constitution resolves; every boundary invariant
      # is wired to a gate (or honestly flagged gate_script:UNENFORCED).
      - name: Assert every constitution code anchor resolves
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_constitution_anchors.py

      # The mechanical half of the discipline test (no governance-verb leak in
      # the diff, no philosophy leak-smell token in the engine tree) resolves
      # its `pub`-declaration scan against the real `symbol-index` tool since
      # the migration off `PUB_DECL_RE` — it runs in `symbol-index-gates`
      # (below), the Rust-toolchain job, not here.

      # Issue #555: diff-scoped journey-marker gate (unit ids, round numbers,
      # ruling ids, "at this commit" hedges) — blocks on a published surface
      # (rustdoc on a `pub` item, a `.proto` comment, a python docstring),
      # advisory on a private comment/test.
      - name: Assert the journey-marker self-test fixtures fire correctly
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_journey_markers.py --self-test

      - name: Assert no journey marker on a published surface in the diff
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 ci/scripts/check_journey_markers.py

      # Issue #556: plan docs under docs/plans/** cite CONSTRUCTS
      # (path::symbol / path#heading / TOML key / proto member). TOML/
      # heading/proto resolution is toolchain-free and stays here; Rust
      # construct resolution (against the real symbol-index tool) runs in
      # `symbol-index-gates` (below) — `check_plan_citations.py` itself is
      # ONE script either way, this is only where its invocation lives.

      # The lead-proactivity gate's own CI leg: runs the REAL hook scripts
      # (lead-gate-{start,stop,pre}.sh) against fixture payloads in a temp
      # state dir — R1-R10 + S1 required-RED fixtures, N1-N7 must-still-count
      # negative-space fixtures, and R10's wiring assertion (settings.json
      # carries both events + every script, scripts executable).
      - name: Assert the lead-proactivity gate's hooks fire correctly on fixtures
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_lead_gate.py --self-test

      - name: Run check_lead_gate.py's own test suite
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/test_check_lead_gate.py

      # esc-lead-gate-R12 M5': a SEPARATE step from --self-test above --
      # mutating and re-running ~24 R12 fixtures per deny arm (~30+ arms)
      # is too slow to fold into the per-invocation self-test.
      - name: Assert every esc-lead-gate-R12 deny arm has a dying fixture (deny-coverage sweep)
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_lead_gate.py --r12-sweep

      # esc-lead-gate-R7 (v2): the committed-rigor-record check's own
      # hermetic self-test — real scratch git repos (a real `origin` +
      # a real feature-branch clone), never against this checkout's own
      # history. Runs unconditionally, matching check_lead_gate.py's own
      # self-test above.
      - name: Assert the rigor-record check fires correctly on fixtures
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_rigor_record.py --self-test

      # esc-lead-invariants-2: the phase-5 oracle-freshness check's own
      # hermetic self-test — real scratch git repos (a real `origin` + a
      # real feature-branch clone), never against this checkout's own
      # history. Runs unconditionally, matching check_lead_gate.py's own
      # self-test above.
      - name: Assert the phase-5 oracle-freshness gate fires correctly on fixtures
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_oracle_gate.py --self-test

      # --- Human-amend-only guards (git-diff-scoped; PRs only) ----------------
      # Each detects its touched set inside the job and exits green when untouched,
      # red (admin-merge required) when touched. Every constitution/gate edit —
      # tightening included — is human-amend-only (anti-Goodhart via human-in-the-
      # loop, not a nonexistent tighten-vs-weaken direction classifier).

      - name: Guard — CONSTITUTION is human-amend-only (CONSTITUTION_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- \
            docs/swarm/CONSTITUTION.md \
            docs/swarm/RULES.md \
            docs/guide/src/philosophy.md)"
          if [ -n "$changed" ]; then
            echo "::error::CONSTITUTION_TOUCHED: a canonical invariant-index source changed in this PR:"
            echo "$changed" | sed 's/^/    /'
            echo "The engine constitution and its two canonical sources (docs/swarm/RULES.md, the"
            echo "swarm-facing rules; docs/guide/src/philosophy.md, the engine's design philosophy)"
            echo "are human-amend-only (anti-Goodhart, ARCHITECTURE §2.7/§7): every edit —"
            echo "tightening included — must be human-reviewed and admin-merged."
            echo "This PR must be human-reviewed and admin-merged."
            exit 1
          fi
          echo "CONSTITUTION_TOUCHED: clean — constitution and its canonical sources untouched."

      - name: Guard — swarm gate definitions are human-amend-only (SWARM_GATE_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- \
            ':(glob).claude/agents/*.md' \
            ':(glob)ci/scripts/**/check_*.py' \
            ':(glob)ci/scripts/**/check_*.sh' \
            ':(glob)ci/tools/**' \
            'ci/scripts/no_consumer_names_allowlist.txt' \
            'ci/lead-gate-required-commands.txt' \
            '.claude/settings.json' \
            ':(glob).claude/evals/**' \
            ':(glob).claude/hooks/**' \
            '.github/workflows/swarm.yml')"
          if [ -n "$changed" ]; then
            echo "::error::SWARM_GATE_TOUCHED: a swarm gate definition changed in this PR:"
            echo "$changed" | sed 's/^/    /'
            echo "Gate definitions (agent cards, check_*.py gates, ci/tools/** shared indexers, the"
            echo "no-consumer-names waiver allowlist, swarm.yml) are human-amend-only."
            echo "Autonomously adding/altering a gate touches a gate definition and is blocked by design."
            echo "This PR must be human-reviewed and admin-merged."
            exit 1
          fi
          echo "SWARM_GATE_TOUCHED: clean — no swarm gate definition changed."

      # esc-lead-gate-R7 (v2, R7b): ARMED BY THE DIFF, SATISFIED BY
      # DISCLOSURE, JUDGED BY THE HUMAN — never described any other way.
      # Requires (only when base...HEAD touches crates/**, ci/**, or
      # .github/workflows/**) a committed docs/rigor/<unit-slug>.jsonl
      # record carrying a pressure-tester row, plus a committed mechanism
      # contract in THIS SAME diff — see the script's own module doc for
      # the full rule, every known no-op shape, and the honest limits.
      - name: Guard — a mechanism change carries a committed rigor record (esc-lead-gate-R7)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 ci/scripts/check_rigor_record.py

      - name: Guard — the rigor-record exemption allowlist only shrinks
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 ci/scripts/check_rigor_record.py --check-allowlist-only-shrinks

      - name: Guard — the R12 anticipation-record grandfather list only shrinks (esc-lead-gate-R12)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 ci/scripts/check_rigor_record.py --check-r12-grandfather-only-shrinks

      # esc-lead-gate-R12: the OPPOSITE polarity from the two ratchets
      # above — this file names REQUIRED gates, so it may only GROW;
      # removing a committed line is the weakening this catches.
      - name: Guard — the R12 required-commands gate list only grows (esc-lead-gate-R12)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 ci/scripts/check_rigor_record.py --check-required-commands-only-shrinks

      # esc-lead-gate-R12: the committed sweep-survivor baseline — arms the
      # sweep step above already found and printed — can never grow
      # autonomously; a human commits a NEW entry on main directly, and
      # only ever shrinks it once an arm gets a real fixture or a
      # `# R12-RESIDUAL` marker.
      - name: Guard — the R12 deny-coverage sweep survivor list only shrinks (esc-lead-gate-R12)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 ci/scripts/check_lead_gate.py --check-r12-survivors-only-shrinks

      # esc-lead-invariants-2: ARMED BY THE DIFF (crates/**, cookbook/**),
      # SATISFIED BY DISCLOSURE, JUDGED BY THE HUMAN — never described any
      # other way. Requires a committed docs/rigor/<unit-slug>.oracle.jsonl
      # record carrying a FRESH oracle PASS row (head_sha's tree matches
      # HEAD outside docs/rigor/**) whenever base...HEAD touches a path
      # phase-5 (oracle) reviews — see the script's own module doc for the
      # full rule and its stated residual.
      - name: Guard — a source-code change carries a fresh, committed phase-5 oracle PASS (esc-lead-invariants-2)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: python3 ci/scripts/check_oracle_gate.py

      - name: Guard — the oracle-gate exemption allowlist only shrinks
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: python3 ci/scripts/check_oracle_gate.py --check-allowlist-only-shrinks

  # A SEPARATE job (not a step folded into `swarm-gates` above) because these
  # two gates resolve Rust construct citations / public-declaration scans
  # against a REAL `syn` AST parse (`ci/tools/symbol-index`, `cargo run
  # --release -p symbol-index`) rather than a regex reader — this repo's own
  # recorded lesson ("regex readers over YAML/Rust lost five audits") is why
  # `check_plan_citations.py`'s Rust resolution and `check_no_consumer_
  # names.py`'s PUB_DECL_RE scan were both migrated onto that ONE shared
  # tool rather than each carrying (or re-carrying) its own text scanner.
  # That real parse needs the repo's pinned Rust toolchain, which the
  # toolchain-free `swarm-gates` job above deliberately does not carry (its
  # own header comment states this) — hence its own `container:`, mirroring
  # `ci.yml`'s `check`/`dep-audit` jobs' own pattern (the repo-provided CI
  # image with the toolchain baked in, `./.github/actions/setup-rust-ci` for
  # the sccache GHA-cache backend) rather than reinventing toolchain setup
  # here. No `paths:` filter, same rationale as `swarm-gates` (the #245
  # trap) — this job always runs, on every PR and push to main.
  #
  # NOTE for the human who wires branch protection: this is a NEW job name
  # (`Guard (symbol-index gates)`), distinct from `swarm-gates`'s own
  # `Guard (swarm constitution + boundary)` — it needs adding to the
  # required-status-checks list in repo settings alongside that one; this
  # workflow file cannot do that itself.
  symbol-index-gates:
    name: Guard (symbol-index gates)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-ci

      - name: Assert symbol-index's own unit tests + fmt + clippy pass
        if: ${{ !cancelled() }}
        run: |
          cargo fmt -p symbol-index -- --check
          cargo clippy -p symbol-index --all-targets -- -D warnings
          cargo test -p symbol-index

      # Issue #555 is journey-markers (toolchain-free, `swarm-gates`); this
      # is issue #556's Rust construct resolution — a bare `path::symbol`
      # citation under docs/plans/** resolved against the real syn index.
      - name: Assert the plan-citations self-test fixtures fire correctly
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_plan_citations.py --self-test

      - name: Assert every construct citation under docs/plans/** resolves
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_plan_citations.py

      # The mechanical half of the discipline test: no governance-verb leak in
      # the diff, no philosophy leak-smell token in the engine tree. Advisory-
      # labelled. Migrated off `PUB_DECL_RE` onto the real symbol-index tool.
      - name: Assert the no-consumer-names self-test fixtures fire correctly
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_no_consumer_names.py --self-test

      - name: Assert no consumer-name / governance leak in the engine tree
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 ci/scripts/check_no_consumer_names.py
