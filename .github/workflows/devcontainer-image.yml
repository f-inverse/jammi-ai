name: Devcontainer Image

# Build-only verification of `.devcontainer/Dockerfile`: the image is never
# published; the artifact is the green build. Path-filtered, so it stays out
# of `ci-summary`, which must never hang a pull request that does not touch
# the devcontainer.

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
      - ".github/actions/build-image/**"
  workflow_dispatch:

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/build-image
        with:
          file: .devcontainer/Dockerfile
          context: .devcontainer
          cache-scope: devcontainer
