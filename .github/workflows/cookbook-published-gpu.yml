# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The cookbook notebooks at a release tag, as a reader on a GPU runtime runs
# them: on a rented L4, each in a fresh environment whose setup cell installs
# the CUDA wheels from PyPI. The CPU lane is nightly.yml's. Dispatched by hand
# after a release.

name: Cookbook as published (GPU)
'on':
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to run (py-vX.Y.Z).
        required: true
        type: string
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # Every published notebook at the release tag on a rented L4, in a fresh environment installing the CUDA wheels from PyPI, after the release is installable everywhere.
  cookbook-published-gpu:
    name: GPU (RunPod L4)
    needs:
      - await-images
    runs-on: ubuntu-latest
    concurrency:
      group: cookbook-published-gpu-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 300
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The release is installable
        run: python3 ci/scripts/release_installable.py --tag "$TAG"
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_cookbook_published.sh
        env:
          RP_IMAGE: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          DRIVER_REF: ${{ github.sha }}
          NOTEBOOKS_TAG: ${{ inputs.tag }}
