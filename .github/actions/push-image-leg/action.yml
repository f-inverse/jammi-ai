name: push-image-leg
description: >
  Builds one image for one platform and pushes it to GHCR with its SBOM and
  build provenance; for a published image, also attests the pushed digest
  with a Sigstore bundle and verifies both before the step is green. The one
  definition of an image push: every server image leg and every CI image leg
  goes through it. Runs after `actions/checkout`, in a job granted
  `packages: write` (and, with `attest`, `id-token: write` and
  `attestations: write`).

inputs:
  image:
    description: "The image, e.g. ghcr.io/f-inverse/jammi-ai-server."
    required: true
  tags-spec:
    description: "`docker/metadata-action`'s `tags:` block."
    required: true
  tag-suffix:
    description: >
      A per-arch leg's suffix (`amd64`/`arm64`): every tag it pushes carries
      `-<suffix>`, so a leg never moves a real tag; the merge does. Empty for
      a single-platform image that pushes its real tags itself.
    required: false
    default: ""
  context:
    description: "The build context."
    required: false
    default: "."
  file:
    description: "The Dockerfile; empty is the context's own."
    required: false
    default: ""
  build-args:
    description: "`KEY=VALUE` lines for `docker build`; every value non-empty."
    required: false
    default: ""
  build-contexts:
    description: "Named build contexts (`name=path` lines)."
    required: false
    default: ""
  platforms:
    description: "The one platform this leg builds."
    required: true
  cache-scope:
    description: "The GitHub Actions layer-cache scope this build shares; empty uses no layer cache (a CI image would evict every compile cache)."
    required: false
    default: ""
  attest:
    description: "\"true\" (the default) attests and verifies the pushed digest: a published image. \"false\" for a CI environment image."
    required: false
    default: "true"

outputs:
  digest:
    description: "The pushed image's digest."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: bash ci/scripts/check_build_args.sh <<< "$BUILD_ARGS"

    # The `docker-container` driver is what emits the attestation manifest
    # the merge's platform assertion reads; the default driver omits it.
    - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}

    # `latest=false`: a moving tag is the caller's policy
    # (`ci/scripts/image_tags.sh`), never metadata-action's default; a
    # per-arch leg suffixes every tag it pushes.
    - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      id: meta
      with:
        images: ${{ inputs.image }}
        tags: ${{ inputs.tags-spec }}
        flavor: |
          latest=false
          ${{ inputs.tag-suffix != '' && format('suffix=-{0},onlatest=true', inputs.tag-suffix) || '' }}

    - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      id: build
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        build-contexts: ${{ inputs.build-contexts }}
        sbom: true
        provenance: mode=max
        cache-from: ${{ inputs.cache-scope != '' && format('type=gha,scope={0}', inputs.cache-scope) || '' }}
        cache-to: ${{ inputs.cache-scope != '' && format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}

    - if: inputs.attest == 'true'
      uses: ./.github/actions/attest-image
      with:
        image: ${{ inputs.image }}
        digest: ${{ steps.build.outputs.digest }}
