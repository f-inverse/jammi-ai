name: Server Image

# Publishes the `jammi-server` container images to GHCR on a `v*` release tag
# (or a recovery dispatch on that tag), behind the shared release gate:
#
#   * `jammi-ai-server`, the CPU image, two variants of one binary — `generic`
#     (operator-supplied config, a mounted volume) and `selfcontained` (a baked
#     config, boots with no config and no volume) — each a linux/amd64 +
#     linux/arm64 index;
#   * `jammi-ai-server-cu12`, the CUDA image, linux/amd64 (its runtime base
#     has no arm64 build).
#
# One tag policy for every image (`ci/scripts/image_tags.sh`): `:X.Y.Z`,
# `:X.Y`, `:sha-<sha>` and `:latest` (the newest release; a tag is only ever
# pushed for a release), the self-contained variant's under its own name
# (`selfcontained-X.Y.Z`, …, `selfcontained`). Nothing else moves a tag: there
# is no branch arm and no manual refresh.
#
# Every image packages binaries it does not compile: the `jammi-server` and
# `jammi` binaries the `build.yml` run that proved the tree built
# (`artifacts`, through `_proven-artifacts.yml`), laid out as the Dockerfile's
# `builder` context (`stage-server-binaries`) — the same packaging
# `build.yml`'s image check and smokes run over those bytes. A branch dispatch is a rehearsal: it
# resolves the branch tree's proving run and pushes nothing.
#
# The CPU variants are built one native leg per arch, each pushing only its
# immutable `sha-<sha>-<arch>` tag, then merged into the real tags
# (`merge-index`, verify-then-promote). Every pushed digest is attested and
# verified before its job is green (`attest-image`).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jammi-ai-server
  IMAGE_CU12: ghcr.io/${{ github.repository_owner }}/jammi-ai-server-cu12

jobs:
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: build
      artifacts: >-
        server-cpu-x86_64-binary
        server-cpu-aarch64-binary
        server-cu12-x86_64-binary
        jammi-x86_64-unknown-linux-gnu
        jammi-aarch64-unknown-linux-gnu

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  # The CPU image's legs: variant x arch, each pushing its own immutable
  # commit tag. The runner follows the arch and the tag policy is
  # `ci/scripts/image_tags.sh`'s (`ci/scripts/build_matrix.py`).
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        run: python3 ci/scripts/build_matrix.py images --platforms linux/amd64,linux/arm64 --cross variant=generic,selfcontained | tee -a "$GITHUB_OUTPUT"

  push-cpu:
    name: Push ${{ matrix.variant }} (${{ matrix.arch }})
    needs: [plan, proof, artifacts]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.plan.result == 'success' && needs.proof.result == 'success' && needs.artifacts.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The arch's binary names and the leg's tag
        id: leg
        env:
          ARCH: ${{ matrix.arch }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          case "$ARCH" in amd64) target=x86_64 ;; arm64) target=aarch64 ;; esac
          {
            echo "target=$target"
            echo "tags<<EOF"
            bash ci/scripts/image_tags.sh "$VARIANT" --immutable
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/stage-server-binaries
        id: binaries
        with:
          server: server-cpu-${{ steps.leg.outputs.target }}-binary
          cli: jammi-${{ steps.leg.outputs.target }}-unknown-linux-gnu
          stage: builder
          run-id: ${{ needs.artifacts.outputs.run }}

      - uses: ./.github/actions/push-image-leg
        with:
          image: ${{ env.IMAGE }}
          tags-spec: ${{ steps.leg.outputs.tags }}
          tag-suffix: ${{ matrix.arch }}
          build-args: |
            RUNTIME_VARIANT=runtime-${{ matrix.variant }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          platforms: ${{ matrix.platform }}
          cache-scope: cpu-${{ matrix.variant }}-${{ matrix.arch }}

  merge-cpu:
    name: Merge ${{ matrix.variant }}
    needs: [push-cpu]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.push-cpu.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        variant: [generic, selfcontained]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The variant's tags and its per-arch sources
        id: variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            bash ci/scripts/image_tags.sh "$VARIANT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # `latest=false`: the moving tag is the policy's own `raw` entry, never
      # metadata-action's default.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: ${{ steps.variant.outputs.tags }}

      # The commit tag first — the immutable one the merge re-reads and
      # attests — then every other tag; its per-arch legs are the sources.
      - name: The merge's tags and its per-arch sources
        id: merge
        env:
          VARIANT: ${{ matrix.variant }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          immutable="$IMAGE:$(bash ci/scripts/image_tags.sh "$VARIANT" --commit-tag "$GITHUB_SHA")"
          {
            echo "tags<<EOF"
            echo "$immutable"
            grep -vx -- "$immutable" <<< "$TAGS"
            echo "EOF"
            echo "sources<<EOF"
            echo "${immutable}-amd64"
            echo "${immutable}-arm64"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/merge-index
        with:
          image: ${{ env.IMAGE }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.merge.outputs.tags }}
          sources: ${{ steps.merge.outputs.sources }}
          attest: "true"

  push-cu12:
    name: Push CUDA image
    needs: [proof, artifacts]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.proof.result == 'success' && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/stage-server-binaries
        id: binaries
        with:
          server: server-cu12-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder-cuda
          run-id: ${{ needs.artifacts.outputs.run }}

      - name: The image's tags
        id: tags
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            bash ci/scripts/image_tags.sh cuda
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/push-image-leg
        with:
          image: ${{ env.IMAGE_CU12 }}
          tags-spec: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNTIME_VARIANT=runtime-cuda
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          platforms: linux/amd64
          cache-scope: cu12
