name: npm

# Publishes `@f-inverse/jammi-client` (the TypeScript gRPC-web SDK) to npm on
# the same `v*` tag that publishes the crates, behind the shared release
# gate. It builds nothing: `ci.yml`'s `ts-client` job builds, tests and packs
# the package on every pull request and on `main`, and this workflow
# publishes the tarball the run that proved the tag's tree packed, through
# npm's OIDC trusted publishing (no stored token). A dispatch on the tag
# finishes an interrupted release (a version already on npm is skipped); a
# branch dispatch is a rehearsal: it resolves the branch tree's proving run
# and its package, and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-npm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: ts-client-package

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish to npm
    # `if: always()` keeps the rehearsal's download and resolution on a branch
    # dispatch, where `proof` never runs; the publish itself is gated on the
    # "Publish" step.
    needs: [artifacts, proof]
    if: always() && needs.artifacts.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm OIDC trusted publishing and its provenance attestation.
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: clients/typescript/.nvmrc
          registry-url: "https://registry.npmjs.org"

      # npm's OIDC trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.18.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-client-package
          path: package
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      # Absolute: npm reads a relative `dir/file.tgz` as a GitHub `owner/repo`
      # shorthand.
      - name: The package and its version
        id: package
        run: |
          set -euo pipefail
          tarball="$(ls "$PWD"/package/*.tgz)"
          version="$(tar -xzOf "$tarball" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # npm's own resolution of the tarball, on every dispatch: a rehearsal
      # fails here, before a release does.
      - name: npm resolves the promoted tarball
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm pack --dry-run "$TARBALL"

      - name: Publish
        if: always() && startsWith(github.ref, 'refs/tags/v') && needs.proof.result == 'success'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@f-inverse/jammi-client@${VERSION}" version >/dev/null 2>&1; then
            echo "@f-inverse/jammi-client ${VERSION} is already on npm"
          else
            npm publish "$TARBALL" --provenance --access public
          fi
