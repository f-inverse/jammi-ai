name: Crates

# Publishes the workspace crates to crates.io on a `v*` tag, behind the shared
# release gate: the tree's recorded verdicts and the tag's version
# (`_proof-required.yml`). `ci/scripts/publish_crates.sh` is the publish
# program: topological order, the per-crate already-published guard, the
# sparse-index wait; this workflow mints its token and supplies its
# environment. A dispatch on the tag finishes an interrupted release; a
# branch dispatch runs nothing but the image wait, since a crates.io publish
# is irreversible and only a tag may first-publish a version.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tree's CI image: `cargo publish` verifies each crate builds, in the
  # toolchain the tree defines.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish to crates.io
    needs: [ci-image, proof]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.ci-image.result == 'success' && needs.proof.result == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    environment: crates-io
    permissions:
      # The trusted-publishing token exchange (`ci/scripts/crates_io_token.sh`).
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Mint the crates.io token
        id: token
        run: bash ci/scripts/crates_io_token.sh mint

      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
        run: bash ci/scripts/publish_crates.sh

      - name: Revoke the crates.io token
        if: always() && steps.token.outputs.token != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
        run: bash ci/scripts/crates_io_token.sh revoke
