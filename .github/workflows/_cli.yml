name: _cli

# Builds the `jammi` CLI release binary for each target triple asked for and
# packages it as its release tarball (`ci/scripts/package_release_bin.sh`).
# The one definition of how the CLI is compiled: `ci.yml` calls it for the
# Linux targets its cookbook and image smokes use, and `release-binaries.yml`
# for every target it ships.
#
# Artifact: `jammi-<target>`, the tarball `jammi-<version>-<target>.tar.gz`.

on:
  workflow_call:
    inputs:
      targets:
        description: >
          Space-separated target triples, each one of x86_64-unknown-linux-gnu,
          aarch64-unknown-linux-gnu and aarch64-apple-darwin.
        type: string
        required: true
      cpu-image:
        description: "The tree's CPU CI image (the Linux targets build in it)."
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # A matrix cannot be built from a raw string; `fromJson` needs a real JSON
  # value. The one place a target maps to its runner and container.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Each target's runner and container
        id: plan
        shell: bash
        env:
          TARGETS: ${{ inputs.targets }}
          CPU_IMAGE: ${{ inputs.cpu-image }}
        run: |
          set -euo pipefail
          entries=()
          for target in $TARGETS; do
            case "$target" in
              # manylinux_2_28 glibc floor: built inside the CI image, so the
              # binary links glibc 2.28 and runs on any newer host.
              x86_64-unknown-linux-gnu) runner=ubuntu-latest; container="$CPU_IMAGE" ;;
              aarch64-unknown-linux-gnu) runner=ubuntu-24.04-arm; container="$CPU_IMAGE" ;;
              # Apple silicon, natively. mold is Linux-only (`.cargo/config.toml`
              # scopes it to the Linux targets).
              aarch64-apple-darwin) runner=macos-14; container="" ;;
              *) echo "::error::unsupported target '$target'" >&2; exit 1 ;;
            esac
            entries+=("$(jq -cn --arg t "$target" --arg r "$runner" --arg c "$container" '{target: $t, runner: $r, container: $c}')")
          done
          if [ "${#entries[@]}" -eq 0 ]; then
            echo "::error::no targets given" >&2
            exit 1
          fi
          echo "matrix={\"include\":[$(IFS=,; echo "${entries[*]}")]}" >> "$GITHUB_OUTPUT"

  build:
    name: Build jammi (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-rust-ci
        with:
          # A release build, not the lint gate.
          deny-warnings: false

      # The Linux targets build in the CI image, which carries the Rust
      # toolchain, protoc and mold. The macOS runner needs protoc and the
      # pinned toolchain installed natively.
      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Read the pin rather than restate it; assigned on its own so a failed
      # read stops the step instead of yielding an empty channel.
      - name: Resolve the pinned Rust toolchain (macOS)
        if: runner.os == 'macOS'
        id: rust-pin
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bash ci/scripts/rust_pin.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      # SHA-pinned; the branch name in the ref is inert — the toolchain
      # installed is the explicit `toolchain:` input.
      - name: Install Rust toolchain (macOS)
        if: runner.os == 'macOS'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-pin.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Build jammi (release)
        run: cargo build --release -p jammi-cli --bin jammi

      - name: Package
        id: package
        shell: bash
        run: bash ci/scripts/package_release_bin.sh jammi "${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: jammi-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
