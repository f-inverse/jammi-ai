name: Cookbook as published (GPU)

# The cookbook notebooks at a release tag, as a reader on a GPU runtime runs
# them: on a RunPod L4 (sm_89, the class of GPU a Colab reader gets), each in a
# fresh environment whose setup cell installs the CUDA wheels from PyPI
# (`ci/scripts/runpod_cookbook_published.sh`). The CPU lane is
# `cookbook-published.yml`. Dispatched by hand after a release: it rents a pod.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run (py-vX.Y.Z)."
        required: true
        type: string

concurrency:
  group: cookbook-published-gpu-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu cuda

  gpu:
    name: GPU (RunPod L4)
    needs: ci-image
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Before renting the pod: every place a notebook installs from serves
      # the release, or the run would fail install by install.
      - name: The release is installable
        env:
          TAG: ${{ inputs.tag }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/release_installable.py --tag "$TAG"

      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_cookbook_published.sh
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RP_IMAGE: ${{ needs.ci-image.outputs.cuda }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          DRIVER_REF: ${{ github.sha }}
          NOTEBOOKS_TAG: ${{ inputs.tag }}
