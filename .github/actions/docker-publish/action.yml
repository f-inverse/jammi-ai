name: docker-publish
description: >
  Shared build[-and-push] pipeline for a jammi-ai-server container image:
  Buildx setup, conditional GHCR login (only when `push` is `true` — a
  build-only verification lane never touches GHCR credentials), conditional
  tag/label extraction (skipped when `tags-spec` is empty — a build-only lane
  needs no tags), and the `docker/build-push-action` invocation itself. This
  collapses server-image.yml's four jobs (generic CPU, self-contained CPU,
  CUDA push, CUDA build-only PR-verification) — which differ only in image
  name, tag scheme, build-args, and whether they push at all — into one
  parameterized action instead of four repeated step sequences. Must run
  AFTER `actions/checkout@v4` (local-path composite; the checkout step has to
  have already materialized it, same constraint as `setup-rust-ci`).

inputs:
  images:
    description: >
      Fully-qualified image ref(s) for docker/metadata-action (e.g.
      ghcr.io/f-inverse/jammi-ai-server). Only consulted when tags-spec is
      non-empty.
    required: false
    default: ""
  tags-spec:
    description: >
      The multi-line `tags:` block passed straight through to
      docker/metadata-action. Empty (the default) skips tag/label extraction
      entirely — the build-only PR lane pushes nothing, so it needs no tags.
    required: false
    default: ""
  build-args:
    description: >
      Multi-line build-args block passed to docker/build-push-action, e.g.
      "RUNTIME_VARIANT=runtime-cuda".
    required: false
    default: ""
  push:
    description: >
      "true" to log into GHCR and push; "false" for a build-only verification
      (no GHCR credentials touched, no manifest pushed).
    required: true
  registry:
    description: "Container registry to log into when push is \"true\"."
    required: false
    default: "ghcr.io"
  cache-scope:
    description: >
      gha cache scope suffix (e.g. "cu12") so parallel image builds don't
      clobber each other's cache. Empty (the default) uses the unscoped gha
      cache.
    required: false
    default: ""
  context:
    description: "Build context passed to docker/build-push-action."
    required: false
    default: "."
  file:
    description: "Dockerfile path passed to docker/build-push-action."
    required: false
    default: "Dockerfile"
  load:
    description: >
      "true" to `docker load` the built image into the runner's local Docker
      daemon (tagged `local-tag`) instead of pushing it — the shape a
      same-runner smoke test needs to run the exact image it just built,
      never a registry round-trip. Mutually exclusive with `push: "true"` in
      practice (a caller wanting both should push, then pull).
    required: false
    default: "false"
  local-tag:
    description: >
      Tag applied to the image when `load` is "true" (e.g.
      "jammi-ai-server:pr"). Ignored when `load` is "false".
    required: false
    default: ""
  sbom:
    description: >
      "true" to attach an SPDX SBOM to the build (`docker/build-push-action`'s
      own `sbom` input). A build-only `load` lane sets this "false" — the
      docker exporter cannot carry attestations on a stock daemon.
    required: false
    default: "true"
  provenance:
    description: >
      Provenance mode passed to `docker/build-push-action`'s own `provenance`
      input (e.g. "mode=max"). A build-only `load` lane sets this "false" for
      the same reason as `sbom` above.
    required: false
    default: "mode=max"

outputs:
  digest:
    description: "The built image's digest (docker/build-push-action's own `digest` output)."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        # Composite actions cannot read the `secrets` context; `github.token`
        # is the same value as `secrets.GITHUB_TOKEN`, exposed via the
        # `github` context instead.
        password: ${{ github.token }}

    - name: Extract metadata
      if: inputs.tags-spec != ''
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.images }}
        tags: ${{ inputs.tags-spec }}

    # Resolves the gha cache-from/cache-to strings once so the build-push step
    # below doesn't need conditional expression logic — a scoped cache when
    # cache-scope is given, the unscoped default cache otherwise.
    - name: Resolve cache scope
      id: cache
      shell: bash
      run: |
        if [ -n "${{ inputs.cache-scope }}" ]; then
          echo "from=type=gha,scope=${{ inputs.cache-scope }}" >> "$GITHUB_OUTPUT"
          echo "to=type=gha,mode=max,scope=${{ inputs.cache-scope }}" >> "$GITHUB_OUTPUT"
        else
          echo "from=type=gha" >> "$GITHUB_OUTPUT"
          echo "to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: linux/amd64
        push: ${{ inputs.push }}
        # `docker load` into the runner's local daemon under `local-tag`
        # instead of pushing — a same-runner smoke test's only way to run the
        # EXACT image this step built, not a registry pull of some other tag.
        load: ${{ inputs.load }}
        tags: ${{ inputs.load == 'true' && inputs.local-tag || steps.meta.outputs.tags }}
        build-args: ${{ inputs.build-args }}
        # `labels` stays metadata-action's output (or empty on the build-only
        # PR lane) regardless of `load` — labels carry no registry meaning.
        labels: ${{ steps.meta.outputs.labels }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance }}
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
