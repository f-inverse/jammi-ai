# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# Publishes `@f-inverse/jammi-client` to npm on the `v*` tag that publishes the
# crates, behind the release gate, through npm's OIDC trusted publishing
# (registered to this file). It builds nothing: the tarball is the one the run
# that proved the tag's tree packed.

name: npm
'on':
  push:
    tags:
      - v*
  workflow_dispatch: {}
concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # The release gate: the tree's recorded verdicts, and the tag names its version.
  proof:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/verdict.py require --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

  # The ci.yml run that proved this tree, which holds what this workflow installs.
  artifacts-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ci
          ARTIFACTS: ts-client-package
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # Publishes the packed tarball through npm's OIDC trusted publishing with provenance; a version already on npm is skipped, so a re-run is idempotent.
  publish-npm:
    name: Publish to npm
    needs:
      - artifacts-ci
      - proof
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: clients/typescript/.nvmrc
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ts-client-package
          path: package
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Publish
        run: bash ci/scripts/publish_npm.sh "$PWD"/package/*.tgz
