name: docker-publish
description: >
  Shared build[-and-push] pipeline for a jammi-ai-server container image:
  Buildx setup, conditional GHCR login (only when `push` is `true` — a
  build-only verification lane never touches GHCR credentials), conditional
  tag/label extraction (skipped when `tags-spec` is empty — a build-only lane
  needs no tags), and the `docker/build-push-action` invocation itself. This
  collapses server-image.yml's four jobs (generic CPU, self-contained CPU,
  CUDA push, CUDA build-only PR-verification) — which differ only in image
  name, tag scheme, build-args, and whether they push at all — into one
  parameterized action instead of four repeated step sequences. Must run
  AFTER `actions/checkout@v4` (local-path composite; the checkout step has to
  have already materialized it, same constraint as `setup-rust-ci`).

inputs:
  images:
    description: >
      Fully-qualified image ref(s) for docker/metadata-action (e.g.
      ghcr.io/f-inverse/jammi-ai-server). Only consulted when tags-spec is
      non-empty.
    required: false
    default: ""
  tags-spec:
    description: >
      The multi-line `tags:` block passed straight through to
      docker/metadata-action. Empty (the default) skips tag/label extraction
      entirely — the build-only PR lane pushes nothing, so it needs no tags.
    required: false
    default: ""
  tag-suffix:
    description: >
      When non-empty, passed to docker/metadata-action as `flavor:
      suffix=-<value>,onlatest=true` — the per-arch immutable leg shape
      (e.g. "amd64"/"arm64"): a leg tagged this way pushes ONLY its own
      `sha-<sha>-<arch>` tag, never a bare `latest`/`sha-<sha>` a
      concurrent leg could race against (`onlatest=true` is required
      because metadata-action otherwise emits an UNSUFFIXED `latest`
      regardless of `flavor.suffix`, meta.ts:525-527). Empty (the default)
      leaves `docker/metadata-action`'s tag/label extraction byte-unaffected
      for every caller that does not merge per-arch legs.
    required: false
    default: ""
  build-args:
    description: >
      Multi-line build-args block passed to docker/build-push-action, e.g.
      "RUNTIME_VARIANT=runtime-cuda".
    required: false
    default: ""
  push:
    description: >
      "true" to log into GHCR and push; "false" for a build-only verification
      (no GHCR credentials touched, no manifest pushed).
    required: true
  registry:
    description: "Container registry to log into when push is \"true\"."
    required: false
    default: "ghcr.io"
  cache-scope:
    description: >
      gha cache scope suffix (e.g. "cu12") so parallel image builds don't
      clobber each other's cache. Empty (the default) uses the unscoped gha
      cache.
    required: false
    default: ""
  context:
    description: "Build context passed to docker/build-push-action."
    required: false
    default: "."
  file:
    description: "Dockerfile path passed to docker/build-push-action."
    required: false
    default: "Dockerfile"
  load:
    description: >
      "true" to `docker load` the built image into the runner's local Docker
      daemon (tagged `local-tag`) instead of pushing it — the shape a
      same-runner smoke test needs to run the exact image it just built,
      never a registry round-trip. Mutually exclusive with `push: "true"` in
      practice (a caller wanting both should push, then pull).
    required: false
    default: "false"
  local-tag:
    description: >
      Tag applied to the image when `load` is "true" (e.g.
      "jammi-ai-server:pr"). Ignored when `load` is "false".
    required: false
    default: ""
  sbom:
    description: >
      "true" to attach an SPDX SBOM to the build (`docker/build-push-action`'s
      own `sbom` input). A build-only `load` lane sets this "false" — the
      docker exporter cannot carry attestations on a stock daemon.
    required: false
    default: "true"
  provenance:
    description: >
      Provenance mode passed to `docker/build-push-action`'s own `provenance`
      input (e.g. "mode=max"). A build-only `load` lane sets this "false" for
      the same reason as `sbom` above.
    required: false
    default: "mode=max"
  platforms:
    description: >
      Comma-separated buildx platform list passed straight through to
      `docker/build-push-action`. Empty (the default) means NATIVE — the
      builder's own platform, never a hardcoded "linux/amd64" — so a caller
      running on an arm64 runner builds an arm64 image without asking for
      one by name. A caller that needs a specific platform regardless of
      runner arch (e.g. a CUDA image, amd64-only at runtime) passes
      "linux/amd64" explicitly.
    required: false
    default: ""

outputs:
  digest:
    description: "The built image's digest (docker/build-push-action's own `digest` output)."
    value: ${{ steps.build.outputs.digest }}

runs:
  using: composite
  steps:
    - name: Validate load/push/local-tag combination
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.load }}" = "true" ] && [ -z "${{ inputs.local-tag }}" ]; then
          echo "::error::load is \"true\" but local-tag is empty -- a load with no tag has nothing to load the image as" >&2
          exit 1
        fi
        if [ "${{ inputs.load }}" = "true" ] && [ "${{ inputs.push }}" = "true" ]; then
          echo "::error::load and push are both \"true\" -- mutually exclusive (see the load input's own description); push then pull instead" >&2
          exit 1
        fi

    # Self-check: an explicitly-passed-but-empty `--build-arg NAME=` silently
    # overrides a Dockerfile ARG's own default with blank -- for a global ARG
    # consumed by a FROM line, BuildKit fails closed on that ("base name
    # should not be blank"), but a build-arg feeding anything else (a RUN, an
    # ENV) would instead blank the value silently and keep building. Refuse
    # closed here, naming the arg, rather than letting either failure mode
    # happen downstream: `build-args` is a caller-controlled multi-line
    # `KEY=VALUE` block (this action's own doc above), so a blank VALUE is
    # always a caller bug -- a build-arg the caller genuinely doesn't need to
    # override should be OMITTED (the Dockerfile's own default applies), never
    # passed empty.
    - name: Refuse an empty build-arg value
      shell: bash
      env:
        BUILD_ARGS: ${{ inputs.build-args }}
      run: |
        set -euo pipefail
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          case "$line" in
            *=*) ;;
            *)
              echo "::error::build-args line '$line' is not KEY=VALUE" >&2
              exit 1
              ;;
          esac
          name="${line%%=*}"
          value="${line#*=}"
          if [ -z "$value" ]; then
            echo "::error::build-arg '$name' was passed with an empty value -- this silently overrides the Dockerfile's own ARG default with blank; omit the line entirely if the caller doesn't need to override it, or pass a real value" >&2
            exit 1
          fi
        done <<< "$BUILD_ARGS"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    - name: Log in to GHCR
      if: inputs.push == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        # Composite actions cannot read the `secrets` context; `github.token`
        # is the same value as `secrets.GITHUB_TOKEN`, exposed via the
        # `github` context instead.
        password: ${{ github.token }}

    - name: Extract metadata
      if: inputs.tags-spec != ''
      id: meta
      uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
      with:
        images: ${{ inputs.images }}
        tags: ${{ inputs.tags-spec }}
        # Empty (the default) leaves flavor unset -- byte-identical to every
        # caller that predates per-arch legs. Non-empty (a per-arch leg)
        # suffixes every emitted tag with "-<tag-suffix>" and forces `latest`
        # to carry the suffix too (`onlatest=true`) so a leg NEVER emits a
        # bare, unsuffixed real tag -- see this action's own `tag-suffix`
        # input doc.
        flavor: ${{ inputs.tag-suffix != '' && format('suffix=-{0},onlatest=true', inputs.tag-suffix) || '' }}

    # Resolves the gha cache-from/cache-to strings once so the build-push step
    # below doesn't need conditional expression logic — a scoped cache when
    # cache-scope is given, the unscoped default cache otherwise.
    - name: Resolve cache scope
      id: cache
      shell: bash
      run: |
        if [ -n "${{ inputs.cache-scope }}" ]; then
          echo "from=type=gha,scope=${{ inputs.cache-scope }}" >> "$GITHUB_OUTPUT"
          echo "to=type=gha,mode=max,scope=${{ inputs.cache-scope }}" >> "$GITHUB_OUTPUT"
        else
          echo "from=type=gha" >> "$GITHUB_OUTPUT"
          echo "to=type=gha,mode=max" >> "$GITHUB_OUTPUT"
        fi

    - name: Build and push
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        # `docker load` into the runner's local daemon under `local-tag`
        # instead of pushing — a same-runner smoke test's only way to run the
        # EXACT image this step built, not a registry pull of some other tag.
        load: ${{ inputs.load }}
        tags: ${{ inputs.load == 'true' && inputs.local-tag || steps.meta.outputs.tags }}
        build-args: ${{ inputs.build-args }}
        # `labels` stays metadata-action's output (or empty on the build-only
        # PR lane) regardless of `load` — labels carry no registry meaning.
        labels: ${{ steps.meta.outputs.labels }}
        sbom: ${{ inputs.sbom }}
        provenance: ${{ inputs.provenance }}
        cache-from: ${{ steps.cache.outputs.from }}
        cache-to: ${{ steps.cache.outputs.to }}
