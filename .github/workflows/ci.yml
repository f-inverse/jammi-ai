# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The merge gate and the release candidate: every pull request, and every push
# to main. Does the tree pass its lints, its hermetic suite, its backend arms
# and its guards; does every artifact a release promotes build, and run as a
# user runs it. A pull request's run measures the tree; main's run compiles
# what writes the shared cache (setup-rust-ci writes only on main), builds the
# artifacts a release promotes, and measures what only main measures: the live
# hub tests and the performance gate. Branch protection requires `ci-summary`
# and an up-to-date branch, so the tree main holds is the tree a run proved.
#
# The tree's CI images are built here when the registry lacks them (the
# `CI image (...)` jobs); every other workflow waits for them.

name: CI
'on':
  push:
    branches:
      - main
  pull_request: {}
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:

  # Records the tree this run measures, so a verdict follows the tree a run tested and never a commit.
  subject:
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: subject
        uses: ./.github/actions/record-subject

  # The tree's CPU CI image, one native leg per platform, built when the registry lacks its content tag.
  image-cpu:
    name: CI image (CPU, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: built
        run: python3 ci/scripts/ci_image.py built --dockerfile .docker/ci.Dockerfile | tee -a "$GITHUB_OUTPUT"
      - if: steps.built.outputs.build == 'true'
        id: args
        run: '{ echo ''args<<EOF''; python3 ci/scripts/ci_image.py build-args --dockerfile .docker/ci.Dockerfile --arch "$ARCH"; echo EOF; } >> "$GITHUB_OUTPUT"'
        env:
          ARCH: ${{ matrix.arch }}
      - if: steps.built.outputs.build == 'true'
        uses: ./.github/actions/push-image-leg
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci
          context: .docker
          file: .docker/ci.Dockerfile
          tags-spec: type=raw,value=ctx-f11e59b47140e868
          tag-suffix: ${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.args }}
          platforms: ${{ matrix.platform }}
          attest: 'false'

  # Merges the CPU image's per-arch legs into the one reference every lane pulls, verify-then-promote.
  image-cpu-merge:
    name: CI image (CPU, merge)
    needs:
      - image-cpu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: built
        run: python3 ci/scripts/ci_image.py built --dockerfile .docker/ci.Dockerfile | tee -a "$GITHUB_OUTPUT"
      - if: steps.built.outputs.build == 'true'
        uses: ./.github/actions/merge-index
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          sources: |
            ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868-amd64
            ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868-arm64

  # The tree's CUDA CI image, FROM the CPU image of the same tree, built when the registry lacks its content tag.
  image-cuda:
    name: CI image (CUDA, ${{ matrix.arch }})
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: built
        run: python3 ci/scripts/ci_image.py built --dockerfile .docker/ci-cuda.Dockerfile | tee -a "$GITHUB_OUTPUT"
      - if: steps.built.outputs.build == 'true'
        id: args
        run: '{ echo ''args<<EOF''; python3 ci/scripts/ci_image.py build-args --dockerfile .docker/ci-cuda.Dockerfile --arch "$ARCH"; echo EOF; } >> "$GITHUB_OUTPUT"'
        env:
          ARCH: ${{ matrix.arch }}
      - if: steps.built.outputs.build == 'true'
        uses: ./.github/actions/push-image-leg
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci-cuda
          context: .docker
          file: .docker/ci-cuda.Dockerfile
          tags-spec: type=raw,value=ctx-3b6cc7ba90dcbf4a
          tag-suffix: ${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.args }}
          platforms: ${{ matrix.platform }}
          attest: 'false'

  # Promotes the CUDA image's leg to its one reference through the same merge every image goes through.
  image-cuda-merge:
    name: CI image (CUDA, merge)
    needs:
      - image-cuda
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: built
        run: python3 ci/scripts/ci_image.py built --dockerfile .docker/ci-cuda.Dockerfile | tee -a "$GITHUB_OUTPUT"
      - if: steps.built.outputs.build == 'true'
        uses: ./.github/actions/merge-index
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci-cuda
          platforms: linux/amd64
          tags: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          sources: |
            ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a-amd64

  # Points the CI images' `:latest` alias, which the devcontainer builds FROM, at main's tree.
  image-latest:
    needs:
      - image-cuda-merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/merge-index
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/f-inverse/jammi-ai-ci:latest
          sources: |
            ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
      - uses: ./.github/actions/merge-index
        with:
          image: ghcr.io/f-inverse/jammi-ai-ci-cuda
          platforms: linux/amd64
          tags: ghcr.io/f-inverse/jammi-ai-ci-cuda:latest
          sources: |
            ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a

  # The devcontainer image builds; it is never published.
  devcontainer-image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/build-image
        with:
          file: .devcontainer/Dockerfile
          context: .devcontainer
          cache-scope: devcontainer

  # The workspace is formatted and lints clean, with the SQLx source-provider surface nothing else on the merge path compiles.
  fmt-clippy:
    name: Format & Lint
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy jammi-db postgres,mysql
        run: cargo clippy -p jammi-db --features postgres,mysql --all-targets -- -D warnings

  # Every test surface compiled only under a feature naming a host resource, or the live hub, lints clean (`check_lint_surface_closure.py` asserts every gated surface has a lane).
  clippy-gated:
    name: 'Clippy (gated: ${{ matrix.surface }})'
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: jammi-ai host resources
            cmd: cargo clippy -p jammi-ai --all-targets --features unprivileged-tests,live-distributed-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - surface: jammi-db host resources
            cmd: cargo clippy -p jammi-db --all-targets --features unprivileged-tests,live-postgres-tests,test-hooks,live-s3-tests,live-gcs-tests,live-azure-tests,live-r2-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - surface: jammi-server host resources
            cmd: cargo clippy -p jammi-server --all-targets --features unprivileged-tests,live-postgres-tests,test-hooks -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - surface: jammi-bench fleet
            cmd: cargo clippy -p jammi-bench --tests --features live-distributed-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - surface: jammi-ai live hub
            cmd: cargo clippy -p jammi-ai --all-targets --features live-hub-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - surface: jammi-encoders live hub
            cmd: cargo clippy -p jammi-encoders --all-targets --features live-hub-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: ${{ matrix.cmd }}

  # Every CUDA-gated surface compiles and lints under nvcc with no device, one leg per feature graph; `flash-attn` stays unreachable from `cuda`, so jammi-ai is linted without it.
  clippy-cuda:
    name: 'Clippy (CUDA: ${{ matrix.crate }})'
    needs:
      - image-cuda-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: jammi-kernels
            cmd: cargo clippy -p jammi-kernels --all-targets --features live-gpu-tests,flash-attn -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-encoders flash-oracle
            cmd: cargo clippy -p jammi-encoders --all-targets --features live-flash-oracle-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-encoders
            cmd: cargo clippy -p jammi-encoders --all-targets --features live-gpu-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-lora
            cmd: cargo clippy -p jammi-lora --all-targets --features live-gpu-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-bench
            cmd: cargo clippy -p jammi-bench --all-targets --features live-gpu-tests,flash-attn -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-ai
            cmd: cargo clippy -p jammi-ai --all-targets --features live-gpu-tests,live-gpu-gang-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          - crate: jammi-server
            cmd: cargo clippy -p jammi-server --tests --features live-gpu-tests,live-gpu-gang-tests -- -D warnings
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
      - name: Init the CUTLASS submodule
        run: git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass
      - name: The image carries NCCL (header + link library)
        run: rpm -q libnccl libnccl-devel && test -e /usr/include/nccl.h && test -e /usr/lib64/libnccl.so
      - uses: ./.github/actions/setup-rust-ci
      - run: ${{ matrix.cmd }}

  # The Metal-gated surfaces lint clean; a hosted macOS runner cannot construct a Metal device, so they run on Apple-silicon hardware.
  clippy-metal:
    name: Clippy (Metal)
    runs-on: macos-14
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-host
      - uses: ./.github/actions/setup-rust-ci
      - run: |
          cargo clippy -p jammi-kernels --lib --tests --features live-metal-tests -- -D warnings
          cargo clippy -p jammi-lora --tests --features live-metal-tests -- -D warnings
          cargo clippy -p jammi-ai --test metal_quantized_gpu --features live-metal-tests -- -D warnings

  # Compiles the hermetic test graph once, locked, and archives it for the partitions, which compile nothing; nextest runs no doctests, so they run here.
  test-build:
    name: Test (hermetic) build
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Build the hermetic test archive
        run: cargo nextest archive --workspace --exclude jammi-python --locked --archive-file target/hermetic.tar.zst
      - if: github.event_name == 'pull_request'
        name: Doctests
        run: cargo test --workspace --exclude jammi-python --doc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermetic-tests
          path: target/hermetic.tar.zst
          retention-days: 1
          compression-level: 0

  # Runs a slice of every hermetic test binary from the archive, each test in a process of its own; eight slices end near the slowest test's floor.
  test:
    name: Test (hermetic) (${{ matrix.partition }}/8)
    needs:
      - image-cpu-merge
      - test-build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: 1
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 2
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 3
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 4
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 5
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 6
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 7
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - partition: 8
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermetic-tests
          path: /tmp/hermetic
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Run the partition
        run: cargo nextest run --profile ci --archive-file /tmp/hermetic/hermetic.tar.zst --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" --partition "slice:$PARTITION/8"
        env:
          PARTITION: ${{ matrix.partition }}
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermetic-timings-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 30

  # The tests `unprivileged-tests` adds run as an account mode bits apply to; the image runs as root.
  test-permission-fault:
    name: Test (permission faults)
    needs:
      - image-cpu-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: bash ci/scripts/run_permission_fault_tests.sh

  # The cloud drivers' root-identity determinants, compiled only under the shipped `storage-cloud` graph.
  test-storage-cloud:
    name: Test (storage-cloud)
    needs:
      - image-cpu-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: cargo test -p jammi-db --features storage-cloud --lib -- catalog::instance storage::builder

  # The `jammi-python` crate's Rust tests link libpython against the image's interpreter, outside the archive maturin would build.
  test-python-rust:
    name: Test (Python, Rust)
    needs:
      - image-cpu-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: cargo test -p jammi-python --no-fail-fast

  # The backend-parameterised suites' Postgres arms, each test on a database of its own, four at a time (the server's connection budget).
  test-pg:
    name: Test (Postgres)
    needs:
      - image-cpu-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: '--health-cmd "pg_isready -U jammi -d jammi_test" --health-interval 5s --health-timeout 5s --health-retries 12'
        ports:
          - 5432:5432
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: cargo nextest run --profile postgres -p jammi-db -p jammi-server --features jammi-db/live-postgres-tests,jammi-server/live-postgres-tests -E '(package(jammi-db) & (kind(lib) | binary(it))) | (package(jammi-server) & binary(it))'

  # The tests `live-hub-tests` adds, against the live model hub: a verdict main measures, so a hub outage reds main until it is measured again.
  test-live:
    name: Test (live)
    needs:
      - image-cpu-merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: bash ci/scripts/run_live_hub_tests.sh

  # Every CPU-hermetic `*-scale` tier against its committed floor, and a proof the gate bites: measured on main only, because a hosted runner's throughput jitters and a per-PR rate gate would flap.
  perf-gate:
    name: Performance gate (main)
    needs:
      - image-cpu-merge
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      RAYON_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Build the bench harness (release)
        run: cargo build -p jammi-bench --release
        env:
          JAMMI_BUILD_SHA: ${{ github.sha }}
      - name: Run the CPU-hermetic scale tiers
        run: bash ci/scripts/perf/run_scale_tiers.sh
      - name: The rate gate bites
        run: bash ci/scripts/perf/check_rate_gate_bites.sh

  # Compiles the `jammi-server` the distributed harness spawns, with the S3 driver its workers publish through, and archives each crate's distributed test binary with it.
  distributed-build:
    name: Distributed build
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Build the jammi-server binary
        run: cargo build -p jammi-server --bin jammi-server --features storage-s3
      - name: Archive the distributed test binaries
        run: |
          for crate in jammi-ai jammi-bench; do
            cargo nextest archive --profile distributed -p "$crate" --features live-distributed-tests --test distributed --archive-file "/tmp/distributed-$crate.tar.zst"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributed-jammi-ai
          path: /tmp/distributed-jammi-ai.tar.zst
          retention-days: 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributed-jammi-bench
          path: /tmp/distributed-jammi-bench.tar.zst
          retention-days: 1

  # N worker processes claiming from a shared Postgres catalog and S3-class store: the fleet-safety claims, the SIGKILL crash windows and the ladder's fleet rungs, one leg per what decides its outcome (`check_distributed_legs.py` holds every distributed test to exactly one leg).
  distributed:
    name: 'Distributed: ${{ matrix.display }}'
    needs:
      - distributed-build
      - image-cpu-merge
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deterministic
            display: claim correctness
            crate: jammi-ai
            tests: one_job_n_workers_exactly_one_wins mixed_tenant_queue_completes_each_under_its_own_scope rendezvous_placed_search_over_real_worker_processes
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - name: chaos
            display: SIGKILL crash windows
            crate: jammi-ai
            tests: killed_worker_job_is_reclaimed_and_completed_once crash_between_publish_and_finalize_commits_only_the_winner artifact_written_on_worker_is_readable_by_a_different_client killed_peer_job_is_reclaimed_and_completed_by_a_new_gang killed_coordinator_job_is_reclaimed_and_completed_by_a_new_gang
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - name: rungs
            display: ladder rungs on a fleet
            crate: jammi-bench
            tests: every_train_run_rung_publishes_the_same_adapter every_predictor_train_run_rung_publishes_the_same_predictor
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    services:
      postgres:
        image: postgres:16@sha256:1a6ab3f5345eb6dbe04a1349529caabdb0ab09293a09590fad07b2246bfa4b54
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: '--health-cmd "pg_isready -U jammi -d jammi_test" --health-interval 5s --health-timeout 5s --health-retries 12'
        ports:
          - 5432:5432
    env:
      JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /opt/s3-test-store
          key: s3-test-store-${{ hashFiles('ci/scripts/s3_test_store.sh') }}
      - name: Start the S3-class store
        run: |
          export JAMMI_S3_STORE_DIR=/opt/s3-test-store
          ci/scripts/s3_test_store.sh start --addr 127.0.0.1:9000 --data /tmp/s3-test-store
          ci/scripts/s3_test_store.sh env --addr 127.0.0.1:9000 >> "$GITHUB_ENV"
      - name: Every distributed backend is provisioned (no hollow green)
        run: bash ci/scripts/require_distributed_backends.sh
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributed-${{ matrix.crate }}
          path: /tmp/distributed
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Run the leg
        run: |
          read -ra tests <<< "$TESTS"
          bash ci/scripts/run_distributed_leg.sh "/tmp/distributed/distributed-$CRATE.tar.zst" "${tests[@]}"
        env:
          TESTS: ${{ matrix.tests }}
          CRATE: ${{ matrix.crate }}
      - if: failure()
        name: S3 store log (on failure)
        run: cat /tmp/s3-test-store/.log

  # The repository's guards (`ci/guards.toml`) and the tests of its own scripts, through the runners a local check uses too; a pull request runs what its diff can affect, main runs them all.
  guard:
    name: Guards
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
      BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-ci
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.kubeconform-cache
          key: kubeconform-schemas-${{ hashFiles('ci/scripts/check_kube_manifests.sh') }}
      - name: Run the guards
        run: python3 ci/scripts/run_guards.py ${BASE:+--base "$BASE"}
      - name: Test the scripts
        run: python3 ci/scripts/run_script_tests.py ${BASE:+--base "$BASE"}

  # `cargo deny` over the default and the shipped-feature graphs: the live advisory database, the license allowlist, and the bans and sources that formalise the engine's one-way dependency direction.
  dep-audit:
    name: Guard (dependency audit)
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
        with:
          no-sccache: 'true'
      - run: cargo deny check advisories licenses bans sources
      - run: cargo deny --all-features check bans advisories licenses sources

  # The `jammi-ai-native` wheels, maturin abi3 builds of the embedded engine for every platform, each held to the GLIBC floor, the machine its tag claims and PyPI's per-file limit.
  native-wheels:
    name: Native wheel (${{ matrix.dist }})
    needs:
      - image-cpu-merge
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - dist: linux-x86_64
            arch: amd64
            assert_arch: x86_64
            target_flag: ''
            glibc: '2.28'
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
            bare: false
          - dist: linux-aarch64
            arch: arm64
            assert_arch: aarch64
            target_flag: ''
            glibc: '2.28'
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
            bare: false
          - dist: macos-arm64
            assert_arch: aarch64
            rust_target: aarch64-apple-darwin
            target_flag: '--target aarch64-apple-darwin'
            glibc: ''
            runner: macos-14
            container: ''
            bare: true
          - dist: macos-x86_64
            assert_arch: x86_64
            rust_target: x86_64-apple-darwin
            target_flag: '--target x86_64-apple-darwin'
            glibc: ''
            runner: macos-14
            container: ''
            bare: true
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    defaults:
      run:
        working-directory: packaging/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: ${{ matrix.bare }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - if: ${{ matrix.bare }}
        name: maturin at its pin
        run: bash .docker/pinned-tools.sh maturin
        working-directory: ${{ github.workspace }}
      - if: ${{ matrix.bare }}
        uses: ./.github/actions/setup-rust-host
        with:
          targets: ${{ matrix.rust_target }}
      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: 'false'
      - name: Build the wheel
        run: |
          # $TARGET_FLAG is a flag and its value, split on purpose.
          read -ra target <<< "$TARGET_FLAG"
          maturin build --release --out dist "${target[@]}"
        env:
          TARGET_FLAG: ${{ matrix.target_flag }}
      - name: The wheel's .so holds the GLIBC floor and the machine
        run: bash ../../ci/scripts/assert_wheel_so.sh dist/*.whl "$ASSERT_ARCH" "$GLIBC"
        env:
          ASSERT_ARCH: ${{ matrix.assert_arch }}
          GLIBC: ${{ matrix.glibc }}
      - name: The wheel fits PyPI's per-file limit
        run: bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-native-${{ matrix.dist }}
          path: packaging/native/dist

  # The `jammi-ai-native-cu12` wheel, the embedded CUDA engine, built and checked by `ci/scripts/build_native_cu12_wheel.sh` in the CUDA image.
  native-wheel-cu12:
    name: Native wheel (CUDA)
    needs:
      - image-cuda-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false
      - name: Init the CUTLASS submodule
        run: git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass
      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: 'false'
      - run: bash ci/scripts/build_native_cu12_wheel.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-cu12-wheel
          path: packaging/native-cu12/dist/

  # One `jammi-server` binary per manifest build and arch, its features read from `ci/release-feature-manifest.json`, stripped, held to the GLIBC floor and the machine, and packaged as its release tarball (a CUDA build bundles its runtime libraries and leaves its loader and jail reports).
  server:
    name: Server (${{ matrix.build }}, ${{ matrix.target }})
    needs:
      - image-cpu-merge
      - image-cuda-merge
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: server-cpu
            arch: amd64
            cuda: false
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - build: server-cpu
            arch: arm64
            cuda: false
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - build: server-cu12
            arch: amd64
            cuda: true
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: 'false'
      - if: matrix.cuda
        name: Init the CUTLASS submodule (flash-attn builds its kernels from it)
        run: git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass
      - name: Build jammi-server (release)
        run: |
          features="$(jq -r --arg b "$BUILD" '.builds[$b].cargo_features | join(",")' ci/release-feature-manifest.json)"
          test -n "$features" || { echo "::error::ci/release-feature-manifest.json declares no cargo_features for build '$BUILD'" >&2; exit 1; }
          cargo build --release -p jammi-server --bin jammi-server --features "$features"
        env:
          BUILD: ${{ matrix.build }}
      - name: Strip the binary
        run: strip target/release/jammi-server
      - name: The binary holds the GLIBC floor and the machine
        run: |
          bash ci/scripts/assert_glibc_floor.sh target/release/jammi-server 2.28
          bash ci/scripts/assert_elf_machine.sh target/release/jammi-server "$ARCH"
        env:
          ARCH: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.build }}-${{ matrix.target }}-binary
          path: target/release/jammi-server
      - name: Package the release tarball
        id: tarball
        run: bash ci/scripts/package_server_tarball.sh "$BUILD" "$ARCH"
        env:
          BUILD: ${{ matrix.build }}
          ARCH: ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.build }}-${{ matrix.target }}-tarball
          path: ${{ steps.tarball.outputs.asset }}
      - if: always() && matrix.cuda
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cu12-loader-report
          path: cu12_loader_report_real.txt
      - if: always() && matrix.cuda
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cu12-jail-report
          path: cu12_jail_report_real.txt

  # Each server binary as its PyPI wheel, relabelled to the platform the binary requires, its runtime link set verified against the wheel's dependency wheels where the manifest says so, and held to PyPI's per-file limit.
  server-wheel:
    name: Server wheel (${{ matrix.build }}, ${{ matrix.target }})
    needs:
      - image-cpu-merge
      - server
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: server-cpu
            arch: amd64
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - build: server-cpu
            arch: arm64
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
          - build: server-cu12
            arch: amd64
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.build }}-${{ matrix.target }}-binary
          path: artifact
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: Build the wheel
        run: bash ci/scripts/build_server_wheel.sh "$BUILD" artifact/jammi-server "$PLATFORM_TAG"
        env:
          BUILD: ${{ matrix.build }}
          PLATFORM_TAG: manylinux_2_28_${{ matrix.target }}
      - name: The wheel fits PyPI's per-file limit
        run: bash ci/scripts/assert_wheel_size.sh "packaging/$BUILD"/dist/*.whl
        env:
          BUILD: ${{ matrix.build }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.build }}-${{ matrix.target }}-wheel
          path: packaging/${{ matrix.build }}/dist/

  # The `jammi` CLI release binary for every target the tree ships, packaged as its release tarball.
  cli:
    name: CLI (${{ matrix.triple }})
    needs:
      - image-cpu-merge
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - triple: x86_64-unknown-linux-gnu
            arch: amd64
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
            bare: false
          - triple: aarch64-unknown-linux-gnu
            arch: arm64
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
            bare: false
          - triple: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            runner: macos-14
            container: ''
            bare: true
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - if: ${{ matrix.bare }}
        uses: ./.github/actions/setup-rust-host
        with:
          targets: ${{ matrix.rust_target }}
      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: 'false'
      - name: Build jammi (release)
        run: cargo build --release -p jammi-cli --bin jammi
      - name: Package
        id: package
        run: bash ci/scripts/package_release_bin.sh jammi "$TARGET"
        env:
          TARGET: ${{ matrix.triple }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jammi-${{ matrix.triple }}
          path: ${{ steps.package.outputs.asset }}

  # The pure-Python client `jammi-ai`: its proto stubs generated, its hermetic tests run from source, its import direction asserted, and the wheel built and held to PyPI's per-file limit.
  client-wheel:
    name: Client wheel
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: A venv, as a reader installs it
        run: |
          python3 -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install from source and generate the stubs
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -e '.[dev]' build
          make generate
      - name: Test (hermetic)
        run: make test
      - name: The client imports with no engine
        run: |
          python3 - <<'PY'
          import sys, jammi
          bad = [m for m in sys.modules if m == "jammi_native" or m.startswith("jammi_native.")]
          assert not bad, f"import jammi eagerly pulled jammi_native: {bad}"
          PY
      - name: Build the wheel
        run: python -m build --wheel --outdir dist
      - name: The wheel fits PyPI's per-file limit
        run: bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-wheel
          path: clients/python/dist/

  # `@f-inverse/jammi-client` generated from the proto, type-checked, tested and packed: the tarball npm.yml publishes, at the Node version `.nvmrc` pins.
  ts-client:
    name: TS client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: clients/typescript/.nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/ts-client"
          npm pack --pack-destination "$RUNNER_TEMP/ts-client"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-client-package
          path: ${{ runner.temp }}/ts-client/*.tgz

  # The guide, with every Rust example in it compiled and run against the workspace, and the rustdoc of every crate, laid out as the site a release publishes.
  docs:
    name: Guide and API reference
    needs:
      - image-cpu-merge
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Build the guide
        run: mdbook build docs/guide
      - name: Build the workspace the guide's examples link against
        run: cargo build --workspace --exclude jammi-python --quiet
      - name: Test the guide's examples
        run: RUSTUP_TOOLCHAIN="$(bash ci/scripts/rust_pin.sh)" mdbook test docs/guide -L "${CARGO_TARGET_DIR:-target}/debug/deps"
      - name: Build the API reference
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude jammi-python --no-deps
      - name: Lay out the site
        run: |
          mkdir -p _site
          cp -r docs/guide/book/. _site/
          cp -r "${CARGO_TARGET_DIR:-target}/doc" _site/api
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: _site

  # The pytest suite over the two dists that ship in lockstep: the client from source with its generated stubs, and the compiled engine this run built as its `file://` backend.
  test-python:
    name: Test (Python)
    needs:
      - image-cpu-merge
      - native-wheels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install-jammi
        with:
          client: source
          extra-pip-packages: pytest
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - run: pytest crates/jammi-python/tests -v
      - name: Python client suite (with the embedded engine)
        run: make -C clients/python test-embedded
      - name: The UAT shape-B/C Python scripts
        run: |
          for script in tests/uat/shape_b_*.py tests/uat/shape_c_*.py; do
            echo "=== $script"
            python3 "$script"
          done

  # The client's live-server suite over this run's engine, server and CLI, against the engine's test checkpoints.
  client-live:
    name: Python client against a live server
    needs:
      - cli
      - image-cpu-merge
      - native-wheels
      - server
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install-jammi
        with:
          client: source
          binaries: 'true'
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - run: make -C clients/python test-live

  # The book's checks that need no model: its API reference against the engine, its library's lint and unit tests, the no-deferral gate and its citations; the chapters run on real models in the cookbook lane.
  book-checks:
    name: Book (static checks)
    needs:
      - client-wheel
      - image-cpu-merge
      - native-wheels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    defaults:
      run:
        working-directory: cookbook/book
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install-jammi
        with:
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - name: Install the book
        run: pip install -e '.[book,dev]'
      - name: API reference matches the engine
        run: python -m jammi.session_journal -- python scripts/check_api_reference.py
      - name: Lint
        run: ruff check jammi_cookbook scripts tests
      - name: Shared-lib unit tests
        run: pytest -q
      - name: No-deferral gate
        run: bash scripts/no_deferral_grep.sh
      - name: No dangling citations
        run: python -m jammi.session_journal -- python scripts/check_citations.py

  # The CUDA image's runtime stage assembles from this run's CUDA binary before a tag publishes it; the GPU runtime itself is not testable here.
  server-image-cuda-check:
    name: Server image (CUDA) assembles
    needs:
      - cli
      - server
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: binaries
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cu12-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder-cuda
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - uses: ./.github/actions/build-image
        with:
          build-args: |
            RUNTIME_VARIANT=runtime-cuda
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          platforms: linux/amd64
          cache-scope: cu12

  # Shape B: the CPU image packaged from the run's binaries, `deploy/docker-compose.yml` brought up with the CI fixture overlay and driven by the client wheel, with a restart's result durability; one leg per arch on its native runner.
  compose-smoke:
    name: Compose smoke (Shape B, ${{ matrix.arch }})
    needs:
      - cli
      - client-wheel
      - server
    if: github.event_name == 'pull_request'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            triple: x86_64-unknown-linux-gnu
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            triple: aarch64-unknown-linux-gnu
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
      JAMMI_IMAGE: jammi-ai-server:smoke
      COMPOSE_FILE: deploy/docker-compose.yml:deploy/docker-compose.ci.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: An ephemeral audit master key for this throwaway stack
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "JAMMI_AUDIT_MASTER_KEY=$key" >> "$GITHUB_ENV"
      - id: binaries
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cpu-${{ matrix.target }}-binary
          cli: jammi-${{ matrix.triple }}
          stage: builder
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - uses: ./.github/actions/build-image
        with:
          load-tag: ${{ env.JAMMI_IMAGE }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          cache-scope: cpu-generic-${{ matrix.arch }}
      - name: The pinned service images, under the names the compose file uses
        run: bash ci/scripts/pull_service_images.sh
      - name: Bring up Shape B (server + Postgres)
        run: docker compose up --wait
      - name: The running container is the image this job built
        run: bash ci/scripts/assert_compose_image_identity.sh "$JAMMI_IMAGE" jammi-server
      - uses: ./.github/actions/install-jammi
        with:
          native: 'false'
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - name: The remote Shape B smoke
        run: python3 tests/compose/shape_b_remote.py
      - name: The Shape B release smoke (RELEASE via SIGINT)
        run: python3 tests/compose/shape_b_release.py
      - name: The Postgres catalog was exercised at runtime
        run: bash ci/scripts/assert_catalog_exercised.sh docker compose exec -T postgres
      - if: failure()
        name: Compose logs (on failure)
        run: docker compose logs
      - if: always()
        name: Tear down
        run: docker compose down -v

  # Shape C: the CPU image packaged from the run's binaries, loaded into a kind cluster, `deploy/kubernetes/overlays/ci` applied and driven by the client wheel through a rollout restart; one amd64 leg, the arm64 image being proven by the compose smoke.
  kube-smoke:
    name: Kubernetes smoke (kind, amd64)
    needs:
      - cli
      - client-wheel
      - server
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      JAMMI_ARTIFACT_RUN: ${{ github.run_id }}
      JAMMI_IMAGE: jammi-ai-server:smoke
      KUBECONFORM_CACHE: ${{ github.workspace }}/.kubeconform-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: kustomize and kubeconform at their pins
        run: sudo bash .docker/pinned-tools.sh kustomize kubeconform
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.kubeconform-cache
          key: kubeconform-schemas-${{ hashFiles('ci/scripts/check_kube_manifests.sh') }}
      - name: An ephemeral audit master key for this throwaway stack
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          echo "JAMMI_AUDIT_MASTER_KEY=$key" >> "$GITHUB_ENV"
      - id: binaries
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cpu-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - uses: ./.github/actions/build-image
        with:
          load-tag: ${{ env.JAMMI_IMAGE }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          cache-scope: cpu-generic-amd64
      - name: The ci overlay is valid against the pinned schema, before it is applied
        run: bash ci/scripts/check_kube_manifests.sh deploy/kubernetes/overlays/ci
      - name: Render the kind cluster config
        run: envsubst < deploy/kubernetes/overlays/ci/kind-config.yaml.in > "$RUNNER_TEMP/kind-config.yaml"
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          kubectl_version: v1.34.11
          cluster_name: kind
          config: ${{ runner.temp }}/kind-config.yaml
      - name: The pinned service images, under the names the overlay uses
        id: services
        run: '{ echo ''images<<EOF''; bash ci/scripts/pull_service_images.sh; echo EOF; } >> "$GITHUB_OUTPUT"'
      - name: Load the built server image and the service images into kind
        run: |
          read -ra services <<< "$(tr '\n' ' ' <<< "$SERVICE_IMAGES")"
          kind load docker-image "$JAMMI_IMAGE" "${services[@]}" --name kind
        env:
          SERVICE_IMAGES: ${{ steps.services.outputs.images }}
      - name: Create the namespace and the Secret
        run: |
          kubectl create namespace jammi-ci
          kubectl -n jammi-ci create secret generic jammi-server-secrets \
            --from-literal=JAMMI_AUDIT_MASTER_KEY="$JAMMI_AUDIT_MASTER_KEY" \
            --from-literal=JAMMI_CATALOG__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi \
            --from-literal=JAMMI_BROKER__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi
      - name: Apply the ci overlay
        run: kustomize build deploy/kubernetes/overlays/ci | kubectl apply -f -
      - name: Wait for postgres and jammi-server to roll out
        run: |
          kubectl -n jammi-ci rollout status statefulset/postgres --timeout=300s
          kubectl -n jammi-ci rollout status deploy/jammi-server --timeout=300s
      - name: Every pod runs the image this job built
        run: bash ci/scripts/assert_kind_image_identity.sh "$JAMMI_IMAGE" jammi-ci app=jammi-server
      - uses: ./.github/actions/install-jammi
        with:
          native: 'false'
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - name: The remote Kubernetes smoke (port-forward + rollout restart)
        run: python3 tests/compose/shape_c_kube_remote.py
      - name: The Postgres catalog was exercised at runtime
        run: bash ci/scripts/assert_catalog_exercised.sh kubectl -n jammi-ci exec statefulset/postgres --
      - if: failure()
        name: Pod state and logs (on failure)
        run: |
          kubectl -n jammi-ci get pods -o wide
          kubectl -n jammi-ci describe pod -l app=jammi-server
          kubectl -n jammi-ci logs -l app=jammi-server --tail=-1 --all-containers
      - if: always()
        name: Delete the kind cluster
        run: kind delete cluster --name kind

  # The one check a ruleset requires: every job above succeeded or was skipped by its trigger.
  ci-summary:
    needs:
      - subject
      - image-cpu
      - image-cpu-merge
      - image-cuda
      - image-cuda-merge
      - image-latest
      - devcontainer-image
      - fmt-clippy
      - clippy-gated
      - clippy-cuda
      - clippy-metal
      - test-build
      - test
      - test-permission-fault
      - test-storage-cloud
      - test-python-rust
      - test-pg
      - test-live
      - perf-gate
      - distributed-build
      - distributed
      - guard
      - dep-audit
      - native-wheels
      - native-wheel-cu12
      - server
      - server-wheel
      - cli
      - client-wheel
      - ts-client
      - docs
      - test-python
      - client-live
      - book-checks
      - server-image-cuda-check
      - compose-smoke
      - kube-smoke
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "  \(.key) = \(.value.result)"' <<< "$NEEDS"
          failed="$(jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")"
          [ -z "$failed" ] || { echo "::error::failed or cancelled: $failed"; exit 1; }
