name: PyPI (jammi-server, CPU)

# Publishes the CPU `jammi-server` wheel to PyPI on a `py-v*` tag — the SAME tag
# that publishes the base client `jammi-ai` and the `jammi-ai-native` engine
# wheels, so the whole Python surface ships in LOCKSTEP at one version. Thin
# caller of the shared `_pypi-server` reusable (build -> package, NO GPU
# prove-gate on this leg); the publish job lives HERE, not in the reusable —
# PyPI's token exchange and its attestation verification match different
# workflow-ref claims for a reusable-workflow publish and can never both pass
# (see `_pypi-server.yml`'s header). The PyPI trusted publisher for
# `jammi-server` is registered under THIS file's name (workflow
# `pypi-server.yml`, environment `pypi`).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
  # PR gate: build-only (no publish) on every input compiled into the wheel
  # (`ci/scripts/check_wheel_gates.py` holds the list), so a wheel that stops
  # building, or outgrows PyPI's per-file limit
  # (`ci/scripts/assert_wheel_size.sh`), fails on the PR that caused it.
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - ".cargo/**"
      - "rust-toolchain.toml"
      - "packaging/server-cpu/**"
      - ".github/workflows/pypi-server.yml"
      - ".github/workflows/_pypi-server.yml"
      - "ci/scripts/assert_wheel_size.sh"
      - "ci/release-feature-manifest.json"

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-server-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; only the publish job below widens to
# `id-token: write` (PyPI trusted publishing).
permissions:
  contents: read

jobs:
  # The tree's CI images (`_ci-image.yml`), by content: `ci.yml` builds them,
  # and this run waits until they exist.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  read-manifest:
    name: Read release feature list
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      cargo_features: ${{ steps.manifest.outputs.cargo_features }}
    steps:
      - uses: actions/checkout@v4

      # `ci/release-feature-manifest.json`'s `cpu-wheel` lane is the single
      # source of truth for the CPU wheel's cargo feature list — read
      # here, once, and fed to both arch legs below via `needs.read-
      # manifest.outputs.cargo_features` (a reusable `uses:` workflow's `with:`
      # inputs cannot run their own shell, so the read happens in a job of
      # this workflow, the same idiom as pypi-server-cuda.yml's).
      - name: Read release feature list (ci/release-feature-manifest.json)
        id: manifest
        run: |
          set -euo pipefail
          features="$(jq -r '.lanes["cpu-wheel"].cargo_features | join(",")' ci/release-feature-manifest.json)"
          if [ -z "$features" ]; then
            echo "::error::ci/release-feature-manifest.json produced an empty cpu-wheel cargo_features list" >&2
            exit 1
          fi
          echo "cargo_features=$features" >> "$GITHUB_OUTPUT"

  server-cpu-x86_64:
    name: jammi-server (CPU, x86_64)
    needs: [read-manifest, ci-image]
    permissions:
      contents: read
    uses: ./.github/workflows/_pypi-server.yml
    with:
      container_image: ${{ needs.ci-image.outputs.cpu }}
      cargo_features: ${{ needs.read-manifest.outputs.cargo_features }}
      package_dir: packaging/server-cpu
      artifact_prefix: server-cpu-x86_64
      platform_tag: manylinux_2_28_x86_64
    secrets: inherit

  server-cpu-aarch64:
    name: jammi-server (CPU, aarch64)
    needs: [read-manifest, ci-image]
    permissions:
      contents: read
    uses: ./.github/workflows/_pypi-server.yml
    with:
      container_image: ${{ needs.ci-image.outputs.cpu }}
      runs_on: ubuntu-24.04-arm
      cargo_features: ${{ needs.read-manifest.outputs.cargo_features }}
      package_dir: packaging/server-cpu
      artifact_prefix: server-cpu-aarch64
      platform_tag: manylinux_2_28_aarch64
    secrets: inherit

  proof:
    name: Proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before the CPU wheel is published (every release publisher
    # gates on the prove verdict, all-or-nothing: the CPU wheel never touches
    # CUDA itself, but it ships in the SAME all-or-nothing lockstep release as
    # the CUDA lanes, so it must not promote ahead of an unproven commit).
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref — a tag push, or a
    # workflow_dispatch run on the tag (recovery: PyPI rejects a re-upload of
    # an existing version, so re-running the tag is idempotent) — whose
    # commit's GPU-prove verdict is green. A branch dispatch or PR is an
    # artifact-only dry run and can never publish. Same recovery contract as
    # `pypi.yml`/`pypi-client.yml` on this lockstep surface. PURE conjunction
    # (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.server-cpu-x86_64.result == 'success' && needs.server-cpu-aarch64.result == 'success' && needs.proof.result == 'success'
    needs: [server-cpu-x86_64, server-cpu-aarch64, proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      # A release with a partial platform set (one arch's wheel missing) is
      # a worse outcome than a failed release -- both legs are `needs:` of
      # this job, and this ONE job downloads and uploads both wheels
      # together (`pattern` + `merge-multiple`, the same shape `pypi.yml`'s
      # publish job already uses).
      - uses: actions/download-artifact@v4
        with:
          pattern: server-cpu-*-dist
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
