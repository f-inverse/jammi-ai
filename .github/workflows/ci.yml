          # the `push` sentinel on a `pull_request`/`pull_request_target`
          # event, or any non-sentinel value on a `push` event, is a named
          # refusal citing both variables, never silently resolved. Past
          # that cross-check the raw value normalises into either a
          # resolved sha (arm (b) engages: the artifact's own last commit
          # must equal it, so ANY later commit on the PR, whether or not it
          # touches a file the record already names, reds named, rather
          # than only the subset arm (a) alone can see) or `None` (the
          # `push` sentinel; arm (a) alone applies, recorded via a printed
          # notice in the test's own stdout). No GPU, no network.
          - name: frontend_ab_artifact suite
            cmd: JAMMI_CI_FRONTEND_AB_FINAL_FIXTURE_EXPECTED=1 JAMMI_CI_UNIT_HEAD_SHA=${{ github.event.pull_request.head.sha || 'push' }} JAMMI_CI_UNIT_BASE_SHA=${{ github.event.pull_request.base.sha || '' }} python3 ci/scripts/perf/test_frontend_ab_artifact.py
            fetch_depth: "0"
          # `fa2_ab.sh`'s own shape test: the shell PRODUCER is a manual,
          # exclusive-timing-box script with hardcoded `/root/...` paths
          # and no `DRY_RUN` support at all, so this covers its flash/block
