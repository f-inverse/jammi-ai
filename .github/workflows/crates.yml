name: Crates

on:
  push:
    tags: ["v*"]
  # Manual re-run to finish a release whose publish step was interrupted (e.g. a
  # runner ran out of disk mid-publish). Pass the version to (re)publish; the
  # per-crate "already on crates.io" guard skips whatever already landed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 0.13.0. Defaults to the pushed tag."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege at the workflow level; the publish job widens to
# `id-token: write` (crates.io trusted publishing) and `github-release` to
# `contents: write` per job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Verify tag matches workspace version
        if: github.event_name == 'push'
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match workspace version $version"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `jammi-python` is built via maturin, not workspace cargo — its
      # `extension-module` feature is opt-in so the bare workspace test
      # lane would fail to link `-lpython3.x` on the manylinux CI image.
      # The crate is exercised end-to-end by the `Test (Python)` job in
      # `ci.yml` (which also runs `cargo test -p jammi-python` against
      # the venv's interpreter).
      - name: Run tests
        run: cargo test --workspace --exclude jammi-python

  perf-gate:
    name: Performance regression gate (release-blocking)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    # The release tag is the authoritative same-box-ish performance gate: a
    # structural throughput regression (a path that went quadratic, a serialized
    # parallel section, a dropped fast path) SHOULD block a release. Each
    # `*-scale` tier maps its measured-rate-vs-committed-floor verdict (and its
    # determinism-digest check) to the process exit code, so a regression exits
    # non-zero and reds this job — and because `publish` needs it, the crates
    # never ship. This is the gated half of §4.4; the nightly `perf.yml` lane is
    # the non-blocking early-warning half. The documented contract (the verb ×
    # baseline × threshold × reference-box SLO table) is
    # `docs/guide/src/performance-slos.md`.
    env:
      # Pin Rayon to one thread so the measured rate reflects the engine's
      # per-core code path, not the runner's core count — the posture the
      # committed baselines were emitted under.
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Build the bench harness (release)
        # The committed baselines are release-profile numbers; the rate gate
        # only means anything against a release build.
        run: cargo build -p jammi-bench --release

      # The tier list is stated once, in the shared script (also the nightly
      # early-warning lane's list — perf.yml); a red names the regressed tier
      # via its ::group:: header in the log.
      - name: Run the CPU-hermetic scale tiers (measured-rate gate)
        run: bash ci/scripts/perf/run_scale_tiers.sh

  publish:
    name: Publish to crates.io
    # A release ships only if BOTH the workspace validates AND the performance
    # gate holds — a structural perf regression blocks the tag.
    needs: [validate, perf-gate]
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # Trusted-publishing auth exchanges a short-lived GitHub OIDC token for a
      # crates.io API token. Retrying this exchange is unconditionally safe —
      # a failed or repeated token exchange creates no state on crates.io — so
      # a blind bounded retry (no output classification needed) is correct
      # here, unlike the publish step below. GitHub Actions has no construct
      # to loop a `uses:` step in place (and no way for a later `run:` step to
      # read an earlier `uses:` step's console output to classify its
      # failure), so the bounded attempts are unrolled explicitly: each
      # subsequent attempt is gated on the previous one having failed, and the
      # resolution step below picks whichever attempt produced a token.
      - name: Authenticate with crates.io (attempt 1)
        id: auth1
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Back off before crates.io auth retry
        if: steps.auth1.outcome == 'failure'
        run: sleep 2

      - name: Authenticate with crates.io (attempt 2)
        id: auth2
        if: steps.auth1.outcome == 'failure'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Back off before crates.io auth retry (2)
        if: steps.auth2.outcome == 'failure'
        run: sleep 4

      - name: Authenticate with crates.io (attempt 3)
        id: auth3
        if: steps.auth2.outcome == 'failure'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Back off before crates.io auth retry (3)
        if: steps.auth3.outcome == 'failure'
        run: sleep 8

      - name: Authenticate with crates.io (attempt 4)
        id: auth4
        if: steps.auth3.outcome == 'failure'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Back off before crates.io auth retry (4)
        if: steps.auth4.outcome == 'failure'
        run: sleep 16

      - name: Authenticate with crates.io (attempt 5)
        id: auth5
        if: steps.auth4.outcome == 'failure'
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Resolve crates.io auth token
        id: auth
        run: |
          set -euo pipefail
          for token in \
            "${{ steps.auth1.outputs.token }}" \
            "${{ steps.auth2.outputs.token }}" \
            "${{ steps.auth3.outputs.token }}" \
            "${{ steps.auth4.outputs.token }}" \
            "${{ steps.auth5.outputs.token }}"; do
            if [ -n "$token" ]; then
              echo "::add-mask::$token"
              echo "token=$token" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::crates.io auth failed after 5 attempts" >&2
          exit 1

      # The whole publish program (topo order, transient-retry classification,
      # sparse-index wait, per-crate presence guard) lives in
      # ci/scripts/publish_crates.sh; this step only supplies the env it needs.
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          # On a tag push, the script derives the version from the tag
          # (v0.13.0 -> 0.13.0); on a manual dispatch, from this input.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: bash ci/scripts/publish_crates.sh

  github-release:
    name: GitHub Release
    needs: publish
    # Only on a tag push — a manual dispatch (used to finish an interrupted
    # publish) has no tag ref to create a release from.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # `release-binaries.yml`'s legs create the release themselves before
      # uploading their assets, so by the time the crates.io publish finishes the
      # release usually already exists. Create it only if missing — otherwise
      # no-op — so whoever wins the race creates it and this job tolerates it.
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
