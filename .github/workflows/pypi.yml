name: PyPI

# Publishes every Python dist to PyPI on a `py-v*` tag, in lockstep at the
# workspace version: the pure-Python client `jammi-ai` (import `jammi`), the
# embedded engine `jammi-ai-native` (per platform) and `jammi-ai-native-cu12`
# (the same `jammi_native` module on CUDA), and the servers `jammi-server`
# (CPU, per arch) and `jammi-server-cu12`. `jammi-ai`'s `[embedded]` extra
# pins `jammi-ai-native==X`, so the five ship together or not at all.
#
# It compiles nothing: `build.yml` builds every wheel on every pull request
# and on `main`, where a wheel that stops building or outgrows PyPI's per-file
# limit fails the change that caused it, and this workflow publishes the ones
# the run that proved the tag's tree built — the bytes that run's Python
# lanes, smokes and cookbook installed. The publish job is one matrix, one
# PyPI project per leg: PyPI's trusted publisher for each project is
# registered to THIS file (`pypi.yml`, environment `pypi`), and a publish
# from inside a reusable workflow can never satisfy both the OIDC token's
# claim and the attestation's (`_server.yml`'s header).
#
# A dispatch on the tag finishes an interrupted release (PyPI refuses a
# re-upload of an existing version, so a re-run is idempotent); a branch
# dispatch is a rehearsal that resolves the branch tree's proving run and
# publishes nothing.

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

# Serialize per ref, never cancel: a PyPI upload is not resumable.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: build
      artifacts: >-
        client-wheel
        wheels-native-linux-x86_64
        wheels-native-linux-aarch64
        wheels-native-macos-arm64
        wheels-native-macos-x86_64
        native-cu12-wheel
        server-cpu-x86_64-wheel
        server-cpu-aarch64-wheel
        server-cu12-x86_64-wheel

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  publish:
    name: Publish ${{ matrix.project }}
    needs: [artifacts, proof]
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: jammi-ai
            pattern: client-wheel
          - project: jammi-ai-native
            pattern: wheels-native-*
          - project: jammi-ai-native-cu12
            pattern: native-cu12-wheel
          - project: jammi-server
            pattern: server-cpu-*-wheel
          - project: jammi-server-cu12
            pattern: server-cu12-x86_64-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      # One leg uploads every wheel of its project together: a release with
      # one platform missing is worse than a failed release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ matrix.pattern }}
          merge-multiple: true
          path: dist
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
