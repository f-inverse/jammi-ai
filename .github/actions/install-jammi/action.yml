name: install-jammi
description: >
  Installs the jammi surfaces a run built, the way a user would: a `.venv` at
  the workspace root holding the base client `jammi-ai` (import `jammi`) and
  the compiled `jammi-ai-native` engine (import `jammi_native`, the Linux
  x86_64 wheel `_native-wheels.yml` built), and optionally the `jammi-server`
  and `jammi` binaries on PATH. Nothing here compiles: every consumer runs the
  bytes its run built once. Later steps re-activate the venv themselves
  (`. .venv/bin/activate`). Must run AFTER `actions/checkout@v4` (a local-path
  composite).

inputs:
  client:
    description: >
      "source" (the default) installs the client from `clients/python` in
      editable mode, with its dev extra and generated proto stubs — the shape
      a suite testing the client's own source needs. "wheel" then installs
      the client wheel `_client-wheel.yml` built over it — the shape a reader
      installs.
    required: false
    default: "source"
  binaries:
    description: >
      "true" also puts the run's CPU `jammi-server` (`server-cpu`, x86_64) and
      `jammi` CLI on PATH, named by `JAMMI_SERVER_BIN` and `JAMMI_CLI_BIN`.
    required: false
    default: "false"
  extra-pip-packages:
    description: "Extra pip packages installed into the venv (space-separated), e.g. pytest."
    required: false
    default: ""
  run-id:
    description: "The run that built the artifacts; empty (the default) is this run."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: wheels-native-linux-x86_64
        path: ${{ runner.temp }}/jammi-dist/native
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.run-id != '' && github.token || '' }}

    - if: inputs.client == 'wheel'
      uses: actions/download-artifact@v4
      with:
        name: client-wheel
        path: ${{ runner.temp }}/jammi-dist/client
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.run-id != '' && github.token || '' }}

    - name: Install the client and the native engine
      shell: bash
      env:
        CLIENT: ${{ inputs.client }}
        EXTRA_PIP: ${{ inputs.extra-pip-packages }}
        DIST: ${{ runner.temp }}/jammi-dist
      run: |
        set -euo pipefail
        case "$CLIENT" in
          source | wheel) ;;
          *) echo "::error::install-jammi: client must be source or wheel, got '$CLIENT'" >&2; exit 1 ;;
        esac
        python3 -m venv .venv
        . .venv/bin/activate
        pip install --upgrade pip
        # $EXTRA_PIP is deliberately unquoted: a space-separated package list.
        if [ -n "$EXTRA_PIP" ]; then pip install $EXTRA_PIP; fi
        pip install -e 'clients/python[dev]'
        make -C clients/python generate
        pip install --force-reinstall --no-deps "$DIST"/native/jammi_ai_native-*.whl
        if [ "$CLIENT" = wheel ]; then
          pip install --force-reinstall --no-deps "$DIST"/client/jammi_ai-*.whl
        fi

    - if: inputs.binaries == 'true'
      uses: actions/download-artifact@v4
      with:
        name: server-cpu-x86_64-binary
        path: ${{ runner.temp }}/jammi-bin
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.run-id != '' && github.token || '' }}

    - if: inputs.binaries == 'true'
      uses: actions/download-artifact@v4
      with:
        name: jammi-x86_64-unknown-linux-gnu
        path: ${{ runner.temp }}/jammi-dist/cli
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.run-id != '' && github.token || '' }}

    - name: Put jammi-server and jammi on PATH
      if: inputs.binaries == 'true'
      shell: bash
      env:
        BIN: ${{ runner.temp }}/jammi-bin
        DIST: ${{ runner.temp }}/jammi-dist
      run: |
        set -euo pipefail
        tar -xzf "$(ls "$DIST"/cli/jammi-*.tar.gz)" -C "$BIN" jammi
        # Artifacts do not preserve the exec bit.
        chmod +x "$BIN/jammi-server" "$BIN/jammi"
        echo "$BIN" >> "$GITHUB_PATH"
        {
          echo "JAMMI_SERVER_BIN=$BIN/jammi-server"
          echo "JAMMI_CLI_BIN=$BIN/jammi"
        } >> "$GITHUB_ENV"
