name: Compose smoke (Shape B)

# Packages the CPU `jammi-ai-server` image, brings up
# `deploy/docker-compose.yml` (Shape B: server + one Postgres serving as
# catalog and broker) with the CI fixture-mount override, and drives it with a
# remote Python client (`tests/compose/shape_b_remote.py`) — proving the
# compose file, the image's env-only config resolution, and a restart's
# result durability together, not any one of them in isolation.
#
# Where the image's binaries come from is the one difference between its two
# callers:
#   * `ci.yml` calls it on every pull request and on `main` with `prebuilt`:
#     each arch's image packages the `jammi-server` and `jammi` binaries that
#     run built (`_server.yml`, `_cli.yml`), through the Dockerfile's
#     builder-stage contract, so the smoke costs the stack's start-up, not a
#     compile, and the run's summary carries the result.
#   * The nightly (catching drift with no code change at all — a base-image
#     CVE fix, a dependency bump) and a dispatch build the image the way a
#     self-hoster's `docker build .` does, compiling the binaries in the
#     Dockerfile's own builder stage.
#
# No GHCR credentials are ever touched here: the composite build below runs
# with `push: "false"` — a `docker load` into the runner's own daemon, never
# a registry write — so this workflow needs no `packages: write` permission
# and is not a promotion primitive (`check_gpu_prove_once.py`'s P6 rule
# reads `push:` values other than a literal `false` as a promotion
# candidate; this workflow's literal `"false"` is deliberately exempt).

on:
  workflow_call:
    inputs:
      prebuilt:
        description: >
          Package the binaries the calling run built (`server-cpu-<arch>-binary`,
          `jammi-<arch>-unknown-linux-gnu`) instead of compiling them.
        type: boolean
        required: true
  schedule:
    # 03:00 UTC nightly.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tree's CI images (`_ci-image.yml`), by content: `ci.yml` builds them,
  # and this run waits until they exist.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  compose-smoke:
    name: Compose smoke (Shape B, ${{ matrix.arch }})
    needs: [ci-image]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            target_arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate the ephemeral compose env (job-wide)
        run: |
          set -euo pipefail
          # Compose interpolates `${JAMMI_AUDIT_MASTER_KEY:?…}` against every
          # subcommand this job runs, not just "up" — `ps -q`, `logs`,
          # `down -v`, and the smoke script's own `docker compose restart`
          # all fail the same "required variable ... is missing a value"
          # unless the key is in the environment for the whole job. Generate
          # it once here and export it via `$GITHUB_ENV` so every later step
          # (including the ones the Python script subprocesses) inherits it.
          # A synthetic key for this ephemeral, throwaway compose stack —
          # never a real deployment secret.
          key="$(openssl rand -hex 32)"
          echo "::add-mask::${key}"
          echo "JAMMI_AUDIT_MASTER_KEY=${key}" >> "$GITHUB_ENV"
          echo "JAMMI_IMAGE=jammi-ai-server:pr" >> "$GITHUB_ENV"

      - name: Stage the run's binaries as the builder stage
        id: binaries
        if: inputs.prebuilt
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cpu-${{ matrix.target_arch }}-binary
          cli: jammi-${{ matrix.target_arch }}-unknown-linux-gnu
          stage: builder

      # Compiling instead: `ci/release-feature-manifest.json`'s `server-cpu`
      # build is the single source of truth for the Dockerfile's
      # `CARGO_FEATURES` build-arg (required — no default).
      - name: Read release feature list (ci/release-feature-manifest.json)
        id: manifest
        if: ${{ !inputs.prebuilt }}
        run: |
          set -euo pipefail
          features="$(jq -r '.builds["server-cpu"].cargo_features | join(",")' ci/release-feature-manifest.json)"
          if [ -z "$features" ]; then
            echo "::error::ci/release-feature-manifest.json produced an empty server-cpu cargo_features list" >&2
            exit 1
          fi
          {
            echo "build-args<<EOF"
            echo "BASE_IMAGE=${{ needs.ci-image.outputs.cpu }}"
            echo "CARGO_FEATURES=$features"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build the CPU image (load, no push)
        uses: ./.github/actions/docker-publish
        with:
          push: "false"
          load: "true"
          local-tag: jammi-ai-server:pr
          build-args: ${{ steps.manifest.outputs.build-args }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          # No `platforms` input -- native (the default, per this action's
          # own doc): each leg's own runner arch is what buildx builds, so
          # the arm64 leg loads a real arm64 image, never an emulated one
          # (`load: true` is single-platform by design).
          # The docker exporter (what `load: true` uses) cannot carry
          # attestations on a stock daemon — belt-and-braces: build-push-
          # action already omits default provenance when `load: true`, and
          # `sbom: false` is the one that actually matters here.
          sbom: "false"
          provenance: "false"
          cache-scope: cpu-${{ matrix.arch }}

      - name: Bring up Shape B (server + Postgres)
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up --wait

      - name: Assert the running container is the image this job built
        run: |
          set -euo pipefail
          built_id="$(docker image inspect --format '{{.Id}}' "$JAMMI_IMAGE")"
          container_id="$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml ps -q jammi-server)"
          running_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          if [ "$built_id" != "$running_id" ]; then
            echo "::error::running container's image ($running_id) is not the image this job built ($built_id) -- a pulled :latest cannot pass this smoke" >&2
            exit 1
          fi
          echo "running container image matches the built image: $built_id"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `grpcio-tools` (needed to regenerate the proto stubs) lives in the
      # `dev` extra, mirroring ci.yml's `py-client` job.
      - name: Install clients/python (dev extra) + generate stubs
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e 'clients/python[dev]'
          make -C clients/python generate

      - name: Run the remote Shape B smoke script
        run: python3 tests/compose/shape_b_remote.py

      # The two-mode shutdown's RELEASE arm on the shipped image: SIGINT
      # hands the in-flight job's lease back (Postgres row: lease NULL,
      # releases = 1), the process exits 0, `restart: unless-stopped` brings
      # it back and its worker reclaims the row (attempts = 2).
      - name: Run the Shape B release smoke script (RELEASE via SIGINT)
        run: python3 tests/compose/shape_b_release.py

      - name: Assert the Postgres catalog was exercised at runtime
        run: |
          set -euo pipefail
          catalog_count="$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml exec -T postgres \
            psql -U jammi -d jammi -tAc 'select count(*) from sources')"
          echo "postgres catalog sources row count: ${catalog_count}"
          if [ "${catalog_count}" -lt 1 ]; then
            echo "::error::expected at least 1 row in the Postgres 'sources' table after shape_b_remote.py's add_source call, got ${catalog_count} -- the compose file's JAMMI_CATALOG__POSTGRES__URL is not actually backing the catalog" >&2
            exit 1
          fi

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml down -v
