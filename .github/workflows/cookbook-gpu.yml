# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# Every recipe and every page of the book, run with the real Hub models they
# teach with, over the builds of the ci.yml run that proved the tree: the CUDA
# engine wheel, the client wheel, the CUDA server and the CLI, installed on a
# rented L4 (the class of GPU a Colab reader gets). The run records each page's
# execution and assembles the book a release publishes. Every release gates on
# this lane's recorded verdict for the tree it promotes: dispatch it before
# tagging.

name: Cookbook on a GPU
'on':
  pull_request:
    types:
      - labeled
  workflow_dispatch: {}
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # The ci.yml run that proved this tree, which holds what this workflow installs.
  artifacts-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ci
          ARTIFACTS: client-wheel jammi-x86_64-unknown-linux-gnu native-cu12-wheel server-cu12-x86_64-binary
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # Records the tree this run renders the book over; the pod checks out that same commit.
  cookbook-subject:
    name: Subject
    if: (github.event_name == 'pull_request' && github.event.label.name == 'cookbook-gpu') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: subject
        uses: ./.github/actions/record-subject

  # Every recipe and page on real Hub models over the proving run's builds, on a rented L4; the whole-book assembly then reads each page's record and executes nothing.
  cookbook:
    name: Cookbook on RunPod
    needs:
      - artifacts-ci
      - await-images
      - cookbook-subject
    if: (github.event_name == 'pull_request' && github.event.label.name == 'cookbook-gpu') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    permissions:
      contents: read
      actions: read
    concurrency:
      group: cookbook-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 280
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-cu12-wheel
          path: ${{ runner.temp }}/artifacts/native
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: client-wheel
          path: ${{ runner.temp }}/artifacts/client
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: server-cu12-x86_64-binary
          path: ${{ runner.temp }}/artifacts/server
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: jammi-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/artifacts/cli
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_cookbook_gpu.sh
        env:
          RP_IMAGE: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          PROVE_EXPECT_SHA: ${{ needs.cookbook-subject.outputs.commit }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
          FREEZE_OUT: cookbook/book/_freeze
      - name: Assemble the book
        run: quarto render --profile assemble
        working-directory: cookbook/book
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookbook-book
          path: cookbook/book/_book
