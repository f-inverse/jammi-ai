# env wins over this file (the JAMMI_<PATH> layer resolves after it); secrets
# never here -- JAMMI_AUDIT_MASTER_KEY, JAMMI_CATALOG__POSTGRES__URL and
# JAMMI_BROKER__JET_STREAM__URL come from the Secret this Deployment's
# envFrom names, never from this ConfigMap.

[storage]
result_root = "s3://jammi-results/prod"

[storage.cloud.s3]
region = "us-east-1"

[lease]
duration_secs = 30
heartbeat_secs = 10

[distributed]
# The submit edge admits up to the compute pod's two devices (shape D's
# `jammi-server-compute` runs `task_slots = 1` but assembles a rank-0 +
# rank-1 pair from `[worker] local_ranks = 2`); a cross-pod `Peer` gang
# needs this bound raised to the target world size on BOTH this ConfigMap
# and every compute pod's own `[distributed] max_world_size`.
max_world_size = 2

[server]
services = ["core", "event", "eval"]

[worker]
enabled = false
