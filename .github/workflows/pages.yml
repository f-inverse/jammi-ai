name: Pages

# Deploys the documentation site of a `py-v*` release, behind the shared
# release gate: the guide and API reference the `ci.yml` run that proved the
# tree built (`docs`), and the book the `cookbook-gpu.yml` run that proved it
# rendered on real models (`book`), so what a reader reads is what PyPI serves
# and what each chapter's Colab badge installs. It compiles and renders
# nothing. A dispatch on the tag redeploys the same site; a branch dispatch is
# a rehearsal that lays the site out and deploys nothing.

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

# A deploy in flight is never cancelled; a later tag's waits behind it.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: docs-site

  book:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: cookbook
      artifacts: cookbook-book

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  # The guide at the root, the API reference under `api/`, the book under
  # `cookbook/`: the paths the guide, the README and every notebook link to.
  site:
    name: Lay out the site
    needs: [docs, book]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: _site
          run-id: ${{ needs.docs.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cookbook-book
          path: _site/cookbook
          run-id: ${{ needs.book.outputs.run }}
          github-token: ${{ github.token }}

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: [site, proof]
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.site.result == 'success' && needs.proof.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
