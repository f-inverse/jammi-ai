syntax = "proto3";

package jammi.v1.error;

import "google/protobuf/any.proto";

// RpcStatus — the canonical `google.rpc.Status` wire shape (field numbers and
// types identical to `google/rpc/status.proto`), defined here so the engine
// emits a *spec-compliant* `grpc-status-details-bin` without taking a
// `tonic-types` / `googleapis` dependency for one three-field message.
//
// The gRPC rich-error contract — which every gRPC-web client (Connect-ES,
// grpc-web) and the canonical spec assume — requires `grpc-status-details-bin`
// to carry a serialized `google.rpc.Status` whose `code` mirrors the
// `grpc-status` trailer and whose `details` is a list of `Any`. tonic's
// `Status::with_details` writes the raw `details` bytes verbatim into the
// header, so the engine must construct this envelope itself: a bare
// `JammiErrorDetail` in the header has no `code` field, and a gRPC-web client
// reading it as a `google.rpc.Status` sees `code == 0` (success) and then fails
// the unary read with "missing message". The engine packs its typed detail
// (`JammiErrorDetail` / `TriggerErrorDetail` / `AuditErrorDetail`) as the single
// `Any` in `details`, so both the spec-compliant code/message AND the faithful
// typed detail cross the wire.
message RpcStatus {
  int32 code = 1;
  string message = 2;
  repeated google.protobuf.Any details = 3;
}

// JammiErrorDetail — the structured domain-error payload a server attaches to
// a `tonic::Status` so a remote client can reconstruct the EXACT engine
// `JammiError` the in-process path returns, not a lossy gRPC-code-category
// guess. Carried in the Status `details` bytes (the gRPC richer-error model);
// the Status `code` + `message` still hold the idiomatic gRPC surface for
// clients that do not decode the detail.
//
// The standard gRPC code set is insufficient to distinguish the engine's
// failure modes — `invalid_argument` alone collapses Source / Model / Tenant /
// Config / Schema / Eval into one code — so a typed detail payload is the
// ADR-01 §5.3-sanctioned mechanism for "structured error information when the
// standard gRPC code set is insufficient". A typed `oneof` (not a
// `google.rpc.Any`) keeps it type-driven: each engine variant reachable on the
// embedding/search verb surface has its own message carrying exactly the
// fields needed to reconstruct it.
//
// The contract is complete over `JammiError`: every owned-shape variant — the
// String- and struct-carrying ones whose fields fully reconstruct the variant —
// has its own typed arm here. `MutableTable` and `ChannelCatalog` are NOT
// folded: their inner errors (`MutableTableError`, `ChannelCatalogError`) are
// engine-owned (every field reconstructs), so they carry their own structured
// detail (`MutableTableErrorDetail`, `ChannelCatalogErrorDetail`) and
// reconstruct faithfully — the same standard the owned-shape variants meet. The
// only variants folded into `other` are the genuinely-foreign `#[from]` ones whose inner error
// cannot cross a process boundary (`Io`/`std::io::Error`,
// `BackendDriver`/`Toml`/`Json`/`DataFusion`/`Trigger`/`Storage`): they
// reconstruct as `JammiError::Other` carrying the faithful `Display` string —
// the genuine fidelity limit, not a lossy guess. Faithfulness is a property of
// the error type, so the mapping covers the whole enum, not only one verb
// surface.
message JammiErrorDetail {
  oneof variant {
    SourceError source = 1;
    ModelError model = 2;
    StringError inference = 3;
    StringError catalog = 4;
    SchemaError schema = 5;
    StringError config = 6;
    StringError eval = 7;
    StringError tenant = 8;
    StringError other = 9;
    StringError fine_tune = 10;
    StringError gpu = 11;
    StringError backend = 12;
    ChannelCatalogErrorDetail channel_catalog = 13;
    MutableTableErrorDetail mutable_table = 14;
    StringError channel_assembly = 16;
    ModelReferencedError model_referenced = 17;
    ModelNotFoundError model_not_found = 18;
    RowGoneError row_gone = 19;
    TenantMismatchError tenant_mismatch = 20;
    LeaseLostError lease_lost = 21;
    CasFailedError cas_failed = 22;
    SourceBusyError source_busy = 23;
    JobAttemptSupersededError job_attempt_superseded = 24;
    JobCancelledError job_cancelled = 25;
    // `JammiError::Lexical(String)` — a single human-readable message like
    // `inference`/`catalog`/`config`, so it reuses `StringError` rather than
    // a dedicated message.
    StringError lexical = 26;
    IncompatibleFormatError incompatible_format = 27;
    DependencyCycleError dependency_cycle = 28;
    NotRecomputableError not_recomputable = 29;
    InvalidKeyError invalid_key = 32;
    VersionUnavailableError version_unavailable = 33;
  }
  // Tag 15 / `model_retired` are reserved: the wire surface must never reuse a
  // retired field number or name, so a peer built against either contract
  // reads an unknown field rather than a silently-reinterpreted one -- an
  // older peer decoding a payload that sets a variant it does not know (a
  // retired tag, or one a newer contract added after this peer was built)
  // sees `variant` unset. `error_from_status` reconstructs THAT case as
  // `JammiError::Other` carrying the enclosing `Status`'s message verbatim --
  // the peer keeps the fault's text even though it cannot keep the fault's
  // specific shape, never a fabricated empty string.
  reserved 15;
  reserved "model_retired";
}

// `JammiError::RowGone { table }`. A building-row compare-and-set matched no
// row because the row is gone; deletes nothing. Maps to `NotFound`.
message RowGoneError {
  string table = 1;
}

// `JammiError::TenantMismatch { table }`. A building-row compare-and-set
// matched no row because the row belongs to another tenant (only possible
// under a non-admin binding); never deletes. Maps to `PermissionDenied`.
message TenantMismatchError {
  string table = 1;
}

// `JammiError::LeaseLost { table }`. A building-row compare-and-set matched
// no row because the row's lease was claimed by another writer; the caller
// deletes nothing. Maps to `Aborted` (a retryable conflict, not a permanent
// precondition failure).
message LeaseLostError {
  string table = 1;
}

// `JammiError::CasFailed { table, status }`. A building-row compare-and-set
// matched no row because the row already left `building`; never re-promotes,
// never deletes. Maps to `Aborted` (the same retryable-conflict family as
// `LeaseLost` — the caller's view of the row was stale).
message CasFailedError {
  string table = 1;
  string status = 2;
}

// `JammiError::SourceBusy { source_id, table }`. A source delete was refused
// because a live-lease `building` row still references it. Maps to
// `FailedPrecondition` — a retry once the writer finishes or its lease
// expires.
message SourceBusyError {
  string source_id = 1;
  string table = 2;
}

// `JammiError::JobAttemptSuperseded { job_id }`. A `create_result_table`
// call's `jobs.partial_result` compare-and-set matched zero rows: the job is
// either not `running` (a peer reclaimed it) or another attempt already
// recorded a `partial_result` for it first. Maps to `Aborted` (the same
// retryable-conflict family as `LeaseLost`/`CasFailed` — the caller's view of
// the job's attempt was stale).
message JobAttemptSupersededError {
  string job_id = 1;
}

// `JammiError::JobCancelled { job_id }`. A job's executor observed
// `jobs.cancel_requested` at a checkpoint boundary and stopped; the job is
// recorded `failed` with this message. Maps to `Cancelled` — the caller
// asked for exactly this outcome, so it is not a fault, but it is also not
// the terminal state the caller's own request expected without checking
// status.
message JobCancelledError {
  string job_id = 1;
}

// `JammiError::IncompatibleFormat { artifact, found, supported }`. A
// persisted artifact carries a format stamp this build cannot read (the
// `.rowmap`, the ANN `.manifest.json` version, or the USearch graph's
// `backend_version`).
message IncompatibleFormatError {
  string artifact = 1;
  string found = 2;
  string supported = 3;
}

// `JammiError::DependencyCycle { table }`. A `derives-from` lineage walk
// revisited a table it was already descending through — a corruption of the
// recorded `input_anchors_json`, not a caller condition.
message DependencyCycleError {
  string table = 1;
}

// `JammiError::NotRecomputable { table }`. A `recompute` was asked to
// re-produce a table the engine has no faithful replay for (a pre-contract
// table with no recorded descriptor, or an `External`-producer table).
message NotRecomputableError {
  string table = 1;
}

// `JammiError::InvalidKey { column, null_count }`. A `NULL` in the key column
// of a source scanned for embedding / inference / refresh — refused typed at
// the input edge before any model call, with the exact null count. A
// data-shape fault, so it maps to `InvalidArgument`.
message InvalidKeyError {
  string column = 1;
  uint64 null_count = 2;
}

// `JammiError::VersionUnavailable { table, version }`. A versioned result
// table whose CURRENT version cannot be served (its version row is `failed`
// or its manifest is definitively absent). The absent-resource convention:
// maps to `NotFound`.
message VersionUnavailableError {
  string table = 1;
  int64 version = 2;
}

// `JammiError::ChannelCatalog(ChannelCatalogError)`. The inner taxonomy is
// engine-owned and every variant's fields reconstruct, so it crosses the wire
// faithfully rather than folding to a string. The two struct variants carry
// per-field messages (channel + column + type tokens) so `to_string()` rebuilds
// the exact Display the in-process error produces; the column-type tokens are
// the canonical PascalCase names (`"Float32"`, `"Utf8"`, …).
message ChannelCatalogErrorDetail {
  oneof variant {
    string already_exists = 1;
    string not_registered = 2;
    ColumnAlreadyDeclared column_already_declared = 3;
    ColumnConflict column_conflict = 4;
    string invalid_id = 5;
    string invalid_column_type = 6;
  }
}

// `ChannelCatalogError::ColumnAlreadyDeclared { channel, column, ty }`. `ty` is
// the canonical PascalCase column-type token shared with the catalog's stored
// representation.
message ColumnAlreadyDeclared {
  string channel = 1;
  string column = 2;
  string ty = 3;
}

// `ChannelCatalogError::ColumnConflict { channel, column, existing, requested }`.
// `existing` / `requested` are canonical PascalCase column-type tokens.
message ColumnConflict {
  string channel = 1;
  string column = 2;
  string existing = 3;
  string requested = 4;
}

// `JammiError::ModelReferenced { model_id, referenced_by }`. A `delete_model`
// was refused because the model is still the target of one or more references.
// Distinct from `ModelError` (a bad-argument model fault → `InvalidArgument`):
// this is a delete precondition failure → `FailedPrecondition`. `referenced_by`
// lists the generic catalog edge names still pointing at the model (e.g.
// `result_tables`, `training_jobs.output_model_id`).
message ModelReferencedError {
  string model_id = 1;
  repeated string referenced_by = 2;
}

// `JammiError::ModelNotFound { model_id }`. A `delete_model` call resolved no
// model row for the caller's tenant. Distinct from
// `ModelError` (a bad-argument model fault → `InvalidArgument`): an absent row
// is a NotFound → `NotFound`, so it carries its own variant rather than folding
// onto the generic model error.
message ModelNotFoundError {
  string model_id = 1;
}

// `JammiError::MutableTable(MutableTableError)`. The inner taxonomy is
// engine-owned and every variant's fields reconstruct, so it crosses the wire
// faithfully rather than folding to `other`. Each arm carries exactly the
// fields the matching `MutableTableError` variant holds; the id-carrying
// variants (`not_found`/`already_exists`) carry the table id string, and
// `backend` nests the engine-owned `BackendErrorDetail`.
message MutableTableErrorDetail {
  oneof variant {
    string invalid_id = 1;
    string schema = 2;
    string missing_primary_key = 3;
    string reserved_column = 4;
    string not_found = 5;
    string already_exists = 6;
    // `MutableTableError::NoOrderColumn` carries no payload.
    bool no_order_column = 7;
    BackendErrorDetail backend = 8;
  }
}

// `MutableTableError::Backend(BackendError)`. The backend taxonomy is
// engine-owned; every variant but `Sqlx` reconstructs field-for-field. A raw
// `sqlx::Error` cannot cross a process boundary, so `Sqlx` is the one arm that
// folds to a faithful `Display` string — the genuine fidelity limit, mirroring
// how `JammiErrorDetail` folds its own foreign `#[from]` variants.
message BackendErrorDetail {
  oneof variant {
    string execution = 1;
    ConstraintViolation constraint = 2;
    string unavailable = 3;
    string retry = 4;
    string migration = 5;
    TypeConversion type_conversion = 6;
    TenantMismatch tenant_mismatch = 7;
    // `BackendError::Sqlx` — the lone genuinely-foreign arm; its `Display`
    // string is carried because a `sqlx::Error` does not cross the wire.
    string sqlx = 8;
  }
}

// `BackendError::Constraint { table, detail }`.
message ConstraintViolation {
  string table = 1;
  string detail = 2;
}

// `BackendError::TypeConversion { column, detail }`.
message TypeConversion {
  string column = 1;
  string detail = 2;
}

// `BackendError::TenantMismatch { table, expected, got }`. The tenant ids are
// UUID strings; an empty string means `None` (no tenant on that side).
message TenantMismatch {
  string table = 1;
  string expected = 2;
  string got = 3;
}

// A `JammiError` variant carrying a single human-readable string (`Inference`,
// `Catalog`, `Config`, `Eval`, `Tenant`, `FineTune`, `Gpu`, `Backend`,
// `ChannelAssembly`, `Other`).
message StringError {
  string message = 1;
}

// `JammiError::Source { source_id, message }`.
message SourceError {
  string source_id = 1;
  string message = 2;
}

// `JammiError::Model { model_id, message }`.
message ModelError {
  string model_id = 1;
  string message = 2;
}

// `JammiError::Schema { table, column, expected, actual }`.
message SchemaError {
  string table = 1;
  string column = 2;
  string expected = 3;
  string actual = 4;
}

// TriggerErrorDetail — the structured wire detail for `jammi_db::TriggerError`,
// attached to a `tonic::Status` by the server's `map_trigger_error` so a remote
// the data-plane client reconstructs the EXACT `TriggerError` the in-process path
// returns (the standard gRPC code set collapses several variants onto one code).
//
// The contract is complete and faithful over `TriggerError`. Every owned-shape
// variant has its own typed arm. The two `#[from]` variants do NOT fold: their
// inner errors are engine-owned and fully reconstructable, so `backing_table`
// nests the shared `MutableTableErrorDetail` and `backend` nests the shared
// `BackendErrorDetail` — the same faithful taxonomies `JammiErrorDetail` reuses.
// No `TriggerError` variant degrades to a lossy string.
message TriggerErrorDetail {
  // `TriggerError::OffsetEvicted` is removed: no driver surfaces an eviction
  // error any more — a driver that cannot start at or before the requested
  // offset (or a lagging receiver) self-heals via `LiveEvent::Wake` instead.
  // Field 9 retired, not reused.
  reserved 9;
  reserved "offset_evicted";
  oneof variant {
    string topic_not_found = 1;
    SchemaConflict schema_conflict = 2;
    UnsupportedSchemaType unsupported_schema_type = 3;
    string batch_schema_mismatch = 4;
    PublishTenantMismatch publish_tenant_mismatch = 5;
    string predicate_parse = 6;
    string predicate_eval = 7;
    string predicate_unsupported = 8;
    // `TriggerError::BackingTable(MutableTableError)` — engine-owned, nested
    // faithfully (never folded to a string).
    MutableTableErrorDetail backing_table = 10;
    // `TriggerError::Backend(BackendError)` — engine-owned, nested faithfully.
    BackendErrorDetail backend = 11;
    string driver = 12;
    string catalog = 13;
  }
}

// `TriggerError::SchemaConflict { topic, detail }`.
message SchemaConflict {
  string topic = 1;
  string detail = 2;
}

// `TriggerError::UnsupportedSchemaType { column, data_type }`.
message UnsupportedSchemaType {
  string column = 1;
  string data_type = 2;
}

// `TriggerError::PublishTenantMismatch { topic, topic_tenant, publish_tenant }`.
// The tenant ids are UUID strings; an empty string means `None` (an unscoped
// publish or a global topic).
message PublishTenantMismatch {
  string topic = 1;
  string topic_tenant = 2;
  string publish_tenant = 3;
}

// AuditErrorDetail — the structured wire detail for `jammi_db::AuditError`,
// attached to a `tonic::Status` by the server's `map_audit_error` so a remote
// the data-plane client reconstructs the EXACT `AuditError` the in-process path
// returns.
//
// Every owned-shape variant has its own typed arm and reconstructs faithfully.
// The only fold is `serde` — `AuditError::Serde(#[from] serde_json::Error)`
// wraps a foreign error that cannot cross a process boundary, so it carries its
// faithful `Display` string (the genuine fidelity limit, mirroring how
// `JammiErrorDetail` folds its own foreign `#[from]` variants).
message AuditErrorDetail {
  oneof variant {
    LengthMismatch length_mismatch = 1;
    LineageTooLarge lineage_too_large = 2;
    // `AuditError::NoTenantBinding` carries no payload.
    bool no_tenant_binding = 3;
    // `AuditError::SignatureMismatch(Uuid)` — the offending query id (UUID
    // string). The faithful server-emitted path always carries a valid UUID;
    // a decode that finds an un-parseable string here (a forged or corrupted
    // message) folds to `storage` rather than fabricating the nil UUID.
    string signature_mismatch = 4;
    string master_key = 5;
    // `AuditError::Serde` — the lone genuinely-foreign arm; its `Display`
    // string is carried because a `serde_json::Error` does not cross the wire.
    string serde = 6;
    string storage = 7;
    string broker = 8;
  }
}

// `AuditError::LengthMismatch { ids, scores }`. Both are element counts.
message LengthMismatch {
  uint64 ids = 1;
  uint64 scores = 2;
}

// `AuditError::LineageTooLarge { actual, max }`. Both are byte counts.
message LineageTooLarge {
  uint64 actual = 1;
  uint64 max = 2;
}
