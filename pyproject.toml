[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "jammi-ai"
version = "0.33.0"
requires-python = ">=3.9"
description = "Embeddable AI engine for inference, embeddings, vector search, and fine-tuning"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "F-Inverse" }]
keywords = ["embeddings", "vector-search", "fine-tuning", "inference", "machine-learning"]
# `jammi-ai` is the pure-Python convenience front-end: the `connect(target)`
# dispatcher that unifies the compiled local engine and the remote client behind
# one front door. It ships no compiled code itself — it is the thin bundle of
# the two arms, pinned in LOCKSTEP at the shared workspace version:
#   * `jammi-ai-native` — the compiled in-process engine (`import jammi_native`),
#     the `file://` arm of `connect`.
#   * `jammi-client`     — the pure-Python gRPC client, the remote arm.
# Both are HARD deps at an EXACT pin (not extras): an extra could only *add* an
# arm, never *subtract* the engine, and the front-end IS the two arms composed.
dependencies = [
    "jammi-ai-native==0.33.0",
    "jammi-client==0.33.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/f-inverse/jammi-ai"
Documentation = "https://f-inverse.github.io/jammi-ai/"
Repository = "https://github.com/f-inverse/jammi-ai"
"Bug Tracker" = "https://github.com/f-inverse/jammi-ai/issues"

[tool.hatch.build.targets.wheel]
# The pure-Python front-end lives under `python/jammi_ai/`; `packages` strips the
# `python/` source-root prefix so it installs as the top-level `jammi_ai`. The
# compiled engine (`jammi_native`) is NOT here — it ships in the `jammi-ai-native`
# wheel, pulled in via the exact dependency pin above.
packages = ["python/jammi_ai"]

[tool.hatch.build.targets.sdist]
# The repo root is the workspace root, so an unconstrained sdist would sweep in
# the whole tree. Ship only what builds the pure-Python front-end. The leading
# `/` anchors `README.md`/`pyproject.toml` to the root — an unanchored pattern
# matches every same-named file across the workspace.
include = ["python/jammi_ai", "/README.md", "/pyproject.toml"]
