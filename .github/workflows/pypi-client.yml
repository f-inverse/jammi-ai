name: PyPI (jammi-ai)

# Publishes the pure-Python base client `jammi-ai` (import `jammi`), built from
# `clients/python`, to PyPI on a `py-v*` tag — the SAME tag that publishes the
# `jammi-ai-native` engine wheels (pypi.yml). The two ship in LOCKSTEP at one
# version so `jammi-ai`'s `[embedded]` extra (`jammi-ai-native==X`) always
# resolves. Uses PyPI Trusted Publishing (OIDC) — no API token.
#
# NOTE (release-time, EXTERNAL — do not act in CI): the `jammi-ai` PyPI project's
# Trusted-Publisher config must authorize THIS workflow (`pypi-client.yml`), which
# builds the `jammi-ai` dist from `clients/python`. Confirm the re-point before the
# first `py-v*` publish. CI only BUILDS the wheel; it does not publish on a PR, so
# this is not a merge blocker.

on:
  push:
    tags: ["py-v*"]
  # Manual re-run to finish a release whose publish was interrupted: run the
  # dispatch ON the `py-v*` tag (the publish job is tag-guarded; PyPI rejects
  # a re-upload of an existing version, so re-running the tag is idempotent).
  # A branch dispatch is a build-only dry run — the same recovery semantics
  # as the lockstep `pypi.yml` / `_pypi-server.yml` lanes.
  workflow_dispatch:

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-client-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; the publish job widens to
# `id-token: write` (PyPI trusted publishing) per job.
permissions:
  contents: read

jobs:
  build:
    name: Build wheel (py3-none-any)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generate the proto stubs from the canonical jammi.v1 proto, then build
      # the universal wheel. The stubs are generated-at-build (never committed),
      # exactly like the npm client's `src/gen`. The dev extra carries the
      # pinned `grpcio-tools` — the published wheel's grpcio/protobuf floors
      # are derived from what that exact generator emits, so installing it
      # unpinned here could ship a wheel that crashes at import under its own
      # declared minima.
      - name: Generate proto stubs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          make generate

      - name: Build wheel
        run: |
          python -m pip install --upgrade build
          python -m build --wheel --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: clients/python/dist/

  gpu-proof:
    name: GPU proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before `jammi-ai` is published (#454 follow-up, operator
    # direction: every release publisher gates on the prove verdict,
    # all-or-nothing, not only the CUDA lanes). This client wheel is pure
    # Python and never touches CUDA itself, but the lockstep contract this
    # workflow's header states means it must ship in the SAME all-or-nothing
    # release as `jammi-ai-native`, never ahead of an unproven commit.
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_gpu-proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref — a tag push, or a
    # workflow_dispatch run on the tag (recovery: PyPI rejects a re-upload of
    # an existing version, so re-running the tag is idempotent) — whose
    # commit's GPU-prove verdict is green. A branch dispatch is a build-only
    # dry run: without the tag guard it could first-publish an untagged
    # version of `jammi-ai` alone, breaking the lockstep this workflow's
    # header states (`jammi-ai`'s `[embedded]` extra must always resolve
    # `jammi-ai-native==X`). PURE conjunction (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.build.result == 'success' && needs.gpu-proof.result == 'success'
    needs: [build, gpu-proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
