name: Cookbook on a GPU

# Every recipe and every page of the book, run with the real Hugging Face Hub
# models they teach with, over the builds a tree's CI made: the CUDA engine
# wheel, the client wheel, the CUDA server and the CLI of the `ci.yml` run that
# proved the tree, installed on a rented RunPod L4 (sm_89, the class of GPU a
# Colab reader gets) by `ci/scripts/runpod_cookbook_gpu.sh`. The run records
# each page's execution and assembles the book a release publishes
# (`cookbook-book`, which `pages.yml` deploys). The tree it measures is
# recorded once (`subject`), and the pod checks out that same commit.
#
# Real models never run in `ci.yml`: it stays hermetic, and checks the
# cookbook statically there. This lane is where a chapter's claims are checked
# on real models. Off the merge path: GPU time costs money. It fires on the
# `cookbook-gpu` pull-request label and on manual dispatch; no `push:` or
# `workflow_call:` trigger, and nothing `uses:` it (`check_gpu_prove_once.py`'s
# P7 rule). The label runs once the pull request's CI is green: the lane
# installs that run's builds.
#
# The release gate requires it: every publisher's `_proof-required.yml` asks
# for this lane's green measurement of the released tree, beside `ci.yml`'s
# and `gpu-prove.yml`'s. Dispatch it before tagging a release
# (`gh workflow run cookbook-gpu.yml --ref <branch holding the tree>`).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  subject:
    if: github.event_name != 'pull_request' || github.event.label.name == 'cookbook-gpu'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: subject
        uses: ./.github/actions/record-subject

  # The job runs in the CPU image, which carries quarto; the pod runs the
  # CUDA image.
  ci-image:
    if: github.event_name != 'pull_request' || github.event.label.name == 'cookbook-gpu'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu cuda

  artifacts:
    if: github.event_name != 'pull_request' || github.event.label.name == 'cookbook-gpu'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: native-cu12-wheel client-wheel server-cu12-x86_64-binary jammi-x86_64-unknown-linux-gnu

  cookbook:
    name: Cookbook on RunPod
    needs: [subject, ci-image, artifacts]
    if: github.event_name != 'pull_request' || github.event.label.name == 'cookbook-gpu'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    permissions:
      contents: read
      # Downloads the builds from the proving run, not this one.
      actions: read
    # Job level and never cancelled: a cancel SIGKILLs the runner before the
    # driver's EXIT trap terminates the pod it rented.
    concurrency:
      group: cookbook-gpu-${{ github.ref }}
      cancel-in-progress: false
    # 80m worst-case deploy exhaustion (8 candidates x 600s SSH wait) + the
    # driver's 180m session budget (RP_TTL_HOURS 4 - 1) + 20m to install and
    # assemble.
    timeout-minutes: 280
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The builds to install, from the proving run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "{native-cu12-wheel,client-wheel,server-cu12-x86_64-binary,jammi-x86_64-unknown-linux-gnu}"
          path: ${{ runner.temp }}/artifacts
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      # The driver reads `native/`, `client/`, `server/` and `cli/`.
      - name: Lay the builds out by part
        env:
          ARTIFACTS: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          cd "$ARTIFACTS"
          mv native-cu12-wheel native && mv client-wheel client
          mv server-cu12-x86_64-binary server && mv jammi-x86_64-unknown-linux-gnu cli

      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_cookbook_gpu.sh
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RP_IMAGE: ${{ needs.ci-image.outputs.cuda }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          PROVE_EXPECT_SHA: ${{ needs.subject.outputs.commit }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
          FREEZE_OUT: cookbook/book/_freeze

      # A whole-book render under the `assemble` profile reads each page's
      # recorded execution and executes nothing; a page without a record fails
      # here rather than running.
      - name: Assemble the book
        working-directory: cookbook/book
        run: quarto render --profile assemble

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cookbook-book
          path: cookbook/book/_book
