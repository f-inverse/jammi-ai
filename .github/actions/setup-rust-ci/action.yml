name: setup-rust-ci
description: >
  Shared per-job Rust CI setup: runs the sccache GHA-cache action and exports
  SCCACHE_GHA_ENABLED + RUSTFLAGS via $GITHUB_ENV, so a job's cache backend and
  its linker/warnings posture live in ONE definition instead of being repeated
  in every workflow. Must run AFTER `actions/checkout@v4` — this is a
  local-path composite (`./.github/actions/setup-rust-ci`), so the checkout
  step has to have already materialized it. Bump the sccache-action pin HERE,
  not in each consuming workflow.

inputs:
  rustflags:
    description: >
      RUSTFLAGS to export for the rest of the job. Defaults to the shared
      "-D warnings -C link-arg=-fuse-ld=mold" posture the hermetic Rust lanes
      use. Pass an explicit override for a job whose real config genuinely
      differs — e.g. "-C link-arg=-fuse-ld=mold" with no `-D warnings` for a
      lane that must not fail on a warning outside its own crates, or ""
      to leave RUSTFLAGS unset entirely (falling back to .cargo/config.toml's
      per-target mold default). Never silently force a job onto a flag set it
      didn't have -- EXCEPT the aarch64-linux ISA-floor target-feature flags
      pinned in `.cargo/config.toml`'s `[target.aarch64-unknown-linux-gnu]`
      stanza (see that file for which flags and why -- not repeated here on
      purpose, so this description can never drift from the actual pin),
      which THIS RUNNER'S CALLER cannot drop: on a Linux aarch64 runner,
      whatever non-empty RUSTFLAGS this action ends up exporting (your override or the
      default) always carries every `-C target-feature=…` entry
      `ci/scripts/rust_target_features.sh aarch64-unknown-linux-gnu`
      extracts from that config stanza appended, because an exported
      RUSTFLAGS replaces (never merges with) config-file rustflags. Leaving
      `rustflags` empty skips this export entirely and falls through to
      `.cargo/config.toml` instead, which pins the same floor for local/
      config-honoring builds — either path carries it. The floor follows
      the RUNNER'S OWN arch (`uname -m`), not a `--target` flag: a
      cross-build TO aarch64-unknown-linux-gnu FROM an amd64 runner is not
      covered by this action at all -- no such cross-build lane exists in
      this repo today (`release-binaries.yml`'s linux-aarch64 leg is still
      deferred), so there is nothing yet for this gap to silently miss.
    required: false
    default: "-D warnings -C link-arg=-fuse-ld=mold"
  no-sccache:
    description: >
      Set to "true" to skip the sccache-action step and the SCCACHE_GHA_ENABLED
      export — for a lane that explicitly disables the compiler wrapper
      (RUSTC_WRAPPER="") and never talks to an sccache server, e.g. a
      metadata-only `cargo install`/`cargo deny` lane.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.no-sccache != 'true'
      uses: mozilla-actions/sccache-action@v0.0.9

    - shell: bash
      run: |
        if [ "${{ inputs.no-sccache }}" != "true" ]; then
          echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
        fi
        if [ -n "${{ inputs.rustflags }}" ]; then
          flags="${{ inputs.rustflags }}"
          # An exported RUSTFLAGS env var REPLACES (never merges with)
          # .cargo/config.toml's per-target rustflags -- cargo's own,
          # documented precedence rule (that file's own comment states it).
          # Every caller of THIS action that passes a non-empty `rustflags`
          # would therefore silently drop config.toml's aarch64-linux ISA
          # floor. This is the ONE place that can see "am I about to export
          # a RUSTFLAGS that would shadow config.toml, on a runner that
          # needs the floor" and fix it, instead of trusting every present
          # and future caller to remember. NO LITERAL FEATURE STRING LIVES
          # HERE: `rust_target_features.sh` reads the actual flags back out
          # of `.cargo/config.toml` itself, so this step and the config
          # file can never drift apart -- appended, never prepended or
          # exclusive, and only once per feature (idempotent against a
          # caller who already spelled one out by hand).
          if [ "$(uname -s)" = "Linux" ] && [ "$(uname -m)" = "aarch64" ]; then
            while IFS= read -r feature; do
              [ -n "$feature" ] || continue
              case "$flags" in
                *"target-feature=$feature"*) : ;;
                *) flags="$flags -C target-feature=$feature" ;;
              esac
            done < <(bash ci/scripts/rust_target_features.sh aarch64-unknown-linux-gnu)
          fi
          echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
        fi
