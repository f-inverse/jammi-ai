[project]
name = "jammi_cookbook"
version = "0.1.0"
description = "Shared library for the Theory↔Computation Cookbook — the datasets, encoders, frozen goldens and rails its chapters run on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "F-Inverse" }]

# jammi-ai is consumed at HEAD, not pinned to a PyPI release: CI builds the HEAD
# wheels and force-installs them over this unpinned declaration, so the book proves
# the engine commit it ships alongside. (The nightly release-recipe leg runs the last
# PUBLISHED jammi-ai against the book at that release's tag.) numpy and pyarrow are
# the data substrate the chapters manipulate; requests fetches the published
# datasets a `full`-scale run reads.
dependencies = [
    "jammi-ai",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
# The book toolchain. Quarto itself is a system binary installed separately
# (see .github/workflows/ci.yml); jupyter is the execution engine Quarto drives.
book = [
    "jupyter>=1.0",
    "nbclient>=0.9",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jammi_cookbook"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
