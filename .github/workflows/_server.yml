name: _server

# Builds one `jammi-server` binary — a build of `ci/release-feature-manifest.json`
# (`server-cpu` or `server-cu12`) on one arch — and packages it as that build's
# release tarball and PyPI wheel. The one definition of how a server binary is
# compiled and packaged: `build.yml` calls it on every pull request and on
# `main`, where its consumers and image smokes use the binary, and a release
# promotes the tarball, wheel and image the run that proved its tree built
# (`_proven-artifacts.yml`). A container image never compiles: it packages
# these bytes (`stage-server-binaries`).
#
# Everything but the build and the arch is the manifest's or derived:
#   - the cargo features: the build's `cargo_features`;
#   - the CI image: the CPU image, or the CUDA image for a CUDA build;
#   - the runner: native per arch (`ci/scripts/build_matrix.py`);
#   - the CUTLASS submodule: initialised when the features reach
#     `flash-attn`, whose kernels build from it;
#   - the wheel: `packaging/<build>`, tagged `manylinux_2_28_<arch>`, its
#     runtime link set verified against its dependency wheels when the build
#     says so (`wheel_verifies_link_set`).
#
# Artifacts: `<build>-<arch>-binary` (the stripped `jammi-server`),
# `<build>-<arch>-tarball` (`ci/scripts/package_server_tarball.sh`; a CUDA
# build also leaves its loader and jail reports, `cu12-loader-report` and
# `cu12-jail-report`) and `<build>-<arch>-wheel`. Nothing here publishes:
# PyPI trusted publishing matches the OIDC token's `job_workflow_ref` (the
# called file) while its PEP-740 attestation matches the caller file, so a
# publish from inside a reusable workflow can never satisfy both
# (https://github.com/pypa/gh-action-pypi-publish/issues/166).

on:
  workflow_call:
    inputs:
      build:
        description: "The manifest build: `server-cpu` or `server-cu12`."
        type: string
        required: true
      arch:
        description: "`x86_64` or `aarch64`."
        type: string
        required: true
      cpu-image:
        description: "The tree's CPU CI image."
        type: string
        required: true
      cuda-image:
        description: "The tree's CUDA CI image (used by a CUDA build)."
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan (${{ inputs.build }}, ${{ inputs.arch }})
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.plan.outputs.features }}
      image: ${{ steps.plan.outputs.image }}
      runner: ${{ steps.runner.outputs.runner }}
      cutlass: ${{ steps.plan.outputs.cutlass }}
      cuda: ${{ steps.plan.outputs.cuda }}
      verify-link-set: ${{ steps.plan.outputs.verify-link-set }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: runner
        env:
          ARCH: ${{ inputs.arch }}
        run: python3 ci/scripts/build_matrix.py server --arch "$ARCH" | tee -a "$GITHUB_OUTPUT"

      - name: The build's features, image and checks
        id: plan
        env:
          BUILD: ${{ inputs.build }}
          ARCH: ${{ inputs.arch }}
          CPU_IMAGE: ${{ inputs.cpu-image }}
          CUDA_IMAGE: ${{ inputs.cuda-image }}
        run: |
          set -euo pipefail
          features="$(jq -r --arg b "$BUILD" '.builds[$b].cargo_features // empty | join(",")' ci/release-feature-manifest.json)"
          test -n "$features" || { echo "::error::ci/release-feature-manifest.json declares no cargo_features for build '$BUILD'" >&2; exit 1; }
          verify="$(jq -r --arg b "$BUILD" '.builds[$b].wheel_verifies_link_set' ci/release-feature-manifest.json)"
          case "$verify" in true|false) ;; *) echo "::error::build '$BUILD' states no wheel_verifies_link_set (true/false)" >&2; exit 1 ;; esac
          if [[ ",$features," == *",cuda,"* ]]; then
            if [ -z "$CUDA_IMAGE" ] || [ "$ARCH" != x86_64 ]; then
              echo "::error::build '$BUILD' is a CUDA build: it needs the CUDA image and arch x86_64" >&2
              exit 1
            fi
            image="$CUDA_IMAGE"; cuda=true
          else
            image="$CPU_IMAGE"; cuda=false
          fi
          if [[ ",$features," == *",flash-attn,"* ]]; then cutlass=true; else cutlass=false; fi
          {
            echo "features=$features"
            echo "image=$image"
            echo "cutlass=$cutlass"
            echo "cuda=$cuda"
            echo "verify-link-set=$verify"
          } >> "$GITHUB_OUTPUT"

  binary:
    name: Build jammi-server (${{ inputs.build }}, ${{ inputs.arch }})
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    container: ${{ needs.plan.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      # `flash-attn` builds its kernels from the vendored CUTLASS submodule
      # (`build.rs::build_flash_attn`).
      - name: Init the CUTLASS submodule
        if: needs.plan.outputs.cutlass == 'true'
        run: git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass

      - uses: ./.github/actions/setup-rust-ci
        with:
          # A release build, not the lint gate.
          deny-warnings: false

      - name: Build jammi-server (release)
        env:
          FEATURES: ${{ needs.plan.outputs.features }}
        run: cargo build --release -p jammi-server --bin jammi-server --features "$FEATURES"

      - name: Strip the binary
        run: strip target/release/jammi-server

      # Built inside a manylinux_2_28 container does not by itself prove the
      # linked symbol versions stay at the floor.
      - name: The binary holds the GLIBC floor (manylinux_2_28) and the arch
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          bash ci/scripts/assert_glibc_floor.sh target/release/jammi-server 2.28
          bash ci/scripts/assert_elf_machine.sh target/release/jammi-server "$ARCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.build }}-${{ inputs.arch }}-binary
          path: target/release/jammi-server

      # In the image the binary compiled in: a CUDA build's tarball stages
      # the CUDA runtime libraries from the toolkit that image carries.
      - name: Package the release tarball
        id: tarball
        env:
          BUILD: ${{ inputs.build }}
          ARCH: ${{ inputs.arch }}
        run: bash ci/scripts/package_server_tarball.sh "$BUILD" "$ARCH"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.build }}-${{ inputs.arch }}-tarball
          path: ${{ steps.tarball.outputs.asset }}

      # The real loader and jail reports, written before their checks run so a
      # failing check still leaves them: a maintainer refreshes
      # `ci/scripts/fixtures/cu12_{loader,jail}_report_real.txt` from these.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.plan.outputs.cuda == 'true'
        with:
          name: cu12-loader-report
          path: cu12_loader_report_real.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.plan.outputs.cuda == 'true'
        with:
          name: cu12-jail-report
          path: cu12_jail_report_real.txt

  wheel:
    name: Package wheel (${{ inputs.build }}, ${{ inputs.arch }})
    needs: [plan, binary]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.build }}-${{ inputs.arch }}-binary
          path: artifact

      # Artifacts do not preserve the exec bit.
      - name: Stage the binary into the wheel package
        env:
          PACKAGE: packaging/${{ inputs.build }}
        run: |
          set -euo pipefail
          cp artifact/jammi-server "$PACKAGE/jammi_server/bin/jammi-server"
          chmod +x "$PACKAGE/jammi_server/bin/jammi-server"

      # Fail here, not on a user's machine at execve, if the binary links a
      # library the wheel's runtime dependencies do not deliver. DT_NEEDED
      # survives stripping, so this checks the exact bytes shipped.
      - name: The runtime link set is covered by the wheel's dependencies
        if: needs.plan.outputs.verify-link-set == 'true'
        env:
          PACKAGE: packaging/${{ inputs.build }}
        run: python3 "$PACKAGE/verify_link_set.py" artifact/jammi-server

      - name: Build the wheel
        working-directory: packaging/${{ inputs.build }}
        env:
          PLATFORM_TAG: manylinux_2_28_${{ inputs.arch }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip build wheel
          python -m build --wheel --outdir dist
          # A bin-bearing wheel is not py3-none-any (hatchling sees only the
          # Python sources): relabel it to the platform the binary requires.
          python -m wheel tags --platform-tag "$PLATFORM_TAG" --remove dist/*.whl

      - name: The wheel fits PyPI's per-file limit
        env:
          PACKAGE: packaging/${{ inputs.build }}
        run: bash ci/scripts/assert_wheel_size.sh "$PACKAGE"/dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.build }}-${{ inputs.arch }}-wheel
          path: packaging/${{ inputs.build }}/dist/
