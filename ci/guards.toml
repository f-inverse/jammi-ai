# The repository's guards: hermetic commands, each holding one property of the
# tree. `ci/scripts/run_guards.py` runs them — in CI's `guard` job and locally
# (`ci/dev.sh python3 ci/scripts/run_guards.py --base origin/main`) alike. A
# test of a script — a `test_*` file, a script's own `--self-test` — is not a
# guard: `ci/scripts/run_script_tests.py` runs those.
#
#   name   what a report calls it
#   run    the command, from the repository root
#   why    the property it holds, in a sentence
#   when   scopes (below); omitted = runs on every change. A scoped guard runs
#          when a changed path matches its scope, and always on a push to main.
#   needs  host requirements (`ci/needs.toml`) the runner provides before running
#
# Adding a guard: it must hold a property of the product or of the machinery
# that ships and measures it, and it must have been seen to fail for the reason
# it exists. A check of how a change was made, or of prose, does not belong.

# ---------------------------------------------------------------- scopes

# The rented-GPU rig: pod lifecycle, the prove/gang/cluster lanes and the
# workflows that drive them.
[scope.rig]
paths = [
  "ci/**",
  ".github/**",
  ".docker/**",
  ".cargo/**",
  "Cargo.lock",
  "**/Cargo.toml",
  "rust-toolchain.toml",
  "crates/jammi-kernels/build.rs",
  "crates/jammi-ai/tests/gpu_capability/**",
]

# The performance harnesses: Jammi-vs-PyTorch comparators, kernel census,
# corpus generators, and the evidence they commit.
[scope.perf]
paths = [
  "ci/**",
  "crates/jammi-bench/**",
  "crates/jammi-kernels/artifacts/**",
]

# The resolved dependency and feature graph, and the lanes that lint it.
[scope.cargo-graph]
paths = ["ci/**", ".github/**", ".cargo/**", "Cargo.lock", "**/Cargo.toml"]

# Ancestry checks ask whether a recorded commit is in HEAD's history.
# ------------------------------------------------- the product's own shape

[[guard]]
name = "cookbook one-way"
run = "bash ci/scripts/check_cookbook_one_way.sh"
why = "The book consumes the engine; no engine crate references cookbook/book/."

[[guard]]
name = "cookbook coverage"
run = "python3 ci/scripts/check_cookbook_coverage.py"
why = "Every public Python surface of jammi is run by a recipe or an executed book-chapter cell, so a verb cannot ship without its runnable example."

[[guard]]
name = "SQLite-ism tripwire"
run = "python3 ci/scripts/check_sqlite_isms.py"
why = "No backend-specific SQL token in jammi-db's shared catalog code; the Postgres test matrix is the real parity proof."

[[guard]]
name = "doc↔enum parity"
run = "python3 ci/scripts/check_doc_parity.py"
why = "Every enum the docs enumerate lists exactly the variants the code has."

[[guard]]
name = "no run-time test skips"
run = "bash ci/scripts/check_no_runtime_skips.sh"
why = "No test reads green when its resource is missing: none calls a run-time skip, and none reads a JAMMI_REQUIRE_* flag, because none has a skip for one to guard."

[[guard]]
name = "no piped grep -q"
run = "bash ci/scripts/check_no_piped_grep_q.sh"
why = "No bash test reads a match as no match: none pipes into grep -q, whose early exit SIGPIPEs the writer and, under pipefail, flips the pipeline's status."

[[guard]]
name = "GPU parity matrix"
run = "python3 ci/scripts/check_gpu_parity_matrix.py"
why = "Every shipped (architecture × verb) cell is covered by a GPU parity test, structurally excluded, or named as pending."

[[guard]]
name = "engine dep-direction"
run = "cargo metadata --format-version 1 --locked | python3 ci/scripts/check_dep_direction.py"
why = "The engine's dependency closure holds no crate from outside crates.io: a consumer may depend on Jammi, never the reverse."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "flash-attn feature closure"
run = "python3 ci/scripts/check_flash_attn_closure.py"
why = "No default, release or all-features build reaches jammi-kernels/flash-attn: only a lane that asks for the CUTLASS kernels compiles them."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "release postgres/mysql closure"
run = "python3 ci/scripts/check_release_manifest_pg_mysql_closure.py"
why = "No release lane's feature closure reaches jammi-db's postgres or mysql features: they link an OpenSSL the release images do not carry."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "lint-surface closure"
run = "python3 ci/scripts/check_lint_surface_closure.py"
why = "Every feature-gated target is compiled under clippy by some lane that runs on every pull request."
when = ["cargo-graph"]
needs = ["pyyaml", "cargo-registry"]

[[guard]]
name = "release manifest consistency"
run = "python3 ci/scripts/check_release_manifest.py"
why = "The release lanes describe one capability surface, each op classified by exactly one proof mechanism."

[[guard]]
name = "release workflow feature literals"
run = "python3 ci/scripts/check_workflow_feature_literals.py"
why = "A release workflow takes jammi-server's cargo features from the release manifest and spells none itself."

[[guard]]
name = "cu12 tarball fixture"
run = "python3 ci/scripts/check_bundle_fixture.py"
why = "The committed cu12 loader report is the real build's, never a provisional stand-in."

[[guard]]
name = "held-out fixture integrity"
run = "python3 ci/scripts/perf/check_heldout_fixture_integrity.py"
why = "The committed held-out evaluation fixture's files agree with each other: ids, order, hashes and manifest."

[[guard]]
name = "CUDA run artifact schema"
run = "python3 ci/scripts/check_cuda_run_artifacts.py"
why = "Every committed GPU run artifact is well-formed and names a commit in this history."
when = ["perf", "rig"]
needs = ["full-history"]

[[guard]]
name = "CUDA run artifact census"
run = "python3 ci/scripts/check_cuda_run_artifacts.py --census"
why = "Every committed GPU run artifact is accounted for by kind."
when = ["perf", "rig"]

# ------------------------------------------------------------ the GPU rig

[[guard]]
name = "gpu prove once"
run = "python3 ci/scripts/check_gpu_prove_once.py"
why = "A release commit is GPU-proven once per shipped architecture, and every release publisher waits on that verdict."
when = ["rig"]
needs = ["pyyaml"]

[[guard]]
name = "execution-surface reachability"
run = "python3 ci/scripts/check_execution_surface_reachability.py"
why = "Every cargo invocation a fresh pod's seed runs also runs on the merge path, so a pod is never the first place it fails."
when = ["rig"]
needs = ["pyyaml"]

[[guard]]
name = "producer provenance gates"
run = "python3 ci/scripts/perf/check_producer_provenance_gates.py"
why = "Every perf producer checks the binary it measures was built from the commit it stamps, and no test-only knob is live in a real run."
when = ["perf"]

[[guard]]
name = "ladder budgets follow their artifacts"
run = "python3 ci/scripts/perf/budgets_from_verdicts.py --check crates/jammi-bench/budgets.json"
why = "Every bound in the committed budgets table is the one its named verdict artifact measures; an edited bound or a moved artifact reds here."
when = ["perf"]

[[guard]]
name = "distributed legs"
run = "python3 ci/scripts/check_distributed_legs.py"
why = "Every distributed test runs in exactly one leg of distributed.yml; none is compiled and never run."

[[guard]]
name = "workflow validity"
run = "bash ci/scripts/check_workflows.sh"
why = "Every workflow parses as GitHub parses it: jobs, needs, expressions and action inputs resolve."
needs = ["actionlint"]

[[guard]]
name = "GPU test placement"
run = "python3 ci/scripts/check_gpu_test_placement.py"
why = "Every GPU test is in a GPU-only target or a `gpu` module the GPU lane selects; no CPU test runs on a GPU host."
