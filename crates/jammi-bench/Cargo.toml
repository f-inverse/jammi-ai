[package]
name = "jammi-bench"
description = "Scale and performance measurement harness for the Jammi engine. A measurement consumer of the engine — not an engine surface — kept out of the published workspace so the engine stays a clean library."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "jammi-bench"
path = "src/main.rs"

[dependencies]
jammi-db.workspace = true
jammi-numerics.workspace = true
# The training-throughput tier drives the engine's hermetic CPU fine-tune
# primitives (`gradcache_backward`, `build_projection_head`, `AdamW`) and the
# LoRA layer they run over, so the bench pulls jammi-ai's embedded (`local`)
# engine and the candle stack it trains on — the same surface the engine's own
# `fine_tune` integration suite exercises on `Device::Cpu`.
jammi-ai = { workspace = true, features = ["local"] }
jammi-lora = { workspace = true, features = ["candle"] }
jammi-encoders.workspace = true
# Direct dependency (not just the transitive pull-in via jammi-encoders/
# jammi-lora's `candle` feature) so `finetune_step::run` can call
# `jammi_kernels::admission::unmatched_disables()` directly — Rust does not
# let a crate name a transitive dependency's items without its own
# `[dependencies]` entry, even when that dependency is already linked in via
# another direct dependency's public API (contract K-aux).
jammi-kernels.workspace = true
candle-core.workspace = true
candle-nn.workspace = true

arrow.workspace = true
datafusion.workspace = true
tokio.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
libc.workspace = true
tempfile = "3"
# The grad-oracle tier's base-checkpoint CONTENT identity (sha256 of
# config.json / model.safetensors, replacing the un-comparable `model_dir`
# path string — see `grad_oracle.rs`'s module doc's determinant table).
# Both `sha2` and `hex` are ALREADY workspace dependencies (see the
# workspace root `Cargo.toml`'s `[workspace.dependencies]`, and
# `jammi-db/src/store/manifest.rs`'s identical `Sha256`/`hex::encode` usage)
# — this is a reference to an existing, already-vetted workspace dependency,
# not a new external crate entering the tree.
sha2.workspace = true
hex.workspace = true

[features]
# Enables the on-GPU observability tier (`gpu-inference-scale`, embedding +
# classification lanes): pulls the engine's CUDA backend so the tier serves on
# a real device. Off by default so the rest of the harness stays CPU-hermetic;
# the GPU prove-lane builds with it.
cuda = ["jammi-ai/cuda"]
