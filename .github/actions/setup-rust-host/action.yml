name: setup-rust-host
description: >
  The Rust toolchain on a bare hosted runner, at the pin `rust-toolchain.toml`
  names, with what a build on that host needs beside it: on macOS, protoc and
  sccache (`.cargo/config.toml` names sccache as every target's rustc wrapper);
  on Linux, mold, the linker that file names for every Linux target, at the pin
  `.docker/pinned-tools.sh` holds. A job in the CI image needs none of this;
  this is for the macOS legs and the one Linux job that must read
  `.cargo/config.toml` outside any container. Run `setup-rust-ci` after it.

inputs:
  targets:
    description: "Extra target triples to install beside the host's own (space-separated)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve the pinned Rust toolchain
      id: pin
      shell: bash
      run: echo "channel=$(bash ci/scripts/rust_pin.sh)" >> "$GITHUB_OUTPUT"

    # The ref is inert: the toolchain installed is the `toolchain:` input.
    - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}

    - name: protoc and sccache (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install protobuf sccache

    - name: mold (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: sudo bash .docker/pinned-tools.sh mold
