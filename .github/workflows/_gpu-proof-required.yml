name: _gpu-proof-required

# Reusable "proof required" gate (issue #454, esc-084): every CUDA release
# lane calls this instead of renting hardware itself. It asks the GitHub
# REST API, for the commit THIS caller is promoting (`github.sha`), whether
# `gpu-prove.yml` already has a green measurement (`ci/scripts/
# gpu_prove_verdict.py`'s most-recent-measurement-wins rule) for every
# shipped CUDA arch (`crates/jammi-kernels/build.rs` GENCODE_ARCHES).
#
# THE PROVE LANE IS NEVER STARTED FROM HERE -- see `gpu-prove.yml`'s own
# header for the canonical statement of why. A dev dispatches
# `gpu-prove.yml` by hand before tagging a release — see
# docs/maintainer/dev-gpu.md's "GPU proof and the release gate" section and
# MAINTAINER-GUIDE.md's release runbook. This job only READS the verdict
# already on record for the promoted commit.
#
# Fail-closed: no measurement for some shipped arch, or the most recent
# measurement for some arch is not `success`, denies — this job's own
# result becomes non-success and the caller's promoting job (gated on
# `needs.<this job>.result == 'success'`) never runs (#432 non-goal:
# nothing promotes unproven). The bounded poll inside `gpu_prove_verdict.py`
# only serves the "tag, then dispatch gpu-prove.yml on the tag" ordering —
# it waits for an ALREADY-STARTED prove run to finish, it never starts one.
#
# `timeout-minutes: 360` / `--deadline-minutes 355` (5m margin) is the SAME
# release-tag budget `gpu-prove.yml`'s own header derives (esc-080/esc-083)
# — kept in that ONE place; this comment states the corresponding number,
# never a second derivation. No concurrency group: this job never rents
# anything, so nothing here can orphan a pod or need serialization.

on:
  workflow_call: {}

# Least privilege: `actions: read` is what lets `gpu_prove_verdict.py` list
# `gpu-prove.yml`'s runs/jobs via the GitHub REST API using the ambient
# `GITHUB_TOKEN` — a called workflow cannot elevate beyond what it declares
# here, regardless of what the caller itself grants.
permissions:
  contents: read
  actions: read

jobs:
  proof-required:
    name: GPU proof required
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Check the commit's GPU-prove verdict (gpu-prove.yml, rule Q/V)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/scripts/gpu_prove_verdict.py \
            --repo "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --deadline-minutes 355
