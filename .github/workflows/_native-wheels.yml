name: _native-wheels

# Builds the `jammi-ai-native` wheels — the compiled embedded engine
# (`jammi-python`, the manifest's `native-cpu` build), as maturin abi3 wheels
# from `packaging/native/pyproject.toml` — for every platform asked for, and
# checks each against what PyPI and its platform tag promise. The one
# definition of how the native wheel is built: `build.yml` calls it on every
# pull request and on `main`, where the Python lanes install the Linux x86_64
# wheel; `pypi.yml` publishes what that run built.
#
# Artifact per platform: `wheels-native-<platform>`, for `linux-x86_64`,
# `linux-aarch64`, `macos-arm64` and `macos-x86_64`. A caller asks for the
# platforms it consumes, so a job that installs one wheel never waits on
# another's build.

on:
  workflow_call:
    inputs:
      platforms:
        description: >
          Space-separated platforms, each one of linux-x86_64, linux-aarch64,
          macos-arm64 and macos-x86_64.
        type: string
        required: true
      cpu-image:
        description: "The tree's CPU CI image (the Linux wheels build in it)."
        type: string
        required: true

permissions:
  contents: read

jobs:
  # `fromJson` needs a real JSON value; where a platform builds is
  # `ci/scripts/build_matrix.py`'s to say.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: python3 ci/scripts/build_matrix.py wheels --platforms "$PLATFORMS" | tee -a "$GITHUB_OUTPUT"

  linux:
    name: Native wheel (Linux, ${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.linux != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ inputs.cpu-image }}
    defaults:
      run:
        working-directory: packaging/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
        with:
          # A wheel build, not the lint gate.
          deny-warnings: false

      # maturin derives the wheel's platform tag (manylinux_2_28_<arch>) from
      # the container it runs in.
      - name: Build the wheel
        run: maturin build --release --out dist

      # Built in a manylinux_2_28 container does not by itself prove the
      # linked symbol versions stay at the floor, nor that the machine matches
      # the arch the tag claims: both are read from the `.so` inside the wheel.
      - name: The wheel's .so holds the GLIBC floor and the arch
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          python3 -m zipfile -e dist/*.whl "$workdir"
          so="$(find "$workdir" -name '*.so' -print -quit)"
          test -n "$so" || { echo "::error::no .so inside the wheel" >&2; exit 1; }
          bash ../../ci/scripts/assert_glibc_floor.sh "$so" 2.28
          bash ../../ci/scripts/assert_elf_machine.sh "$so" "$ARCH"

      - name: The wheel fits PyPI's per-file limit
        run: bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-native-linux-${{ matrix.arch }}
          path: packaging/native/dist

  macos:
    name: Native wheel (macOS, ${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.macos != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.macos) }}
    runs-on: macos-14
    defaults:
      run:
        working-directory: packaging/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/setup-rust-host
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: false

      - name: Build the wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # `packaging/native/pyproject.toml`'s `[tool.maturin] manifest-path`
          # resolves the crate.
          working-directory: packaging/native
          args: --release --out dist

      - name: The wheel's .so is the target's machine
        env:
          ASSERT_ARCH: ${{ matrix.assert_arch }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          python3 -m zipfile -e dist/*.whl "$workdir"
          so="$(find "$workdir" -name '*.so' -print -quit)"
          test -n "$so" || { echo "::error::no .so inside the wheel" >&2; exit 1; }
          bash ../../ci/scripts/assert_elf_machine.sh "$so" "$ASSERT_ARCH"

      - name: The wheel fits PyPI's per-file limit
        run: bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: packaging/native/dist
