syntax = "proto3";

// The wire form of `jammi-datafusion`'s operators: what a
// `PhysicalExtensionCodec` writes for an `InferenceExec` or a
// `NumberedInputExec` and rebuilds the node from in another process. Only
// the descriptor crosses; the runtime a node runs against is the decoding
// process's own.
package jammi.inference.v1;

// Where a model is loaded from.
message ModelSource {
  oneof source {
    // A Hugging Face Hub repository id.
    string hugging_face = 1;
    // A local directory.
    string local = 2;
    // A model served at a remote endpoint, by its declared name. The
    // decoding process resolves the name against its own configuration.
    string remote = 3;
  }
}

// `InferenceExec`'s construction inputs — the `InferenceSpec` the node
// carries.
message InferenceExecNode {
  ModelSource source = 1;
  // `ModelTask::as_str()` — the canonical spelling.
  string task = 2;
  repeated string content_columns = 3;
  string key_column = 4;
  string source_id = 5;
  // The chunk budget: the most rows and the most padded tokens one forward
  // takes.
  uint64 batch_size = 7;
  uint64 batch_tokens = 13;
  optional uint64 embedding_dim = 8;
  // `DistributionForm` via `serde_json`.
  optional string regression_form_json = 9;
  repeated string passthrough = 10;
  // The device KIND this descriptor must run on ("cpu"|"cuda"|"metal"):
  // exactly the value the node was constructed with. The codec never invents
  // or rewrites it.
  string device_kind = 11;
  // The fan-out the node declares: how many partitions forward chunks
  // concurrently.
  uint64 partitions = 12;
}

// `NumberedInputExec`'s construction inputs: the order it numbers its single
// child's rows in, and the spec whose model costs the rows and whose budget
// cuts their chunks — the same descriptor the `InferenceExec` above it
// carries.
message NumberedInputExecNode {
  // The key column of the keyed total order. Absent: rows are numbered in
  // arrival order.
  optional string key_column = 1;
  // The columns that break ties on the key, in order, for a keyed order.
  repeated string tie_breakers = 3;
  InferenceExecNode spec = 2;
}
