name: stage-server-binaries
description: >
  Lays out binaries a run built, a `jammi-server` and the `jammi` CLI, as the
  Dockerfile's builder-stage output (`<dir>/out/jammi-server`,
  `<dir>/out/jammi`, and, for the CPU builder, an empty `<dir>/out/jammi-data/`),
  so an image build packages them through an image action's
  `build-contexts: builder=<dir>` instead of compiling them again. Runs after
  `actions/checkout`.

inputs:
  run-id:
    description: "The run that built the artifacts."
    required: true
  server:
    description: "The server binary's artifact, e.g. `server-cpu-x86_64-binary`."
    required: true
  cli:
    description: "The CLI tarball's artifact, e.g. `jammi-x86_64-unknown-linux-gnu`."
    required: true
  stage:
    description: >
      The Dockerfile stage these binaries replace: `builder` (the CPU
      runtimes, which also take `jammi-data/`) or `builder-cuda`.
    required: true

outputs:
  build-context:
    description: "The `build-contexts` line for `build-image` or `push-image-leg`: `<stage>=<dir>`."
    value: ${{ steps.layout.outputs.build-context }}

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.server }}
        path: ${{ runner.temp }}/server-binaries/server
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}

    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        name: ${{ inputs.cli }}
        path: ${{ runner.temp }}/server-binaries/cli
        run-id: ${{ inputs.run-id }}
        github-token: ${{ github.token }}

    - name: Lay out the builder stage's output
      id: layout
      shell: bash
      env:
        STAGE: ${{ inputs.stage }}
        ROOT: ${{ runner.temp }}/server-binaries
      run: |
        set -euo pipefail
        case "$STAGE" in
          builder | builder-cuda) ;;
          *) echo "::error::stage must be builder or builder-cuda, got '$STAGE'" >&2; exit 1 ;;
        esac
        out="$ROOT/context/out"
        mkdir -p "$out"
        # Artifacts do not preserve the exec bit.
        install -m 0755 "$ROOT/server/jammi-server" "$out/jammi-server"
        bash ci/scripts/unpack_cli.sh "$ROOT/cli" "$out"
        if [ "$STAGE" = builder ]; then
          mkdir -p "$out/jammi-data"
        fi
        echo "build-context=$STAGE=$ROOT/context" >> "$GITHUB_OUTPUT"
