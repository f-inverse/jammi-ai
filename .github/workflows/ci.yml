name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `--all-targets` above only compiles test targets whose
      # `required-features` are satisfied by default. Exactly three
      # workspace test targets are NOT (`cargo metadata` enumerated): jammi-ai
      # `gpu_capability` (`required-features = ["live-gpu-tests"]`), jammi-ai
      # `distributed` (`required-features = ["live-distributed-tests"]`) —
      # both covered by the step below, neither needs an actual GPU/CUDA
      # toolchain or a distributed harness to *compile*, only to run
      # meaningfully, so this step stays hermetic and cheap — and jammi-kernels
      # `cuda_parity` (`required-features = ["cuda"]`, crates/jammi-kernels/
      # Cargo.toml:66), which CANNOT be covered here: `cuda` pulls
      # `dep:bindgen_cuda`, a real CUDA toolchain requirement this hermetic
      # runner does not have. That target is linted instead in
      # `ci/scripts/runpod_gpu_prove.sh`, the one lane with a real GPU.
      #
      # This step is what actually closes the doc_lazy_continuation escape
      # `ci/scripts/check_doc_list_indent.py` was written to catch (a real
      # hit in gpu_capability's `graph_propagation_parity.rs`, confirmed via
      # this exact command going from EXIT=101/4 errors to EXIT=0 once the
      # doc was fixed). That script was retired, not merged in alongside
      # this step: it both OVER-approximates the lint (flags markdown-list-
      # shaped lines mid-paragraph, e.g. `2. text`, that clippy is silent on)
      # and UNDER-approximates it (misses flush-left prose following a
      # properly-indented continuation, which clippy does flag) — a fixed
      # text scanner cannot track clippy's own CommonMark-interruption rules,
      # so it is not a substitute for running the real lint.
      #
      # Residual gap, disclosed rather than silently accepted: a doc comment
      # attached to an item behind a proc-macro attribute (e.g. `#[test_case
      # (...)]`) is invisible to `clippy::doc_lazy_continuation` — the macro
      # expansion masks the lint, a class no `cargo clippy` invocation can
      # see through. `check_doc_list_indent.py` DID cover that class (it is
      # a text scanner, not macro-aware), so retiring it trades away
      # detection there. `crates ci` at HEAD has zero such hits, so this is
      # a prospective gap, not a live one; if it needs closing, it needs a
      # macro-aware (or item-doc-scoped) checker, not a reinstated line-shape
      # scanner with the over/under-approximation problems above.
      - name: Clippy (gated test surfaces — compile-only feature closure)
        run: cargo clippy -p jammi-ai --tests --features live-gpu-tests,live-distributed-tests -- -D warnings

  test:
    name: Test (hermetic)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # `jammi-python` is a PyO3 cdylib whose `extension-module` feature is
      # opt-in (activated by maturin via pyproject.toml). With the feature
      # off, pyo3 emits `-lpython3.x` and the cdylib + tests/it.rs binary
      # both need `libpython` on the linker search path — which the
      # manylinux CI image does not provide outside a maturin-managed
      # build. Excluding it from the workspace test lane matches the
      # existing CLAUDE.md guidance ("build it via maturin, not
      # `cargo build --workspace`") and keeps this lane hermetic; the
      # crate is exercised end-to-end by the `Test (Python)` job below,
      # which also runs `cargo test -p jammi-python` against the venv's
      # interpreter to cover the Rust integration test.
      - name: Run tests
        run: cargo test --workspace --exclude jammi-python

  # The gated-lane compile-checks live in their OWN job, not in `test` above.
  # Each `--no-run` builds a full-workspace test-binary graph; accumulating all
  # of them plus the run-tests graph in one job's `target/` exhausted the
  # runner's disk at link time (`mold: … Disk full?` linking the jammi-server
  # `it` binary). One large graph per job keeps every link within the disk
  # budget. These only compile-check — the live runs are gated elsewhere.
  compile-check-gated:
    name: Compile-check (gated lanes)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # Live (hub) tests reach the network, so they only compile here; the live
      # run is gated behind `live-hub-tests`. Compile-checking guards bit-rot.
      - name: Compile-check live tests
        run: cargo test --workspace --exclude jammi-python --features live-hub-tests --no-run

      # The gated GPU-capability suite needs a CUDA build and a real GPU, so it
      # cannot run on this CPU runner — like the distributed lane, compile-check
      # it here so it can't bit-rot. The live run is a GPU-host (A10G) gate: see
      # `cargo test -p jammi-ai --features cuda,live-gpu-tests gpu_capability`.
      # Compile-checked without `cuda` (the suite is feature-gated config only;
      # the CUDA symbols it drives are cfg-gated inside the engine), so this
      # stays a CPU-runner step.
      - name: Compile-check GPU-capability suite
        run: cargo test -p jammi-ai --features live-gpu-tests --test gpu_capability --no-run

  test-live:
    name: Test (live)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: test
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Run live tests
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        # Same `jammi-python` exclusion as the hermetic lane: the cdylib
        # plus integration test need libpython on the linker path, which
        # only the maturin-managed build (Test (Python) job) provides.
        run: cargo test --workspace --exclude jammi-python --features live-hub-tests

  test-clients:
    name: Test (wire / admin / client)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # The candle-free client substrate: the wire transport (`jammi-wire`,
      # holding the generated stubs, the proto↔domain converters, and the moved
      # request / eval / fine-tune vocabulary), the control-plane client
      # (`jammi-admin`), and the data-plane client (`jammi-client`). The moved
      # wire-converter + config-round-trip unit tests live here, so run their
      # lints + tests deterministically in their own right.
      - name: Clippy (wire / admin / client)
        run: cargo clippy -p jammi-wire -p jammi-admin -p jammi-client --all-targets -- -D warnings

      - name: Test (wire / admin / client)
        run: cargo test -p jammi-wire -p jammi-admin -p jammi-client

      # The client substrate must stay candle-free — NO candle / hf-hub /
      # symphonia / tokenizers ML stack. The workspace build feature-unifies
      # `local` on via jammi-server / jammi-python, so `cargo tree` would falsely
      # flag candle; the real per-package build set is what `cargo build -p X`
      # compiles, so the guard inspects the compiler-artifact stream of the
      # actual isolated build.
      - name: Assert the client substrate pulls no ML deps
        run: |
          cargo build -p jammi-wire -p jammi-admin -p jammi-client --message-format=json \
            | grep '"reason":"compiler-artifact"' \
            | grep -iE '"name":"(candle[^"]*|hf-hub|hf_hub|symphonia|tokenizers)"' \
            && { echo "::error::the client substrate compiled an embedded-engine ML dep — the candle-free boundary regressed"; exit 1; } \
            || echo "wire / admin / client build set is candle-free"

      # The `jammi` CLI is a strict control-plane client: it depends on
      # `jammi-admin`, NOT `jammi-ai`, so it must stay candle-free AND carry no
      # `jammi-ai` edge at all. The workspace build feature-unifies `local` on
      # via jammi-server / jammi-python, so this isolated `-p jammi-cli` lane is
      # the only place the strict client is exercised — without it a re-coupling
      # of the engine into the CLI would compile everywhere else and regress only
      # here.
      - name: Assert the standalone CLI build pulls no ML deps and no jammi-ai
        run: |
          ARTIFACTS=$(cargo build -p jammi-cli --message-format=json \
            | grep '"reason":"compiler-artifact"' \
            | grep -oE '"name":"[^"]*"')
          echo "$ARTIFACTS" | grep -iE '"name":"(candle[^"]*|hf-hub|hf_hub|symphonia|tokenizers)"' \
            && { echo "::error::the jammi CLI compiled an embedded-engine ML dep — the strict-client boundary regressed"; exit 1; } \
            || echo "jammi-cli build set is candle-free"
          echo "$ARTIFACTS" | grep -iE '"name":"jammi[-_]ai"' \
            && { echo "::error::the jammi CLI compiled jammi-ai — the strict-client boundary regressed"; exit 1; } \
            || echo "jammi-cli build set carries no jammi-ai edge"

  # The hermetic script-guard class (plain ubuntu + checkout + run one
  # hermetic script, no toolchain/container) lives as ONE matrix job below —
  # see `guard`, near the doc-parity / gpu-parity-matrix checks it was folded
  # in with.

  dep-direction:
    name: Guard (engine dep-direction)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # The open-core boundary is one-way: a consumer may depend on Jammi;
      # Jammi depends on no consumer. This guard walks the resolved
      # normal-dependency closure of the shippable OSS crates (the workspace
      # default-members) and fails, naming the offender, if any crate is from
      # a non-crates.io source (a path outside the workspace, a git source, or a
      # private/alternate registry) — a proprietary crate is caught by its
      # source, not its name. It reads `cargo metadata`'s resolved graph — the
      # source of truth — so a transitive dep cannot slip past a text grep of
      # Cargo.toml.
      - name: Assert no proprietary crate in the OSS engine dep tree
        run: cargo metadata --format-version 1 --locked | python3 ci/scripts/check_dep_direction.py

  flash-attn-closure:
    name: Guard (flash-attn feature closure)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # `jammi-kernels/flash-attn` vendors CUTLASS + a multi-minute `nvcc`
      # build; it must depend on `cuda` but never be IMPLIED by it, or the
      # release lane (`release-binaries.yml`'s `cuda,jetstream-broker,
      # storage-cloud` build) silently drags CUTLASS into every release
      # build. This walks the workspace feature graph the way the resolver
      # does (own `cargo metadata --no-deps` call, so it runs unpiped unlike
      # the dep-direction guard above) and fails if `flash-attn` is reachable
      # from `default`, the release lane's feature set, or `--all-features`.
      - name: Assert no consumer's feature closure reaches jammi-kernels/flash-attn
        run: python3 ci/scripts/check_flash_attn_closure.py

  # This is a COMPILE lane, not a correctness lane: it proves the vendored
  # FlashAttention-2 tree, the torch-free C wrapper, the shim headers, and
  # `build.rs::build_flash_attn` still produce a valid `nvcc` build (a
  # source-tree or wrapper edit that FAILS to compile is caught here). It
  # does NOT prove the kernels are numerically correct — no test in this job
  # runs on a GPU. `tests/flash_smoke.rs` (16 cases) and the `flash::` unit
  # tests (17 cases) are the only lane that checks output values, and they
  # currently run nowhere in CI; they exist only as ad-hoc `JAMMI_REQUIRE_
  # CUDA=1 cargo test -p jammi-kernels --features flash-attn --test
  # flash_smoke` pod sessions (see the P6 stage-A artifact commit). Closing
  # THAT gap needs a self-hosted GPU runner wired the way `_gpu-prove-gate.yml`
  # already does for the release lane — out of scope here; do not read a green
  # run of this job as evidence the kernels compute the right numbers.
  #
  # `cargo check` (not `cargo build`) is enough: build scripts run in full —
  # unconditionally compiled AND executed — for `cargo check` exactly as for
  # `cargo build`, because the primary crate's check needs the build script's
  # `cargo:rustc-link-lib` / `cargo:rustc-cfg` output regardless of whether the
  # crate itself is only being metadata-checked. `build.rs::build_flash_attn`
  # is gated on `CARGO_FEATURE_FLASH_ATTN` in `main()`, not on the downstream
  # check/build distinction, so `cargo check -p jammi-kernels --features
  # flash-attn` invokes it — and therefore `nvcc` — the same as a full build.
  #
  # Needs the CUDA toolkit (`nvcc`) but NOT a GPU: reuses the established CUDA
  # CI base image (`JAMMI_CI_IMAGE_CUDA`, the same image `server-cu12` in
  # release-binaries.yml and the `_pypi-server.yml` CUDA leg already build
  # in), which ships CUDA 12.6 + gcc-toolset-13 on PATH
  # (`.docker/ci-cuda.Dockerfile`) and needs no `nvidia-smi`/driver at build
  # time (`CUDA_COMPUTE_CAP=80` is pinned, matching this crate's own
  # `build_cuda` precedent).
  #
  # The CUTLASS submodule init below is scoped to THIS job's own checkout
  # step only — GitHub Actions jobs run on independent, ephemeral runners
  # with independent checkouts, so it cannot leak an initialised CUTLASS tree
  # into `crates.yml`'s publish checkout. That distinction matters: `cargo
  # package -p jammi-kernels` (crates.yml, no per-crate `include`/`exclude`)
  # walks any submodule that IS checked out at package time and would ship
  # BSD-3-Clause CUTLASS source inside the Apache-2.0-declared tarball
  # undisclosed (the gap `third_party/flash-attention/VENDORED.md` already
  # flags, unrelated to and not fixed by this job) — so `submodules:` is never
  # added to `crates.yml`'s own checkout step.
  #
  # Cost, measured on an A100 pod build (the three vendored TUs compile
  # CONCURRENTLY — `build.rs`'s `tus.iter().map(..).spawn(..)`, so wall time
  # is bounded by the slowest, not the sum): fwd ~48 s, bwd ~77 s, the
  # wrapper ~5 s, so the `nvcc` stage alone is ~80 s. Add checkout, a shallow
  # CUTLASS submodule clone, the CUDA-image pull, and the rest of the crate's
  # own `cuda`-feature PTX build (`build_cuda`, 7 kernel files, also
  # nvcc-driven) and the job is realistically a few minutes end to end — real
  # but bounded, and it runs on every PR here (no `paths:` filter, matching
  # every other job in this file and the swarm's own no-paths-filter
  # discipline: a filtered-out required check hangs unrelated PRs). If that
  # per-PR cost is judged too high, the alternative is scoping it to changes
  # under `crates/jammi-kernels/build.rs`, `crates/jammi-kernels/src/flash/**`,
  # `crates/jammi-kernels/third_party/**`, `crates/jammi-kernels/Cargo.toml`,
  # and `.gitmodules` — EVERY one of those five paths, since missing any is
  # worse than no filter (it looks like coverage and isn't) — left to the
  # maintainer to decide, not applied unilaterally here.
  flash-attn-compile:
    name: Compile-check (flash-attn / CUTLASS, nvcc — no GPU)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE_CUDA || 'ghcr.io/f-inverse/jammi-ai-ci-cuda:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately NOT `submodules: recursive` on the checkout itself —
          # initialise only the one submodule this job needs, explicitly, so
          # the scope is auditable from this one line rather than implicit in
          # a blanket flag.
          submodules: false

      # A bare `git` in a container `run:` step hits "fatal: detected dubious
      # ownership" (exit 128) — the checkout is owned by a different user than
      # the container's git, and the safe.directory `actions/checkout` sets is
      # not visible here (same trap as `dep-dag.yml`'s dep-DAG freshness step).
      - name: Init the CUTLASS submodule (scoped to this job's checkout only)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass

      - uses: ./.github/actions/setup-rust-ci

      - name: Compile-check jammi-kernels --features flash-attn (nvcc, no GPU)
        run: cargo check -p jammi-kernels --features flash-attn

  oss-only-build:
    name: Guard (OSS-only build)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # This guard's signal is HERMETICITY, not re-linking code the test lane
      # already compiles. No private registry or source is configured, and
      # `--locked` forbids resolving any crate not already in the committed
      # Cargo.lock — so a green build proves the OSS edition is self-contained
      # and its lockfile holds zero proprietary entries. `jammi-python` (a PyO3
      # cdylib built via maturin, not `cargo build --workspace`) is excluded to
      # match the existing build/test/docs lanes.
      - name: Build OSS workspace hermetically with no private source
        run: cargo build --workspace --exclude jammi-python --locked

  dep-audit:
    name: Guard (dependency audit)
    runs-on: ubuntu-latest
    # Runs in the same gnu CI image as every other job: `cargo deny` resolves
    # `cargo metadata`, which needs the repo's pinned toolchain (rust-toolchain.toml)
    # and respects `.cargo/config.toml`. The upstream cargo-deny *action*
    # runs in its own Alpine/musl container, where that toolchain is absent and the
    # sccache wrapper has no server — so we install + run the binary here instead.
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    env:
      # `cargo metadata` needs no build cache; skip the sccache wrapper (this lane
      # runs no sccache server) so metadata resolution doesn't try to invoke it.
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci
        with:
          no-sccache: "true"

      # `cargo deny` runs the supply-chain gate against `deny.toml`: the live
      # RustSec advisory DB (a newly-published vulnerability against a crate in
      # the resolved tree reds this job), the license allowlist, and the
      # bans/sources lanes that formalize the engine's one-way dependency
      # direction in the lockfile. cargo-deny fetches/updates the RustSec DB
      # itself, so the advisory check reads the current database, not a stale
      # snapshot — and knowingly-carried advisories live as documented exceptions
      # in `deny.toml`, never a blanket silence.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny check advisories licenses bans sources

  ts-client:
    name: TS client (@f-inverse/jammi-client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `@f-inverse/jammi-client` is generated from the canonical proto at
      # `crates/jammi-wire/proto` by `buf generate` (run inside `npm run build`),
      # then type-checked and smoke-tested. Running it on every PR catches a
      # proto change that breaks TS codegen — or a regression in the thin
      # hand-written wrapper — here, not only at the release-tag publish in
      # `npm.yml`. Plain ubuntu (not the Rust CI container): this lane needs
      # Node, not cargo.
      - name: Install
        run: npm ci

      - name: Build (generate + tsc)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test (hermetic)
        run: npm run test

  py-client:
    name: Python client (jammi-ai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `jammi-ai` (import `jammi`) is the pure-Python (no-Rust) base client:
      # generated from the canonical `crates/jammi-wire/proto` by `make generate`,
      # then installed and tested. Running it on every PR catches a proto change that breaks the
      # Python codegen — or a regression in the hand-written `connect` /
      # `RemoteDatabase` seam — here, not only at the `py-v*` publish in
      # `pypi-client.yml`. Plain ubuntu (not the Rust CI container): this lane
      # needs Python, not cargo.
      - name: Install (with dev extra) + generate stubs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          make generate

      - name: Test (hermetic)
        run: make test

      - name: Guard — base client stays native-free at import
        run: |
          python -c "import sys, jammi; bad=[m for m in sys.modules if m=='jammi_native' or m.startswith('jammi_native.')]; assert not bad, f'import jammi eagerly pulled jammi_native: {bad}'; print('client import-direction OK')"

  test-broker:
    name: Test (NATS JetStream)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Install and start nats-server (with JetStream)
        # GHA `services:` cannot override the upstream image's CMD to pass
        # `-js`, so the broker driver's JetStream API isn't available with
        # the default `nats:2.10` entrypoint. Running the official tarball
        # release directly lets the job pass `-js -m 8222` and own the
        # process lifetime explicitly.
        run: |
          NATS_VERSION=v2.10.21
          NATS_TGZ="nats-server-${NATS_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "https://github.com/nats-io/nats-server/releases/download/${NATS_VERSION}/${NATS_TGZ}" -o /tmp/nats.tar.gz
          tar -xzf /tmp/nats.tar.gz -C /tmp
          /tmp/nats-server-${NATS_VERSION}-linux-amd64/nats-server -js -m 8222 -p 4222 >/tmp/nats.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8222/healthz >/dev/null 2>&1; then
              echo "nats-server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8222/healthz

      - name: Run JetStream broker tests
        env:
          JAMMI_TEST_NATS_URL: nats://127.0.0.1:4222
        # JetStream streams are global; serialise so concurrent tests do not
        # collide on freshly minted topic ids while one of them is still
        # tearing down.
        run: |
          cargo test -p jammi-db --features live-broker-tests --test it -- --test-threads=1

  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Install the base client + native engine
        # The CI base image ships maturin + a python3 toolchain; use a
        # venv to avoid polluting the system site-packages and to make
        # `python` resolve to the venv's interpreter for pytest.
        #
        # The pytest suite drives two dists that ship in lockstep:
        #   * `jammi-ai` (import `jammi`) — the base client; install from in-repo
        #     source (`-e` with the dev extra, which carries the pinned
        #     `grpcio-tools` generator and the client's real grpcio/protobuf
        #     floors) then generate its proto stubs, since it is not on PyPI for
        #     an unreleased commit.
        #   * `jammi-ai-native` — the compiled engine (`import jammi_native`);
        #     `maturin develop` on `packaging/native/pyproject.toml` builds it
        #     into the venv, and the base client discovers it as its `file://`
        #     backend.
        # This is what makes the conformance test (`jammi.connect`'s remote IS
        # `jammi.RemoteDatabase`, its `file://` arm the native engine) runnable
        # in this lane.
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install maturin pytest
          pip install -e 'clients/python[dev]'
          make -C clients/python generate
          ( cd packaging/native && maturin develop --release )

      - name: Run pytest
        run: |
          . .venv/bin/activate
          pytest crates/jammi-python/tests -v

      - name: Run UAT shape-B/C Python scripts
        run: |
          . .venv/bin/activate
          for script in tests/uat/shape_b_*.py tests/uat/shape_c_*.py; do
            echo "=== $script ==="
            python3 "$script"
          done

  test-pg:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: >-
          --health-cmd "pg_isready -U jammi -d jammi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Run Postgres-gated tests
        env:
          # Service container is reachable at `postgres` from the job container
          # (same Docker network); the catalog connects via sqlx::PgPool.
          JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
        # Tests share one catalog DB and serialise migrate() ledger writes.
        # `--test-threads=1` keeps that contract; the suite is small.
        run: |
          cargo test -p jammi-db --features live-postgres-tests --test it -- --test-threads=1

  # Hermetic script-guard class: every leg here is the same shape (plain
  # ubuntu, checkout, run one hermetic script — no toolchain, no container,
  # no GPU) so it is ONE job parameterized over the guard, not N near-identical
  # jobs. `fail-fast: false` so one guard's failure doesn't hide another's; the
  # matrix job's overall result is `failure` if any leg fails, which is what
  # `ci-summary` (below) actually gates on. No path filter (runs on every PR)
  # so the context stays safe to require. (The swarm-gates workflow is
  # deliberately NOT folded in here: it is a human-amend-only governance gate
  # and stays isolated.)
  guard:
    name: Guard (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The book (cookbook/book/) consumes the engine; the engine never
          # consumes the book. Engine crates may depend on the engine-owned
          # cookbook/fixtures/ (that edge stays) but no crate may reference
          # cookbook/book/.
          - name: cookbook one-way
            cmd: bash ci/scripts/check_cookbook_one_way.sh
          # A cheap, hermetic, toolchain-free grep over crates/jammi-db/src for
          # backend-specific SQL tokens (SQLite-only rowid/AUTOINCREMENT/PRAGMA/
          # strftime(/glob(, and — bidirectionally — Postgres-only ctid). This
          # is a syntactic first-pass tripwire, not the parity closure
          # mechanism: the required Postgres it-matrix (parameterized
          # crates/jammi-db/tests/it) is what actually enforces
          # backend-behavioral parity.
          - name: SQLite-ism syntactic tripwire
            cmd: python3 ci/scripts/check_sqlite_isms.py
          # Doc↔enum parity guard — a trivial hermetic pure-Python check (no
          # toolchain), folded in from the former standalone doc-parity.yml so
          # the single `ci-summary` gate covers it.
          - name: doc↔enum parity
            cmd: python3 ci/scripts/check_doc_parity.py
          # Every measurement-shaped number (an N/M element count with M >= 64,
          # an X%/X.Y%, or a bare 2-6-decimal cosine) with a trigger word
          # ANYWHERE in its enclosing doc-comment BLOCK, in a kernel/test doc
          # comment or assert! message under
          # crates/jammi-{kernels,encoders,lora,bench}, must cite what
          # produced it — `see [`fn`]` / `see mod::path::fn` / `see fn`,
          # `printed by <same forms>`, `measured by <tracked path>`, or
          # `[producer: <same forms>]` — ANYWHERE in that same block (the
          # citation and the number need not be on the same line, or even
          # adjacent lines — round-2 audit: a 12-line window both missed and
          # over-reached; round-3 audit: binding is the comment block a
          # citation and a number both live in). The resolved fn must be a
          # #[test] function or a pub fn under tests/ — not any fn with a
          # matching name, which is what let `see below` resolve against an
          # unrelated non-test fn. `no-producer: <reason>` stays LINE-scoped
          # (an explicit opt-out for a genuinely derived constant). Closes
          # the class where a precise-looking number reads as evidence but
          # nothing in the tree actually computes it (see
          # docs/maintainer/cuda-kernel-guide.md §3.9). A committed,
          # only-shrinks allowlist (ci/doc_number_allowlist.txt, classified
          # real/noise in ci/doc_number_allowlist_classification.md) carries
          # the pre-existing debt on main at the time this gate landed.
          #
          # ADVISORY, not required (lead ship decision, round-4): the lexical
          # heuristic's honest noise rate on main is 36/69 = 52.2% (real:
          # 33/69 = 47.8%; see ci/doc_number_allowlist_classification.md), so
          # a REQUIRED scan leg would block an honest in-flight branch on its
          # own noise (the esc-045 branch alone carries 69 unallowlisted
          # findings, roughly half of them noise) rather than only on
          # genuine new violations. The scan leg reports (advisory) until
          # precision on main reaches >= 80% real.
          # `continue_on_error: "true"` below (consumed by the shared "Run
          # guard" step's `continue-on-error` expression) marks ONLY this one
          # leg soft; `--self-test` and `--check-allowlist-only-shrinks`
          # stay REQUIRED — the mechanism itself and the allowlist's
          # only-shrinks invariant are both still fail-closed, only the
          # noisy scan output is advisory.
          - name: doc numbers have producers
            cmd: python3 ci/scripts/check_doc_numbers_have_producers.py
            continue_on_error: "true"
          - name: doc numbers have producers self-test
            cmd: python3 ci/scripts/check_doc_numbers_have_producers.py --self-test
          # ci/doc_number_allowlist.txt is only-shrinks, mechanically: fetches
          # origin/main (fails CLOSED if the fetch itself fails, or if
          # origin/main does not resolve at all — never silently proceeds on
          # stale/absent data) and fails on any entry this branch ADDS
          # relative to it (never on one it removes). The one leg of this
          # gate that is not otherwise hermetic (a single `git fetch origin
          # main`), matching swarm.yml's own TOUCHED-guard precedent for
          # comparing a branch against its merge base. Trivially passes
          # (bootstrap) ONLY when origin/main resolves but has no allowlist
          # file yet — the one PR introducing the file for the first time,
          # since there is no baseline yet to have grown past.
          - name: doc numbers allowlist only shrinks
            cmd: python3 ci/scripts/check_doc_numbers_have_producers.py --check-allowlist-only-shrinks
          # GPU-parity coverage-completeness guard — the device-axis analog of
          # the required Postgres/SQLite backend it-matrix. It enumerates every
          # SHIPPED (encoder architecture × GPU-dispatching ModelTask verb)
          # cell and requires each to be COVERED, STRUCTURALLY_EXCLUDED, or
          # PENDING, so an untested cell cannot silently hide a divergence
          # (closes esc-028).
          - name: GPU parity matrix
            cmd: python3 ci/scripts/check_gpu_parity_matrix.py
          # CUDA-run-artifact schema + provenance guard: every `*.json` under
          # `crates/jammi-kernels/artifacts/cuda-runs/` (recursing into any
          # `*-raw-runs/` leg dir) must carry a well-typed `schema_version` /
          # `git_sha` / `box` / `producer` / `status`, a `git_sha` that is an
          # ancestor of `HEAD`, and a `producer` that is either statically
          # verifiable (a real `#[test] fn` under its stated gating
          # attribute) or a reviewed legacy `kind: "none"` entry — closes the
          # class where a green artifact quietly proved a squash-merged,
          # no-longer-reachable tip (docs/maintainer/cuda-kernel-guide.md §4).
          # Needs REAL commit history (git merge-base --is-ancestor), unlike
          # every other leg in this matrix — the shared checkout step below
          # reads this entry's own `fetch_depth: "0"` (full history; GitHub
          # reports this repo's on-disk size as ~94 MB, negligible next to
          # the Rust build jobs) and defaults every other leg to the normal
          # shallow `actions/checkout` clone (`fetch_depth` unset -> `'1'`),
          # so only this one runner instance pays the deeper-clone cost.
          # QUOTED as a STRING, not the bare number 0: GitHub Actions
          # expressions treat the NUMBER 0 as falsy, so a bare `fetch_depth:
          # 0` makes `matrix.fetch_depth || '1'` below silently discard it
          # and fall through to the shallow default — this exact bug shipped
          # once already and made even a genuinely-ancestor git_sha FAIL in
          # CI (`git fetch --depth=1` in the job log, not `--depth=0`/full).
          # The string `"0"` is non-empty, hence truthy, so `||` leaves it
          # alone; `actions/checkout`'s `fetch-depth` input is read as a
          # string either way, so this changes nothing about what the action
          # itself does with the value.
          - name: CUDA run artifact schema
            cmd: python3 ci/scripts/check_cuda_run_artifacts.py
            fetch_depth: "0"
          # Completeness tripwire for this very guard class: every
          # ci/scripts/check_*.py|.sh gate script must be referenced by at
          # least one workflow (this file included), so a new check script
          # can't be authored and left silently unwired into CI.
          - name: CI guard wiring
            cmd: python3 ci/scripts/check_ci_guard_wiring.py
          # check_ci_guard_wiring.py's OWN suite (advisory iii, PR #372
          # round 2): drives the real python_test_suites()/main() entry
          # points against throwaway git-init'd fixtures, pinning the
          # comment-vs-code-line tightening and the root generalization.
          - name: CI guard wiring suite
            cmd: python3 ci/scripts/test_check_ci_guard_wiring.py
          # Re-resolves every finetune_step.rs:<n>/grad_oracle.rs:<n>
          # PATH:LINE citation under crates/jammi-bench/** and
          # ci/scripts/perf/** against the file at HEAD (advisory i, PR #372
          # round 2) -- stdlib-only, hermetic, catches the F7-class
          # regression (an in-bounds but STALE line number) an eyeballed
          # diff review missed twice in a row on this same PR.
          - name: citation resolver
            cmd: python3 ci/scripts/perf/check_citations.py
          - name: citation resolver suite
            cmd: python3 ci/scripts/perf/test_check_citations.py
          # jammi-vs-torch gradient-oracle comparator's own math/refusal
          # suite (F6, PR #372 audit round): stdlib-only (`unittest`), no
          # torch/numpy required — `compare_grad_oracle.py`'s own module
          # doc's "numpy-first oracle, pure-Python fallback" convention —
          # so this is exactly the hermetic script-guard shape, never a
          # torch-dependent lane. Was previously invoked from ZERO
          # workflows (49 assertions enforced by nothing); execution
          # provenance principle: zero-execution is RED, not a skip.
          - name: perf compare_grad_oracle suite
            cmd: python3 ci/scripts/perf/test_compare_grad_oracle.py
          # `finetune_ab.sh`'s merge/table stage suite (F6): stdlib-only,
          # drives `ab_merge.main` (the real entry point that script's own
          # heredoc-turned-module extraction was built to make testable —
          # see `ab_merge.py`'s own module doc's B3 note). Same
          # zero-execution gap as `compare_grad_oracle`'s suite above.
          - name: perf ab_merge suite
            cmd: python3 ci/scripts/perf/test_ab_merge.py
          # `torch_grad_oracle.py`'s NAME-TRANSLATION suite (F6): stdlib-
          # only, importable without torch installed (that module's own
          # `import torch_finetune_step as tfs` succeeds torch-free because
          # `torch_finetune_step.py` imports torch lazily inside its
          # functions, never at module scope — see this suite's own module
          # doc). Caught and pinned a real bug (the `Wi`/`mlp.Wi` name
          # misroute) before this fix; was wired into no workflow at all.
          - name: reference torch_grad_oracle name-translation suite
            cmd: python3 crates/jammi-bench/reference/test_torch_grad_oracle_names.py
          # The fused-op-gradient-parity gate's OWN self-test (RED/GREEN
          # cases, including a shape-specific-defect-must-not-gate-alone
          # case and a materially-diverging bf16-vs-f32-shaped pair
          # exercised both PASS and FAIL, against synthetic AblationReport
          # fixtures — never a real GPU run;
          # `check_fused_op_gradient_parity.py`'s own module doc). This
          # gate's REAL invocation (TWO real `jammi-bench grad-oracle
          # --ablate-each-op` reports, `b4-s128` and `b8-s128`, each an
          # internal 3-seed cascade, checked against a PER-SHAPE budget
          # derived from the `all_fused` arm's OWN measured seed spread —
          # round-7 audit fix on PR #383, never a fixed constant) needs a
          # live CUDA box and is a MANUAL pod-lane step
          # (`docs/maintainer/cuda-kernel-guide.md` §5: no CI lane has a
          # GPU) — this leg only proves the gate's own logic is sound, the
          # same "hermetic self-test wired, GPU-dependent real run manual"
          # split `check_cuda_run_artifacts.py`'s schema checks take.
          - name: fused-op gradient parity gate self-test
            cmd: python3 ci/scripts/perf/check_fused_op_gradient_parity.py --self-test
    steps:
      - uses: actions/checkout@v4
        with:
          # Every leg but "CUDA run artifact schema" leaves this at the
          # normal shallow default (`fetch_depth` unset in its matrix entry
          # -> `'1'`); that one leg's ancestry check needs real history. Both
          # sides of `||` are STRINGS (`'1'`, and the matrix entry's own
          # `"0"`) — the number `0` is falsy in GitHub Actions expressions,
          # so a bare `0` here would make `||` silently discard it.
          fetch-depth: ${{ matrix.fetch_depth || '1' }}
      - name: Run guard
        # `continue_on_error` is unset ('') for every leg except "doc
        # numbers have producers" (matrix.continue_on_error: "true" there) —
        # this expression is false for every other leg, so this stays a
        # no-op change for the required guards.
        continue-on-error: ${{ matrix.continue_on_error == 'true' }}
        run: ${{ matrix.cmd }}

  # ── Single rolled-up gate ──────────────────────────────────────────────────
  # The ONE check a branch-protection ruleset should require, instead of listing
  # every job as a separate context. It fails if any job above failed/cancelled;
  # a `skipped` job (intentional — e.g. `test-live`, which is main-only) counts
  # as a pass. `if: always()` makes it emit on every run, so the required check
  # never hangs "waiting for status". `test-live` is deliberately excluded — it
  # is `continue-on-error` (a live-network lane allowed to fail).
  ci-summary:
    needs:
      - check
      - test
      - compile-check-gated
      - test-clients
      - guard
      - dep-direction
      - flash-attn-closure
      - flash-attn-compile
      - oss-only-build
      - dep-audit
      - ts-client
      - py-client
      - test-broker
      - test-python
      - test-pg
    if: always()
    uses: ./.github/workflows/_summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
