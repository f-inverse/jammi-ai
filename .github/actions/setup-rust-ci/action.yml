name: setup-rust-ci
description: >
  Per-job Rust CI setup: the sccache GitHub Actions cache backend, and the
  `-D warnings` posture a lint lane carries. Runs after the checkout and after
  the job's toolchain is on PATH (it reads `rustc -vV`).

  The warnings flag is exported as `CARGO_TARGET_<HOST_TRIPLE>_RUSTFLAGS`,
  never as a bare `RUSTFLAGS`: a bare `RUSTFLAGS` replaces `.cargo/config.toml`'s
  per-target `rustflags`, where the mold linker and the aarch64 `+fp16` floor
  live, while the per-target variable joins with them. No caller exports a
  bare `RUSTFLAGS` after this action either (`ci.yml`'s arm64 floor oracle
  asserts it).

inputs:
  deny-warnings:
    description: >
      "true" (the default) exports `-D warnings` for the host triple, so a lint
      lane fails on any warning. "false" for a release or packaging build,
      which must not fail on a warning outside its own crates.
    required: false
    default: "true"
  no-sccache:
    description: >
      "true" skips the sccache backend, for a lane that disables the compiler
      wrapper and never compiles (`cargo deny`).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - if: inputs.no-sccache != 'true'
      uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9

    - shell: bash
      env:
        NO_SCCACHE: ${{ inputs.no-sccache }}
        DENY_WARNINGS: ${{ inputs.deny-warnings }}
        REF: ${{ github.ref }}
      run: |
        set -euo pipefail
        if [ "$NO_SCCACHE" != "true" ]; then
          # sccache refuses to start its server when its storage check fails
          # (SCCACHE_IGNORE_SERVER_IO_ERROR covers compile responses only), so
          # an unavailable Actions cache would fail every cargo call. Start it
          # here; when it cannot, the job compiles through the local disk cache.
          #
          # Only `main` writes: the cache is scoped by ref, every run reads
          # `main`'s entries, and an entry another ref writes serves only that
          # ref's re-runs while evicting `main`'s from the repository's 10 GB.
          if [ "$REF" = "refs/heads/main" ]; then rw_mode=READ_WRITE; else rw_mode=READ_ONLY; fi
          if SCCACHE_GHA_ENABLED=true SCCACHE_GHA_RW_MODE="$rw_mode" sccache --start-server >/tmp/sccache-start.log 2>&1; then
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "SCCACHE_GHA_RW_MODE=$rw_mode" >> "$GITHUB_ENV"
          else
            echo "::warning::the GitHub Actions cache refused sccache ($(grep -m1 -o 'error: .*' /tmp/sccache-start.log)); this job compiles through sccache's local disk cache"
          fi
        fi

        case "$DENY_WARNINGS" in
          true) ;;
          false) exit 0 ;;
          *) echo "::error::deny-warnings must be 'true' or 'false', got '$DENY_WARNINGS'" >&2; exit 1 ;;
        esac
        # Cargo's spelling of `target.<triple>.rustflags` as a variable:
        # the triple uppercased, `-` as `_`. An unresolvable triple fails
        # here rather than exporting a variable cargo never reads.
        host_triple="$(rustc -vV | sed -n 's/^host: //p')"
        [[ "$host_triple" =~ ^[a-z0-9_]+-[a-z0-9_-]+$ ]] \
          || { echo "::error::rustc -vV reported no usable host triple ('$host_triple')" >&2; exit 1; }
        echo "CARGO_TARGET_$(echo "$host_triple" | tr 'a-z-' 'A-Z_')_RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"
