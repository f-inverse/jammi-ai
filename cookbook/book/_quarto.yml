project:
  type: book
  output-dir: _book

book:
  title: "The Jammi Cookbook"
  subtitle: "Learn every Jammi capability by running it"
  author: "F-Inverse"
  search: true
  site-url: https://f-inverse.github.io/jammi-ai/cookbook/
  repo-url: https://github.com/f-inverse/jammi-ai
  chapters:
    - index.qmd
    - part: "Start here"
      chapters:
        - chapters/recipes/quickstart.qmd
        - chapters/datasets.qmd
    - part: "Search"
      chapters:
        - chapters/retrieval/retrieval.qmd
        - chapters/recipes/image_search.qmd
        - chapters/recipes/audio_search.qmd
        - chapters/recipes/cross_modal_search.qmd
        - chapters/ann-recall/ann-recall.qmd
        - chapters/segmented-ann/segmented-ann.qmd
        - chapters/precision/precision.qmd
        - chapters/precision/binary-precision.qmd
        - chapters/precision/asymmetric-binary.qmd
        - chapters/recipes/search_audit.qmd
    - part: "Models and inference"
      chapters:
        - chapters/recipes/model_catalog.qmd
        - chapters/model-catalog/model-catalog.qmd
        - chapters/recipes/remote_model.qmd
        - chapters/precision/compute-precision.qmd
        - chapters/precision/quantized-weights.qmd
        - chapters/fanout/fanout.qmd
    - part: "Evaluation"
      chapters:
        - chapters/recipes/eval_embeddings.qmd
        - chapters/recipes/eval_inference.qmd
        - chapters/recipes/eval_inference_ner.qmd
        - chapters/eval-channels/eval-channels.qmd
        - chapters/error-taxonomy/error-taxonomy.qmd
        - chapters/calibration/calibration.qmd
    - part: "Fine-tuning"
      chapters:
        - chapters/recipes/fine_tune.qmd
        - chapters/finetune-methods/finetune-methods.qmd
        - chapters/finetune-regression/finetune-regression.qmd
        - chapters/media-tower-lora/media-tower-lora.qmd
        - chapters/precision/finetune-acceleration.qmd
        - chapters/distributed-training/distributed-training.qmd
    - part: "Graphs and prediction"
      chapters:
        - chapters/recipes/graph_and_lineage.qmd
        - chapters/recipes/context_predictor.qmd
    - part: "Data that changes"
      chapters:
        - chapters/recipes/mutable_tables.qmd
        - chapters/feature-store/feature-store.qmd
        - chapters/recipes/trigger_streams.qmd
        - chapters/cdc/cdc.qmd
        - chapters/point-in-time/point-in-time.qmd
        - chapters/recompute/recompute.qmd
        - chapters/incremental-refresh/incremental-refresh.qmd
        - chapters/recipes/session_lifecycle.qmd
    - part: "Where data lives"
      chapters:
        - chapters/recipes/cloud_storage.qmd
        - chapters/federation/federation.qmd
    - part: "Running Jammi"
      chapters:
        - chapters/unified-client/unified-client.qmd
        - chapters/recipes/remote_session.qmd
        - chapters/recipes/flight_sql.qmd
        - chapters/recipes/compound_query.qmd
        - chapters/surfaces/surfaces.qmd
        - chapters/recipes/jobs.qmd
        - chapters/tenancy/tenancy.qmd
        - chapters/tenancy-per-verb/tenancy-per-verb.qmd
        - chapters/production/production.qmd
        - chapters/production/operations.qmd
    - part: "Case study: graph machine learning on ogbn-arxiv"
      chapters:
        - chapters/construct/construct.qmd
        - chapters/analyze/analyze.qmd
        - chapters/learn/learn.qmd
        - chapters/predict/predict.qmd
        - chapters/conformal/conformal.qmd
        - chapters/rails/rails.qmd
        - chapters/closed-loop/closed-loop.qmd
        - chapters/bridge/bridge.qmd
  appendices:
    - chapters/api-reference.qmd

bibliography: jammi_cookbook/references.bib

format:
  html:
    theme: cosmo
    # Each chapter's Open-in-Colab badge (generated by scripts/build_notebooks.py).
    include-after-body: _colab.html
    code-copy: true
    code-overflow: wrap
    toc: true

# Every chapter executes on every render — no freeze. Each runs its capability live
# and checks the measurement against its frozen golden; a result frozen by an earlier
# render would mask a moved one. The determinism contract (jammi_cookbook.determinism,
# applied on import) keeps fresh execution reproducible. CI's `assemble` profile
# (_quarto-assemble.yml) records each execution only to assemble the book from the
# same run's renders.
execute:
  freeze: false
  error: false

jupyter: python3
