name: attest-image
description: >
  Attests a pushed image digest and verifies what was published: a
  Sigstore-signed build-provenance bundle is pushed to the registry beside the
  image, the image's own index is asserted to carry a non-empty SBOM and
  provenance manifest for every platform it holds, and the bundle is verified
  back from the registry. Shared by every push and every merge of a published
  image. Needs `id-token: write`, `attestations: write` and a GHCR login.

inputs:
  image:
    description: "The image, e.g. ghcr.io/f-inverse/jammi-ai-server."
    required: true
  digest:
    description: "The pushed digest (`sha256:…`), never a mutable tag."
    required: true

runs:
  using: composite
  steps:
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true

    - shell: bash
      env:
        REF: ${{ inputs.image }}@${{ inputs.digest }}
      run: bash ci/scripts/assert_image_attestations.sh

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ inputs.image }}@${{ inputs.digest }}
        OWNER: ${{ github.repository_owner }}
      run: gh attestation verify "oci://$REF" --owner "$OWNER" --bundle-from-oci
