[package]
name = "jammi-datafusion"
description = "Jammi's DataFusion extension: ExecutionPlan nodes and a PhysicalOptimizerRule that run a model over a relation as a physical stage — numbered, chunked by a token budget, device-admitted, streamed — over one model-runtime trait pair, and the model vocabulary every stage shares."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["datafusion", "inference", "model", "execution-plan", "arrow"]
categories = ["science"]

[dependencies]
jammi-numerics.workspace = true

datafusion.workspace = true
arrow.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true

[dev-dependencies]
# This crate's own test targets run with `test-hooks` on (the runner's
# forward-call oracle); a self dev-dependency is how a package turns a
# feature on for its tests without a `--features` flag on every `cargo test`
# invocation. Consumers never see the feature.
jammi-datafusion = { path = ".", features = ["test-hooks"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[features]
# Test-only oracles inside the runner: a per-source count of forward calls
# and their peak concurrency, so a test can prove a refusal happened before
# the model was ever invoked and that the device's admission bounds the
# forwards in flight. Off for every consumer.
test-hooks = []
