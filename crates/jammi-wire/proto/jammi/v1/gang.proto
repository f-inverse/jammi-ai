syntax = "proto3";

package jammi.v1.gang;

// GangService — the coordinator-to-member admission wire for a multi-host
// gang run. One rpc, `RunRank`, bidi: a member opens the stream and sends
// exactly one `Assign` naming its job coordinates (never training-set
// identity, which lives on the `jobs` row and is resolved host-side, never
// carried on the wire); the handler admits or refuses it, and an admitted
// session is HELD under re-verification until it ends `Aborted{reason}`.
//
// No `FetchPartition`: a rank reads its partition from the shared object
// store using the row's own recorded training-set identity — peer-local,
// never a wire fetch of bytes every member can already read.
//
// The ROUND PROTOCOL between admitted ranks rides the same stream, after
// `Admitted`, as the `round_*` arms of both frames (see "The round protocol"
// below): a member's contribution flows member → coordinator on `RankEvent`,
// the coordinator's rank-ordered fold flows coordinator → member on
// `RankControl`, and a round applies on a rank only after `RoundCommit`,
// which the coordinator sends only after every member's `RoundAck`.
//
// Served ONLY on the internal `[server] peer_bind` listener, beside
// `PeerService` — never on the public gRPC + Flight SQL listener (which
// answers UNIMPLEMENTED for these paths), never wrapped by the tenant-binding
// layer. Invariant I-GANG: a caller-supplied tenant is never read; the
// member derives the tenant from the verified `jobs` row and resolves a
// multi-host job's training set under that tenant alone.
//
// Message shape and arity are frozen by review, not by the api-freeze
// guard: that guard decodes only the `PACKAGE`/`(Service, Method)` tokens.
// A later change MAY add fields or oneof variants but MUST NOT rename or
// remove anything declared here.
service GangService {
  rpc RunRank(stream RankControl) returns (stream RankEvent);
}

// A control frame a rank sends on its `RunRank` stream.
message RankControl {
  oneof control {
    Assign assign = 1;
    Cancel cancel = 2;
    // The round protocol, coordinator → member (all after `Admitted`).
    // The coordinator's rank-ordered fold of round `round`, followed by
    // `chunk_count` `round_chunk` frames carrying its Arrow IPC bytes.
    RoundPayload round_result = 3;
    RoundChunk round_chunk = 4;
    // The coordinator observed every member's `RoundAck` for this round:
    // apply it. A member that never receives this for a round it ACKed
    // applies nothing for that round.
    RoundCommit round_commit = 5;
    // The round is abandoned on every rank; `detail` is the gang's fault.
    RoundFault round_fault = 6;
  }
}

// The job coordinates only. No training-set identity (resolved by the
// handler from the `jobs` row) and no lease duration (the rank derives its
// own admission window from the same row). A second `Assign` on an
// already-admitted stream is a protocol violation.
message Assign {
  string job_id = 1;
  int64 attempt = 2;
  uint32 rank = 3;
  uint32 world = 4;
  string coordinator_instance_id = 5;
}

// End this rank's own session cooperatively.
message Cancel {}

// An event frame on a `RunRank` stream.
message RankEvent {
  oneof event {
    Admitted admitted = 1;
    Aborted aborted = 2;
    Outcome outcome = 3;
    // The round protocol, member → coordinator (all after `Admitted`).
    // This member's contribution to round `round`, followed by
    // `chunk_count` `round_chunk` frames carrying its Arrow IPC bytes.
    RoundPayload round_contribution = 4;
    RoundChunk round_chunk = 5;
    // This member holds the coordinator's result for `round`, decoded and
    // UNAPPLIED, and will apply it on `RoundCommit`.
    RoundAck round_ack = 6;
    // This member abandons the round; `detail` is why.
    RoundFault round_fault = 7;
  }
}

// The rank was admitted: held under re-verification until it ends `Aborted`.
message Admitted {}

// Why a session ended without ever handing control to a rank body. Additive:
// a later reason joins this set; none already declared is ever renamed or
// removed.
enum AbortReason {
  ABORT_REASON_UNSPECIFIED = 0;
  // This host is draining — the only host-initiated cut.
  ABORT_REASON_DRAIN = 1;
  // A row fact refuted admission (status, claimant, attempt, lease, or the
  // training-set identity no longer holds) — assembly-scoped.
  ABORT_REASON_REFUTED = 2;
  // The rank itself sent `Cancel`.
  ABORT_REASON_CANCELLED = 3;
  // The admitted session reached its park bound with no body to run.
  ABORT_REASON_NO_BODY = 4;
  // This host's own object store faulted at re-verification — member-scoped,
  // never counted against the assembly's attempt budget.
  ABORT_REASON_STORE_UNAVAILABLE = 5;
  // The catalog did not answer within tolerance — transient, assembly-scoped,
  // never counted against the assembly's attempt budget.
  ABORT_REASON_UNAVAILABLE = 6;
}

message Aborted {
  AbortReason reason = 1;
}

// The terminal outcome of a rank body's natural end. Frozen here (additive,
// costs nothing at the freeze gate — `api_freeze.rs` decodes only
// `PACKAGE`/`RPC` tokens) though this rpc's own admission stage ships neither
// this variant's producer (a rank body) nor its consumer (the coordinator's
// terminal write on receipt).
message Outcome {
  oneof result {
    TrainedOutcome trained = 1;
    FailedOutcome failed = 2;
  }
}

message TrainedOutcome {
  string artifact_digest = 1;
}

message FailedOutcome {
  string reason = 1;
}

// ── The round protocol ──────────────────────────────────────────────────────
//
// One collective on a gang of `world` ranks is one ROUND, numbered from 0 on
// every rank. Rank 0 is the coordinator (in-process on the host that claimed
// the job; W=1 never crosses the wire); every other rank is a member on the
// far end of one admitted `RunRank` stream. A round on a member:
//
//   1. send `round_contribution` (this rank's `RoundDescriptor` + the
//      contribution's Arrow IPC bytes as `chunk_count` `round_chunk`s);
//   2. wait for `round_result` + its chunks — the coordinator's fold, in
//      RANK ORDER, over every rank's contribution, published ONLY once every
//      rank's descriptor for the round is equal to rank 0's;
//   3. decode it, HOLD it unapplied, send `round_ack`;
//   4. wait for `round_commit`, then apply.
//
// The coordinator sends `round_commit` only after it has observed every
// member's `round_ack` (its own contribution is the W-th); a fault before
// that — a disconnect, a `round_fault` from any rank, the gang deadline —
// leaves NO rank applied for the round, and every rank's typed error names
// it. A fault DURING the commit fan-out is fatal on every rank too: the
// coordinator applies nothing, faults every member, and refuses every later
// round; a member whose stream ends between its ACK and the commit applies
// nothing; a member the commit did reach applied the round, and its next
// contribution is refused by the faulted coordinator — so no rank ever
// continues past a round every rank did not apply.
//
// Every numeric field here is range-checked by its reader before use (K2):
// `world`, `root < world`, every `counts` value and every `dims` entry as a
// `usize` with an overflow-checked element product, `chunk_count`, `index <
// chunk_count`, and the reassembled byte length against the bound the
// descriptor implies. An unknown `RoundVerb` or `DType` value (including the
// zero `UNSPECIFIED`) is a typed refusal naming both sides, never a default.

// The collective a round computes. CLOSED: a reader matches every value
// exhaustively, and `ROUND_VERB_UNSPECIFIED` (or any value it does not
// know) is refused, never treated as any verb.
enum RoundVerb {
  ROUND_VERB_UNSPECIFIED = 0;
  ROUND_VERB_ALL_GATHER = 1;
  ROUND_VERB_ALL_REDUCE_SUM = 2;
  ROUND_VERB_ALL_REDUCE_MAX_FLAGS = 3;
  ROUND_VERB_BROADCAST = 4;
  ROUND_VERB_BARRIER = 5;
}

// The element type of one tensor a round carries. The `Peer` collective
// carries exactly these three; every other element type is refused at the
// seam before a descriptor is ever built.
enum ElementType {
  ELEMENT_TYPE_UNSPECIFIED = 0;
  ELEMENT_TYPE_F32 = 1;
  ELEMENT_TYPE_F16 = 2;
  ELEMENT_TYPE_BF16 = 3;
}

// `all_gather`'s per-rank row counts, wrapped so `RoundDescriptor.counts`
// distinguishes "this verb carries no counts" (absent) from "every rank
// contributes zero rows" (present, all zero).
message Counts {
  repeated uint64 values = 1;
}

// One tensor's shape and element type as far as a round's descriptor cares:
// the full shape for `all_reduce_sum` and `broadcast`; the TRAILING shape
// (dim 0 dropped) for `all_gather`, whose dim 0 is already `counts`.
message TensorSignature {
  repeated uint64 dims = 1;
  ElementType dtype = 2;
}

// One rank's declaration of what a round computes: the verb, and every
// per-call argument other than the tensor bytes that determines the round's
// result. The coordinator publishes a round ONLY once every rank's
// descriptor equals its own; a disagreement is a typed refusal on EVERY
// rank naming both descriptors, symmetric with the in-process collective.
message RoundDescriptor {
  // The round this rank is entering, counted from 0 on every rank. Agreed
  // like every other field: a contribution from a stale round is a typed
  // disagreement naming both descriptors, never folded.
  uint64 round = 7;
  RoundVerb verb = 1;
  uint32 world = 2;
  // `broadcast`'s root; absent for every other verb.
  optional uint32 root = 3;
  // `all_gather`'s full counts vector; absent for every other verb.
  Counts counts = 4;
  repeated TensorSignature tensors = 5;
  // An opaque digest the caller binds on every rank (a trainer binds its
  // canonical trainable-variable key order); absent when nothing is bound.
  // Compared like every other field: a rank bound to a different value, or
  // to none, disagrees.
  optional string agreement = 6;
}

// A contribution (member → coordinator) or a result (coordinator →
// member) for round `round`: the descriptor it was computed under, how many
// `RoundChunk` frames follow, and — for `all_reduce_max_flags` only, which
// carries no tensor — the control word. Every tensor's bytes travel in the
// chunks, each at most the listener's `[server.limits] max_message_bytes`.
message RoundPayload {
  uint64 round = 1;
  RoundDescriptor descriptor = 2;
  uint32 chunk_count = 3;
  uint32 flags = 4;
}

// One slice of a payload's Arrow IPC bytes: chunk `index` of the
// `chunk_count` its `RoundPayload` announced, in order.
message RoundChunk {
  uint64 round = 1;
  uint32 index = 2;
  bytes ipc = 3;
}

// A member holds round `round`'s result, decoded and unapplied.
message RoundAck {
  uint64 round = 1;
}

// Every member ACKed round `round`: apply it.
message RoundCommit {
  uint64 round = 1;
}

// Round `round` is abandoned on every rank; `detail` is the gang's fault,
// quoted by every later refusal on the rank that receives it.
message RoundFault {
  uint64 round = 1;
  string detail = 2;
}
