# CI-only override for the `compose-smoke` workflow (`.github/workflows/
# compose-smoke.yml`): bind-mounts the bundled tiny fixtures the smoke's
# remote script (`tests/compose/shape_b_remote.py`) reads, and pins
# `jammi-server` to the image the workflow already built + `docker load`ed
# via `JAMMI_IMAGE` — never a fresh build, never a registry pull. No
# `build:` block here: the composite build step is the sole producer of the
# image this override runs.
#
# Usage: `docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up --wait`.

services:
  jammi-server:
    pull_policy: never
    volumes:
      - ../cookbook/fixtures/tiny_bert:/fixtures/tiny_bert:ro
      - ../tests/fixtures/patents.parquet:/fixtures/patents.parquet:ro
