name: Image (CI base, CUDA)

# Builds the CUDA CI base image (jammi-ai-ci-cuda = the CPU base + CUDA toolkit)
# that the GPU build/prove lanes run inside. Thin caller of the shared
# _ci-base-image reusable. Rebuilds when its own Dockerfile, ITS BASE
# (ci.Dockerfile — ci-cuda is `FROM jammi-ai-ci`), or the toolchain changes;
# watching the base closes the gap where a CPU-base change left the CUDA base
# stale.

on:
  push:
    branches: [main]
    paths:
      - ".docker/ci.Dockerfile"
      - ".docker/ci-cuda.Dockerfile"
      - "rust-toolchain.toml"
  workflow_dispatch:

# Serialize per ref, never cancel: an image push in flight must finish,
# matching the other release/publish lanes.
concurrency:
  group: image-cuda-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; the calling job widens to
# `packages: write` so the reusable can push to GHCR (a called workflow can
# hold at most what its caller grants).
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_ci-base-image.yml
    with:
      image_suffix: ci-cuda
      dockerfile: .docker/ci-cuda.Dockerfile
