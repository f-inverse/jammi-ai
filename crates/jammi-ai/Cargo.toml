[package]
name = "jammi-ai"
description = "Embeddable AI engine for inference, embeddings, vector search, and fine-tuning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
jammi-db.workspace = true
jammi-numerics.workspace = true
# `jammi-lora` is pulled for its candle-free config vocabulary (the `BackboneDtype`
# / `LoraInitMode` fields of `FineTuneConfig`, on the wire surface) at all times
# — the workspace pins it `default-features = false`. Its candle stack is opt-in:
# the `local` feature turns `jammi-lora/candle` back on for the embedded fine-tune
# engine.
jammi-lora.workspace = true

# The candle-free wire substrate: the generated `jammi.v1` stubs, the
# proto↔domain conversions, and the moved request / eval / fine-tune vocabulary.
# The engine re-exports that vocabulary at its original paths and builds its
# residual engine-spec converters (`jammi_ai::wire`) on top of jammi-wire's
# `proto` + helpers. Pulled at all times (it is candle-free).
jammi-wire.workspace = true

# ── The embedded ML engine. Every dep below pulls a heavy ML / decode stack and
# is needed only by the in-process engine (the `model` / `inference` / `session`
# / engine-`fine_tune` / `eval::runner` modules). They are gated behind the
# default-on `local` feature so a thin build pulls none of them and stays a thin
# wire-speaker. A default / embedded / PyO3 build keeps them all.
jammi-encoders = { workspace = true, optional = true }
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
# The fused, in-place multi-tensor AdamW step (`crates/jammi-kernels/src/ops/adamw_step.rs`)
# that `fine_tune::adamw::AdamW::step` dispatches to behind `jammi_kernels::admission::admit` —
# same leaf crate `jammi-encoders`/`jammi-lora` already depend on for their own fused ops.
# Optional/`local`-gated for the same reason `candle-core` is: it is only reachable through
# the embedded engine's candle-backed fine-tune path.
jammi-kernels = { workspace = true, optional = true }
# `half::{f16,bf16}` is the element type the collective's `Peer` arm
# (`fine_tune::collective::peer`) reads out of a candle tensor and writes
# into an Arrow IPC column (and the `NcclType` the CUDA arm dispatches its
# kernels by) — the same crate candle-core and arrow both depend on (one
# version in the lock, so the two agree on the type), but neither
# re-exports it. Rides `local` like the rest of the embedded engine.
half = { workspace = true, optional = true }
# `ReceiverStream` — the `Peer` collective's outbound frames are an mpsc the
# tonic client / server stream is built over (`fine_tune::collective::peer`).
tokio-stream = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
# `HubSource`'s cache-root fallback (`model/hub.rs`): when neither
# `[models] hub_cache_dir` nor `HF_HOME` is set, the platform home directory
# stands in for hf-hub's own `Cache::default()` — but resolved through
# `directories::BaseDirs` (a typed refusal when no home dir is found) rather
# than `Cache::default()`'s own `dirs::home_dir().expect(..)`, which panics
# in that situation. `jammi-db` already carries this dependency (its own
# `ProjectDirs`-based config-path resolution) at the same pinned version, so
# this is zero new transitive deps. Only the embedded engine resolves a Hub
# cache root, so it rides `local` like `dep:hf-hub`.
directories = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
# Lexical (BM25) retrieval sidecar — the tantivy inverted index, peer of the
# USearch ANN sidecar. Embedded-engine-only, so it rides `local`.
tantivy = { workspace = true, optional = true }
# Image processing
image = { workspace = true, optional = true }
# Audio decode/demux for the audio-embedding path (bytes-in: WAV/FLAC/MP3/Ogg)
symphonia = { workspace = true, optional = true }
# Gzip decompression for OpenCLIP BPE vocab (bpe_simple_vocab_16e6.txt.gz)
flate2 = { workspace = true, optional = true }
# The media front end's per-item decode/preprocess parallelization: candle's private thread pool is
# never installed, so rayon's GLOBAL pool is the one pool the process runs media-batch work on.
# Hoisted to `[workspace.dependencies]` (rather than a per-crate literal version) so
# every consumer resolves the same rayon version by construction. Only
# the embedded engine's audio/image front ends and their trainer call sites
# use it, so it rides `local` like `image` / `symphonia`.
rayon = { workspace = true, optional = true }
# HTTP backend
reqwest = { workspace = true, optional = true }
# `#[async_trait]` for the `annotate` table function's `TableProvider` impl
# (the in-process compound-query surface); only the `local` engine builds it.
async-trait = { workspace = true, optional = true }
# The embedded fine-tune engine trains into a worker-private tempdir before
# publishing the final artifact to the object store; only the `local` engine
# builds that path.
tempfile = { version = "3", optional = true }
# `Bytes` for handing trained-artifact files to the artifact store's staging
# API; only the `local` engine's fine-tune worker uses it.
bytes = { version = "1", optional = true }
# The model-content digest: a streaming SHA-256 over the local
# model directory's config / `1_Pooling/config.json` / tokenizer / weights
# bytes, computed once per model load in `model::backend::candle` and folded
# into `ModelIdentity.content_digest`. `jammi-db` and `jammi-bench` already
# depend on the identical pair for their own checkpoint-identity hashing
# (`crates/jammi-bench/src/finetune_step.rs::sha256_and_len`); `jammi-bench`
# depends on `jammi-ai` (not the reverse), so that implementation cannot be
# imported here — this crate carries its own copy of the same streaming
# pattern rather than a bespoke one. Only the embedded engine loads local
# model directories, so this rides `local` like the other model-loading deps.
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

datafusion.workspace = true
arrow.workspace = true
arrow-schema.workspace = true
arrow-array.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true

# The residual engine-spec converters (`jammi_ai::wire`, under `local`) encode /
# decode the engine `TrainingSpec` / predictor / edge-gather shapes against
# jammi-wire's `proto` and return a `tonic::Status` on a malformed wire body, so
# `tonic` rides the `local` feature as a runtime dep. `prost` rides it too: the
# embedded binding hands the converters a serialized request body to decode
# (the same proto the remote client sends), so `wire` owns the `prost`-decode
# step rather than leaking the proto type and a second decode call site into the
# PyO3 crate. The Flight SQL / IPC transport stack still lives in jammi-wire.
tonic = { workspace = true, optional = true }
prost = { workspace = true, optional = true }

# Vendor-neutral OTLP trace export, behind `telemetry-otlp`. `jammi_ai::telemetry`
# is the one place this crate names any of the five: the factory
# (`telemetry::otlp_layer`) builds the exporter + tracer provider from
# `jammi_db::config::ObservabilityConfig`, and the same module's
# `set_parent_from_headers` continues an incoming W3C `traceparent` — both
# consumed by `jammi-server`'s `telemetry::install` / `TraceContextLayer` and
# by `jammi-python`'s `open_local` subscriber (the factory lives in the
# library, not duplicated per consumer). `tracing-subscriber` rides this
# feature (rather than being an unconditional dependency) because the
# `Layer<S>` bound `telemetry::otlp_layer` returns only has a reason to exist
# under this feature; it is otherwise dev-dependency-only (this crate's own
# GPU-capability test harness).
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
jammi-test-resources = { workspace = true, features = ["candle"] }
# A recording `ObjectStore` wrapper for the rank read-path oracle: proves
# `verify_partition_leaves` issues one BOUNDED ranged read per leaf and
# never an unbounded (whole-object) read.
object_store.workspace = true
# This crate's own test targets run with `test-hooks` on (the rendezvous
# inside `jammi_ai::jobs::execute_compute`); a self dev-dependency is how a
# package turns a feature on for its tests without a `--features` flag on
# every `cargo test` invocation. Consumers never see the feature.
jammi-ai = { path = ".", features = ["test-hooks"] }
tempfile = "3"
tokio.workspace = true
parquet.workspace = true
wiremock = "0.6"
serial_test = "3"
jammi-test-utils.workspace = true
# SIGKILL of a spawned worker process in the distributed-validation harness
# (the kill-9 reclaim / artifact-crash-window properties). Test-only.
libc.workspace = true
# Standard-normal quantiles for generating calibrated/ensemble fixtures in the
# calibration-eval unit tests. Test-only — the engine routes all
# production calibration math through `jammi-numerics`, never `statrs` directly.
statrs.workspace = true
# Synthetic exchangeable data generators for the conformal coverage tests.
rand.workspace = true
rand_distr.workspace = true
# The gated GPU-capability suite captures the fine-tune trainer's per-epoch
# `avg_train_loss` off its `tracing` events (a `Layer` over the in-process
# worker) to prove on-device learning — the loss-decrease property. Test-only.
tracing-subscriber.workspace = true
# The `telemetry-otlp` test's stub OTLP collector: a real (in-process,
# loopback) tonic server implementing `opentelemetry.proto.collector.trace.v1
# .TraceService`, generated from the SAME `opentelemetry-proto` version
# `opentelemetry-otlp` depends on (kept in lockstep so the wire shape the
# exporter sends and the shape this stub decodes never drift independently).
# `gen-tonic` for the generated server trait + tonic-prost codec; `trace` for
# the trace-service message types. Test-only.
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic", "trace"] }
# The source-scanning tests (`tests/it/fine_tune_session_binding.rs`,
# `tests/it/test_bounds_inventory.rs`, `tests/it/rank_admission.rs`): a
# hand-rolled char scanner cannot tell a raw string's `r#"..."#` delimiter
# from a plain string's `"`, and a line-based literal scan cannot see a call
# embedded in a `tokio::select!`/`assert!` arm. They instead parse with the
# SAME lexer `rustc` itself is built on (`proc-macro2`'s fallback,
# non-proc-macro tokenizer) and walk the syntax tree with `syn`. Pinned to
# the exact versions already resolved transitively in `Cargo.lock`
# (`cargo tree -p proc-macro2 -p syn`), so this dev-only edge moves nothing
# in the lock and `cargo deny`'s advisory scan sees no new dependency.
# Test-only: no production code parses Rust source.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }

[features]
default = ["local"]
# The embedded in-process engine: model loading + inference + fine-tune training
# + embedding/search pipelines, and the candle / hf-hub / symphonia / tokenizers
# / image stack they run on. Default-on, so a plain / embedded / PyO3 build is
# byte-unchanged. It also gates the residual engine-spec converters
# (`jammi_ai::wire`, which return a `tonic::Status` on a malformed wire body), so
# `dep:tonic` rides here. The candle-free wire substrate and the client crates
# live outside this crate, so a consumer that wants a thin client depends on
# `jammi-wire` / `jammi-admin` / `jammi-client`, not a feature-stripped `jammi-ai`.
local = [
    "dep:jammi-encoders",
    "dep:candle-core",
    "dep:candle-nn",
    "dep:jammi-kernels",
    "dep:hf-hub",
    "dep:directories",
    "dep:tokenizers",
    "dep:tantivy",
    "dep:image",
    "dep:symphonia",
    "dep:flate2",
    "dep:rayon",
    "dep:reqwest",
    "dep:async-trait",
    "dep:tempfile",
    "dep:bytes",
    "dep:tonic",
    "dep:prost",
    "dep:sha2",
    "dep:hex",
    "dep:half",
    "dep:tokio-stream",
    "jammi-lora/candle",
]
live-hub-tests = []
# Vendor-neutral OTLP trace export: `jammi_ai::telemetry::otlp_layer`
# and the incoming-`traceparent` continuation helper. Off by default (so a
# thin/bench/CLI consumer of this crate pulls no OTel stack); `jammi-server`
# and `jammi-python` each enable it explicitly in their own `Cargo.toml`
# (`jammi-ai = { workspace = true, features = ["telemetry-otlp"] }`),
# matching the `local`/`cuda` by-name-passthrough precedent below rather
# than folding it into `default`. Implies `dep:tonic` (the OTLP exporter's
# gRPC transport, and the metadata type `otlp_headers` resolves into) even
# though this crate's own `local` feature already carries `tonic` for the
# unrelated wire-decode seam — the two features are independent knobs and
# each must be self-sufficient.
telemetry-otlp = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "dep:http",
    "dep:tonic",
]
# Test-only rendezvous hooks inside `jammi_ai::jobs::execute_compute` /
# `InferenceSession::run_now` (`jammi_ai::jobs::compute_test_hooks`): a test
# parks a compute job at a documented checkpoint and manufactures a cancel
# request or a peer's write there. Forwards to the `jammi-db` crate's own
# `test-hooks` peer (`LeaseKeeper::kill_thread_for_test`
# is the only way to observe a genuine lease-renewal miss on the SAME hold
# without a second worker's claim/reclaim ever touching the row, which a
# claimed-job cancel-vs-lease-loss test needs and no in-crate seam can
# reach) — a private-dependency feature union that compiles away entirely
# when this feature is off. On for this crate's own tests via the self
# dev-dependency above; off for every consumer.
test-hooks = ["jammi-db/test-hooks"]
# A gated, multi-process distributed-validation lane: spawns N `jammi-server`
# worker processes against a shared Postgres catalog + shared object store
# (MinIO) and asserts the durable-worker fleet-safety properties (exactly-one
# claim, kill-9 reclaim, the artifact crash-window on real object storage,
# cross-tenant isolation) under real distribution. Off by default — the harness
# needs `JAMMI_TEST_PG_URL` + a MinIO S3 endpoint and is not part of the hermetic
# `cargo test` lane. The `it` engine suite is still required for the shared
# session/fixture machinery, so this feature implies `local`; it also implies
# `jammi-db/storage-s3` because the harness session reads the worker-published
# adapter back from the shared MinIO bucket (the cross-host artifact round-trip),
# which needs the S3 object-store driver compiled into the test binary.
live-distributed-tests = ["local", "jammi-db/storage-s3"]
# Compiles the GPU capability suite (`tests/gpu_capability`) and the library's
# CUDA tests: CPU↔GPU parity for every verb with a GPU kernel, fine-tune and
# graph fine-tune learning on the device, bf16 admission, GGUF serving and
# QLoRA. Needs CUDA device 0; every GPU session pins `require_gpu = true`.
live-gpu-tests = ["local", "cuda"]
# The two-rank NCCL gang tests: two CUDA devices on one host.
live-gpu-gang-tests = ["live-gpu-tests"]
# The two-host NCCL gang test: one rank per host, reading the rank, world,
# NCCL-id-file and artifact-dir env `ci/scripts/runpod_gpu_cluster.sh` sets on each.
live-gpu-cluster-tests = ["live-gpu-tests"]
# CUDA / Metal acceleration of the embedded engine — only meaningful with `local`.
# `jammi-encoders/cuda` forwards to the encoders' fused kernels;
# `jammi-lora/cuda` (the fused LoRA epilogue) forwards the same way, through `jammi-lora`'s own
# `cuda = ["jammi-kernels/cuda"]` feature — `jammi-lora` and `jammi-encoders`
# both depend on the same leaf `jammi-kernels` crate, not on each other, so
# each needs its own forwarding entry in this list. `jammi-kernels/cuda`
# itself is a direct entry too: `fine_tune::adamw::AdamW::step` depends
# on `jammi-kernels` directly (the fused multi-tensor AdamW step), not only
# transitively through `jammi-encoders`/`jammi-lora`.
# `candle-core/nccl` is the collective's CUDA arm
# (`fine_tune::collective::nccl`), and it belongs to `cuda` rather than to a
# feature of its own: TOPOLOGY IS CONFIGURATION -- `[worker] collective`
# selects the arm at runtime, and a build in which `Nccl` could not be
# selected would make the same binary answer differently for the same
# configuration. `candle-core`'s `nccl` is a pure pass-through to
# `cudarc/nccl` (it gates nothing in candle itself) and `nccl` implies
# `cuda`, so a build without `cuda` resolves the identical dependency graph
# it resolved before: `cudarc` is optional, is not compiled, and nothing
# links. On a CUDA build cudarc's `dynamic-linking` emits
# `-lnccl` at LINK time, so the toolchain that builds this feature needs
# `libnccl` present -- not only the runtime host.
cuda = [
    "local",
    "candle-core/cuda",
    "candle-core/nccl",
    "candle-nn/cuda",
    "jammi-encoders/cuda",
    "jammi-lora/cuda",
    "jammi-kernels/cuda",
]
metal = ["local", "candle-core/metal", "candle-nn/metal"]
# Forwards to `jammi-encoders`'s and `jammi-kernels`'s own `flash-attn`
# features — one link of the declared 1:1 chain
# `jammi-server`/`jammi-bench` -> `jammi-ai` -> `{jammi-encoders,jammi-kernels}`
# -> `jammi-kernels/flash-attn` that `ci/scripts/check_flash_attn_closure.py`
# walks and asserts. DEPENDS on `cuda` (both forwarded features themselves
# depend on `cuda`) but is NEVER implied by it: `cuda` alone must never reach
# `jammi-kernels/flash-attn` — that is the closure gate's core invariant.
# `jammi-kernels/flash-attn` is listed explicitly (not left to the transitive
# `jammi-encoders/flash-attn` edge alone) because `fine_tune::adamw::AdamW`
# and the direct `jammi-kernels` dependency this crate already carries under
# `local` may reach flash types without going through `jammi-encoders` at
# all — the same "explicit direct entry, not only transitive" precedent the
# `cuda` feature above already documents for `jammi-kernels/cuda`.
flash-attn = ["cuda", "jammi-encoders/flash-attn", "jammi-kernels/flash-attn"]

# Compiles the tests that need file permissions to apply to the test process: a
# non-root user on a filesystem that enforces mode bits.
unprivileged-tests = []
# Compiles the tests that need a Metal device.
live-metal-tests = ["metal"]

# The `it` integration suite drives the embedded engine end-to-end (model loading,
# inference, fine-tune, search), so it requires the `local` feature. Declaring the
# requirement here lets `--all-targets` leave it out of a non-`local` build
# rather than fail to compile an engine test with no engine.
[[test]]
name = "it"
path = "tests/it/main.rs"
required-features = ["local"]

# The multi-process distributed-validation harness. Its own target (not part of
# the hermetic `it` suite) so it compiles and runs only under
# `live-distributed-tests`, and so the gated CI lane can target it by name with
# `--test distributed`. Spawns `jammi-server` worker processes against a shared
# Postgres + MinIO; never compiled or run on the default `cargo test` lane.
[[test]]
name = "distributed"
path = "tests/distributed/main.rs"
required-features = ["live-distributed-tests"]

# The GPU-capability suite. Its own target (not part of the hermetic `it` suite)
# so it compiles only under `live-gpu-tests` (which enables `cuda`) and needs
# CUDA device 0: acquiring the device panics naming what is missing, never a
# silent pass. The gang and two-host tests inside it additionally need
# `live-gpu-gang-tests` / `live-gpu-cluster-tests`.
[[test]]
name = "gpu_capability"
path = "tests/gpu_capability/main.rs"
required-features = ["live-gpu-tests"]

# The Metal arm of the GGUF/k-quant + QLoRA GPU capability suite: a standalone
# binary because the `gpu_capability` harness selects CUDA devices.
[[test]]
name = "metal_quantized_gpu"
path = "tests/metal_quantized_gpu.rs"
required-features = ["live-metal-tests"]
