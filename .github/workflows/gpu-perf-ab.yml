name: GPU perf A/B (RunPod)

# The `encode` ladder's revision edge on a real NVIDIA A100 (sm_80) via an
# ephemeral RunPod pod: `ci/scripts/perf/gpu_inference_ab.sh` builds this
# checkout's merge-base with main twice (`base`, and `rebuilt` as the edge's
# own A/A null) and this checkout once (`revised`), runs `jammi-bench
# encode-step --cuda 0` on each in a balanced order, and `jammi-bench ladder
# encode --revision direct` judges the revised cost against the wider of the
# rung's repeat noise band and the A/A band. A cost outside the band in the
# slow direction is RED; in the fast direction RED_FOR_INVESTIGATION —
# investigated, never assumed favourable.
#
# Off the merge path: a label-triggered PR run and a dispatch upload the
# verdict as an artifact for a human to read; neither is a required check.
# `aa_null: true` builds the parent a third time in place of this checkout,
# so every side is one revision and the reading is the instrument's own null.

on:
  workflow_dispatch:
    inputs:
      aa_null:
        description: "Every side the parent sha: the instrument's own null. 'true' or 'false' (default false: this checkout against its merge-base)."
        required: false
        type: string
        default: "false"
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  gpu-perf-ab:
    name: encode revision edge on RunPod A100 (sm_80)
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu-perf-ab'
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-perf-ab-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Run the encode revision edge on a real A100
        id: perfab
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          GPU_PERF_AB_AA_NULL: ${{ github.event.inputs.aa_null == 'true' && '1' || '0' }}
        run: |
          set +e
          bash ci/scripts/runpod_gpu_perf_ab.sh
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Annotate a capacity failure
        if: always() && steps.perfab.outputs.rc == '75'
        run: echo "::warning::gpu-perf-ab found nothing to compare (no capacity, no idle GPU, no parent-side build, or HEAD is its own merge-base) — not a verdict. Re-run once the condition clears."

      - name: Annotate a non-GREEN verdict
        if: always() && steps.perfab.outputs.rc == '1'
        run: echo "::error::gpu-perf-ab's ladder verdict is not GREEN — RED (slower than the base by more than the rung's noise band), RED_FOR_INVESTIGATION (faster by more than the band — investigated, never assumed favourable), or INVALID (a refusal named in the verdict's causes). Read ladder_verdict.json in the uploaded artifact."

      - name: Annotate a usage/infra error
        if: always() && steps.perfab.outputs.rc == '2'
        run: echo "::error::gpu-perf-ab hit a usage/infra error (exit 2) — a clone, checkout or fetch failure, or an unresolved sha; see the run log."

      - name: Upload the ladder verdict and legs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-perf-ab-artifact-${{ github.run_id }}
          path: .gpu-pull/gpu-perf-ab/
          if-no-files-found: warn
          retention-days: 14
