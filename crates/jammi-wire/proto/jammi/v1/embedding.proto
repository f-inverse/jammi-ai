syntax = "proto3";

package jammi.v1.embedding;

import "jammi/v1/inference.proto";

// EmbeddingService — the wire surface for the engine's embedding compute
// verbs. These are imperative session methods, not SQL queries, so they live
// as typed gRPC RPCs alongside InferenceService / TriggerService rather than on
// the Flight SQL surface (which carries query/result only, per ADR-01 §3.2).
//
// The surface is modality-agnostic: one GenerateEmbeddings / EncodeQuery pair
// keyed by a `Modality` selects the text, image, or audio tower, rather than a
// verb per modality. Each verb delegates 1:1 to the consumer-facing
// `Session` abstraction, which dispatches the modality onto the
// engine's concrete tower method — the service reimplements no decode,
// feature-extraction, or forward logic; it is purely a wire adapter over the
// in-process engine. Jammi stays non-generative: these encode input → vector,
// never generate.
//
// Source registration and model introspection — the control-plane catalog
// surface this compute lane reads — live on CatalogService, not here. This
// service carries the data-plane compute verbs only.
//
// Tenant scope is read from the request's `SessionTenant` extension, set by
// the single async tenant-binding layer driven by the engine's
// `TenantResolver` (default: the `jammi-session-id` header → shared session
// store) — the one mechanism CatalogService / TriggerService / Flight SQL
// bind through.
service EmbeddingService {
  // Scan `columns` on a registered source, run the modality's tower over
  // every row (decode/feature-extraction as the modality requires → forward
  // pass), persist one L2-normalized vector per row keyed by `key_column`,
  // and return the result-table record. The `modality` selects which tower.
  // Peer of the abstraction's `generate_embeddings`.
  rpc GenerateEmbeddings(GenerateEmbeddingsRequest) returns (ResultTable);

  // Encode a single query into one L2-normalized embedding with the modality's
  // tower. The `modality` selects the tower; the `input` oneof must match it —
  // `text` for TEXT, `data` (raw encoded bytes) for IMAGE/AUDIO. Peer of the
  // abstraction's `encode_query`.
  rpc EncodeQuery(EncodeQueryRequest) returns (EncodeQueryResponse);

  // Register a set of PRECOMPUTED per-row vectors as a first-class ready
  // embedding table WITHOUT re-running any encoder. The producer already ran
  // the model elsewhere (a remote vector upsert, a migration off another store,
  // or an offline recompute-avoidance batch); this promotes those vectors into
  // a `(source, model)` embedding table the engine's `Search` can query, keyed
  // and indexed exactly like a `GenerateEmbeddings` output. Each incoming vector
  // is L2-normalized on import (every embedding table holds normalized vectors —
  // the cosine ANN sidecar assumes it); a zero-norm vector is rejected. The
  // `model_id` is recorded as the table's derivation provenance after being
  // parsed to its canonical form — it is validated as a well-formed encoder
  // reference, not loaded, so import needs no GPU. The resulting table is
  // recompute-inert: the engine did not compute it, so a `Recompute` of it is a
  // typed refusal, never a guessed re-run. Peer of the abstraction's
  // `import_embeddings`.
  rpc ImportEmbeddings(ImportEmbeddingsRequest) returns (ResultTable);

  // Nearest-neighbor search over a source's embedding table. The query is
  // either a precomputed vector (encode-then-search) or an existing row's key
  // (query-by-example; the engine resolves that row's stored vector
  // internally — the vector never crosses the wire). Peer of the
  // abstraction's flat `search`. This is the embedding-consumption verb on the
  // gRPC surface edge runtimes reach (gRPC-web); it adds no new consumption
  // model, only an additional transport for the existing capability.
  rpc Search(SearchRequest) returns (SearchResponse);
}

// Which embedding tower a GenerateEmbeddings / EncodeQuery call targets.
// Mirrors the abstraction's `Modality`; unifying the three per-modality verbs
// into one parameter is what lets the service carry one embedding verb pair.
enum Modality {
  MODALITY_UNSPECIFIED = 0;
  TEXT = 1;
  IMAGE = 2;
  AUDIO = 3;
}

message GenerateEmbeddingsRequest {
  // Registered source to scan.
  string source_id = 1;
  // Encoder model. `local:<path>`, an HF repo id, or a fine-tuned id.
  string model_id = 2;
  // Content columns to embed. The TEXT tower embeds the listed columns; the
  // IMAGE and AUDIO towers take exactly one content column.
  repeated string columns = 3;
  // Column whose value becomes each embedding row's key.
  string key_column = 4;
  // Which tower to run over the columns.
  Modality modality = 5;
  // Opt-in memoization. UNSPECIFIED maps to the engine default (`Bypass`).
  // Embedding anchors its source `UnpinnedAtInstant`, so a `Use` request is
  // honestly always a miss — the cache is off here until sources expose a
  // version surface.
  jammi.v1.inference.CachePolicy cache = 6;
}

// Which kind of derivation a `ResultTable` is — the wire mirror of the
// engine's `jammi_db::catalog::result_repo::ResultTableKind`. A `DescribeSource`
// projection carries a source's embedding tables AND its derived tables
// (neighbor graphs, as-of joins) under the same shape, so the kind is what
// tells a remote consumer which one it is looking at rather than fabricating
// `MODEL` for every row.
enum ResultTableKind {
  RESULT_TABLE_KIND_UNSPECIFIED = 0;
  MODEL = 1;
  NEIGHBOR_GRAPH = 2;
  ASOF_JOIN = 3;
}

// Subset of the engine's `ResultTableRecord` a client needs to locate and
// query the persisted embedding table. Internal bookkeeping columns
// (parquet/index paths, timestamps) stay server-side. The record is
// self-describing — it carries its own `task` — so it reconstructs without the
// caller supplying the modality out of band; this is the one shape both
// GenerateEmbeddings and the catalog's DescribeSource return.
message ResultTable {
  string table_name = 1;
  string source_id = 2;
  string model_id = 3;
  // Embedding dimensionality; unset on the wire as 0 when the engine did
  // not record one (an empty source produces no vectors).
  int32 dimensions = 4;
  uint64 row_count = 5;
  // Lifecycle status reported by the engine ("ready" on success).
  string status = 6;
  // The task that produced this table (the embedding tower: text / image /
  // audio). Carried so the record reconstructs its `ModelTask` faithfully on
  // the wire rather than from a guessed default.
  jammi.v1.inference.ModelTask task = 7;
  // Which path the producer that returned this table took under its
  // `CachePolicy` — COMPUTED for a fresh build, REUSED for an exact cache hit.
  // UNSPECIFIED on a `ResultTable` that did not come from a producer (e.g. a
  // catalog `DescribeSource` projection), so reuse is observable without
  // claiming a producer ran. Mirrors the engine's `CacheOutcome`.
  jammi.v1.inference.CacheOutcome cache_outcome = 8;
  // The column whose value became each row's key; empty when the engine did
  // not record one.
  string key_column = 9;
  // Direct model output vs. a derivation of another result table.
  ResultTableKind kind = 10;
  // The table this one was derived from (a `NEIGHBOR_GRAPH` or `ASOF_JOIN`
  // row's origin embedding table); unset for a `MODEL` row.
  optional string derived_from = 11;
}

message ImportEmbeddingsRequest {
  // Source the imported rows belong to (recorded as the result table's
  // `source_id`, the same handle `Search` resolves the table by).
  string source_id = 1;
  // Encoder that produced these vectors. `local:<path>`, an HF repo id, or a
  // fine-tuned id — recorded as the table's derivation provenance in its
  // canonical form. Validated as a well-formed reference only; never loaded, so
  // import runs GPU-free.
  string model_id = 2;
  // StorageUrl of a Parquet object holding the precomputed vectors, one row per
  // key: a `_row_id` (Utf8) column and a `vector` (`FixedSizeList<Float32>` of
  // width `dimensions`) column. Read fully into memory on import.
  string vectors_url = 3;
  // The source key-column name recorded as catalog provenance (which column of
  // the origin the `_row_id` values came from). The physical key stays
  // `_row_id`; this is lineage, not a schema change.
  string key_column = 4;
  // The source content columns these vectors were computed from, recorded as
  // catalog provenance. Empty when the producer does not attribute source
  // columns.
  repeated string text_columns = 5;
  // Width of every incoming vector. Each row is validated to this width.
  uint32 dimensions = 6;
}

message EncodeQueryRequest {
  string model_id = 1;
  // Which tower to encode the input with.
  Modality modality = 2;
  // The query input. `text` for TEXT; `data` (raw encoded bytes — an image
  // file or an audio clip) for IMAGE/AUDIO. Must match `modality`.
  oneof input {
    string text = 3;
    bytes data = 4;
  }
}

message EncodeQueryResponse {
  // The L2-normalized embedding for the query.
  repeated float embedding = 1;
}

// A packed f32 query vector — the output of `EncodeQuery` (or any client-side
// encoder) fed back as a search query.
message QueryVector {
  repeated float values = 1;
}

message SearchRequest {
  // Source whose embedding table is searched.
  string source_id = 1;
  // Either a precomputed query vector or an existing row's key. A row_key
  // resolves that row's stored vector inside the engine (query-by-example);
  // the vector is never carried on the wire.
  oneof query {
    QueryVector query_vector = 2;
    string row_key = 3;
  }
  // Number of nearest neighbors to return.
  uint32 k = 4;
  // Optional SQL predicate pushed into the search (predicate pushdown). The
  // engine treats it as an opaque expression over the result columns; it
  // carries no domain semantics.
  optional string filter = 5;
  // Columns to project into each hit's `columns` map. Empty = key + score
  // only (no projected columns).
  repeated string select = 6;
  // Which embedding table of the source to search. Unset = the source's
  // most-recent ready table. Naming a table searches that one (e.g. a raw,
  // propagated, or fine-tuned table when a source carries several).
  optional string embedding_table = 7;
  // Per-request override of the table's config-default retrieve→rescore
  // oversample multiplier for a quantized sidecar index (market parity with
  // Qdrant's per-query oversampling knob). Unset = the table's default.
  // Irrelevant for an `f32`-precision table (single-stage, no rescore).
  optional uint32 oversample = 8;
}

message SearchResponse {
  repeated SearchHit hits = 1;
}

message SearchHit {
  // The matched row's key (the source's key-column value).
  string key = 1;
  // Similarity score from the ANN search.
  float score = 2;
  // Projected scalar columns, stringified, when `select` is non-empty.
  map<string, string> columns = 3;
}
