name: Image (CI :latest alias)

# Points `jammi-ai-ci:latest` and `jammi-ai-ci-cuda:latest` at the CI images of
# `main`'s tree. No CI run pulls `:latest`: every run uses its own tree's
# content-tagged images (`_ci-image.yml`), which `ci.yml` builds. The alias
# serves the devcontainer (`.devcontainer/Dockerfile` builds FROM it).

on:
  push:
    branches: [main]
    paths:
      - ".docker/**"
      - "rust-toolchain.toml"
      - ".github/workflows/_ci-base-image.yml"
      - "ci/scripts/ci_image.py"
  workflow_dispatch:

# Serialize per ref, never cancel: a tag move in flight must finish.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci-image:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu cuda

  # A reviewed UNGATED promotion (`check_gpu_prove_once.py`'s table): it moves
  # a development alias on a merge to `main`, never a release artifact, and
  # its `if:` keeps a `workflow_dispatch` on a tag ref from reaching it.
  latest:
    needs: ci-image
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :latest at main's images
        env:
          CPU: ${{ needs.ci-image.outputs.cpu }}
          CUDA: ${{ needs.ci-image.outputs.cuda }}
        run: |
          set -euo pipefail
          docker buildx imagetools create -t "${CPU%:*}:latest" "$CPU"
          docker buildx imagetools create -t "${CUDA%:*}:latest" "$CUDA"
