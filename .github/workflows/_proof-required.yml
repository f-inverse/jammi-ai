name: _proof-required

# The release gate every publisher calls: reads, for the tree of the commit
# the caller promotes, whether the tree's four measurements are green —
# `gpu-prove.yml` on every shipped CUDA arch, `ci.yml`'s summary job (the merge
# gate), `build.yml`'s (the artifacts and their consumers) and
# `cookbook-gpu.yml` (`ci/scripts/verdict.py require`, most recent measurement
# wins) — and that the tag names the version the tree ships. A tree, never a
# commit: the release tag names the merge `main` holds, whose tree the pull
# request's run and the prove run measured.
#
# It starts nothing and waits for nothing: one pass over the recorded runs. A
# tag on a tree whose proof is not already green fails every publisher at
# once, because a tag push commits the version number: prove, then tag. A
# missing measurement, or a most recent one that is not `success`, denies, and
# the caller's promoting job (gated on `needs.<this job>.result == 'success'`)
# never runs. `timeout-minutes` bounds the REST lookup, not a wait.

on:
  workflow_call: {}

# `actions: read` lets `verdict.py` list the tree's subject artifacts and its
# runs' jobs with the ambient token; a called workflow cannot widen beyond
# what it declares here.
permissions:
  contents: read
  actions: read

jobs:
  proof-required:
    name: Proof required
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The tag names the version this tree ships
        run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"

      - name: The tree's GPU-prove, CI, build and cookbook verdicts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 ci/scripts/verdict.py require \
            --repo "$GITHUB_REPOSITORY" \
            --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"
