          # artifact's own commit lies in this PR's range -- a PR whose base
          # already carries the artifact merely inherits it and is never red
          # for commits it did not make. `resolve_unit_head_sha` also cross-checks the
          # resolved value against `GITHUB_EVENT_NAME` (a GitHub Actions
