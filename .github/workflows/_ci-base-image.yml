name: _ci-base-image

# Reusable CI base-image builder. The CPU base (jammi-ai-ci) and the CUDA base
# (jammi-ai-ci-cuda) build identically — same login → metadata → build-push —
# differing only in the image name and the Dockerfile. One reusable, two thin
# callers (image.yml / image-cuda.yml), instead of two byte-identical workflows.

on:
  workflow_call:
    inputs:
      image_suffix:
        description: "ghcr image-name suffix appended to the repo: 'ci' or 'ci-cuda'."
        type: string
        required: true
      dockerfile:
        description: "Dockerfile to build (build context is .docker/)."
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          # `latest` is the tag every `container:` job field in this repo
          # pulls. `type=sha,format=long` already gives an exact, reproducible
          # per-commit tag, kept for provenance/debugging — it is deliberately
          # NOT threaded into any consumer's `container.image`. GitHub Actions
          # resolves `container.image` at job setup, before any step (incl.
          # checkout) runs, and restricts that field to the `github`, `needs`,
          # `strategy`, `matrix`, `vars`, `inputs` contexts — no `hashFiles()`,
          # no `env`. The only legal way to feed a computed tag into
          # `container.image` is a per-workflow resolver job whose output the
          # consumer job reads via `needs.<job>.outputs.<x>` — which would
          # touch the job graph of every consumer job in every workflow that
          # runs against this image, AND introduce a push-ordering race
          # `latest` doesn't have (the resolved tag can be computed before
          # this workflow has finished pushing the matching manifest,
          # 404-ing the pull). `latest` stays the consumer-facing tag.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .docker
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
