name: CI

# The merge gate: does the tree pass its hermetic suite, its lints and its
# guards?
#
# Every pull request, whatever its base, and every push to `main`. A run
# proves a tree, never a commit. `plan` records the tree this run tests
# (`record-subject`) and asks whether a run already proved it
# (`ci/scripts/verdict.py probe --lane ci`): the merge of a pull request whose
# tree its own run proved lands on `main` with that same tree. A proven tree's
# run skips every job whose only work is executing tests (each carries
# `if: needs.plan.outputs.proven != 'true'`, and `ci-summary` counts a skipped
# job as passed). Jobs that compile still run, because a run on `main` writes
# the compile cache every pull request reads (`setup-rust-ci`); jobs whose
# result depends on more than the tree (a hosted runner's image, a live
# advisory database or model hub, the event) run too. `main`'s run also
# measures what only `main` measures: the live hub tests and the performance
# gate, so a release — which requires this summary green on its tree
# (`_proof-required.yml`) — carries both.
#
# This workflow also builds the tree's CI images when the registry lacks
# them; every other workflow on the same event waits for them
# (`_ci-image.yml`). The tree's artifacts, and every check that installs
# them, are `build.yml`'s. Nothing waits on work it does not consume: no job
# needs `check`, and each compile graph that would outlast the hermetic
# suite runs as a job of its own.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A PR ref cancels its own superseded runs. On `main` a running run is
  # never cancelled; a group holds one pending run, so a merge streak leaves
  # `main` with verdicts and every commit was green on its own pull request.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: jobs widen this only where they must.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── The tree's environment and verdict ──────────────────────────────────────
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml


  # This run builds the tree's images when the registry lacks them. Every
  # other workflow on the same push waits for these two jobs by their
  # `CI image (` name prefix (`ci_image.py`'s BUILDER_JOB_PREFIX). Reviewed
  # ungated promotions (`check_gpu_prove_once.py`'s table): a CI environment,
  # never a release artifact, and the `if:` keeps a tag ref from reaching them.
  build-ci-image:
    name: CI image (CPU)
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_ci-base-image.yml
    with:
      dockerfile: .docker/ci.Dockerfile


  # FROM the CPU image of the same tree, so after it.
  build-ci-image-cuda:
    name: CI image (CUDA)
    needs: build-ci-image
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_ci-base-image.yml
    with:
      dockerfile: .docker/ci-cuda.Dockerfile


  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      proven: ${{ steps.verdict.outputs.proven }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: subject
        uses: ./.github/actions/record-subject

      - name: Whether a run already proved this tree
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE: ${{ steps.subject.outputs.tree }}
        run: python3 ci/scripts/verdict.py probe --lane ci --repo "$GITHUB_REPOSITORY" --tree "$TREE" | tee -a "$GITHUB_OUTPUT"


  # ── Lint ───────────────────────────────────────────────────────────────────
  check:
    name: Format & Lint
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # jammi-db's `postgres` / `mysql` features compile the SQLx source
      # providers and nothing else on the merge path activates them, so the
      # workspace clippy above never sees those files
      # (`ci/scripts/check_lint_surface_closure.py` credits this lane).
      - name: Clippy jammi-db --features postgres,mysql --all-targets (source-provider feature surface)
        run: cargo clippy -p jammi-db --features postgres,mysql --all-targets -- -D warnings


  # Tests that need something a CI host lacks are compiled only under the
  # feature naming it, so `--all-targets` above never sees them. This job lints
  # the ones that need no CUDA toolchain; `clippy-cuda` lints the CUDA ones,
  # `clippy-metal` the Metal ones. `check_lint_surface_closure.py` asserts
  # every gated surface has a lane.
  clippy-gated:
    name: Clippy (feature-gated test surfaces)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Clippy (feature-gated test surfaces)
        run: |
          cargo clippy -p jammi-ai --all-targets --features unprivileged-tests,live-distributed-tests -- -D warnings
          cargo clippy -p jammi-db --all-targets --features unprivileged-tests,live-postgres-tests,test-hooks,live-s3-tests,live-gcs-tests,live-azure-tests,live-r2-tests -- -D warnings
          cargo clippy -p jammi-server --all-targets --features unprivileged-tests,live-postgres-tests,test-hooks -- -D warnings
          cargo clippy -p jammi-bench --tests --features live-distributed-tests -- -D warnings


  # Compiles and lints every CUDA-gated surface with the CUDA toolkit and no
  # GPU: it proves the code builds, never that it computes the right numbers
  # (`gpu-prove.yml` runs the `live-gpu-*` tests on a device). One leg per
  # feature graph, so the legs share no compile. jammi-encoders gates code on
  # `not(feature = "flash-attn")` as well, so it is linted with and without
  # flash-attn; `flash-attn` must stay unreachable from `cuda`
  # (`check_flash_attn_closure.py`), so jammi-ai is linted without it. The
  # CUTLASS submodule is initialised in this job's checkout only: a publishing
  # checkout that walked it would ship its source in the jammi-kernels tarball.
  clippy-cuda:
    name: Clippy (CUDA surfaces, nvcc — no GPU) (${{ matrix.crate }})
    runs-on: ubuntu-latest
    needs: build-ci-image-cuda
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: jammi-kernels
            cmd: cargo clippy -p jammi-kernels --all-targets --features live-gpu-tests,flash-attn -- -D warnings
          - crate: jammi-encoders flash-oracle
            cmd: cargo clippy -p jammi-encoders --all-targets --features live-flash-oracle-tests -- -D warnings
          - crate: jammi-encoders
            cmd: cargo clippy -p jammi-encoders --all-targets --features live-gpu-tests -- -D warnings
          - crate: jammi-lora
            cmd: cargo clippy -p jammi-lora --all-targets --features live-gpu-tests -- -D warnings
          - crate: jammi-bench
            cmd: cargo clippy -p jammi-bench --all-targets --features live-gpu-tests,flash-attn -- -D warnings
          - crate: jammi-ai
            cmd: cargo clippy -p jammi-ai --all-targets --features live-gpu-tests,live-gpu-gang-tests -- -D warnings
          - crate: jammi-server
            cmd: cargo clippy -p jammi-server --tests --features live-gpu-tests,live-gpu-gang-tests -- -D warnings
    container:
      image: ${{ needs.build-ci-image-cuda.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: false

      - name: Init the CUTLASS submodule
        run: git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass

      # `jammi-ai/cuda` includes `candle-core/nccl`, which links libnccl: fail
      # here, naming the package, rather than minutes later in a build script.
      - name: The image carries NCCL (header + link library)
        run: rpm -q libnccl libnccl-devel && test -e /usr/include/nccl.h && test -e /usr/lib64/libnccl.so

      - uses: ./.github/actions/setup-rust-ci

      - name: Clippy CUDA surfaces (nvcc, no GPU)
        run: ${{ matrix.cmd }}


  # Lints the Metal-gated surfaces. It cannot run them: a GitHub-hosted
  # macos-14 runner cannot construct a candle Metal device, so
  # `live-metal-tests` run on Apple-silicon hardware.
  clippy-metal:
    name: Clippy (Metal, macos-14)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-host
      - uses: ./.github/actions/setup-rust-ci

      - name: Clippy Metal surfaces
        run: |
          cargo clippy -p jammi-kernels --lib --tests --features live-metal-tests -- -D warnings
          cargo clippy -p jammi-lora --tests --features live-metal-tests -- -D warnings
          cargo clippy -p jammi-ai --test metal_quantized_gpu --features live-metal-tests -- -D warnings


  # ── The hermetic suite: build once, run in partitions ──────────────────────
  # One compile of the workspace's test graph, archived (`cargo nextest
  # archive`) for the partitions below, which compile nothing. `jammi-python`
  # links libpython unless maturin builds it, so its Rust tests run in
  # `test-python-rust`. The archive build always runs: on `main` it is what
  # writes the test graph into the shared compile cache.
  test-build:
    name: Test (hermetic) build
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan]
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Build the hermetic test archive
        run: cargo nextest archive --workspace --exclude jammi-python --archive-file target/hermetic.tar.zst

      # nextest does not run doctests.
      - name: Doctests
        if: needs.plan.outputs.proven != 'true'
        run: cargo test --workspace --exclude jammi-python --doc

      - name: Hand the archive to the partitions
        if: needs.plan.outputs.proven != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermetic-tests
          path: target/hermetic.tar.zst
          retention-days: 1
          # The archive is zstd already.
          compression-level: 0


  # Each partition runs a slice of every test binary, each test in a process
  # of its own (`.config/nextest.toml`). The archive is extracted into the
  # checkout, at the target path it was built with, so a test's baked
  # `CARGO_BIN_EXE_*` and `CARGO_MANIFEST_DIR` paths resolve. Eight
  # partitions: on a hosted runner the suite is ~110 test-minutes and its
  # slowest test ~7, so eight slices of four threads each end near that floor.
  test:
    name: Test (hermetic) (${{ matrix.partition }}/8)
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan, test-build]
    if: needs.plan.outputs.proven != 'true'
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Outside the checkout: extraction creates `target/` and refuses one that
      # already exists.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermetic-tests
          path: /tmp/hermetic

      - name: Run the partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          cargo nextest run --profile ci \
            --archive-file /tmp/hermetic/hermetic.tar.zst \
            --workspace-remap "$GITHUB_WORKSPACE" --extract-to "$GITHUB_WORKSPACE" \
            --partition "slice:$PARTITION/8"

      - name: Keep the partition's per-test timings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hermetic-timings-${{ matrix.partition }}
          path: target/nextest/ci/junit.xml
          retention-days: 30


  # The tests `unprivileged-tests` adds, run as an unprivileged account
  # (`ci/scripts/run_permission_fault_tests.sh`): this container runs as root,
  # and mode bits do not apply to root.
  test-permission-fault:
    name: Test (permission faults)
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: bash ci/scripts/run_permission_fault_tests.sh


  # The opt-in test features no default build compiles, each a small graph:
  # the cloud drivers' root-identity determinants (`storage-cloud`), and the
  # encoders' parity against a committed PyTorch dump (`golden-parity`, fully
  # hermetic: the oracle is `tests/fixtures/htsat_clap_tiny/goldens.safetensors`,
  # never a network call or a torch install).
  test-opt-in:
    name: Test (opt-in features)
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Run tests (storage-cloud lane — root-identity determinants)
        run: cargo test -p jammi-db --features storage-cloud --lib -- catalog::instance storage::builder

      - name: Test jammi-encoders --features golden-parity (CPU-only, PyTorch reference committed)
        run: cargo test -p jammi-encoders --features golden-parity --test golden_parity


  # A real commit, on a rebuild, moves the sha `jammi-bench` bakes
  # (`ci/scripts/check_build_sha_tracks_head.sh`): the one leg of the build-sha
  # oracle that needs a real checkout, which this job's clone is and which is
  # discarded with it.
  build-sha-oracle:
    name: build-sha oracle
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - run: bash ci/scripts/check_build_sha_tracks_head.sh


  # Live (hub) tests reach the network, so on a pull request they only
  # compile; a full-workspace `--no-run` graph of its own, apart from the
  # test archive (two such graphs in one `target/` exhausted a runner's disk).
  compile-check-gated:
    name: Compile-check (gated lanes)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Compile-check live tests
        run: cargo test --workspace --exclude jammi-python --features live-hub-tests --no-run


  # The tests `live-hub-tests` adds, against the live model hub
  # (`ci/scripts/run_live_hub_tests.sh`): `main`-only, and a verdict like every
  # other lane — a hub outage reds `main`'s run, which is measured again when
  # the hub returns, exactly as a capacity outage reds the GPU lanes.
  test-live:
    name: Test (live)
    runs-on: ubuntu-latest
    needs: build-ci-image
    if: github.ref == 'refs/heads/main'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Run the live tests
        env:
          # Read by `HubSource`'s token fallback chain (`[models] hub_token`
          # > `HF_TOKEN` > the cache's own `token` file).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash ci/scripts/run_live_hub_tests.sh


  # The candle-free client substrate — the wire transport (`jammi-wire`), the
  # control-plane client (`jammi-admin`), the data-plane client
  # (`jammi-client`) and the `jammi` CLI — linted, tested, and held to its
  # boundary: no ML stack, and no `jammi-ai` edge from the CLI. The workspace
  # build feature-unifies `local` on through jammi-server, so the boundary is
  # read from each package's own isolated build (`check_client_deps.sh`).
  clients:
    name: Clients (wire / admin / client / cli)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Clippy (wire / admin / client)
        run: cargo clippy -p jammi-wire -p jammi-admin -p jammi-client --all-targets -- -D warnings

      - name: Test (wire / admin / client)
        run: cargo test -p jammi-wire -p jammi-admin -p jammi-client

      - name: The client substrate pulls no ML deps
        run: bash ci/scripts/check_client_deps.sh substrate

      - name: The standalone CLI pulls no ML deps and no jammi-ai
        run: bash ci/scripts/check_client_deps.sh cli


  # `--locked` with no private registry or source configured: a green build
  # proves the OSS edition is self-contained and its lockfile holds nothing
  # proprietary. `jammi-python` is built via maturin, not `cargo build`.
  oss-only-build:
    name: Guard (OSS-only build)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Build the OSS workspace hermetically with no private source
        run: cargo build --workspace --exclude jammi-python --locked


  # `cargo deny` against `deny.toml`: the live RustSec advisory database, the
  # license allowlist, and the bans/sources lanes that formalise the engine's
  # one-way dependency direction in the lockfile. In the CI image, whose
  # pinned toolchain `cargo metadata` needs; the tool's own version is pinned
  # there too (`.docker/pinned-tools.sh`). Metadata needs no build cache, so
  # the sccache wrapper is off.
  dep-audit:
    name: Guard (dependency audit)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    env:
      RUSTC_WRAPPER: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
        with:
          no-sccache: "true"

      - name: cargo deny (advisories + licenses + bans + sources)
        run: cargo deny check advisories licenses bans sources

      # The default graph excludes every crate reachable only through an
      # optional feature — the SQLx source providers behind `postgres`/`mysql`,
      # the object_store backends behind `storage-*` — which is where a second
      # DataFusion line or an unseen advisory hides. The `--all-features` graph
      # is the shipped one for every family but the bare crates.io crate
      # (`crates/jammi-db/tests/it/shipped_feature_exposure.rs`). A separate
      # step, so the default graph keeps its own verdict and the feature-gated
      # advisories are listed as documented exceptions with their exposure.
      - name: cargo deny --all-features (shipped-feature graph)
        run: cargo deny --all-features check bans advisories licenses sources


  # The `jammi-python` crate's Rust tests: built without `extension-module`,
  # they link libpython against the image's system interpreter — a test build,
  # not the shipped wheel. Mostly compilation, so it runs on a proven tree too.
  test-python-rust:
    name: Test (Python, Rust)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Rust tests (jammi-python)
        run: cargo test -p jammi-python --no-fail-fast


  # The backend-parameterised suites' Postgres arms: compiled only under
  # `live-postgres-tests`, each test against a database of its own on the
  # service, at most four at a time, the server's connection budget
  # (`.config/nextest.toml`'s `postgres` profile).
  test-pg:
    name: Test (Postgres)
    runs-on: ubuntu-latest
    needs: [ci-image, build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    services:
      postgres:
        image: ${{ needs.ci-image.outputs.postgres }}
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: >-
          --health-cmd "pg_isready -U jammi -d jammi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Run Postgres tests
        env:
          JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
        run: |
          cargo nextest run --profile postgres -p jammi-db -p jammi-server \
            --features jammi-db/live-postgres-tests,jammi-server/live-postgres-tests \
            -E '(package(jammi-db) & (kind(lib) | binary(it))) | (package(jammi-server) & binary(it))'


  # The repository's guards (`ci/guards.toml`) and the tests of its own
  # scripts, through the runners a local check uses too
  # (`ci/dev.sh python3 ci/scripts/run_guards.py --base origin/main`). On a
  # pull request only what the change can affect runs; a push to main runs
  # them all. The runner provides what a guard declares it needs; the one
  # guard that builds a workspace crate (the consumer-name guard's
  # `symbol-index` parse) compiles through the shared cache. Full history: the
  # diff-scoped guards read the base branch.
  guard:
    name: Guards
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-ci
      # A pull request's checkout is its merge commit: the first parent is
      # the base the change is diffed against.
      - name: Run the guards
        run: python3 ci/scripts/run_guards.py ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}
      - name: Test the scripts
        run: python3 ci/scripts/run_script_tests.py ${{ github.event_name == 'pull_request' && '--base HEAD^1' || '' }}


  # Every Kubernetes kustomization renders valid manifests against the pinned
  # schema (`ci/scripts/check_kube_manifests.sh`, the kind smoke's own
  # pre-apply check), and every config mount carries the file its server
  # reads. A job rather than a guard: it reads the pinned schemas through a
  # cache.
  kube-manifests:
    name: Guard (kubernetes manifests)
    runs-on: ubuntu-latest
    needs: [build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/kubeconform
          key: kubeconform-schemas-${{ hashFiles('ci/scripts/check_kube_manifests.sh') }}

      - name: kustomize build | kubeconform --strict (base, shape-d, ci)
        run: bash ci/scripts/check_kube_manifests.sh deploy/kubernetes/base deploy/kubernetes/overlays/shape-d deploy/kubernetes/overlays/ci

      - name: Every config mount carries the file its server reads
        run: python3 ci/scripts/check_kube_config_mounts.py


  # The one job that executes `.cargo/config.toml`'s aarch64 stanza on a real
  # aarch64 host outside any container (`ci/scripts/check_aarch64_floor.sh`):
  # every other proof of the `+fp16` floor and the mold link argument is
  # static. Bare on purpose, so the toolchain and mold are installed as a
  # bare host installs them. Cold, a native build of `jammi-numerics` and its
  # dependency set, twice; warm through the shared cache, seconds.
  arm64-floor-oracle:
    name: arm64 floor oracle
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-host
      - uses: ./.github/actions/setup-rust-ci
      - run: bash ci/scripts/check_aarch64_floor.sh


  # The maintainer guide's crate-dependency graph is generated from
  # `cargo build-graph`, extracted from real `cargo build` artifacts, so a
  # stale committed block reds the change that staled it. A job, not a guard:
  # it compiles the workspace.
  dep-dag:
    name: Guard (dep-DAG freshness)
    runs-on: ubuntu-latest
    needs: build-ci-image
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Regenerate the dep-DAG block
        run: python3 ci/scripts/gen_dep_dag.py

      - name: The committed dep-DAG block is fresh
        run: |
          git diff --exit-code -- docs/maintainer/MAINTAINER-GUIDE.md \
            || { echo "::error::docs/maintainer/MAINTAINER-GUIDE.md's dep-DAG block is stale: run 'python3 ci/scripts/gen_dep_dag.py' and commit the result"; exit 1; }


  # The performance gate, measured on `main`: every CPU-hermetic `*-scale`
  # tier against its committed floor (`ci/scripts/perf/run_scale_tiers.sh`;
  # the contract is `docs/guide/src/performance-slos.md`), and a proof that
  # the gate bites. A structural regression — a path gone quadratic, a
  # serialised parallel section, a dropped fast path — reds `main`'s run, and
  # a release requires that run green on its tree. `main` only: a hosted
  # runner's throughput jitters with its neighbours, and a per-pull-request
  # rate gate would flap; a red here is measured again by re-running `main`.
  perf-gate:
    name: Performance gate (main)
    runs-on: ubuntu-latest
    needs: build-ci-image
    if: github.ref == 'refs/heads/main'
    container:
      image: ${{ needs.build-ci-image.outputs.image }}
    env:
      # One Rayon thread: the per-core code path the committed baselines
      # were emitted under, not the runner's core count.
      RAYON_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      # The committed baselines are release-profile numbers. `JAMMI_BUILD_SHA`
      # is `github.sha`, the exact 40-hex shape `build.rs` accepts verbatim, so
      # the tiers' provenance cross-check holds in a container.
      - name: Build the bench harness (release)
        env:
          JAMMI_BUILD_SHA: ${{ github.sha }}
        run: cargo build -p jammi-bench --release

      - name: Run the CPU-hermetic scale tiers (measured-rate gate)
        run: bash ci/scripts/perf/run_scale_tiers.sh

      - name: The rate gate bites
        run: bash ci/scripts/perf/check_rate_gate_bites.sh


  # The multi-process lanes over Postgres and the S3-class store: the claim,
  # chaos and ladder-rung legs `distributed.yml` defines.
  distributed:
    needs: [build-ci-image, plan]
    if: needs.plan.outputs.proven != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/distributed.yml


  # ── Single rolled-up gate ──────────────────────────────────────────────────
  # The one check a branch-protection ruleset requires. It fails if any job
  # above failed or was cancelled; a `skipped` job — one whose tree `plan`
  # found proven, or a `main`-only job off `main` — counts as a pass.
  # `if: always()` makes it emit on every run. `verdict.py`'s CI_SUMMARY_JOB
  # names this job: a release gates on its most recent result over the
  # released tree.
  ci-summary:
    needs:
      - ci-image
      - build-ci-image
      - build-ci-image-cuda
      - plan
      - check
      - clippy-gated
      - clippy-cuda
      - clippy-metal
      - test-build
      - test
      - test-permission-fault
      - test-opt-in
      - build-sha-oracle
      - compile-check-gated
      - test-live
      - clients
      - oss-only-build
      - dep-audit
      - test-python-rust
      - test-pg
      - guard
      - kube-manifests
      - arm64-floor-oracle
      - dep-dag
      - perf-gate
      - distributed
    if: always()
    uses: ./.github/workflows/_summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
