name: Kubernetes smoke (kind)

# Packages the CPU `jammi-ai-server` image from proven binaries, spins up a
# `kind` cluster, applies `deploy/kubernetes/overlays/ci` (kustomize build |
# kubectl apply), and drives it with the client wheel
# (`tests/compose/shape_c_kube_remote.py`) through a `kubectl rollout restart`
# — proving the overlay's manifests, the image's file-then-env config
# resolution, and that a rollout restart's new pod shares the old pod's
# Postgres catalog and broker. It does not assert result durability across
# the restart: the overlay mounts `emptyDir` (that script's module doc draws
# the boundary).
#
# The image packages binaries it does not compile: `ci.yml` calls this with
# its own run id; the nightly and a dispatch resolve the run that proved
# `main`'s tree (`_proven-artifacts.yml`). Built with `push: "false"` and
# loaded into the runner's daemon, then into the cluster's node: no registry
# is written, so this workflow is not a promotion (`check_gpu_prove_once.py`'s
# P6 rule reads that literal). One amd64 leg: `helm/kind-action`'s kind binary
# is amd64 on `ubuntu-latest`, and the arm64 image is proven by
# `compose-smoke.yml`'s arm64 leg.
#
# Kubernetes has no `depends_on`: the overlay's Deployment starts beside the
# Postgres StatefulSet and converges by CrashLoopBackOff-and-retry inside the
# 300s `rollout status` timeout below.

on:
  workflow_call:
    inputs:
      run-id:
        description: "The run whose binaries and client wheel the image packages."
        type: string
        required: true
  schedule:
    # 03:00 UTC nightly.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    if: inputs.run-id == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: server-cpu-x86_64-binary jammi-x86_64-unknown-linux-gnu client-wheel

  kube-smoke:
    name: Kubernetes smoke (kind, amd64)
    needs: [artifacts]
    if: always() && (inputs.run-id != '' || needs.artifacts.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RUN_ID: ${{ inputs.run-id || needs.artifacts.outputs.run }}
      JAMMI_IMAGE: jammi-ai-server:smoke
      KUBECONFORM_CACHE: ${{ github.workspace }}/.kubeconform-cache
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Synthetic, for this throwaway cluster.
      - name: Generate the ephemeral cluster secret
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::${key}"
          echo "JAMMI_AUDIT_MASTER_KEY=${key}" >> "$GITHUB_ENV"

      - uses: ./.github/actions/stage-server-binaries
        id: binaries
        with:
          server: server-cpu-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder
          run-id: ${{ env.RUN_ID }}

      - uses: ./.github/actions/build-image
        with:
          load-tag: ${{ env.JAMMI_IMAGE }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          cache-scope: cpu-generic-amd64

      # A bare runner (kind drives the runner's own Docker): the two tools at
      # the pins the CI image carries.
      - name: Provide kustomize and kubeconform at their pins
        run: sudo bash .docker/pinned-tools.sh kustomize kubeconform

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.KUBECONFORM_CACHE }}
          key: kubeconform-schemas-${{ hashFiles('ci/scripts/check_kube_manifests.sh') }}

      - name: The ci overlay is valid against the pinned schema, before it is applied
        run: bash ci/scripts/check_kube_manifests.sh deploy/kubernetes/overlays/ci

      - name: Render the kind cluster config
        run: envsubst < deploy/kubernetes/overlays/ci/kind-config.yaml.in > "$RUNNER_TEMP/kind-config.yaml"

      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          node_image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
          # Matches the server; the action's own default is three minors over it.
          kubectl_version: v1.34.11
          cluster_name: kind
          config: ${{ runner.temp }}/kind-config.yaml

      - name: The pinned service images, under the names the overlay uses
        id: services
        run: |
          {
            echo "images<<EOF"
            bash ci/scripts/pull_service_images.sh
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Load the built server image and the service images into kind
        env:
          SERVICE_IMAGES: ${{ steps.services.outputs.images }}
        run: |
          # shellcheck disable=SC2086 # a word list by construction
          kind load docker-image "$JAMMI_IMAGE" $SERVICE_IMAGES --name kind

      - name: Create the namespace and the Secret
        run: |
          set -euo pipefail
          kubectl create namespace jammi-ci
          kubectl -n jammi-ci create secret generic jammi-server-secrets \
            --from-literal=JAMMI_AUDIT_MASTER_KEY="$JAMMI_AUDIT_MASTER_KEY" \
            --from-literal=JAMMI_CATALOG__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi \
            --from-literal=JAMMI_BROKER__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi

      - name: Apply the ci overlay
        run: kustomize build deploy/kubernetes/overlays/ci | kubectl apply -f -

      - name: Wait for postgres and jammi-server to roll out
        run: |
          set -euo pipefail
          kubectl -n jammi-ci rollout status statefulset/postgres --timeout=300s
          kubectl -n jammi-ci rollout status deploy/jammi-server --timeout=300s

      - name: Every pod runs the image this job built
        run: bash ci/scripts/assert_kind_image_identity.sh "$JAMMI_IMAGE" jammi-ci app=jammi-server

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install-jammi
        with:
          native: "false"
          run-id: ${{ env.RUN_ID }}

      - name: Run the remote Kubernetes smoke script (port-forward + rollout restart)
        run: python3 tests/compose/shape_c_kube_remote.py

      - name: The Postgres catalog was exercised at runtime
        run: |
          set -euo pipefail
          count="$(kubectl -n jammi-ci exec statefulset/postgres -- psql -U jammi -d jammi -tAc 'select count(*) from sources')"
          echo "postgres catalog sources rows: ${count}"
          [ "${count}" -ge 1 ] \
            || { echo "::error::no row in the Postgres 'sources' table after add_source: the overlay's JAMMI_CATALOG__POSTGRES__URL is not backing the catalog" >&2; exit 1; }

      - name: Dump pod state and logs on failure
        if: failure()
        run: |
          kubectl -n jammi-ci get pods -o wide
          kubectl -n jammi-ci describe pod -l app=jammi-server
          kubectl -n jammi-ci logs -l app=jammi-server --tail=-1 --all-containers

      - name: Delete the kind cluster
        if: always()
        run: kind delete cluster --name kind
