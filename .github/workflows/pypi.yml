name: PyPI

on:
  push:
    tags: ["py-v*"]
  # Manual re-run to finish a release whose publish was interrupted: run the
  # dispatch ON the `py-v*` tag (the publish job is tag-guarded; PyPI rejects
  # a re-upload of an existing version, so re-running the tag is idempotent).
  # A branch dispatch is a rehearsal: it resolves the branch tree's proving
  # run and its wheels, and publishes nothing.
  workflow_dispatch:

# This workflow ships the `jammi-ai-native` dist — the compiled engine (maturin
# abi3 wheels, per-platform). It compiles nothing: `ci.yml` builds the wheels
# on every pull request and on `main` (`_native-wheels.yml`), where a wheel
# that stops building or outgrows PyPI's per-file limit fails the change that
# caused it, and this workflow publishes the ones the run that proved the
# tag's tree built — the bytes that run's Python lanes, cookbook and book
# installed. The tree pins the version (maturin reads the crate's
# `version.workspace`). The pure-Python base client `jammi-ai` (import
# `jammi`) is published from `clients/python` by `pypi-client.yml` on the SAME
# `py-v*` tag, so the two ship in lockstep at the shared workspace version.

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; the publish job widens to
# `id-token: write` (PyPI trusted publishing) per job.
permissions:
  contents: read

jobs:
  # What this release publishes: the artifacts the `ci.yml` run that proved
  # the released tree built — nothing compiles here. On a branch dispatch,
  # the rehearsal: the same lookup over the branch's tree.
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: wheels-native-linux-x86_64 wheels-native-linux-aarch64 wheels-native-macos-arm64 wheels-native-macos-x86_64

  # Windows wheel disabled: usearch 2.24.0 uses POSIX mmap APIs
  # (MAP_FAILED) that MSVC does not support.

  proof:
    name: Proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before the native wheel is published (every release publisher
    # gates on the prove verdict, all-or-nothing, not only the CUDA lanes).
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref (tag push, or a dispatch run on
    # the tag) whose commit's GPU-prove verdict is green — see the
    # workflow_dispatch comment above. Without the guard a branch dispatch
    # could first-publish an untagged, unreleased build, which PyPI cannot
    # undo. PURE conjunction (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    needs: [artifacts, proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-native-*
          merge-multiple: true
          path: dist
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
