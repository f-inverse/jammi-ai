apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: jammi-server-config
    files:
      - jammi.toml

# The Deployment above references `jammi-server-config` by its literal name
# (no hash suffix); every kustomization in this tree (base and every overlay)
# declares this same option so the reference always resolves. See
# `deploy/kubernetes/README.md`.
generatorOptions:
  disableNameSuffixHash: true
