[project]
# Not a published package: a notebook installs it from the release's git tag
# (`…@py-vX#subdirectory=cookbook/book`), so it carries the lockstep version.
name = "jammi-cookbook"
version = "0.49.1"
description = "The jammi cookbook's library and fixtures — the datasets, encoders, frozen goldens and rails its recipes and chapters run on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "F-Inverse" }]

# The chapters are written against the jammi-ai of the same release. CI installs the
# HEAD wheels first, which carry this same version, so the pin resolves to them; the
# engine itself — `jammi-ai-native` or `jammi-ai-native-cu12` — is the installer's
# choice. numpy and pyarrow are the data substrate the chapters manipulate; requests
# fetches the published datasets a `full`-scale run reads.
dependencies = [
    "jammi-ai==0.49.1",
    "numpy>=1.26,<3",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
# The book toolchain. Quarto itself is a system binary installed separately
# (see .github/workflows/ci.yml); jupyter is the execution engine Quarto drives.
book = [
    "jupyter>=1.0",
    "nbclient>=0.9",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["jammi_cookbook"]

# The install carries the fixtures the recipes and the `small` scale read, so a
# fresh Colab runtime runs every recipe and chapter with no working checkout. `_fixtures` links to
# `cookbook/fixtures`, which also holds engine-test and benchmark fixtures the
# cookbook never reads; only the ones named here ship.
[tool.setuptools.package-data]
jammi_cookbook = [
    "goldens/*.json",
    "_api_reference.md",
    "_fixtures/air_routes/*",
    "_fixtures/arxiv_small/*",
    "_fixtures/htsat_clap_tiny/*",
    "_fixtures/tiny_audio_corpus/**/*",
    "_fixtures/tiny_audio_golden.json",
    "_fixtures/tiny_bert/*",
    "_fixtures/tiny_citation_graph/*",
    "_fixtures/tiny_corpus.parquet",
    "_fixtures/tiny_golden.json",
    "_fixtures/tiny_image_corpus/**/*",
    "_fixtures/tiny_image_golden.json",
    "_fixtures/tiny_labels.csv",
    "_fixtures/tiny_modernbert_classifier/*",
    "_fixtures/tiny_modernbert_ner/*",
    "_fixtures/tiny_ner_corpus.parquet",
    "_fixtures/tiny_ner_gold.csv",
    "_fixtures/tiny_open_clip/*",
    "_fixtures/tiny_pairs.csv",
]

# The tiny CLAP checkpoint's directory also holds the engine's own parity goldens.
[tool.setuptools.exclude-package-data]
jammi_cookbook = [
    "_fixtures/htsat_clap_tiny/golden_manifest.json",
    "_fixtures/htsat_clap_tiny/goldens.safetensors",
    "_fixtures/htsat_clap_tiny/pinned_input.safetensors",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
