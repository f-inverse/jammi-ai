            - paragraph [ref=e233]:
              - strong [ref=e234]: Beam
              - text: "(beam.cloud) deserves a mention. They open-sourced their core runtime and their Python SDK feels like a Modal clone. Cold starts are competitive. Pricing slightly below Modal. The downside: smaller team, less mature docs, fewer GPUs available."
            - paragraph [ref=e235]:
              - strong [ref=e236]: Baseten
              - text: ($40M Series B) is the production-focused option. Their Truss framework handles model packaging, and they support
              - link "TensorRT-LLM and vLLM backends" [ref=e237] [cursor=pointer]:
                - /url: /blog/best-cloud-services-mvp-hosting-2026
              - text: for optimized serving. Good for teams that need SLAs and monitoring dashboards.
            - paragraph [ref=e238]:
              - text: "Quick sidebar on a platform you should skip:"
              - strong [ref=e239]: Banana.dev
              - text: shut down in late 2023/early 2024. Their Potassium framework is abandoned on GitHub. If you see old tutorials referencing Banana, they’re outdated. Several developers got burned when the service went dark without warning.
            - heading "Which Platform Should You Pick?" [level=2] [ref=e240]
            - paragraph [ref=e241]: I’ll just tell you what I’d pick for each scenario. No hedging.
            - paragraph [ref=e242]:
              - strong [ref=e243]: Building a prototype?
              - text: Modal. The Python-native SDK means you go from idea to deployed endpoint in 15 minutes. The free $30 credits are enough to test everything.
            - paragraph [ref=e244]:
              - strong [ref=e245]: Shipping to production on a budget?
              - text: RunPod. Eat the Docker friction, save 30% on GPU costs. Once your container is stable, the build/push cycle is a one-time cost.
            - paragraph [ref=e246]:
              - strong [ref=e247]: Serving popular open-source models?
              - text: Replicate. Their model library and shared warm instances mean zero cold starts for standard models. Just don’t deploy custom models here.
            - paragraph [ref=e248]:
              - strong [ref=e249]: Need the open-source escape hatch?
              - text: BentoML. Start on BentoCloud, migrate to self-hosted on EKS when your volume justifies it. No vendor lock-in.
            - paragraph [ref=e250]:
              - strong [ref=e251]: Using an OpenAI-compatible API?
              - text: Together AI. Drop-in replacement for OpenAI’s API with open-source models. Not truly “bring your own model” serverless, but the simplest option if you just need inference on supported models.
            - heading "One Thing I Wish Someone Told Me Earlier" [level=2] [ref=e252]
            - paragraph [ref=e253]: Always cache your model weights on the platform’s persistent storage (Modal Volumes, RunPod Network Storage) before deploying. The difference between “load weights from local NVMe” and “download weights from HuggingFace on every cold start” is the difference between a 15-second cold start and a 90-second one.
            - paragraph [ref=e254]:
              - text: Set that up once and cold starts become
              - link "manageable even for production workloads" [ref=e255] [cursor=pointer]:
                - /url: /blog/best-ai-tools-mvp-development-2026
              - text: . It turns serverless GPUs from an interesting experiment into something worth recommending for real products.
