[package]
name = "jammi-encoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Candle-native BERT-family encoders for sentence embeddings, with built-in PEFT support via jammi-lora."
keywords = ["bert", "sentence-embeddings", "lora", "candle", "transformer"]
categories = ["science"]
readme = "README.md"

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
# The fused-kernel CustomOp scaffolding (bias-free LayerNorm fwd+bwd, this
# commit's first real consumer). Non-optional: the CPU implementations are
# always present (one call path, no cfg forest at call sites) — only the
# `cuda` feature below adds the CUDA build.
jammi-kernels.workspace = true
# Needs the candle-backed LoRA primitives (`LoraLinear` / `MaybeLoraLinear` /
# `LoraError`), so enable jammi-lora's `candle` feature (off at the workspace root).
jammi-lora = { workspace = true, features = ["candle"] }
# The candle-free `ComputePrecision` vocabulary. This crate is the candle
# boundary for it: `compute_precision_to_dtype` is the one place in the
# workspace that maps `ComputePrecision -> candle_core::DType` (a plain
# function, not a `From` impl — neither type is local here, so an orphan-rule
# -legal trait impl cannot exist anywhere but `jammi-numerics` or `candle`
# itself, and `jammi-numerics` must stay candle-free).
jammi-numerics.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
candle-transformers.workspace = true
hf-hub.workspace = true
half.workspace = true
serde_json.workspace = true
tempfile = "3"

[features]
default = []
# Forwards to candle's own `cuda` feature chain via jammi-kernels — THE
# feature this crate did not have before this commit (jammi-ai's own `cuda`
# feature bypassed jammi-encoders entirely; this is the first real link in
# that chain). Adds jammi-kernels' CUDA build (nvcc/PTX) — never required
# by a plain `cargo build` (see jammi-kernels/build.rs's early-return gate).
cuda = ["jammi-kernels/cuda"]
# Forwards to `jammi-kernels`'s `flash-attn` feature — one link of the
# `jammi-kernels -> jammi-encoders -> jammi-ai -> jammi-bench` chain the
# lead's P6 Stage B v5 correction asks B2 to lay down now, with no real
# code depending on it yet: `crate::modernbert`'s flash-cascade admission
# predicate reads `jammi_kernels::admission::FLASH_COMPILED` (a plain,
# unconditionally-compiled `bool`, NOT this local feature) precisely
# because it must stay correct even before `jammi-ai`/`jammi-bench` forward
# this feature — see `FLASH_COMPILED`'s own doc. This feature exists so a
# FUTURE real dependency on `jammi_kernels::flash` types (B1's
# `CuSeqlens`/`flash_attention_varlen`) has a declared forwarding path to
# land behind, and so `rustc`'s `unexpected_cfgs` lint has a declared
# feature name if a future call site DOES need `#[cfg(feature =
# "flash-attn")]` (never a bare `cfg!()` runtime check around a
# `jammi_kernels::flash` type reference — see `FLASH_COMPILED`'s doc for
# why that would fail to compile with this feature off).
flash-attn = ["jammi-kernels/flash-attn"]
# Enables tests/parity.rs which depends on candle-transformers as a numerical
# oracle for the Bert frozen forward pass.
parity-test = []
# Enables tests/golden_parity.rs, which checks the HTSAT-Swin CLAP audio tower
# against committed per-boundary golden activations (dumped from PyTorch
# transformers by tests/fixtures/generate_htsat_clap.py). Needs no torch and no
# network — the goldens are committed binaries.
golden-parity = []
# Enables tests/live_real_clap.rs, which downloads the REAL
# `laion/clap-htsat-fused` checkpoint from the HF Hub and asserts the HTSAT-Swin
# tower reproduces its audio embedding on the committed pinned input. Live: makes
# a network call, so the default `cargo test` stays hermetic.
live-hub-tests = []

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "golden_parity"
path = "tests/golden_parity.rs"

[[test]]
name = "live_real_clap"
path = "tests/live_real_clap.rs"
