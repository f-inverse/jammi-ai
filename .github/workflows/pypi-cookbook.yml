name: PyPI (jammi-cookbook)

# Publishes `jammi-cookbook` — the cookbook's library (`jammi_cookbook`) and the
# fixtures its recipes and `small`-scale chapters read — built from
# `cookbook/book`, to PyPI on a `py-v*` tag, the SAME tag that publishes
# `jammi-ai` and its engines. It pins `jammi-ai==X` at the lockstep version, and
# every cookbook notebook installs `jammi-cookbook==X` for the release it was
# built for, so it ships in the same all-or-nothing release. Uses PyPI Trusted
# Publishing (OIDC) — no API token.
#
# NOTE (release-time, EXTERNAL — do not act in CI): the `jammi-cookbook` PyPI
# project's Trusted-Publisher config must authorize THIS workflow
# (`pypi-cookbook.yml`, environment `pypi`). CI only BUILDS the wheel on a PR.

on:
  push:
    tags: ["py-v*"]
  # Manual re-run to finish an interrupted release: dispatch ON the `py-v*` tag
  # (the publish job is tag-guarded; PyPI rejects a re-upload, so a re-run is
  # idempotent). A branch dispatch is a build-only dry run.
  workflow_dispatch:
  pull_request:
    paths:
      - "cookbook/book/pyproject.toml"
      - "cookbook/book/jammi_cookbook/**"
      - "cookbook/fixtures/**"
      - ".github/workflows/pypi-cookbook.yml"

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-cookbook-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build wheel (py3-none-any)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `jammi_cookbook/_fixtures` is a link to `cookbook/fixtures`; the wheel
      # carries the files it resolves to, per the package data in
      # `cookbook/book/pyproject.toml`. The check below reads the built wheel
      # itself, so a fixture the recipes need but the wheel lost fails here.
      - name: Build wheel
        working-directory: cookbook/book
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: The wheel carries the fixtures
        working-directory: cookbook/book
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("jammi_cookbook/_fixtures/tiny_bert/model.safetensors",
                         "jammi_cookbook/_fixtures/tiny_audio_corpus/queries/q_sine.wav",
                         "jammi_cookbook/_fixtures/arxiv_small/arxiv_papers.parquet",
                         "jammi_cookbook/goldens/arxiv.small.json"):
              assert needed in names, f"the wheel is missing {needed}"
          print(f"{len(names)} files, fixtures present")
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: cookbook-dist
          path: cookbook/book/dist/

  gpu-proof:
    name: GPU proof required
    # The lockstep release is all-or-nothing: a `py-v*` tag publishes only a
    # commit whose GPU-prove verdict is already recorded green.
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_gpu-proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref. PURE conjunction (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.build.result == 'success' && needs.gpu-proof.result == 'success'
    needs: [build, gpu-proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cookbook-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
