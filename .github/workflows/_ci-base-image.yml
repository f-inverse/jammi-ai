name: _ci-base-image

# Reusable CI base-image builder. The CPU base (jammi-ai-ci) and the CUDA base
# (jammi-ai-ci-cuda) build identically — same login → metadata → build-push —
# differing only in the image name and the Dockerfile. One reusable, two thin
# callers (image.yml / image-cuda.yml), instead of two byte-identical workflows.
#
# Every consumer's `container:` field (and workflow-call `container_image`
# input) resolves the image via a repo variable with a literal `:latest`
# fallback: `${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}`
# (resp. `JAMMI_CI_IMAGE_CUDA` for the CUDA base). `container.image` is
# restricted to the `github`, `needs`, `strategy`, `matrix`, `vars`, `inputs`
# contexts — no `hashFiles()`, no `env` — but `vars` IS legal there, so a
# content-addressed (sha-tagged) image ref can reach `container.image`
# directly with no resolver-job indirection. This job is what keeps that
# variable current: after the manifest push completes, it PATCHes (falling
# back to POSTs, on a 404, to create) the repo variable to the exact
# `sha-<commit>` tag it just pushed. Updating the variable strictly AFTER the
# push (not before, not racing it) means a consumer job that reads the
# variable can never observe a tag whose manifest hasn't landed in the
# registry yet — there is no pull-before-push race by construction, and no
# separate resolver job's output has to be threaded through every consuming
# workflow's job graph.

on:
  workflow_call:
    inputs:
      image_suffix:
        description: "ghcr image-name suffix appended to the repo: 'ci' or 'ci-cuda'."
        type: string
        required: true
      dockerfile:
        description: "Dockerfile to build (build context is .docker/)."
        type: string
        required: true

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          # `latest` is the fallback every consumer's `vars.JAMMI_CI_IMAGE[_CUDA]
          # || 'ghcr.io/...:latest'` expression resolves to before the variable
          # below is ever seeded (a fresh fork, or before this workflow has run
          # once). `type=sha,format=long` is the content-addressed tag this job
          # publishes to the repo variable once the push below completes.
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # rust-toolchain.toml is the single source of truth for the pin. The build
      # context is `.docker/`, so the file cannot be COPYed into the image —
      # it is read here and passed as a build-arg instead. Without this the
      # Dockerfile would carry its own copy of the version, and a bump to
      # rust-toolchain.toml would trigger a rebuild that faithfully reproduced
      # the OLD pin and reported success.
      - name: Resolve the pinned Rust toolchain
        id: rust-pin
        shell: bash
        run: |
          set -euo pipefail
          channel="$(sed -n 's/^ *channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
          test -n "$channel" || { echo "could not parse channel from rust-toolchain.toml"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned Rust: $channel"

      - uses: docker/build-push-action@v6
        with:
          context: .docker
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            RUST_VERSION=${{ steps.rust-pin.outputs.channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Only runs once the manifest push above has completed, so the variable
      # a consumer job reads never points at a tag that hasn't landed in the
      # registry yet. Picks the sha-tagged ref out of the metadata action's
      # output (the same tag list just pushed) rather than reconstructing it,
      # so the variable is always byte-identical to what was actually pushed.
      - name: Update the repo variable to the pushed sha-tagged image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VAR_NAME: ${{ inputs.image_suffix == 'ci-cuda' && 'JAMMI_CI_IMAGE_CUDA' || 'JAMMI_CI_IMAGE' }}
        run: |
          set -euo pipefail
          image_ref=$(echo '${{ steps.meta.outputs.tags }}' | grep -m1 ':sha-')
          api="repos/${{ github.repository }}/actions/variables"
          if gh api "$api/$VAR_NAME" \
              -X PATCH -H "Accept: application/vnd.github+json" \
              -f name="$VAR_NAME" -f value="$image_ref"; then
            echo "updated $VAR_NAME=$image_ref"
          else
            echo "$VAR_NAME not found — creating it"
            gh api "$api" \
              -X POST -H "Accept: application/vnd.github+json" \
              -f name="$VAR_NAME" -f value="$image_ref"
            echo "created $VAR_NAME=$image_ref"
          fi
