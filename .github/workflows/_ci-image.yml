name: _ci-image

# The tree's CI environment, resolved once per run (`ci/scripts/ci_image.py`):
# the CPU and CUDA images its lanes run in, each tagged by the content that
# defines it, and the service images they run beside, pinned by digest. A run
# therefore runs in its own tree's images — a pull request that changes
# `.docker/` is tested in the image it defines.
#
# `ci.yml` builds a tree's images when the registry lacks them (its
# `build-ci-image` jobs). Every other workflow starts beside it on the same
# push and passes `await`: this job then waits until those images exist, and
# fails at once, naming the job, when `ci.yml`'s build fails. It builds and
# publishes nothing itself.

on:
  workflow_call:
    inputs:
      await:
        description: >
          Space-separated images to wait for (`cpu`, `cuda`). Empty resolves the
          references without waiting — for `ci.yml`, which builds them.
        type: string
        default: ""
    outputs:
      cpu:
        description: The CPU CI image of this tree.
        value: ${{ jobs.resolve.outputs.cpu }}
      cuda:
        description: The CUDA CI image of this tree.
        value: ${{ jobs.resolve.outputs.cuda }}
      postgres:
        description: The pinned Postgres service image.
        value: ${{ jobs.resolve.outputs.postgres }}

# `actions: read` lets the wait read `ci.yml`'s build jobs for this commit.
permissions:
  contents: read
  actions: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    # An image build takes ~20 min; the wait gives up at 45 and says why.
    timeout-minutes: 50
    outputs:
      cpu: ${{ steps.refs.outputs.cpu }}
      cuda: ${{ steps.refs.outputs.cuda }}
      postgres: ${{ steps.refs.outputs.postgres }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the tree's images
        id: refs
        shell: bash
        run: python3 ci/scripts/ci_image.py refs | tee -a "$GITHUB_OUTPUT"

      - name: Wait for ci.yml to build them
        if: inputs.await != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGES: ${{ inputs.await }}
          # ci.yml's run for a pull request is keyed by the PR's head commit,
          # not the merge commit this run checked out.
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # shellcheck disable=SC2086 # IMAGES is a word list by contract
          python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" $IMAGES
