name: Release Binaries

# Attaches the prebuilt binaries to the GitHub release of a `v*` tag, behind
# the shared release gate: the `jammi` CLI for every target and the
# `jammi-server` tarballs (the CPU build per arch; the CUDA build with the
# runtime libraries it links and an `LD_LIBRARY_PATH` launcher,
# `ci/scripts/package_server_tarball.sh`). It compiles nothing: `ci.yml`
# builds and packages every asset on every pull request and on `main`
# (`_cli.yml`, `_server.yml`), and a release attaches the ones the run that
# proved the tag's tree built (`_proven-artifacts.yml`), each with a
# Sigstore provenance attestation over the exact bytes attached.
#
# The release is created by whichever asset reaches it first
# (`release-upload`); every publisher that touches it creates it the same
# way, so none waits on another. A dispatch on the tag re-attaches every
# asset, recovering a release with assets missing without re-cutting the
# tag; a branch dispatch is a rehearsal that resolves the proving run and
# attaches nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-binaries-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: >-
        jammi-x86_64-unknown-linux-gnu
        jammi-aarch64-unknown-linux-gnu
        jammi-aarch64-apple-darwin
        server-cpu-x86_64-tarball
        server-cpu-aarch64-tarball
        server-cu12-x86_64-tarball

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read

  promote:
    name: Attach ${{ matrix.artifact }}
    needs: [artifacts, proof]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        # Each artifact holds exactly one tarball, named by
        # `package_release_bin.sh` / `package_server_tarball.sh` from the
        # tree's own version.
        artifact:
          - jammi-x86_64-unknown-linux-gnu
          - jammi-aarch64-unknown-linux-gnu
          - jammi-aarch64-apple-darwin
          - server-cpu-x86_64-tarball
          - server-cpu-aarch64-tarball
          - server-cu12-x86_64-tarball
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - name: The one asset the artifact holds
        id: asset
        run: |
          set -euo pipefail
          assets=(*.tar.gz)
          [ "${#assets[@]}" -eq 1 ] || { echo "::error::expected one tarball, found: ${assets[*]}" >&2; exit 1; }
          echo "asset=${assets[0]}" >> "$GITHUB_OUTPUT"

      # Before the upload: the attestation's subject is the exact bytes attached.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.asset.outputs.asset }}

      - uses: ./.github/actions/release-upload
        with:
          asset: ${{ steps.asset.outputs.asset }}
