name: _ci-base-image

# Reusable CI base-image builder. The CPU base (jammi-ai-ci) and the CUDA base
# (jammi-ai-ci-cuda) build identically — same login → metadata → build-push —
# differing only in the image name and the Dockerfile. One reusable, two thin
# callers (image.yml / image-cuda.yml), instead of two byte-identical workflows.
#
# Every consumer's `container:` field (and workflow-call `container_image`
# input) resolves the image via a repo variable with a literal `:latest`
# fallback: `${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}`
# (resp. `JAMMI_CI_IMAGE_CUDA` for the CUDA base).
#
# Consumers track `:latest`, deliberately. This workflow does NOT rewrite those
# variables to the sha tag it just pushed, and a step that tried to was removed:
# GITHUB_TOKEN cannot write repo variables at all (403 "Resource not accessible
# by integration" on both create and update), and no `permissions:` block can
# grant it — repo variables need `administration: write`, which is not available
# to GITHUB_TOKEN. Re-adding sha-pinning therefore means introducing a PAT, not
# adjusting permissions. Do not "fix" the failure by making such a step
# non-fatal; that converts a broken pin into a silent one.
#
# The `sha-<commit>` tag is still published, so a specific build can be pinned by
# hand (set the repo variable to it) when a bisect or a reproduction needs it.

on:
  workflow_call:
    inputs:
      image_suffix:
        description: "ghcr image-name suffix appended to the repo: 'ci' or 'ci-cuda'."
        type: string
        required: true
      dockerfile:
        description: "Dockerfile to build (build context is .docker/)."
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          # `latest` is what every consumer's `vars.JAMMI_CI_IMAGE[_CUDA] ||
          # 'ghcr.io/...:latest'` expression resolves to, and what the repo
          # variables are set to — the toolchain layer the crates.io publish
          # and the release lanes build inside. It therefore only moves from
          # the DEFAULT branch (`enable={{is_default_branch}}`): a dispatch on
          # a feature branch publishes the immutable `sha-<sha>` handle only,
          # never repoints the channel every release lane consumes.
          # `type=sha,format=long` is published alongside as an immutable
          # handle for pinning a build by hand.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      # rust-toolchain.toml is the single source of truth for the pin. The build
      # context is `.docker/`, so the file cannot be COPYed into the image —
      # it is read here and passed as a build-arg instead. Without this the
      # Dockerfile would carry its own copy of the version, and a bump to
      # rust-toolchain.toml would trigger a rebuild that faithfully reproduced
      # the OLD pin and reported success.
      - name: Resolve the pinned Rust toolchain
        id: rust-pin
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bash ci/scripts/rust_pin.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned Rust: $channel"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .docker
          file: ${{ inputs.dockerfile }}
          push: true
          build-args: |
            RUST_VERSION=${{ steps.rust-pin.outputs.channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
