name: Image (CI base, CPU)

# Builds the CPU CI base image (jammi-ai-ci) that the CPU workflows run inside.
# Thin caller of the shared _ci-base-image reusable. Rebuilds on a change to its
# own Dockerfile or the pinned toolchain (narrowed from `.docker/**` so a
# CUDA-only Dockerfile change no longer needlessly rebuilds the CPU base).

on:
  push:
    branches: [main]
    paths:
      - ".docker/ci.Dockerfile"
      - "rust-toolchain.toml"
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/_ci-base-image.yml
    with:
      image_suffix: ci
      dockerfile: .docker/ci.Dockerfile
