name: Cookbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run includes the slow + integration recipes (fine_tune, flight_sql).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: cookbook-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  smoke:
    name: Smoke (fast)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # `jammi.connect` needs both lockstep dists — the base client `jammi-ai`
      # (import `jammi`) and the compiled `jammi-ai-native` engine (`maturin
      # develop`, importable as `jammi_native`), which the base discovers as
      # its `file://` backend. The shared setup-jammi-py action owns the
      # venv/maturin mechanics.
      - name: Build wheel + venv
        uses: ./.github/actions/setup-jammi-py

      - name: Run cookbook smoke
        run: |
          . .venv/bin/activate
          python tests/cookbook_smoke.py

  smoke-slow:
    name: Smoke (slow + integration)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # `flight_sql` shells out to `target/release/jammi-server`; build it
      # (`build-server`) before invoking the smoke runner. `jammi.connect`
      # needs both lockstep dists — the base client `jammi-ai` and the
      # compiled `jammi-ai-native` engine (`maturin develop`, importable as
      # `jammi_native`). The shared setup-jammi-py action owns the
      # venv/maturin mechanics.
      - name: Build wheel + jammi-server binary
        uses: ./.github/actions/setup-jammi-py
        with:
          build-server: "true"

      - name: Run cookbook smoke (all recipes)
        env:
          JAMMI_COOKBOOK_SLOW: "1"
        run: |
          . .venv/bin/activate
          python tests/cookbook_smoke.py
