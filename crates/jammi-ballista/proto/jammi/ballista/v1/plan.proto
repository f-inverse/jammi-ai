// The jammi.ballista.v1 wire: the physical-plan operator descriptors
// `JammiCodec` carries across a Ballista scheduler/executor boundary.
//
// NOT the frozen `jammi.v1` surface (`crates/jammi-wire`): this package is
// owned by `jammi-ballista` alone, crosses only between processes of the
// SAME jammi deployment (never a client), and is free to change in lockstep
// with the codec that reads it. Messages only — no service (the codec calls
// `Message::encode`/`decode` directly on a byte buffer behind a 4-byte magic
// prefix `jammi-ballista`'s own `codec.rs` writes, never a gRPC call).
syntax = "proto3";

package jammi.ballista.v1;

// `ModelSource`'s two constructible variants (`jammi_ai::model::ModelSource`
// is not itself `Deserialize`; its accessor is re-exposed here by
// constituent fields the codec rebuilds through `ModelSource::hf`/`::local`).
message ModelSource {
  oneof source {
    string hugging_face = 1;
    string local = 2;
  }
}

// `InferenceExec`'s `InferenceSpec` (`jammi_ai::operator::inference_exec`).
// The child plan is NOT carried here — the generic physical-plan-to-proto
// framework encodes/decodes it via `ExecutionPlan::children()` /
// `PhysicalExtensionCodec::try_decode`'s own `inputs` slice
// (`datafusion-proto-54.1.0/src/physical_plan/mod.rs:672-697`); the model
// cache and observer are the DECODING session's own, never the encoding
// one's.
message InferenceExecNode {
  ModelSource source = 1;
  // `ModelTask::as_db_str()` — the catalog's own canonical spelling.
  string task = 2;
  repeated string content_columns = 3;
  string key_column = 4;
  string source_id = 5;
  // `BackendType` via `serde_json` (already `Serialize`/`Deserialize`),
  // absent when unset.
  optional string backend_json = 6;
  uint64 batch_size = 7;
  optional uint64 embedding_dim = 8;
  // `DistributionForm` via `serde_json` (already `Serialize`/`Deserialize`).
  optional string regression_form_json = 9;
  repeated string passthrough = 10;
  // The device KIND this descriptor must run on ("cpu"|"cuda"|"metal"):
  // exactly the value the node was constructed with. The codec never invents
  // or rewrites it.
  string device_kind = 11;
  // The fan-out the node declares: how many partitions forward chunks
  // concurrently.
  uint64 partitions = 12;
}

// `NumberedInputExec`'s construction input (`jammi_ai::operator::
// numbered_input_exec`): the order it numbers its single child's rows in.
message NumberedInputExecNode {
  // The key column of the keyed total order. Absent: rows are numbered in
  // arrival order.
  optional string key_column = 1;
}

// `AnnSearchExec`'s construction inputs (`jammi_ai::operator::ann_search_exec`).
// A leaf node (no children). The catalog record is NOT carried whole
// (`ResultTableRecord` is `Serialize`-only, and re-reading it re-validates
// against the live catalog rather than trusting a stale snapshot the
// scheduler serialized) — only the two fields that select it, scoped by
// tenant explicitly (never the decoding call's ambient tenant, which a
// scheduler/executor process has none of): `table_name` + `tenant_id`
// resolve through `Catalog::get_result_table_for_tenant`.
message AnnSearchExecNode {
  string table_name = 1;
  optional string tenant_id = 2;
  repeated float query_vector = 3;
  uint64 k = 4;
  optional uint64 oversample_override = 5;
}

// `AsofJoinExec`'s construction inputs (`jammi_ai::pipeline::asof::exec`).
// Two children (left, right) carried the same generic way as
// `InferenceExecNode`'s single child.
message AsofJoinExecNode {
  // `AsofJoinSpec` via `serde_json` (already `Serialize`/`Deserialize`).
  bytes spec_json = 1;
}

// `KeyCheckExec`'s construction inputs (`jammi_ai::operator::key_check_exec`).
message KeyCheckExecNode {
  string key_column = 1;
}

// `GangExec`'s construction inputs.
message GangExecNode {
  string job_id = 1;
  uint32 attempt = 2;
  uint32 world = 3;
  string submitter = 4;
  // The device KIND this gang must run on ("cpu"|"cuda"|"metal") — the
  // submitter's own `compute_device().kind()`, stamped at
  // `JobWorker::submit_placed` (KIND MATCH, the same rule
  // `InferenceExecNode.device_kind` carries).
  string device_kind = 5;
}
