            - paragraph [ref=f3e474]: As of our July 2026 verification pass, RTX 4090 spot instances start around $0.14/hour on decentralized marketplaces (batch-priority distributed capacity around $0.20/hour), and L40S starts near $0.39/hour on-demand at specialized providers. For larger models requiring 80GB VRAM, A100 80GB spot pricing was verified as low as $0.68/hour (hyperscale spot) with on-demand rates of roughly $1.21-4.10/hour depending on provider type. Actual rates vary by provider, region, availability, and interruption tolerance.
          - generic [ref=f3e475]:
            - heading "How much does an H100 GPU cost per hour?" [level=3] [ref=f3e477]
            - paragraph [ref=f3e479]: As of our July 2026 verification pass, H100 hourly rates at specialized providers ranged from about $2.46/hour (spot) to $6.16/hour (on-demand 8-GPU HGX nodes), with hyperscale on-demand rates of roughly $10.35-12.29/hour per GPU. Decentralized marketplace rates change continuously; see the live dashboard for current listings. Price differences reflect availability guarantees, support levels, and SLA commitments.
          - generic [ref=f3e480]:
            - heading "What is GPU yield score?" [level=3] [ref=f3e482]
            - paragraph [ref=f3e484]: GPU yield score is a performance-per-dollar metric calculated as Performance Index / Hourly Price. Higher scores indicate more computational output per dollar. This metric helps identify cost-efficient options but should be considered alongside workload requirements, availability needs, and performance constraints.
          - generic [ref=f3e485]:
            - heading "How do decentralized providers compare to AWS, GCP, or Azure?" [level=3] [ref=f3e487]
            - paragraph [ref=f3e489]: Decentralized GPU marketplaces often offer meaningfully lower hourly rates (sometimes 50%+ savings) than hyperscale clouds by aggregating supply from diverse sources. Trade-offs commonly include lower availability guarantees (often cited as 70-85% vs 99.9%), no enterprise SLAs, and variable network performance. Decentralized providers work well for development, batch workloads, and cost-sensitive applications, while production services requiring high reliability generally favor hyperscale or specialized providers.
          - generic [ref=f3e490]:
            - heading "What is the cost per 1M tokens for different GPUs?" [level=3] [ref=f3e492]
            - paragraph [ref=f3e494]: Cost per 1M tokens depends on GPU throughput, hourly price, model architecture, and optimization. As an example, RTX 4090 instances running smaller models may achieve costs in the $0.50-1.00 per 1M tokens range, while H100 instances can be more efficient for larger models despite higher hourly rates due to superior throughput. Use our calculator with your specific model parameters for accurate estimates.
          - generic [ref=f3e495]:
            - heading "Is it cheaper to rent or buy GPUs for AI?" [level=3] [ref=f3e497]
            - paragraph [ref=f3e499]: For workloads with consistent 24/7 utilization at 80%+ capacity, purchasing hardware may break even in approximately 8-12 months compared to cloud rental. However, ownership requires significant upfront capital, ongoing power and cooling costs, maintenance, and lacks flexibility for scaling or GPU type changes. Cloud rental generally proves more cost-effective for variable workloads, short-term projects, or when testing different GPU configurations.
