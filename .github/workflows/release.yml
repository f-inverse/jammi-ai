# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The GitHub release of a `v*` tag, behind the release gate: the prebuilt
# binaries attached with a provenance attestation over the exact bytes, and the
# `jammi-server` container images pushed to GHCR -- the CPU image's `generic`
# and `selfcontained` variants, one native leg per arch merged into the real
# tags by the one verify-then-promote definition (`merge-index`), and the CUDA
# image -- every pushed digest attested and verified. One tag policy
# (`ci/scripts/image_tags.sh`): `:X.Y.Z`, `:X.Y`, `:sha-<sha>`, `:latest`.
# Every image packages binaries the proving run built and compiles nothing.

name: Release
'on':
  push:
    tags:
      - v*
  workflow_dispatch: {}
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # The release gate: the tree's recorded verdicts, and the tag names its version.
  proof:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/verdict.py require --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

  # The ci.yml run that proved this tree, which holds what this workflow installs.
  artifacts-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ci
          ARTIFACTS: jammi-aarch64-apple-darwin jammi-aarch64-unknown-linux-gnu jammi-x86_64-unknown-linux-gnu server-cpu-aarch64-binary server-cpu-aarch64-tarball server-cpu-x86_64-binary server-cpu-x86_64-tarball server-cu12-x86_64-binary server-cu12-x86_64-tarball
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # Attaches each prebuilt asset to the GitHub release with a provenance attestation over the exact bytes; whichever asset arrives first creates the release.
  release-binaries:
    name: Attach ${{ matrix.artifact }}
    needs:
      - artifacts-ci
      - proof
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: jammi-x86_64-unknown-linux-gnu
          - artifact: jammi-aarch64-unknown-linux-gnu
          - artifact: jammi-aarch64-apple-darwin
          - artifact: server-cpu-x86_64-tarball
          - artifact: server-cpu-aarch64-tarball
          - artifact: server-cu12-x86_64-tarball
    env:
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ matrix.artifact }}
          path: .
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - name: The one asset the artifact holds
        id: asset
        run: |
          assets=(*.tar.gz)
          [ "${#assets[@]}" -eq 1 ] || { echo "::error::expected one tarball, found: ${assets[*]}" >&2; exit 1; }
          echo "asset=${assets[0]}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/release-upload
        with:
          asset: ${{ steps.asset.outputs.asset }}

  # The CPU image's variant x arch legs, each packaging the proving run's binaries and pushing only its own immutable commit tag, attested and verified.
  server-image-cpu:
    name: Push ${{ matrix.variant }} (${{ matrix.arch }})
    needs:
      - artifacts-ci
      - proof
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic
            arch: amd64
            triple: x86_64-unknown-linux-gnu
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: generic
            arch: arm64
            triple: aarch64-unknown-linux-gnu
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - variant: selfcontained
            arch: amd64
            triple: x86_64-unknown-linux-gnu
            target: x86_64
            platform: linux/amd64
            runner: ubuntu-latest
          - variant: selfcontained
            arch: arm64
            triple: aarch64-unknown-linux-gnu
            target: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/jammi-ai-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The leg's tag
        id: leg
        run: '{ echo ''tags<<EOF''; bash ci/scripts/image_tags.sh "$VARIANT" --immutable; echo EOF; } >> "$GITHUB_OUTPUT"'
        env:
          VARIANT: ${{ matrix.variant }}
      - id: binaries
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cpu-${{ matrix.target }}-binary
          cli: jammi-${{ matrix.triple }}
          stage: builder
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - uses: ./.github/actions/push-image-leg
        with:
          image: ${{ env.IMAGE }}
          tags-spec: ${{ steps.leg.outputs.tags }}
          tag-suffix: ${{ matrix.arch }}
          build-args: |
            RUNTIME_VARIANT=runtime-${{ matrix.variant }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          platforms: ${{ matrix.platform }}
          cache-scope: cpu-${{ matrix.variant }}-${{ matrix.arch }}

  # Merges each CPU variant's per-arch legs into the real tags through the one verify-then-promote definition, and attests the merged digest.
  server-image-cpu-merge:
    name: Merge ${{ matrix.variant }}
    needs:
      - proof
      - server-image-cpu
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: generic
          - variant: selfcontained
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/jammi-ai-server
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The variant's tag policy
        id: policy
        run: '{ echo ''tags<<EOF''; bash ci/scripts/image_tags.sh "$VARIANT"; echo EOF; } >> "$GITHUB_OUTPUT"'
        env:
          VARIANT: ${{ matrix.variant }}
      - uses: ./.github/actions/merge-index
        with:
          image: ${{ env.IMAGE }}
          platforms: linux/amd64,linux/arm64
          tags-spec: ${{ steps.policy.outputs.tags }}
          variant: ${{ matrix.variant }}
          attest: 'true'

  # The CUDA image, one amd64 leg (its runtime base publishes no arm64), packaging the proving run's CUDA binary under the one tag policy, attested and verified.
  server-image-cuda:
    name: Push CUDA image
    needs:
      - artifacts-ci
      - proof
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      actions: read
    env:
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/jammi-ai-server-cu12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: binaries
        uses: ./.github/actions/stage-server-binaries
        with:
          server: server-cu12-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder-cuda
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
      - name: The image's tags
        id: tags
        run: '{ echo ''tags<<EOF''; bash ci/scripts/image_tags.sh cuda; echo EOF; } >> "$GITHUB_OUTPUT"'
      - uses: ./.github/actions/push-image-leg
        with:
          image: ${{ env.IMAGE }}
          tags-spec: ${{ steps.tags.outputs.tags }}
          build-args: |
            RUNTIME_VARIANT=runtime-cuda
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          platforms: linux/amd64
          cache-scope: cu12
