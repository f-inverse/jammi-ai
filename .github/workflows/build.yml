name: Build

# The tree's release candidate: every artifact a release promotes, compiled
# once, and run as a user runs it.
#
# Every pull request, whatever its base, and every push to `main`, beside
# `ci.yml` (the merge gate) on the same event. A run proves a tree, never a
# commit: `plan` records the tree (`record-subject`) and asks whether a run
# of this workflow already proved it (`verdict.py probe --lane build`). The
# artifacts are compiled on every run, each by the reusable workflow its
# publisher promotes from (`_native-wheels.yml`, `_native-wheel-cu12.yml`,
# `_server.yml`, `_cli.yml`, `_client-wheel.yml`), because `main`'s run
# writes the compile cache every pull request reads; the jobs that exercise
# them as a user would — the Python lanes, the client against a live server,
# the image check, the deploy-shape smokes, the book's static checks — skip
# on a proven tree. Nothing here compiles twice: a consumer installs the
# bytes this run built (`install-jammi`, `stage-server-binaries`).
#
# A release promotes this workflow's artifacts (`_proven-artifacts.yml`, lane
# `build`) and requires its summary green on the released tree
# (`_proof-required.yml`), beside `ci.yml`'s, the GPU prove's and the
# cookbook's. The cookbook lane (`cookbook-gpu.yml`) installs the same builds
# on a GPU. The CI images the jobs run in are `ci.yml`'s to build; this
# workflow waits for them (`_ci-image.yml`).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu cuda

  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      proven: ${{ steps.verdict.outputs.proven }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: subject
        uses: ./.github/actions/record-subject

      - name: Whether a run already proved this tree
        id: verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE: ${{ steps.subject.outputs.tree }}
        run: python3 ci/scripts/verdict.py probe --lane build --repo "$GITHUB_REPOSITORY" --tree "$TREE" | tee -a "$GITHUB_OUTPUT"


  # ── The artifacts, each compiled once ─────────────────────────────────────
  # Through the definitions a release promotes from, so a wheel or binary that
  # stops building, or a wheel that outgrows PyPI's per-file limit, fails the
  # change that caused it. Compiling jobs: they run on a proven tree too, and
  # `main`'s run writes the cache every pull request reads. Split per
  # consumer set.
  native-wheel-linux-x86_64:
    name: Native wheel (Linux x86_64)
    needs: ci-image
    uses: ./.github/workflows/_native-wheels.yml
    with:
      platforms: linux-x86_64
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  native-wheels:
    name: Native wheels
    needs: ci-image
    uses: ./.github/workflows/_native-wheels.yml
    with:
      platforms: linux-aarch64 macos-arm64 macos-x86_64
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  native-wheel-cu12:
    name: Native wheel (CUDA)
    needs: ci-image
    uses: ./.github/workflows/_native-wheel-cu12.yml
    with:
      cuda-image: ${{ needs.ci-image.outputs.cuda }}


  server-cpu-x86_64:
    name: Server (CPU, x86_64)
    needs: ci-image
    uses: ./.github/workflows/_server.yml
    with:
      build: server-cpu
      arch: x86_64
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  server-cpu-aarch64:
    name: Server (CPU, aarch64)
    needs: ci-image
    uses: ./.github/workflows/_server.yml
    with:
      build: server-cpu
      arch: aarch64
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  server-cu12:
    name: Server (CUDA)
    needs: ci-image
    uses: ./.github/workflows/_server.yml
    with:
      build: server-cu12
      arch: x86_64
      cpu-image: ${{ needs.ci-image.outputs.cpu }}
      cuda-image: ${{ needs.ci-image.outputs.cuda }}


  cli-x86_64:
    name: CLI (x86_64)
    needs: ci-image
    uses: ./.github/workflows/_cli.yml
    with:
      targets: x86_64-unknown-linux-gnu
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  cli-aarch64:
    name: CLI (aarch64)
    needs: ci-image
    uses: ./.github/workflows/_cli.yml
    with:
      targets: aarch64-unknown-linux-gnu
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  # The macOS CLI nothing here runs: built so a release promotes it from the
  # run that proved its tree, like every other asset.
  cli-macos:
    name: CLI (macOS)
    needs: ci-image
    uses: ./.github/workflows/_cli.yml
    with:
      targets: aarch64-apple-darwin
      cpu-image: ${{ needs.ci-image.outputs.cpu }}


  client-wheel:
    name: Client wheel
    uses: ./.github/workflows/_client-wheel.yml


  # `@f-inverse/jammi-client` is generated from `crates/jammi-wire/proto` by
  # `buf generate` (in `npm run build`), type-checked, tested and packed: the
  # tarball `npm.yml` publishes, at the Node version `clients/typescript/.nvmrc`
  # pins for both.
  ts-client:
    name: TS client (@f-inverse/jammi-client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: clients/typescript/.nvmrc

      - name: Install
        run: npm ci

      - name: Build (generate + tsc)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test (hermetic)
        run: npm run test

      # `--pack-destination` must exist: npm refuses a missing directory.
      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/ts-client"
          npm pack --pack-destination "$RUNNER_TEMP/ts-client"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-client-package
          path: ${{ runner.temp }}/ts-client/*.tgz


  # ── The guide and the API reference ───────────────────────────────────────
  # The guide, with every Rust example in it compiled and run against the
  # workspace, and the rustdoc of every crate: built once per tree, as the
  # site a release publishes (`pages.yml`), beside the book `cookbook-gpu.yml`
  # renders.
  docs:
    name: Guide and API reference
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci

      - name: Build the guide
        run: mdbook build docs/guide

      - name: Build the workspace the guide's examples link against
        run: cargo build --workspace --exclude jammi-python --quiet

      # mdbook compiles each example in a temp dir where rustup cannot find
      # rust-toolchain.toml by walking up, so the example compiler is pinned
      # to the workspace's.
      - name: Test the guide's examples
        run: |
          RUSTUP_TOOLCHAIN="$(bash ci/scripts/rust_pin.sh)"
          export RUSTUP_TOOLCHAIN
          mdbook test docs/guide -L "${CARGO_TARGET_DIR:-target}/debug/deps"

      - name: Build the API reference
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --exclude jammi-python --no-deps

      - name: Lay out the site
        run: |
          mkdir -p _site
          cp -r docs/guide/book/. _site/
          cp -r "${CARGO_TARGET_DIR:-target}/doc" _site/api

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: _site


  # The pytest suite drives the two dists that ship in lockstep — the client
  # wheel `jammi-ai` (import `jammi`) and the compiled engine
  # `jammi-ai-native` (import `jammi_native`) this run built, which the client
  # discovers as its `file://` backend — as a reader installs them.
  test-python:
    name: Test (Python)
    runs-on: ubuntu-latest
    needs: [ci-image, plan, native-wheel-linux-x86_64, client-wheel]
    if: needs.plan.outputs.proven != 'true'
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-jammi
        with:
          extra-pip-packages: pytest

      - name: Run pytest
        run: pytest crates/jammi-python/tests -v

      # The client tests that need the engine; the ones that also need a
      # server run in `client-live`.
      - name: Python client suite (with the embedded engine)
        run: make -C clients/python test-embedded

      - name: Run UAT shape-B/C Python scripts
        run: |
          for script in tests/uat/shape_b_*.py tests/uat/shape_c_*.py; do
            echo "=== $script ==="
            python3 "$script"
          done


  # ── The Python client against a live server ────────────────────────────────
  # The client's live-server suite, over this run's engine, server and CLI and
  # the engine's test checkpoints (`tests/fixtures`). The cookbook's recipes
  # and chapters run real Hub models, so they run on a GPU in the cookbook
  # lane (`cookbook-gpu.yml`), never in this hermetic workflow.
  client-live:
    name: Python client against a live server
    needs: [ci-image, plan, native-wheel-linux-x86_64, client-wheel, server-cpu-x86_64, cli-x86_64]
    if: needs.plan.outputs.proven != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-jammi
        with:
          binaries: "true"

      - name: Python client suite against a live server
        run: make -C clients/python test-live


  # GPU runtime is not testable here; packaging the CUDA image from this
  # run's CUDA binary proves its runtime stage assembles before a tag
  # publishes it.
  server-image-cuda:
    name: Server image (CUDA)
    needs: [plan, server-cu12, cli-x86_64]
    if: needs.plan.outputs.proven != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/stage-server-binaries
        id: binaries
        with:
          server: server-cu12-x86_64-binary
          cli: jammi-x86_64-unknown-linux-gnu
          stage: builder-cuda

      - uses: ./.github/actions/build-image
        with:
          build-args: |
            RUNTIME_VARIANT=runtime-cuda
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          # The CUDA runtime base publishes amd64 only.
          platforms: linux/amd64
          cache-scope: cu12


  # ── The deploy shapes, over this run's binaries ───────────────────────────
  kube-smoke:
    needs: [plan, server-cpu-x86_64, cli-x86_64, client-wheel]
    if: needs.plan.outputs.proven != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/kube-smoke.yml
    with:
      run-id: ${{ github.run_id }}


  compose-smoke:
    needs: [plan, server-cpu-x86_64, server-cpu-aarch64, cli-x86_64, cli-aarch64, client-wheel]
    if: needs.plan.outputs.proven != 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/compose-smoke.yml
    with:
      run-id: ${{ github.run_id }}


  # ── The book ───────────────────────────────────────────────────────────────
  # The book's checks that need no model: its API reference against the
  # engine, its library's lint and unit tests, the no-deferral gate and its
  # citations. Every chapter runs real Hub models, so the chapters render, and
  # the book a release publishes is assembled, in the cookbook lane
  # (`cookbook-gpu.yml`). Every public verb is run by a recipe or an executed
  # chapter cell: the guard `ci/scripts/check_cookbook_coverage.py`.
  book-checks:
    name: Book (API reference, lint, unit tests, citations)
    needs: [ci-image, plan, native-wheel-linux-x86_64, client-wheel]
    if: needs.plan.outputs.proven != 'true'
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    defaults:
      run:
        working-directory: cookbook/book
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install-jammi

      - name: Install the book
        run: pip install -e '.[book,dev]'

      - name: API reference matches the engine
        run: python -m jammi.session_journal -- python scripts/check_api_reference.py

      - name: Lint
        run: ruff check jammi_cookbook scripts tests

      - name: Shared-lib unit tests
        run: pytest -q

      - name: No-deferral gate
        run: bash scripts/no_deferral_grep.sh

      - name: No dangling citations
        run: python -m jammi.session_journal -- python scripts/check_citations.py

  # ── Single rolled-up gate ──────────────────────────────────────────────────
  # The one check a branch-protection ruleset requires of this workflow. It
  # fails if any job above failed or was cancelled; a `skipped` job — a
  # consumer whose tree `plan` found proven — counts as a pass. `verdict.py`'s
  # BUILD_SUMMARY_JOB names this job: a release gates on its most recent
  # result over the released tree, and promotes that run's artifacts.
  build-summary:
    needs:
      - ci-image
      - plan
      - native-wheel-linux-x86_64
      - native-wheels
      - native-wheel-cu12
      - server-cpu-x86_64
      - server-cpu-aarch64
      - server-cu12
      - cli-x86_64
      - cli-aarch64
      - cli-macos
      - client-wheel
      - ts-client
      - docs
      - test-python
      - client-live
      - server-image-cuda
      - kube-smoke
      - compose-smoke
      - book-checks
    if: always()
    uses: ./.github/workflows/_summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
