name: Distributed validation

# The multi-process distributed-validation lane: N `jammi-server` worker
# processes claiming from a shared Postgres catalog + a shared object store
# (the lane's S3-class store), proving the durable-worker fleet-safety
# properties, the compute plane and the ladder's fleet rungs under real
# distribution.
#
# One job, four matrix legs split by what decides their outcome (each leg
# provisions its own Postgres + S3 store so they stay independent):
#
#   * `deterministic` — the claim-correctness tests (exactly-one claim,
#     cross-tenant isolation), decided by Postgres locking.
#   * `chaos` — the SIGKILL crash-window tests (kill-9 reclaim, the
#     publish/finalize crash, the cross-host artifact round-trip). They race a
#     kill against an in-flight publish, but their outcome does not depend on
#     where the kill lands: `crash_between_publish_and_finalize_commits_only_
#     the_winner` derives its expected prefix through `ArtifactStore::
#     prefix_url` (the same function `put_artifact` lays a bundle out
#     through), never a hand-built layout string.
#   * `ballista` — the compute-plane tests (three `jammi-server` processes
#     hosting a Ballista scheduler and executors over the shared catalog),
#     decided by catalog CAS and Ballista's own task binding.
#   * `rungs` — the ladder's fleet rungs (`placed`, `shape-d`) of every
#     workload that has them.
#
# Every leg is a verdict: a red is a regression. `ci.yml` calls this workflow
# on every pull request and every push to `main`, inside the `ci-summary`
# check a merge requires; the nightly run re-proves `main` against the
# moving CI image.
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    # Nightly at 04:17 UTC — off-peak, and offset from round hours to avoid the
    # cron stampede when many repos fire at :00.
    - cron: "17 4 * * *"

concurrency:
  # Called from `ci.yml`, `github.workflow` is the caller's, so a merge's run
  # and the nightly one never share a group; as in `ci.yml`, a run on `main`
  # is never cancelled — it is the only evidence that commit is green.
  group: distributed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  distributed:
    name: ${{ matrix.display }} (Postgres + S3 store)
    runs-on: ubuntu-latest
    strategy:
      # One leg's failure must not cancel another: each carries its own signal.
      fail-fast: false
      matrix:
        include:
          # Decided by Postgres locking, not a timing window.
          - name: deterministic
            display: Deterministic claim correctness
            crate: jammi-ai
            tests: >-
              one_job_n_workers_exactly_one_wins
              mixed_tenant_queue_completes_each_under_its_own_scope
              rendezvous_placed_search_over_real_worker_processes
          # The two `gang_chaos` rows SIGKILL
          # one process of a two-rank gang (a peer, then the coordinator)
          # and need the server's rank body for the cross-process gang to
          # complete.
          - name: chaos
            display: SIGKILL crash-window chaos
            crate: jammi-ai
            tests: >-
              killed_worker_job_is_reclaimed_and_completed_once
              crash_between_publish_and_finalize_commits_only_the_winner
              artifact_written_on_worker_is_readable_by_a_different_client
              killed_peer_job_is_reclaimed_and_completed_by_a_new_gang
              killed_coordinator_job_is_reclaimed_and_completed_by_a_new_gang
          # The Ballista compute-plane lane: a real three(+)-process
          # `jammi-server` fleet with `[ballista]` roles configured, proving
          # embedding-across-two-executors (at a fan-out of one and of four),
          # placed-gang-completes-elsewhere, a context predictor placed on an
          # executor that claims nothing (byte-identical to in-process),
          # killed-executor-mid-gang reclaim, scheduler restart, two
          # schedulers over one catalog, the device-less/KIND-MATCH refusal,
          # a placed task's typed failure (a refused null key classifying as
          # the in-process one; a placed gang's missing source on the row and
          # to the submitter), a client-role query tier's batch statement (a
          # `CREATE TABLE AS` over Flight SQL written on an executor as a
          # result table byte-identical to in-process and read on another
          # query tier, a `SELECT` never submitting, a routed refusal raising
          # the in-process error), an embedding job's sink routed from a
          # client-role claimant to an executor, a killed executor mid-write
          # reclaimed by the lease path and the re-run identical,
          # and `list_workers`/`list_compute_executor_devices`
          # device reporting. Not a SIGKILL-race chaos leg (the killed-executor test
          # IS a SIGKILL test, but its completion is driven by jammi's lease
          # timer, not a publish-window race).
          - name: ballista
            display: Ballista compute plane (three processes)
            crate: jammi-ballista
            tests: >-
              embedding_job_across_two_executors_matches_in_process
              embedding_job_fanned_out_four_ways_matches_in_process
              placed_gang_completes_on_a_registered_executor_other_than_the_submitter
              a_context_predictor_job_completes_on_an_executor_that_claims_nothing
              a_placed_task_reports_completion_to_the_advertised_scheduler_and_frees_its_slot
              killed_executor_mid_gang_leaves_the_row_for_reclaim_then_a_successor_completes
              scheduler_restart_keeps_executors_and_serves_a_new_job
              two_schedulers_over_one_catalog_serve_jobs_sequentially
              device_less_cluster_refuses_gpu_bound_plan_and_accepts_cpu_plan
              placed_inference_refusing_a_null_key_classifies_as_the_in_process_one
              placed_gang_over_a_removed_source_fails_typed_on_the_row_and_to_the_submitter
              create_table_as_over_flight_sql_runs_on_the_compute_plane_and_matches_in_process
              select_over_flight_sql_on_a_client_never_submits_a_compute_job
              routed_create_table_as_refusing_a_null_key_raises_the_in_process_error
              embedding_job_on_a_client_routes_its_sink_to_an_executor_and_matches_in_process
              graph_jobs_on_a_client_run_on_an_executor_and_match_in_process
              killed_executor_mid_sink_write_is_reclaimed_and_a_rerun_writes_the_identical_table
              list_workers_and_compute_executor_devices_report_registered_devices
              free_port_stays_below_the_ephemeral_floor_and_never_repeats
          # The ladder's rungs above the in-process ones: every train-run
          # rung publishes one adapter digest, every encode rung serves one
          # vectors digest, a placed propagation writes the plan's vectors
          # and every predictor-train-run rung publishes one predictor, on
          # fleets the bench spawns through the same facility the ballista
          # lane spawns its own.
          - name: rungs
            display: Ladder rungs on a fleet (placed, shape-d)
            crate: jammi-bench
            tests: >-
              every_train_run_rung_publishes_the_same_adapter
              every_encode_rung_serves_the_same_vectors
              a_placed_propagation_matches_the_plan
              every_predictor_train_run_rung_publishes_the_same_predictor
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: >-
          --health-cmd "pg_isready -U jammi -d jammi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      # Service container is reachable at `postgres` from the job container
      # (same Docker network); the catalog connects via sqlx::PgPool.
      JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
      # The S3-class store runs in-job (see the start step) and binds
      # 127.0.0.1:9000 inside the job container, so the harness and the spawned
      # workers all reach it on localhost; its endpoint, bucket and credentials
      # enter the environment from `ci/scripts/s3_test_store.sh env`.
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Cache the pinned S3 store binary
        uses: actions/cache@v4
        with:
          path: /opt/s3-test-store
          key: s3-test-store-${{ hashFiles('ci/scripts/s3_test_store.sh') }}

      - name: Start the S3-class store
        # GHA `services:` cannot start a gateway over a directory that already
        # holds the lane's bucket, so the store runs in-job from the pinned
        # binary — the one definition `ci/dev.sh --with s3` and a GPU pod run
        # too — and the lane's variables come from that script, never a second
        # spelling here.
        shell: bash
        run: |
          set -euo pipefail
          export JAMMI_S3_STORE_DIR=/opt/s3-test-store
          ci/scripts/s3_test_store.sh start --addr 127.0.0.1:9000 --data /tmp/s3-test-store
          ci/scripts/s3_test_store.sh env --addr 127.0.0.1:9000 >> "$GITHUB_ENV"

      - name: Require the distributed backends (no hollow green)
        # The harness early-returns to a silent pass when any of these is unset
        # (`Backends::from_env_or_skip` → None, harness.rs). On this lane the
        # backends are always provisioned (Postgres service + the in-job S3 store), so a
        # missing var means the lane is misconfigured, not legitimately skipped —
        # fail loudly instead of reporting a green run that exercised nothing.
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in JAMMI_TEST_PG_URL JAMMI_TEST_S3_ENDPOINT JAMMI_TEST_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty — the distributed lane would skip silently (hollow green)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build the `jammi-server` binary
        # The harness spawns `jammi-server` worker processes and resolves the
        # binary next to the test executable under `{target}/{profile}/`. Build
        # it explicitly so it exists before the harness runs. `storage-s3` is
        # required: each worker writes its trained-model artifact to the shared
        # `s3://` store root, which needs the S3 object-store driver compiled in —
        # without it a worker claims the job, trains, then fails the publish with
        # `SchemeNotEnabled`, and the job never reaches `completed`. The driver
        # lives on the server (the CLI is a strict wire client), so the feature
        # is enabled here.
        run: cargo build -p jammi-server --bin jammi-server --features storage-s3

      - name: Compile-check the distributed harness
        run: cargo test -p ${{ matrix.crate }} --features live-distributed-tests --test distributed --no-run

      # One test at a time: each spawns its own worker fleet against the shared
      # catalog and bucket. Every filter must run at least one test — one that
      # matches nothing exits 0 having run nothing. `check_distributed_legs.py`
      # asserts every distributed test is named by exactly one leg.
      - name: Run the ${{ matrix.name }} tests
        run: |
          for t in ${{ matrix.tests }}; do
            out="$(cargo test -p ${{ matrix.crate }} --features live-distributed-tests --test distributed -- --test-threads=1 "$t" 2>&1)" \
              || { echo "$out"; exit 1; }
            echo "$out"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$out" \
              || { echo "::error::filter '$t' ran no test"; exit 1; }
          done

      - name: S3 store log (on failure)
        if: failure()
        run: cat /tmp/s3-test-store/.log || true
