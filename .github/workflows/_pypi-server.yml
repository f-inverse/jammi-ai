name: _pypi-server

# Reusable jammi-server build pipeline: build the binary (in the CI base
# image, at the given container/feature set) -> package + relabel the wheel to
# its real manylinux platform tag (NO auditwheel — the CUDA leg's CUDA `.so`s
# are deliberately left unvendored, arriving instead via the `nvidia-*-cu12`
# dependency wheels at install time; the CPU leg has nothing to vendor either)
# -> optionally prove on a real A100 (`run_gpu_prove`). One reusable, two thin
# callers (pypi-server.yml / pypi-server-cuda.yml) instead of two
# near-identical workflows.
#
# The PyPI publish step deliberately lives in each CALLER, not here: PyPI
# trusted publishing matches the OIDC token's `job_workflow_ref` (the CALLED
# file) while its PEP-740 attestation verification matches the Sigstore
# cert's Build Config URI (the CALLER file) — a publish from inside a
# reusable workflow can never satisfy both checks at once, whichever filename
# the PyPI publisher is registered under
# (https://github.com/pypa/gh-action-pypi-publish/issues/166). Each caller
# publishes the `${artifact_prefix}-dist` artifact this workflow uploads, and
# the PyPI trusted publisher is registered under the CALLER's filename.

on:
  workflow_call:
    inputs:
      container_image:
        description: "CI base image the binary is built in (manylinux_2_28 floor)."
        type: string
        required: true
      cargo_features:
        description: "Comma-separated cargo features for the jammi-server binary build."
        type: string
        required: true
      rustflags:
        description: >
          RUSTFLAGS for the binary build, passed through to setup-rust-ci.
          Both legs currently leave RUSTFLAGS unset upstream (falling back to
          .cargo/config.toml's per-target mold default), hence the default.
        type: string
        required: false
        default: "-C link-arg=-fuse-ld=mold"
      package_dir:
        description: "The wheel package directory (e.g. packaging/server-cpu, packaging/server-cu12)."
        type: string
        required: true
      platform_tag:
        description: "The manylinux platform tag the built binary actually requires."
        type: string
        required: false
        default: "manylinux_2_28_x86_64"
      artifact_prefix:
        description: "Prefix for the uploaded workflow artifacts (e.g. server-cpu, server-cu12)."
        type: string
        required: true
      verify_link_set:
        description: >
          Run `${package_dir}/verify_link_set.py` against the stripped binary —
          the CUDA leg's DT_NEEDED-coverage check (the CPU leg carries no such
          script and leaves this false).
        type: boolean
        required: false
        default: false
      run_gpu_prove:
        description: "Gate publish behind the shared A100 prove-gate (build -> prove -> promote)."
        type: boolean
        required: false
        default: false
      init_cutlass_submodule:
        description: >
          Init the vendored CUTLASS submodule (crates/jammi-kernels/third_party/
          cutlass) before the binary build — required when `cargo_features`
          includes `flash-attn` (the cu12 CUDA wheel lane). Default false, so
          the CPU wheel caller (`pypi-server.yml`) stays byte-unaffected: it
          never sets this input and this step no-ops for it.
        type: boolean
        required: false
        default: false

# Least privilege: nothing in this reusable publishes, so no job here needs
# `id-token: write` — that lives on each caller's own publish job.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binary:
    name: Build jammi-server binary
    runs-on: ubuntu-latest
    container: ${{ inputs.container_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately NOT `submodules: recursive` — a targeted init below
          # (only when `init_cutlass_submodule` is set) keeps the scope
          # auditable and leaves the CPU wheel caller's checkout untouched.
          submodules: false

      # `flash-attn` (the cu12 CUDA wheel lane's manifest-declared feature)
      # needs the vendored CUTLASS submodule at build time (`build.rs::
      # build_flash_attn`). Scoped to this job's own checkout only, same
      # idiom as `ci.yml`'s `flash-attn-compile` job and `release-binaries.
      # yml`'s `server-cu12` job. A no-op when `init_cutlass_submodule` is
      # false (the CPU wheel lane never sets it).
      - name: Init the CUTLASS submodule (scoped to this job's checkout only)
        if: inputs.init_cutlass_submodule
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass

      - uses: ./.github/actions/setup-rust-ci
        with:
          rustflags: ${{ inputs.rustflags }}

      - name: Build jammi-server (release)
        run: cargo build --release -p jammi-server --bin jammi-server --features ${{ inputs.cargo_features }}

      - name: Strip the binary
        run: strip target/release/jammi-server

      # Fail here — not on a user's machine at execve — if the binary links a
      # library the wheel's runtime dependencies do not deliver. DT_NEEDED
      # survives stripping (it lives in .dynamic), so this checks the exact
      # bytes shipped.
      - name: Verify the runtime link set is covered by the wheel dependencies
        if: inputs.verify_link_set
        run: python3 ${{ inputs.package_dir }}/verify_link_set.py target/release/jammi-server

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-binary
          path: target/release/jammi-server

  build-wheel:
    name: Package wheel (${{ inputs.platform_tag }})
    needs: build-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-binary
          path: artifact

      # Stage the prebuilt binary into the wheel package tree. GitHub artifacts
      # do not preserve the exec bit, so re-apply it.
      - name: Stage the binary into the wheel package
        run: |
          set -euo pipefail
          cp artifact/jammi-server ${{ inputs.package_dir }}/jammi_server/bin/jammi-server
          chmod +x ${{ inputs.package_dir }}/jammi_server/bin/jammi-server

      - name: Build the wheel
        working-directory: ${{ inputs.package_dir }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install build wheel
          python -m build --wheel --outdir dist
          # A bin-bearing wheel is NOT py3-none-any (hatchling only sees the
          # Python sources); relabel to the platform tag the binary actually
          # requires so pip installs it only on a compatible host.
          python -m wheel tags --platform-tag ${{ inputs.platform_tag }} --remove dist/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix }}-dist
          path: ${{ inputs.package_dir }}/dist/

  gpu-prove:
    name: GPU prove-gate (A100)
    # Only a `py-v*` TAG ref proves-for-promotion — a tag push, or a
    # workflow_dispatch RUN ON THE TAG (the recovery path). The tag guard is
    # what makes `git_ref` below an immutable identity: the pod clones the
    # same commit build-wheel built, never a branch tip that may have moved
    # (a branch dispatch would prove one sha and publish another). A branch
    # dispatch or PR is build-only and never proves. A no-op (skipped) leg
    # when the caller doesn't request the gate (CPU).
    if: inputs.run_gpu_prove && startsWith(github.ref, 'refs/tags/py-v')
    needs: build-wheel
    uses: ./.github/workflows/_gpu-prove-gate.yml
    with:
      git_ref: ${{ github.ref_name }}
    secrets: inherit
