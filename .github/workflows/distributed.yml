name: Distributed validation

# The multi-process distributed-validation lane: N `jammi-server` worker
# processes claiming from a shared Postgres catalog + a shared object store
# (MinIO), proving the durable-worker fleet-safety properties under real
# distribution.
#
# One job, three matrix legs split by failure character (each leg re-provisions
# its own Postgres + MinIO so they stay independent):
#
#   * `deterministic` — the claim-correctness tests (exactly-one claim,
#     cross-tenant isolation). Their outcome is decided by Postgres locking,
#     not by a timing window, so a red here is a real regression signal: this
#     leg runs WITHOUT `continue-on-error` (`advisory: false`), and the
#     nightly watcher treats its failure as actionable.
#
#   * `chaos` — the SIGKILL crash-window tests (kill-9 reclaim, the
#     publish/finalize crash, the cross-host artifact round-trip). These race a
#     kill against an in-flight publish, but their outcome does not depend on
#     where the kill lands: `crash_between_publish_and_finalize_commits_only_
#     the_winner` derives its expected prefix through `ArtifactStore::
#     prefix_url` (the same function `put_artifact` lays a bundle out
#     through), never a hand-built layout string. This leg runs WITHOUT
#     `continue-on-error` (`advisory: false`), like `deterministic`.
#
#   * `ballista` — the compute-plane tests (three `jammi-server` processes
#     hosting a Ballista scheduler and executors over the shared catalog: the
#     placed gang, device-kind refusal, drain/stop). Their outcome is decided
#     by catalog CAS and Ballista's own task binding, so this leg runs WITHOUT
#     `continue-on-error` (`advisory: false`) like `deterministic`.
#
# All three are the heaviest lanes (process spawn + a real object store), so none
# is on the default hermetic PR path. There is no `pull_request` trigger: this
# lane never gates a merge (it would be branch protection by another name).
on:
  workflow_dispatch:
  schedule:
    # Nightly at 04:17 UTC — off-peak, and offset from round hours to avoid the
    # cron stampede when many repos fire at :00.
    - cron: "17 4 * * *"

concurrency:
  group: distributed-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned MinIO + mc versions, fetched from each project's GitHub release
  # (an immutable, per-release asset) and verified against the checksum the
  # release publishes, so the lane is reproducible and no "latest" reshuffle
  # can change the binary under us. `dl.min.io`'s versioned `archive/` URLs
  # answer 410 since 2025-09 (MinIO withdrew binary hosting there), which is
  # why the GitHub release is the source; the `actions/cache` step below means
  # a GitHub outage on a re-run can't red the lane either.
  MINIO_RELEASE: "RELEASE.2025-09-07T16-13-09Z"
  MINIO_SHA256: "7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f"
  MC_RELEASE: "RELEASE.2025-08-13T08-35-41Z"
  MC_SHA256: "01f866e9c5f9b87c2b09116fa5d7c06695b106242d829a8bb32990c00312e891"

jobs:
  distributed:
    name: ${{ matrix.display }} (Postgres + MinIO)
    runs-on: ubuntu-latest
    strategy:
      # One leg's failure must not cancel the other — they carry independent
      # signals (a deterministic red is actionable regardless of chaos flake).
      fail-fast: false
      matrix:
        include:
          # Decided by Postgres locking, not a timing window — a red is a real
          # regression the nightly watcher acts on.
          - name: deterministic
            display: Deterministic claim correctness
            crate: jammi-ai
            advisory: false
            tests: >-
              one_job_n_workers_exactly_one_wins
              mixed_tenant_queue_completes_each_under_its_own_scope
              rendezvous_placed_search_over_real_worker_processes
          # Not advisory (see this file's header comment). The two
          # `gang_chaos` rows SIGKILL
          # one process of a two-rank gang (a peer, then the coordinator)
          # and need the server's rank body for the cross-process gang to
          # complete.
          - name: chaos
            display: SIGKILL crash-window chaos
            crate: jammi-ai
            advisory: false
            tests: >-
              killed_worker_job_is_reclaimed_and_completed_once
              crash_between_publish_and_finalize_commits_only_the_winner
              artifact_written_on_worker_is_readable_by_a_different_client
              killed_peer_job_is_reclaimed_and_completed_by_a_new_gang
              killed_coordinator_job_is_reclaimed_and_completed_by_a_new_gang
          # The Ballista compute-plane lane: a real three(+)-process
          # `jammi-server` fleet with `[ballista]` roles configured, proving
          # embedding-across-two-executors (at a fan-out of one and of four),
          # placed-gang-completes-elsewhere,
          # killed-executor-mid-gang reclaim, scheduler restart, two
          # schedulers over one catalog, the device-less/KIND-MATCH refusal,
          # a placed task's typed failure (a refused null key classifying as
          # the in-process one; a placed gang's missing source on the row and
          # to the submitter), a client-role query tier's batch statement (a
          # `CREATE TABLE AS` over Flight SQL matching in-process, a `SELECT`
          # never submitting, a routed refusal raising the in-process error),
          # and `list_workers`/`list_compute_executor_devices`
          # device reporting. Not a SIGKILL-race chaos leg (the killed-executor test
          # IS a SIGKILL test, but its completion is driven by jammi's lease
          # timer, not a publish-window race) — `advisory: false`.
          - name: ballista
            display: Ballista compute plane (three processes)
            crate: jammi-ballista
            advisory: false
            tests: >-
              embedding_job_across_two_executors_matches_in_process
              embedding_job_fanned_out_four_ways_matches_in_process
              placed_gang_completes_on_a_registered_executor_other_than_the_submitter
              a_placed_task_reports_completion_to_the_advertised_scheduler_and_frees_its_slot
              killed_executor_mid_gang_leaves_the_row_for_reclaim_then_a_successor_completes
              scheduler_restart_keeps_executors_and_serves_a_new_job
              two_schedulers_over_one_catalog_serve_jobs_sequentially
              device_less_cluster_refuses_gpu_bound_plan_and_accepts_cpu_plan
              placed_inference_refusing_a_null_key_classifies_as_the_in_process_one
              placed_gang_over_a_removed_source_fails_typed_on_the_row_and_to_the_submitter
              create_table_as_over_flight_sql_runs_on_the_compute_plane_and_matches_in_process
              select_over_flight_sql_on_a_client_never_submits_a_compute_job
              routed_create_table_as_refusing_a_null_key_raises_the_in_process_error
              list_workers_and_compute_executor_devices_report_registered_devices
              free_port_stays_below_the_ephemeral_floor_and_never_repeats
    continue-on-error: ${{ matrix.advisory }}
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jammi
          POSTGRES_PASSWORD: jammi
          POSTGRES_DB: jammi_test
        options: >-
          --health-cmd "pg_isready -U jammi -d jammi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
        ports:
          - 5432:5432
    env:
      # Service container is reachable at `postgres` from the job container
      # (same Docker network); the catalog connects via sqlx::PgPool.
      JAMMI_TEST_PG_URL: postgres://jammi:jammi@postgres:5432/jammi_test
      # MinIO runs in-job (see the setup step) and binds 127.0.0.1:9000 inside
      # the job container, so the harness and the spawned workers all reach it
      # on localhost. `allow_http` is on for the plain-HTTP endpoint.
      JAMMI_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      JAMMI_TEST_S3_BUCKET: jammi-dist
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      - name: Cache the pinned MinIO + mc binaries
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: /opt/minio-bin
          key: minio-${{ env.MINIO_RELEASE }}-${{ env.MINIO_SHA256 }}-mc-${{ env.MC_RELEASE }}-${{ env.MC_SHA256 }}

      - name: Download the pinned MinIO + mc binaries (cache miss)
        if: steps.minio-cache.outputs.cache-hit != 'true'
        # Pull the exact pinned release assets from GitHub and verify each
        # against the checksum that release publishes. On a cache hit this step
        # is skipped entirely, so a GitHub outage on a re-run cannot red the lane.
        run: |
          set -euo pipefail
          mkdir -p /opt/minio-bin
          curl -fsSL "https://github.com/minio/minio/releases/download/${MINIO_RELEASE}/minio.linux-amd64.${MINIO_RELEASE}" -o /opt/minio-bin/minio
          echo "${MINIO_SHA256}  /opt/minio-bin/minio" | sha256sum -c -
          curl -fsSL "https://github.com/minio/mc/releases/download/${MC_RELEASE}/mc.linux-amd64.${MC_RELEASE}" -o /opt/minio-bin/mc
          echo "${MC_SHA256}  /opt/minio-bin/mc" | sha256sum -c -
          chmod +x /opt/minio-bin/minio /opt/minio-bin/mc

      - name: Start MinIO + create the bucket
        # GHA `services:` cannot pass `server /data` to the MinIO image's
        # entrypoint, so — mirroring how `test-broker` runs the NATS tarball
        # directly — we run the cached MinIO binary in the background, wait for
        # its readiness probe, then `mc mb` the bucket the lane roots artifacts
        # under.
        run: |
          install -m 0755 /opt/minio-bin/minio /usr/local/bin/minio
          install -m 0755 /opt/minio-bin/mc /usr/local/bin/mc
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" \
            minio server /tmp/minio-data --address 127.0.0.1:9000 >/tmp/minio.log 2>&1 &
          # Readiness wait on the MinIO health endpoint (mirrors the NATS lane's
          # health-poll loop).
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1; then
              echo "minio ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          mc alias set local http://127.0.0.1:9000 "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY"
          mc mb --ignore-existing "local/${JAMMI_TEST_S3_BUCKET}"

      - name: Require the distributed backends (no hollow green)
        # The harness early-returns to a silent pass when any of these is unset
        # (`Backends::from_env_or_skip` → None, harness.rs). On this lane the
        # backends are always provisioned (Postgres service + in-job MinIO), so a
        # missing var means the lane is misconfigured, not legitimately skipped —
        # fail loudly instead of reporting a green run that exercised nothing.
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for var in JAMMI_TEST_PG_URL JAMMI_TEST_S3_ENDPOINT JAMMI_TEST_S3_BUCKET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!var:-}" ]; then
              echo "::error::${var} is empty — the distributed lane would skip silently (hollow green)"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Build the `jammi-server` binary
        # The harness spawns `jammi-server` worker processes and resolves the
        # binary next to the test executable under `{target}/{profile}/`. Build
        # it explicitly so it exists before the harness runs. `storage-s3` is
        # required: each worker writes its trained-model artifact to the shared
        # `s3://` MinIO root, which needs the S3 object-store driver compiled in —
        # without it a worker claims the job, trains, then fails the publish with
        # `SchemeNotEnabled`, and the job never reaches `completed`. The driver
        # lives on the server (the CLI is a strict wire client), so the feature
        # is enabled here.
        run: cargo build -p jammi-server --bin jammi-server --features storage-s3

      - name: Compile-check the distributed harness
        run: cargo test -p ${{ matrix.crate }} --features live-distributed-tests --test distributed --no-run

      # One test at a time: each spawns its own worker fleet against the shared
      # catalog and bucket. Every filter must run at least one test — one that
      # matches nothing exits 0 having run nothing. `check_distributed_legs.py`
      # asserts every distributed test is named by exactly one leg.
      - name: Run the ${{ matrix.name }} tests
        run: |
          for t in ${{ matrix.tests }}; do
            out="$(cargo test -p ${{ matrix.crate }} --features live-distributed-tests --test distributed -- --test-threads=1 "$t" 2>&1)" \
              || { echo "$out"; exit 1; }
            echo "$out"
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' <<<"$out" \
              || { echo "::error::filter '$t' ran no test"; exit 1; }
          done

      - name: MinIO log (on failure)
        if: failure()
        run: cat /tmp/minio.log || true
