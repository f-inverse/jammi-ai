cxx = ["CARGO_MANIFEST_LINKS"]
liblzma_sys = ["LZMA_API_STATIC", "LZMA_SYS_ENABLE_THREADS"]
libsqlite3_sys = [
  "LIBSQLITE3_FLAGS", "LIBSQLITE3_SYS_USE_PKG_CONFIG",
  "LIBSQLITE3_SYS_BUNDLING",
  "SQLITE_MAX_COLUMN", "SQLITE_MAX_EXPR_DEPTH", "SQLITE_MAX_VARIABLE_NUMBER",
