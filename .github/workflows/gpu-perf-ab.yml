# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The `encode` ladder's revision edge on a rented A100: `ci/scripts/perf/gpu_inference_ab.sh`
# builds this checkout's merge-base with main twice (base, and rebuilt as the
# A/A null) and this checkout once, runs `jammi-bench encode-step --cuda 0` on
# each, and the ladder judges the revised cost against the wider of the rung's
# noise band and the A/A band. The verdict is uploaded for a human; nothing
# gates on it.

name: GPU perf A/B (RunPod)
'on':
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      aa_null:
        description: 'Every side the parent sha: the instrument''s own null.'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # The encode revision edge on a rented A100: the verdict is uploaded for a human, and the driver's own exit codes are named.
  gpu-perf-ab:
    name: encode revision edge on RunPod A100 (sm_80)
    needs:
      - await-images
    if: (github.event_name == 'pull_request' && github.event.label.name == 'run-gpu-perf-ab') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-perf-ab-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 180
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: lane
        uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_gpu_perf_ab.sh
          evidence: .gpu-pull/gpu-perf-ab/
          evidence-name: gpu-perf-ab-${{ github.run_id }}
        env:
          RP_IMAGE: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          GPU_PERF_AB_AA_NULL: ${{ inputs.aa_null && '1' || '0' }}
      - if: always() && steps.lane.outputs.rc == '1'
        run: 'echo "::error::the ladder verdict is not GREEN: RED (slower than the base by more than the rung''s noise band), RED_FOR_INVESTIGATION (faster by more than the band), or INVALID (a refusal named in the verdict''s causes). Read ladder_verdict.json in the uploaded evidence."'
      - if: always() && steps.lane.outputs.rc == '2'
        run: 'echo "::error::a usage or infrastructure error (exit 2): a clone, checkout or fetch failure, or an unresolved sha; see the run log."'
