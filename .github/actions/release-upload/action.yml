name: release-upload
description: >
  Attests a packaged asset's provenance over its exact bytes and attaches it
  to the GitHub release of the `v*` tag this run is on, creating the release
  when no asset has yet (every asset creates it the same way, so none waits
  on another), with a bounded retry on the upload. The tag ref is the only
  release identity: an asset on release vX was built from vX's tree. Runs
  after `actions/checkout`, on a tag ref, in a job granted `contents: write`,
  `id-token: write` and `attestations: write`.

inputs:
  asset:
    description: "The packaged asset filename (in the workspace root) to attach."
    required: true

runs:
  using: composite
  steps:
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: ${{ inputs.asset }}

    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REF: ${{ github.ref }}
        TAG: ${{ github.ref_name }}
        ASSET: ${{ inputs.asset }}
      run: |
        set -euo pipefail
        case "$REF" in
          refs/tags/v*) ;;
          *) echo "::error::release-upload runs on a v* tag ref only, not $REF" >&2; exit 1 ;;
        esac
        # `--verify-tag` refuses a release for a tag the repository lacks.
        gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --verify-tag
        # `--clobber` makes a re-run idempotent; the retry covers a transient
        # API failure, never a missing release.
        for attempt in 1 2 3 4 5; do
          if gh release upload "$TAG" "$ASSET" --clobber; then exit 0; fi
          [ "$attempt" -lt 5 ] || { echo "::error::uploading $ASSET to $TAG failed after $attempt attempts" >&2; exit 1; }
          echo "upload of $ASSET failed (attempt $attempt); retrying in 15s" >&2
          sleep 15
        done
