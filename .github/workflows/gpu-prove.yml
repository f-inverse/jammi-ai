name: GPU prove (RunPod)

# Runs the gated GPU suites on REAL NVIDIA hardware via an ephemeral RunPod pod
# — the only place jammi's CUDA path is exercised on a device before release.
# Two suites: the served client/server GPU proof (`grpc_embedding_gpu`, the
# recommended topology over gRPC) and the engine-core GPU correctness suite
# (`gpu_capability`). It doubles as the #277 regression gate: the pod builds
# candle's kernels at the CI image's baked CUDA_COMPUTE_CAP and runs them on a
# real device, so a cap that regresses above the Ampere floor fails here.
#
# Matrixed over every SHIPPED CUDA arch (crates/jammi-kernels/build.rs
# GENCODE_ARCHES, mirrored by check_gpu_parity_matrix.py's silicon axis):
# sm_80 (A100), sm_86 (A40-class Ampere workstation), sm_89 (L40S, Ada), sm_90
# (H100, Hopper). `fail-fast: false` — one arch's capacity outage must not
# hide another arch's result; each leg is an independent, individually
# fail-closed proof. `ci/scripts/runpod_gpu_prove.sh`'s `GPU_PROVE_ARCH` input
# selects the leg's device (see that script's own doc for the sm_XX ->
# RunPod-GPU-type mapping, which lives in exactly one place).
#
# RENAME NOTE FOR HUMANS: this job previously ran ONE leg named "GPU prove on
# RunPod A100 (sm_80)". It now runs FOUR legs, each named "GPU prove on RunPod
# (<arch>)" (`sm_80`/`sm_86`/`sm_89`/`sm_90`) via the matrix `name:` below —
# four distinct required-check names replacing the old single one. This
# workflow is off the merge path (no branch-protection dependency today), but
# if anything downstream starts requiring a specific check name from this
# job, it must be repointed at "GPU prove on RunPod (sm_80)" (the closest
# equivalent), not the old unmatrixed name.
#
# COST NOTE FOR HUMANS: four pods per prove run instead of one — roughly 4x
# the GPU-minute spend of the previous single-A100 lane, each independently
# billed and independently subject to the same $187 cancel-in-progress
# lesson (see the concurrency comment below) if a run is superseded.
#
# Off the merge path by default, and NEVER in the critical path of an
# automated workflow (operator direction, 2026-09-03): GPU minutes cost
# money and capacity is intermittent. It fires on: the `run-gpu` PR label
# (opt-in per PR), a nightly cron, and manual dispatch — deliberately NO
# `push:`/`workflow_call:` trigger (`check_gpu_prove_once.py`'s P1 rule pins
# this by name), so nothing ever auto-starts it and nothing may `uses:` it.
# Needs the `RUNPOD_API_KEY` repo secret.
#
# EVERY release-publishing workflow — CUDA and non-CUDA alike (crates.io,
# npm, every PyPI dist, the server image, the release binaries) — gates its
# promotion on the SUMMARY of a prove run already on record for the commit
# it promotes — `ci/scripts/gpu_prove_verdict.py`, consumed via
# `_gpu-proof-required.yml`, never a fresh rental of its own, and never a
# wait: the check is a single, immediate, fail-loud lookup (no poll, no
# deadline). A dev dispatches THIS workflow by hand before tagging a release
# (see docs/maintainer/dev-gpu.md and MAINTAINER-GUIDE.md's release
# runbook) — a tag push on a commit whose prove is not already green fails
# every release workflow immediately, by design: prove first, then tag,
# because a tag push commits the version number.
#
# BUDGET, ref-type-conditional (esc-080/esc-083 derivation, kept in this ONE
# place — never copied into a publisher's own comment): a `workflow_dispatch`
# run ON A TAG REF gets the release budget (a dev proving the exact commit
# about to ship deserves the full retry margin a release promotion needs):
# `max_attempts` 3, `timeout-minutes` 355 — derivation: 2 retried
# attempts can each cost up to a full deploy-exhaustion cycle before
# returning 75 (worst case 8 candidates × 600s RP_SSH_WAIT_SECS = 80m) plus
# ~5m overhead, and the FINAL attempt additionally pays the full RP_TIMEOUT
# job budget (100m) if it actually runs: 2 × 85m + 180m = 350m, +5m margin =
# 355m. Every OTHER ref (a branch dispatch, the `run-gpu` label, the nightly
# schedule) keeps the original single-attempt budget: `max_attempts` 1,
# `timeout-minutes` 190 (80m worst-case deploy + 100m job cap + 10m margin).

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  schedule:
    # Nightly at 03:47 UTC — off-peak, offset from the other crons.
    - cron: "47 3 * * *"

# Least privilege: this lane only reads the checkout; the RunPod side is
# driven by the RUNPOD_API_KEY secret, not the GitHub token.
permissions:
  contents: read

jobs:
  gpu-prove:
    name: GPU prove on RunPod (${{ matrix.arch }})
    strategy:
      # Independent legs: an sm_90 (H100) capacity outage must not hide a
      # green sm_80 (A100) result, or vice versa — each arch is its own
      # fail-closed proof, not a single pass/fail verdict over all four.
      fail-fast: false
      matrix:
        arch: [sm_80, sm_86, sm_89, sm_90]
    # Label event only runs for the `run-gpu` label; dispatch/schedule always run.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu'
    runs-on: ubuntu-latest
    # Concurrency is on the JOB LEG (arch + ref), not the workflow or the job
    # alone, and never cancels.
    #
    # Per-arch grouping is required BECAUSE of the matrix: a workflow- or
    # job-level (arch-less) group would serialize all four legs against each
    # other, or worse, let one arch's pending run evict another arch's
    # in-flight run (GitHub replaces the older pending run in a group by
    # default) — the four legs must run concurrently, each deduped only
    # against ITS OWN prior run on the same ref.
    #
    # `on: pull_request: types: [labeled]` fires for EVERY label, so a
    # workflow-level group would additionally admit runs whose job the `if:`
    # above skips — and those runs would still cancel an in-flight proof, or
    # evict a pending one. At job level a skipped job never enters the group
    # at all.
    #
    # cancel-in-progress is false because this job rents hardware and cleans up
    # in an EXIT trap. Cancelling SIGKILLs the runner, the trap never runs, and
    # the pod it already rented is orphaned — that is exactly how a toggled
    # `run-gpu` label leaked an A100 for seven days on 2026-07-24. Letting a
    # superseded run finish costs ~$0.50; cancelling one cost $187.
    concurrency:
      group: gpu-prove-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
    # A job-timeout kill is another trap bypass. See this file's own header
    # for the ref-type-conditional budget derivation (one place, not copied
    # into a publisher). A `workflow_dispatch` on a tag ref gets the release
    # budget (355m); every other ref keeps the original 190m.
    timeout-minutes: ${{ github.ref_type == 'tag' && 355 || 190 }}
    steps:
      - uses: actions/checkout@v4

      # The orchestrator rents the requested-arch GPU, runs the gated GPU
      # suites on it, streams the output, and terminates the pod on exit —
      # best-effort, via an EXIT trap a SIGKILLed runner never reaches. The
      # real guarantee is the deadline armed inside the pod's own entrypoint,
      # plus the gpu-reap sweep. A `75` exit means no capacity for this arch
      # (SUPPLY_CONSTRAINT); the step re-exits with that code, so a capacity
      # night FAILS this leg red — fail-closed, a leg with no capacity is a
      # leg with no proof, never a silent green. The `::warning::` step below
      # annotates that red as a provider-capacity condition (not a code
      # regression); operator recovery is a re-run once capacity returns. A
      # `76` exit (esc-080) means `rp_run_remote_watched`'s own inactivity
      # watchdog killed the leg with a `PROVE_GROUPS` member still
      # unresolved — a genuine hang, not a capacity condition; the
      # `::warning::` step below names it separately so the two causes are
      # never conflated at a glance. A cut/hang that lands entirely inside
      # the non-gating `bench` group with every proof group already at
      # rc=0 does NOT reach either arm here — `runpod_gpu_prove.sh`'s own
      # driver rule already turns that case into exit 0 plus its own
      # inline `::warning::` (esc-082), so this step's `rc` output is `0`.
      # Bounded retry PER ARCH on capacity (75), ref-type-conditional (see
      # this file's own header): `MAX_ATTEMPTS`/the `sleep` between attempts
      # only ever fire on a tag-ref dispatch; every other ref's loop body
      # runs at most once (a single unretried attempt).
      # `echo "rc=$rc" >> "$GITHUB_OUTPUT"` runs on EVERY exit
      # path (never only the terminal one) so the 75/76/77 annotation steps
      # below always see a real value, including a mid-retry capacity exit.
      - name: Prove GPU suites on a real ${{ matrix.arch }} device (retry on capacity, fail closed)
        id: prove
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          GPU_PROVE_ARCH: ${{ matrix.arch }}
          # esc-084: the pod echoes PROVE_SHA after clone; runpod_lib.sh's
          # rp_run_remote_watched compares it against this and fails 77
          # ("wrong tree") rather than letting a moved ref silently prove
          # the wrong commit. Unset on a hand run of the script (never
          # checked then).
          PROVE_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MAX_ATTEMPTS: ${{ github.ref_type == 'tag' && 3 || 1 }}
        run: |
          set +e
          attempt=1
          while :; do
            bash ci/scripts/runpod_gpu_prove.sh
            rc=$?
            if [ "$rc" -ne 75 ]; then
              echo "rc=$rc" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::${GPU_PROVE_ARCH} capacity unavailable (SUPPLY_CONSTRAINT) after ${attempt} attempt(s) — this leg is NOT GPU-proven for ${GPU_PROVE_ARCH}. Operator action: re-run this workflow's failed jobs once ${GPU_PROVE_ARCH} capacity returns."
              echo "rc=$rc" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
            echo "::warning::${GPU_PROVE_ARCH} capacity unavailable (SUPPLY_CONSTRAINT), attempt ${attempt}/${MAX_ATTEMPTS} — retrying in 300s."
            sleep 300
            attempt=$((attempt + 1))
          done

      - name: Annotate a capacity failure
        if: always() && steps.prove.outputs.rc == '75'
        run: echo "::warning::GPU prove FAILED for capacity — no ${{ matrix.arch }} device on RunPod (SUPPLY_CONSTRAINT), not a code regression. The run stays red (nothing was proven); re-run once capacity returns."

      - name: Annotate an inactivity-watchdog kill
        if: always() && steps.prove.outputs.rc == '76'
        run: echo "::warning::GPU prove FAILED for inactivity — rp_run_remote_watched's own RP_INACTIVITY watchdog killed this leg with a gating PROVE_GROUPS member still unresolved (a genuine hang, not a capacity condition). Produce the artifact with ci/scripts/perf/gpu_prove_timings.py and add a disposition via check_gpu_prove_timings.py's R4 before re-running."

      - name: Annotate a wrong-tree failure
        if: always() && steps.prove.outputs.rc == '77'
        run: echo "::warning::GPU prove FAILED for wrong tree — the pod's own PROVE_SHA disagreed with PROVE_EXPECT_SHA (the ref moved between run creation and clone, or a tag was moved), or no PROVE_SHA was ever observed. Nothing was proven for ${{ matrix.arch }} at the expected commit; re-run once the ref is stable."
