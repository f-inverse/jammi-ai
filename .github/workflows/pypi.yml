name: PyPI

on:
  push:
    tags: ["py-v*"]
  # Manual re-run to finish a release whose publish was interrupted: run the
  # dispatch ON the `py-v*` tag (the publish job is tag-guarded; PyPI rejects
  # a re-upload of an existing version, so re-running the tag is idempotent).
  # The native wheel version comes from the checked-out source (maturin reads
  # the crate's `version.workspace` from Cargo.toml) — the tag guard is what
  # pins that source to the released commit; a branch dispatch is a
  # build-only dry run.
  workflow_dispatch:

# This workflow ships the `jammi-ai-native` dist — the compiled engine (maturin
# abi3 wheels, per-platform), built from `packaging/native/pyproject.toml`
# (module `jammi_native`). The pure-Python base client `jammi-ai` (import
# `jammi`) is built and published from `clients/python` by `pypi-client.yml` on
# the SAME `py-v*` tag, so the two ship in lockstep at the shared workspace
# version.

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; the publish job widens to
# `id-token: write` (PyPI trusted publishing) per job.
permissions:
  contents: read

jobs:
  # Resolves the mutable CI base-image tag to its index digest ONCE per
  # workflow run (`.github/actions/resolve-ci-image`), so both native-Linux
  # legs below build against the exact same base even if `:latest` is
  # republished mid-run.
  resolve-base:
    name: Resolve CI base image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: resolve
        uses: ./.github/actions/resolve-ci-image
        with:
          ref: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}

  build-native-linux:
    name: Build native wheel (Linux, ${{ matrix.arch }})
    needs: [resolve-base]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ needs.resolve-base.outputs.image }}
    defaults:
      run:
        working-directory: packaging/native
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci
        with:
          # mold applies unconditionally from .cargo/config.toml; this lane
          # never wanted -D warnings (a wheel-build lane, not the lint gate).
          deny-warnings: false

      # No `--platform-tag` relabel here -- that is `_pypi-server.yml`'s
      # mechanism only (a prebuilt binary staged into a hatchling wheel).
      # maturin derives its own platform tag from the container it runs in
      # (manylinux_2_28_${{ matrix.arch }}).
      - name: Build native wheel
        run: maturin build --release --out dist

      # W3: the sufficient ABI floor assert, run against the cdylib INSIDE
      # the built wheel (maturin, unlike `_pypi-server.yml`'s staged
      # binary, never leaves a bare .so at a fixed path -- unzip first).
      - name: Assert the GLIBC symbol-version floor (manylinux_2_28)
        id: glibc-floor
        run: |
          set -euo pipefail
          wheel="$(ls dist/*.whl)"
          workdir="$(mktemp -d)"
          python3 -m zipfile -e "$wheel" "$workdir"
          so="$(find "$workdir" -name '*.so' -print -quit)"
          if [ -z "$so" ]; then
            echo "::error::no .so found inside $wheel -- cannot assert the GLIBC floor" >&2
            exit 1
          fi
          bash ../../ci/scripts/assert_glibc_floor.sh "$so" 2.28
          echo "so_path=$so" >> "$GITHUB_OUTPUT"

      # BLOCK 1 (#482): maturin derives the wheel's own platform tag
      # (manylinux_2_28_${{ matrix.arch }}) from the container it runs in --
      # nothing re-checks that the built `.so`'s actual machine matches
      # `matrix.arch` before it ships under that tag. Same shared script
      # `_pypi-server.yml` and `package_release_bin.sh` use, run against the
      # `.so` this job already unzipped above.
      - name: Assert the wheel's .so ELF machine matches matrix.arch
        run: bash ../../ci/scripts/assert_elf_machine.sh "${{ steps.glibc-floor.outputs.so_path }}" ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-native-linux-${{ matrix.arch }}
          path: packaging/native/dist

  build-native-macos:
    name: Build native wheel (macOS ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: packaging/native
    strategy:
      matrix:
        include:
          # Pinned to macos-14, the same runner baseline release-binaries.yml's
          # aarch64 CLI leg builds on, so the release CLI binary and the native
          # wheel share one macOS baseline (a floating `macos-latest` could
          # silently raise the wheel's OS floor above the CLI's).
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: wheels-native-macos-arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            artifact: wheels-native-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The native wheel depends on `jammi-wire`, whose `build.rs` compiles the
      # `jammi.v1` protos with `protoc` on every build (it is the proto/stub
      # owner). The Linux leg gets `protoc` from the CI base image; the macOS
      # runners do not ship it, so install it here.
      - name: Install protoc (macOS)
        run: brew install protobuf

      - name: Build native wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          # `working-directory` points the action at `packaging/native/pyproject.toml`,
          # whose `[tool.maturin] manifest-path` already resolves the crate — no
          # `--manifest-path` in args.
          working-directory: packaging/native
          args: --release --out dist
        env:
          RUSTC_WRAPPER: ""

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: packaging/native/dist

  # Windows wheel disabled: usearch 2.24.0 uses POSIX mmap APIs
  # (MAP_FAILED) that MSVC does not support.

  gpu-proof:
    name: GPU proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before the native wheel is published (#454 follow-up,
    # operator direction: every release publisher gates on the prove
    # verdict, all-or-nothing, not only the CUDA lanes).
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_gpu-proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref (tag push, or a dispatch run on
    # the tag) whose commit's GPU-prove verdict is green — see the
    # workflow_dispatch comment above. Without the guard a branch dispatch
    # could first-publish an untagged, unreleased build, which PyPI cannot
    # undo. PURE conjunction (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.build-native-linux.result == 'success' && needs.build-native-macos.result == 'success' && needs.gpu-proof.result == 'success'
    needs: [build-native-linux, build-native-macos, gpu-proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-native-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
