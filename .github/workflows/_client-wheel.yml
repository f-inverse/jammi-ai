name: _client-wheel

# The pure-Python client `jammi-ai` (import `jammi`): its proto stubs
# generated from `crates/jammi-wire/proto`, its hermetic tests run from
# source, its import direction asserted, and the wheel built and checked
# against PyPI's per-file limit. The one place the client is built and its
# source tested: `ci.yml` calls it on every pull request and on `main`, and
# every lane that needs the client installs this wheel (`install-jammi`);
# `pypi.yml` publishes it.
#
# Artifact: `client-wheel`.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Client wheel (py3-none-any)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install from source and generate the stubs
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev]'
          make generate

      - name: Test (hermetic)
        run: make test

      # The base client never imports the native engine eagerly: a user
      # without the `[embedded]` extra imports `jammi` with no engine present.
      - name: The client imports with no engine
        run: |
          python - <<'PY'
          import sys, jammi
          bad = [m for m in sys.modules if m == "jammi_native" or m.startswith("jammi_native.")]
          assert not bad, f"import jammi eagerly pulled jammi_native: {bad}"
          PY

      - name: Build the wheel
        run: python -m build --wheel --outdir dist

      - name: The wheel fits PyPI's per-file limit
        run: bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: client-wheel
          path: clients/python/dist/
