// The jammi.ballista.v1 wire: the physical-plan operator descriptors
// `JammiCodec` carries across a Ballista scheduler/executor boundary.
//
// NOT the frozen `jammi.v1` surface (`crates/jammi-wire`): this package is
// owned by `jammi-ballista` alone, crosses only between processes of the
// SAME jammi deployment (never a client), and is free to change in lockstep
// with the codec that reads it. Messages only — no service (the codec calls
// `Message::encode`/`decode` directly on a byte buffer behind a 4-byte magic
// prefix `jammi-ballista`'s own `codec.rs` writes, never a gRPC call).
syntax = "proto3";

package jammi.ballista.v1;

// `AnnSearchExec`'s construction inputs (`jammi_ai::operator::ann_search_exec`).
// A leaf node (no children). The catalog record is NOT carried whole
// (`ResultTableRecord` is `Serialize`-only, and re-reading it re-validates
// against the live catalog rather than trusting a stale snapshot the
// scheduler serialized) — only the two fields that select it, scoped by
// tenant explicitly (never the decoding call's ambient tenant, which a
// scheduler/executor process has none of): `table_name` + `tenant_id`
// resolve through `Catalog::get_result_table_for_tenant`.
//
// The query's provenance rides with it so the decoding process attributes a
// refused query exactly as the encoding one would: `query_stored_table` set
// names the table a query-by-example vector was read from; unset is a
// caller-supplied vector.
message AnnSearchExecNode {
  string table_name = 1;
  optional string tenant_id = 2;
  repeated float query_vector = 3;
  uint64 k = 4;
  optional uint64 oversample_override = 5;
  optional string query_stored_table = 6;
}

// `AsofJoinExec`'s construction inputs (`jammi_ai::pipeline::asof::exec`).
// Two children (left, right) carried the same generic way as
// an `InferenceExec`'s single child.
message AsofJoinExecNode {
  // `AsofJoinSpec` via `serde_json` (already `Serialize`/`Deserialize`).
  bytes spec_json = 1;
}

// `KeyCheckExec`'s construction inputs (`jammi_ai::operator::key_check_exec`).
message KeyCheckExecNode {
  string key_column = 1;
}

// `PlacedAttemptExec`'s construction inputs: a claimed training attempt's
// coordinates, of any training kind. The executor re-derives the run —
// its kind, spec and rank count — from the job's catalog row.
message PlacedAttemptExecNode {
  string job_id = 1;
  uint32 attempt = 2;
  string submitter = 3;
  // The device KIND this attempt must run on ("cpu"|"cuda"|"metal") — the
  // submitter's own `compute_device().kind()`, stamped where the claimant
  // builds the task (KIND MATCH, the same rule
  // `InferenceSpec::device_kind` carries).
  string device_kind = 4;
  // When the submitter claimed the attempt, RFC 3339 UTC on its own clock:
  // the first station of the timeline the executing process folds into the
  // job's metrics.
  string claimed_at = 5;
}

// `ResultTableSinkExec`'s construction inputs (`jammi_db::store::sink`):
// the sink's spec as JSON (`ResultTableSinkSpec`, `serde`), its one child
// carried the generic way. The store the decoding process writes through is
// its own; the decode refuses a spec whose object is not under that store's
// root, or whose row that catalog does not hold. Written across the wire
// ONLY as a placed node: a decoded sink writes where it lands and never
// re-submits.
message ResultTableSinkExecNode {
  string spec_json = 1;
}

// The three graph-propagation operators (`jammi_ai::pipeline::
// graph_propagation::{state, hop, readout}`): each carries its spec as JSON
// (`serde`), its one child the generic way, as `AsofJoinExecNode` does.
message InitialStateExecNode {
  bytes spec_json = 1;
}

message HopFoldExecNode {
  bytes spec_json = 1;
}

message ReadoutExecNode {
  bytes spec_json = 1;
}
