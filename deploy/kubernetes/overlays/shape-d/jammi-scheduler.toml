# env wins over this file (the JAMMI_<PATH> layer resolves after it); secrets
# never here -- see base/jammi.toml's header.

[storage]
result_root = "s3://jammi-results/prod"

[storage.cloud.s3]
region = "us-east-1"

[lease]
duration_secs = 30
heartbeat_secs = 10

[ballista.scheduler]
# This pod hosts the ONE Ballista scheduler (configuration.md's semantics:
# this table's presence makes a process a scheduler): the query tier's
# materializations and any client-role claimant's training attempts are
# submitted here and bound to a registered compute-pod executor. No
# `[ballista.executor]` -- this pod runs no task -- and no
# `[ballista.client]` -- it submits nothing of its own.
bind = "0.0.0.0:50050"
# The name the scheduler stamps into every task it places, which the
# executor dials back to report the task's status: the stable Service
# name, never the unspecified bind host (required whenever `bind`'s host
# is 0.0.0.0/::).
advertise_host = "jammi-server-scheduler"

# This pod claims nothing. A claimed training attempt -- of any kind --
# requires the device kind of the process that claimed it: it is placed only
# on an executor listing that kind, and trains in its claimant's own process
# when none does. This is a CPU pod and the compute pods list `cuda`, so an
# attempt claimed here would train here; the compute pods claim the training
# kinds and train them on their devices.
[worker]
enabled = false

# Pure scheduler node: mounts no query-tier gRPC service.
[server]
services = []
