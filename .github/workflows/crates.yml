# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# Publishes the workspace crates to crates.io on a `v*` tag, behind the release
# gate. `ci/scripts/publish_crates.sh` is the publish program: topological
# order, the per-crate already-published guard, the sparse-index wait. A
# dispatch on the tag finishes an interrupted release; crates.io's trusted
# publisher is registered to this file.

name: Crates
'on':
  push:
    tags:
      - v*
  workflow_dispatch: {}
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # The release gate: the tree's recorded verdicts, and the tag names its version.
  proof:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/verdict.py require --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

  # Publishes the crates in topological order with a token minted and revoked around the publish; `cargo publish` verifies each crate builds, in the tree's own image.
  publish-crates:
    name: Publish to crates.io
    needs:
      - await-images
      - proof
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: ghcr.io/f-inverse/jammi-ai-ci:ctx-f11e59b47140e868
    environment:
      name: crates-io
    permissions:
      contents: read
      id-token: write
      actions: read
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/setup-rust-ci
      - name: Mint the crates.io token
        id: token
        run: bash ci/scripts/crates_io_token.sh mint
      - name: Publish crates
        run: bash ci/scripts/publish_crates.sh
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
      - if: always() && steps.token.outputs.token != ''
        name: Revoke the crates.io token
        run: bash ci/scripts/crates_io_token.sh revoke
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.token.outputs.token }}
