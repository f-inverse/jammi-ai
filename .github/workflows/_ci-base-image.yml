name: _ci-base-image

# Builds one of the tree's CI images, named by the Dockerfile that defines it:
# the CPU image (`jammi-ai-ci`, a linux/amd64 + linux/arm64 index) or the CUDA
# image (`jammi-ai-ci-cuda`, amd64 only, FROM the CPU image). Its reference,
# platforms and build arguments come from `ci/scripts/ci_image.py`, the one
# definition of how an image is built. `ci.yml` calls it once per image; a tag
# the registry already holds is the same image, so `plan` skips the build.
#
# One native runner per platform (`ci/scripts/build_matrix.py`), never QEMU.
# Each leg pushes only `<tag>-<arch>`; `merge-manifest` merges the legs into
# `<tag>`, the one reference consumers pull, through the same
# verify-then-promote every published image uses (`merge-index`).
#
# Two runs that build the same tag at once push equivalent images: the same
# Dockerfile over the same inputs, every base pinned by digest. The later
# merge wins the tag, and either image is the tree's.

on:
  workflow_call:
    inputs:
      dockerfile:
        description: "The Dockerfile that defines the image (an entry of `ci_image.IMAGES`)."
        type: string
        required: true
    outputs:
      image:
        description: The built (or already present) image reference.
        value: ${{ jobs.plan.outputs.image }}

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.describe.outputs.ref }}
      platforms: ${{ steps.describe.outputs.platforms }}
      build: ${{ steps.built.outputs.build }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: describe
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: python3 ci/scripts/ci_image.py describe --dockerfile "$DOCKERFILE" | tee -a "$GITHUB_OUTPUT"

      - id: matrix
        env:
          PLATFORMS: ${{ steps.describe.outputs.platforms }}
        run: python3 ci/scripts/build_matrix.py images --platforms "$PLATFORMS" | tee -a "$GITHUB_OUTPUT"

      - name: Is the tag built
        id: built
        env:
          IMAGE: ${{ steps.describe.outputs.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>/tmp/inspect-stderr.txt; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is built"
          elif grep -q "not found" /tmp/inspect-stderr.txt; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is not built yet"
          else
            echo "::error::reading $IMAGE failed: $(cat /tmp/inspect-stderr.txt)" >&2
            exit 1
          fi

  build-and-push:
    needs: [plan]
    if: needs.plan.outputs.build == 'true'
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The `docker-container` driver is what emits the attestation manifest
      # the merge's platform assertion reads; the default driver omits it.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # The build context is `.docker/`, so the base this arch builds FROM and
      # the toolchain pin arrive as build arguments.
      - name: The image's build arguments on this arch
        id: args
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          {
            echo "args<<EOF"
            python3 ci/scripts/ci_image.py build-args --dockerfile "$DOCKERFILE" --arch "$ARCH"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .docker
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: ${{ steps.args.outputs.args }}
          # Only the per-arch leg: `merge-manifest` produces the reference
          # consumers pull.
          tags: ${{ needs.plan.outputs.image }}-${{ matrix.arch }}

  merge-manifest:
    needs: [plan, build-and-push]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: The per-arch sources
        id: sources
        env:
          IMAGE: ${{ needs.plan.outputs.image }}
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          {
            echo "sources<<EOF"
            jq -r --arg image "$IMAGE" '.include[].arch | "\($image)-\(.)"' <<< "$MATRIX_JSON"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/merge-index
        with:
          image: ${{ needs.plan.outputs.image }}
          platforms: ${{ needs.plan.outputs.platforms }}
          tags: ${{ needs.plan.outputs.image }}
          sources: ${{ steps.sources.outputs.sources }}
