name: PyPI (jammi-server, CPU)

# Publishes the CPU `jammi-server` wheel to PyPI on a `py-v*` tag — the SAME tag
# that publishes the base client `jammi-ai` and the `jammi-ai-native` engine
# wheels, so the whole Python surface ships in LOCKSTEP at one version. It
# compiles nothing: `ci.yml` builds the wheels on every pull request and on
# `main` (`_server.yml`, the `server-cpu` build, per arch), and this workflow
# publishes the ones the run that proved the tag's tree built. The publish
# job lives HERE, not in a reusable — PyPI's token exchange and its
# attestation verification match different workflow-ref claims for a
# reusable-workflow publish and can never both pass (see `_server.yml`'s
# header). The PyPI trusted publisher for
# `jammi-server` is registered under THIS file's name (workflow
# `pypi-server.yml`, environment `pypi`).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

concurrency:
  group: pypi-server-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; only the publish job below widens to
# `id-token: write` (PyPI trusted publishing).
permissions:
  contents: read

jobs:
  # What this release publishes: the artifacts the `ci.yml` run that proved
  # the released tree built — nothing compiles here. On a branch dispatch,
  # the rehearsal: the same lookup over the branch's tree.
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      artifacts: server-cpu-x86_64-wheel server-cpu-aarch64-wheel

  proof:
    name: Proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before the CPU wheel is published (every release publisher
    # gates on the prove verdict, all-or-nothing: the CPU wheel never touches
    # CUDA itself, but it ships in the SAME all-or-nothing lockstep release as
    # the CUDA lanes, so it must not promote ahead of an unproven commit).
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref — a tag push, or a
    # workflow_dispatch run on the tag (recovery: PyPI rejects a re-upload of
    # an existing version, so re-running the tag is idempotent) — whose
    # commit's GPU-prove verdict is green. A branch dispatch is a rehearsal
    # (`artifacts` resolves the branch tree's proving run) and can never
    # publish. Same recovery contract as
    # `pypi.yml`/`pypi-client.yml` on this lockstep surface. PURE conjunction
    # (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    needs: [artifacts, proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      # A release with a partial platform set (one arch's wheel missing) is
      # a worse outcome than a failed release -- both legs are `needs:` of
      # this job, and this ONE job downloads and uploads both wheels
      # together (`pattern` + `merge-multiple`, the same shape `pypi.yml`'s
      # publish job already uses).
      - uses: actions/download-artifact@v4
        with:
          pattern: server-cpu-*-wheel
          merge-multiple: true
          path: dist
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
