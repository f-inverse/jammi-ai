name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "crates/*/src/**"
      # the READMEs the guide {{#include}}s (cookbook-recipes.md, quickstart-python.md)
      - "cookbook/recipes/**"
      - "cookbook/quickstart/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "crates/*/src/**"
      - "cookbook/recipes/**"
      - "cookbook/quickstart/**"
  # Re-publish when a Cookbook render finishes (its output is the /cookbook subpath
  # we serve). The render is its own workflow — it runs only on schedule / manual
  # dispatch and saves a fresh _book cache — so every completion is worth a
  # republish; the cheap PR/push gate lives in a different workflow we don't watch.
  workflow_run:
    workflows: ["Cookbook render"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    # For a `workflow_run` trigger (a Cookbook render completed on main), only
    # republish if that render succeeded — a failed render leaves the last good
    # _book cache in place, which a direct push still serves.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci
        with:
          # This lane never set RUSTFLAGS explicitly — it falls back to
          # .cargo/config.toml's per-target mold default, with no -D warnings.
          # Preserve that (do not silently add -D warnings here).
          rustflags: ""

      - name: Build guide
        run: mdbook build docs/guide

      - name: Build workspace (so mdbook test can resolve workspace crates)
        run: cargo build --workspace --exclude jammi-python --quiet

      - name: Test guide doctests
        # mdbook compiles each doctest in a temp dir where rustup cannot discover
        # rust-toolchain.toml by walking up, so it would fall back to the container's
        # default toolchain — which need not match the toolchain that built the
        # workspace deps under target/debug/deps. Pin the doctest compiler to the
        # workspace channel (read from rust-toolchain.toml) so they always agree.
        run: |
          RUSTUP_TOOLCHAIN="$(bash ci/scripts/rust_pin.sh)"
          export RUSTUP_TOOLCHAIN
          mdbook test docs/guide -L target/debug/deps

      - name: Build rustdoc
        run: cargo doc --workspace --exclude jammi-python --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/guide/book/* _site/
          cp -r target/doc _site/api

      - name: Restore the rendered cookbook
        # Published under /cookbook. The executed render lives in the Cookbook
        # book workflow (nightly / on demand); here we only restore its output by
        # prefix — so an unrelated guide or crate change never re-executes the
        # book, and the book never vanishes from the site between renders.
        id: cookbook
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: cookbook/book/_book
          key: cookbook-book-render-
          restore-keys: |
            cookbook-book-render-

      - name: Add the cookbook to the site
        if: github.event_name != 'pull_request' && steps.cookbook.outputs.cache-matched-key != ''
        run: cp -r cookbook/book/_book _site/cookbook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    # The production Pages site deploys only from the default branch (push,
    # or a recovery dispatch run on main) — a branch dispatch builds the
    # site artifact without repointing the live docs at a feature branch.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
