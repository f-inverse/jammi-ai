# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# Publishes every Python dist to PyPI on a `py-v*` tag, in lockstep at the
# workspace version: the client `jammi-ai`, the embedded engine `jammi-ai-native`
# per platform and `jammi-ai-native-cu12`, and the servers `jammi-server` per
# arch and `jammi-server-cu12`. It compiles nothing: every wheel is the one the
# run that proved the tag's tree built and held to PyPI's per-file limit. One
# leg per PyPI project, each project's trusted publisher registered to this
# file and the `pypi` environment. A dispatch on the tag finishes an
# interrupted release (PyPI refuses a re-upload, so a re-run is idempotent).

name: PyPI
'on':
  push:
    tags:
      - py-v*
  workflow_dispatch: {}
concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # The release gate: the tree's recorded verdicts, and the tag names its version.
  proof:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/verdict.py require --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

  # The ci.yml run that proved this tree, which holds what this workflow installs.
  artifacts-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ci
          ARTIFACTS: client-wheel native-cu12-wheel server-cpu-aarch64-wheel server-cpu-x86_64-wheel server-cu12-x86_64-wheel wheels-native-linux-aarch64 wheels-native-linux-x86_64 wheels-native-macos-arm64 wheels-native-macos-x86_64
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # One leg per PyPI project uploads every wheel of that project together: a release with one platform missing is worse than a failed release.
  publish-pypi:
    name: Publish ${{ matrix.project }}
    needs:
      - artifacts-ci
      - proof
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: jammi-ai
            pattern: client-wheel
          - project: jammi-ai-native
            pattern: wheels-native-*
          - project: jammi-ai-native-cu12
            pattern: native-cu12-wheel
          - project: jammi-server
            pattern: server-cpu-*-wheel
          - project: jammi-server-cu12
            pattern: server-cu12-x86_64-wheel
    env:
      JAMMI_ARTIFACT_RUN: ${{ needs.artifacts-ci.outputs.run }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ matrix.pattern }}
          merge-multiple: true
          path: dist
          run-id: ${{ env.JAMMI_ARTIFACT_RUN }}
          github-token: ${{ github.token }}
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
