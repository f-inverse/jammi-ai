name: Image (CI base, CPU)

# Builds the CPU CI base image (jammi-ai-ci) that the CPU workflows run inside.
# Thin caller of the shared _ci-base-image reusable. Rebuilds on a change to its
# own Dockerfile or the pinned toolchain (narrowed from `.docker/**` so a
# CUDA-only Dockerfile change no longer needlessly rebuilds the CPU base).

on:
  push:
    branches: [main]
    paths:
      - ".docker/ci.Dockerfile"
      - "rust-toolchain.toml"
  workflow_dispatch:

# Serialize per ref, never cancel: an image push in flight must finish,
# matching the other release/publish lanes.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; the calling job widens to
# `packages: write` so the reusable can push to GHCR (a called workflow can
# hold at most what its caller grants).
permissions:
  contents: read

jobs:
  build:
    # `github.ref_type != 'tag'` (F1/F3 audit fix, #454 follow-up round 2):
    # this job `uses:` the LOCAL reusable `_ci-base-image.yml`, whose own
    # `build-and-push` job pushes to GHCR unconditionally -- P6 discovery
    # (`check_gpu_prove_once.py`) therefore tables this job too
    # (`ci-image-cpu`, gate_kind='none'), and a `"none"` row must
    # structurally PROVE it can never fire on a release tag ref. Without
    # this, a `workflow_dispatch` against a `v*` tag ref would still
    # rebuild and push the CI base image, ungated, on a ref this workflow
    # was never meant to reach (`on:` above carries only `push: branches:
    # [main]` and `workflow_dispatch`, never `tags:`).
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_ci-base-image.yml
    with:
      image_suffix: ci
      dockerfile: .docker/ci.Dockerfile
