            cmd: python3 ci/scripts/perf/test_fixture_width_report.py
          # Hermetic `PROFILE_356_LEGS_DRY_RUN=1` smoke test for
          # `profile_356_legs.sh` itself (#356 P4) — mirrors
          # `finetune_ab.sh`'s/`gpu_inference_ab.sh`'s own dry-run smoke
          # suites' "the shell PRODUCER itself must run in CI at least
          # once" doctrine: drives the REAL subprocess end to end (leg
          # table construction, per-leg corpus/work-dir setup, the
          # provenance cross-check, per-leg manifest stamping), no GPU, no
          # `nsys`, no real checkpoint, no network — every `nsys`/
          # `$BENCH_BIN` invocation is printed via `run_cmd`, never
          # executed.
          - name: profile_356_legs.sh dry-run smoke
            cmd: python3 ci/scripts/perf/test_profile_356_legs_dry_run.py
    steps:
      - uses: actions/checkout@v4
        with:
          # Legs leave this at the normal shallow default (`fetch_depth`
          # unset in the matrix entry -> `'1'`) unless their entry declares
          # `fetch_depth: "0"` — the legs needing real commit history:
          # ancestry checks (`git merge-base --is-ancestor`) and
          # sha-relative artifact-citation resolution (`git show
          # <sha>:<path>`), all of which fail closed on a shallow
          # checkout. Both sides of `||` are STRINGS (`'1'`, and the
          # matrix entry's own `"0"`) — the number `0` is falsy in GitHub
          # Actions expressions, so a bare `0` here would make `||`
          # silently discard it.
          fetch-depth: ${{ matrix.fetch_depth || '1' }}
      # This shared job is deliberately "no toolchain, no container, no GPU"
      # for every OTHER leg (see the module doc above) — a bare runner keeps
      # every guard here instant. The "pod build substrate" leg is the one
      # exception: its RED tests (i)/(ii) enumerate every build-script
      # package from a REAL `cargo metadata` and read real vendored
      # build.rs sources under $CARGO_HOME/registry (round-2 audit finding
      # 6), which needs an actual toolchain + a fetched registry — gated
      # behind `if:` so no OTHER leg pays this cost.
      - name: Rust toolchain (pod build substrate only)
        if: matrix.name == 'pod build substrate'
        uses: ./.github/actions/setup-rust-ci
      - name: Fetch the registry (pod build substrate only)
        if: matrix.name == 'pod build substrate'
        run: cargo fetch --locked
      # `convert_legacy_bert_checkpoint.py`'s file-level suite needs the
      # real `safetensors` package (see that matrix entry's own comment,
      # phase-4 audit round-2 re-audit advisory 4) -- installed for THIS
      # ONE leg only, the same `if:`-gated exception the "pod build
      # substrate" leg's own Rust toolchain above already establishes, so
      # every OTHER leg here stays a bare, instant, no-install runner.
      - name: Install safetensors (perf convert_legacy_bert_checkpoint suite only)
        if: matrix.name == 'perf convert_legacy_bert_checkpoint suite'
        run: python3 -m pip install --user safetensors
      - name: Run guard
        # `continue_on_error` is unset ('') for every leg except "doc
        # numbers have producers" (matrix.continue_on_error: "true" there) —
        # this expression is false for every other leg, so this stays a
        # no-op change for the required guards.
        continue-on-error: ${{ matrix.continue_on_error == 'true' }}
        run: ${{ matrix.cmd }}

  # ── Single rolled-up gate ──────────────────────────────────────────────────
  # The ONE check a branch-protection ruleset should require, instead of listing
  # every job as a separate context. It fails if any job above failed/cancelled;
  # a `skipped` job (intentional — e.g. `test-live`, which is main-only) counts
  # as a pass. `if: always()` makes it emit on every run, so the required check
  # never hangs "waiting for status". `test-live` is deliberately excluded — it
  # is `continue-on-error` (a live-network lane allowed to fail).
  ci-summary:
    needs:
      - check
      - test
      - compile-check-gated
      - test-clients
      - guard
      - dep-direction
      - flash-attn-closure
      - lint-surface-closure
      - flash-attn-compile
      - oss-only-build
      - dep-audit
      - ts-client
      - py-client
      - test-broker
      - test-python
      - test-pg
    if: always()
    uses: ./.github/workflows/_summary.yml
    with:
      needs_json: ${{ toJSON(needs) }}
