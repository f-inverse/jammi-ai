name: record-subject
description: >
  Records the tree this run measures as its subject: an artifact named
  `subject-<tree>`. `ci/scripts/verdict.py` finds the runs that measured a
  tree through it, so a verdict follows the tree a run tested — a pull
  request's merge commit, the merge `main` holds, the commit a release tags —
  never a commit id. A lane that measures on a rented host checks out the
  same commit this action read (`commit`), so the subject names the tree it
  built. Runs after `actions/checkout`, in the job that decides what the run
  measures. Once the artifact's 90-day retention ends the run is no longer
  bound to the tree, and a verdict over it is measured again.

outputs:
  tree:
    description: The git tree id of the checkout.
    value: ${{ steps.subject.outputs.tree }}
  commit:
    description: The commit the checkout holds, whose tree is the subject.
    value: ${{ steps.subject.outputs.commit }}

runs:
  using: composite
  steps:
    - id: subject
      shell: bash
      run: |
        set -euo pipefail
        tree="$(git rev-parse 'HEAD^{tree}')"
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
        echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        printf '%s\n' "$tree" > "$RUNNER_TEMP/subject"

    # A rerun of the same run records the same subject again.
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: subject-${{ steps.subject.outputs.tree }}
        path: ${{ runner.temp }}/subject
        retention-days: 90
        overwrite: true
