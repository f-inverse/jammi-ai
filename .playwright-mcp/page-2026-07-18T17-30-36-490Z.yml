          - 'img "Scale-to-Zero Serverless GPUs: Run Fine-Tuned Models Without Paying for Idle Compute" [ref=e82]'
          - generic [ref=e83]:
            - paragraph [ref=e84]: It is common to burn over $800 a month on an A100 that sits idle 91% of the time. A fine-tuned Llama model powering an internal tool with maybe 200 requests a day leaves the GPU just sitting there. Warm. Expensive. Doing nothing.
            - paragraph [ref=e85]: "That’s what pushed me to actually try serverless GPUs with scale-to-zero. The promise: your GPU spins up when a request arrives, handles it, then shuts down. You pay for the seconds you use. Zero traffic, zero bill."
            - paragraph [ref=e86]:
              - text: Turns out the promise mostly holds up. Here is what stands out after migrating a workload to Modal, testing RunPod, and benchmarking the cold starts that everybody warns you about. If you want the wider field first, our
              - link "serverless GPU platform comparison" [ref=e87] [cursor=pointer]:
                - /url: /blog/serverless-gpu-ai-inference-platform-comparison-2026
              - text: weighs seven providers on pricing and cold starts.
            - link [ref=e88] [cursor=pointer]:
              - /url: https://rctrl.com/?utm_source=buildmvpfast&utm_medium=display&utm_campaign=banners-2026q3&utm_content=banner-d
              - generic: Sponsored
              - img "RankControl — get recommended by ChatGPT, Perplexity, and Claude" [ref=e90]
            - heading "How Scale-to-Zero Actually Works" [level=2] [ref=e91]
            - paragraph [ref=e92]: Before I get into the platforms, let me explain what’s happening under the hood. Because “serverless GPU” sounds like marketing until you understand the container lifecycle.
            - paragraph [ref=e93]:
              - img "Modal serverless GPU platform interface" [ref=e94]
            - paragraph [ref=e95]: "The cycle goes like this:"
            - list [ref=e96]:
              - listitem [ref=e97]:
                - strong [ref=e98]: Your model is idle.
                - text: No container running, no GPU allocated, no charges. This is the “zero” in scale-to-zero.
              - listitem [ref=e99]:
                - strong [ref=e100]: A request hits the API gateway.
                - text: The platform detects no warm containers exist.
              - listitem [ref=e101]:
                - strong [ref=e102]: Container provisioning kicks in.
                - text: The platform pulls your cached container image, allocates a GPU, starts the container, and runs your model loading code.
              - listitem [ref=e103]:
                - strong [ref=e104]: Request gets served.
                - text: Model is warm now. Subsequent requests hit the already-loaded container instantly.
              - listitem [ref=e105]:
                - strong [ref=e106]: Idle timeout expires
                - text: (30 to 300 seconds, configurable). Container shuts down, GPU returns to the pool. Back to zero.
            - paragraph [ref=e107]: "The expensive part is step 3. That’s your cold start. Everything platforms do to reduce it comes down to one question: how fast can we get model weights into GPU memory?"
            - paragraph [ref=e108]:
              - text: "The tricks they use: filesystem snapshotting (Modal), NVMe caching of model weights so you’re not downloading from S3 every time, Docker layer caching (RunPod), and warm pools where pre-built containers sit ready to accept a model. None of that is the same problem the giant training clusters face, where keeping 100k+ GPUs synchronized has driven work like"
              - link "OpenAI’s MRC cluster networking protocol" [ref=e109] [cursor=pointer]:
                - /url: /blog/openai-mrc-networking-protocol-ai-clusters-2026
              - text: ", but the underlying instinct, hide the GPU plumbing from your application code, is the same."
            - generic [ref=e114]:
              - paragraph [ref=e115]:
                - text: Building an AI product with custom models? We help founders
                - generic [ref=e116]: pick the right infrastructure
                - text: "and ship fast: see how we work."
              - link "see how we work" [ref=e119] [cursor=pointer]:
                - /url: /
            - heading "The Platforms Worth Trying in 2026" [level=2] [ref=e120]
            - paragraph [ref=e121]: We have tested five of these at BuildMVPFast. Here is the honest breakdown.
            - 'heading "Modal: Best Developer Experience, Period" [level=3] [ref=e122]'
            - paragraph [ref=e123]:
              - text: Modal raised $87M at a $1.1B valuation, and honestly the developer experience justifies the hype. No Docker. No YAML. No Kubernetes. You decorate a Python function, run
              - code [ref=e124]: "`modal deploy`"
              - text: ", and you’re live."
            - code [ref=e126]: "@app.cls(gpu=\"A100\", container_idle_timeout=120) class LLMService: @modal.enter() def load_model(self): self.model = AutoModelForCausalLM.from_pretrained(\"my-model\") @modal.web_endpoint(method=\"POST\") def generate(self, request): return self.model.generate(...)"
            - paragraph [ref=e127]: That’s it. That deploys a scale-to-zero A100 endpoint. Code changes deploy in seconds, not minutes.
            - paragraph [ref=e128]:
              - strong [ref=e129]: "Pricing:"
              - text: A100 80GB at $5.59/hr, H100 at $10.00/hr. Per-second billing. $30/month free credits for new users.
            - paragraph [ref=e130]:
              - strong [ref=e131]: "Cold starts:"
              - text: 2 to 5 seconds for small models, 15 to 30 seconds for 7B+ parameter models. Modal’s filesystem snapshotting is the fastest of the platforms benchmarked here.
            - paragraph [ref=e132]:
              - strong [ref=e133]: "The catch:"
              - text: It’s the most expensive per GPU-hour. About 20 to 40% pricier than RunPod for equivalent hardware. You’re paying for the DX.
            - 'heading "RunPod: Cheapest GPUs, Docker Required" [level=3] [ref=e134]'
            - paragraph [ref=e135]:
              - text: RunPod raised $20M and carved out the budget lane. Their
              - link "serverless GPU pricing" [ref=e136] [cursor=pointer]:
                - /url: /api-costs/gpu
              - text: "undercuts everyone: A100 80GB at $3.49/hr, H100 at $6.99/hr."
            - paragraph [ref=e137]: "The trade-off is friction. RunPod is Docker-based. You build a container, push it, configure the endpoint through their web UI. The handler pattern is straightforward:"
            - code [ref=e139]: "import runpod def handler(event): result = run_inference(event[\"input\"]) return result runpod.serverless.start({\"handler\": handler})"
            - paragraph [ref=e140]: But the Docker build/push cycle adds 5 to 10 minutes every time you iterate. Modal deploys in seconds. That gap matters during development.
            - paragraph [ref=e141]:
              - strong [ref=e142]: "Cold starts:"
              - text: 5 to 25 seconds for medium models. Their FlashBoot feature caches container snapshots and brings it closer to Modal’s speed.
            - paragraph [ref=e143]:
              - strong [ref=e144]: "The catch:"
              - text: Web UI is clunkier than Modal’s dashboard. Community Cloud GPUs (even cheaper) are less reliable. But for production workloads where you’ve already locked in your container, the price difference is real.
            - 'heading "Replicate: Easiest Start, Worst Cold Starts" [level=3] [ref=e145]'
            - paragraph [ref=e146]:
              - text: Replicate ($40M Series B from a16z) wins on simplicity. Their model library lets you deploy popular models with zero configuration. For custom models, you package with Cog (their open-source container format) and
              - code [ref=e147]: "`cog push`"
              - text: .
            - paragraph [ref=e148]: "OK so I need to be honest here: Replicate’s cold starts for custom models are brutal. Expect 30 to 120 seconds from fully cold. For popular community models (Stable Diffusion, Whisper, etc.), they keep instances warm so it’s near-instant. But deploy your own fine-tuned model and that first request after idle? You’re waiting."
            - paragraph [ref=e149]:
              - strong [ref=e150]: "Pricing:"
              - text: Pay-per-prediction, roughly $0.0023/sec on A100 80GB. Competitive with Modal.
            - paragraph [ref=e151]:
              - strong [ref=e152]: "The catch:"
              - text: Cold starts make it a non-starter for production APIs. They offer “always-on” replicas to fix this, but then you’re paying for idle compute, which defeats the whole point. Good for prototyping, bad for serving.
            - link [ref=e153] [cursor=pointer]:
              - /url: https://rctrl.com/?utm_source=buildmvpfast&utm_medium=display&utm_campaign=banners-2026q3&utm_content=banner-k
              - generic: Sponsored
              - img "RankControl — get recommended by ChatGPT, Perplexity, and Claude" [ref=e155]
            - heading "The Cost Math That Actually Matters" [level=2] [ref=e156]
            - paragraph [ref=e157]: Consider the numbers that make the case for switching. Because the savings at low traffic are almost absurd.
