name: Cookbook book

# The fast PR/push gate for the in-repo Theory↔Computation book (cookbook/book/),
# checked against the engine at HEAD: build the HEAD embed wheel, verify the API
# reference matches it, lint, run the shared-lib unit tests, and the no-deferral /
# citation guards — so a feature and its proof land atomically. No render here.
#
# The heavy quarto render (+ live-server chapters + release-recipe leg) is the
# separate `cookbook-render.yml`, which runs nightly / on demand and caches the
# `_book` the Docs workflow publishes. The engine's own SDK-recipes smoke
# (cookbook.yml) and it/cookbook.rs are separate and unchanged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cookbook-book-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  # The determinism regime (K0 §3): jammi_cookbook also sets these on import, but
  # pinning them in the job env covers anything that reads them first.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  gate:
    name: Book gate (HEAD wheel, no render)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scale-tier vector cache (cookbook/book/artifacts/scale/) lives in
          # Git LFS; pull it so the gate reads the real cache, not LFS pointers.
          lfs: true
      - uses: ./.github/actions/setup-rust-ci
        with:
          rustflags: "-C link-arg=-fuse-ld=mold"

      # The book runs against two lockstep dists — the base client `jammi-ai`
      # (import `jammi`) and the compiled `jammi-ai-native` wheel, built fresh
      # and force-reinstalled (mode: wheel — a fresh wheel, never a copy) so
      # the book runs the engine built from THIS commit. The shared
      # setup-jammi-py action owns the venv/maturin mechanics.
      - name: Build + install the HEAD wheels
        uses: ./.github/actions/setup-jammi-py
        with:
          mode: wheel

      - name: Install the book (against the HEAD wheel)
        run: |
          . .venv/bin/activate
          pip install -e 'cookbook/book[book,dev]'

      - name: API reference matches the HEAD wheel
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python scripts/check_api_reference.py

      - name: Lint
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          ruff check jammi_cookbook scripts tests

      - name: Shared-lib unit tests
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest -q

      - name: No-deferral gate
        working-directory: cookbook/book
        run: bash scripts/no_deferral_grep.sh

      - name: No dangling citations
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python scripts/check_citations.py
