# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The fine-tune gang on real GPUs at every topology the engine lays a job out
# as -- one host with one GPU, one host with two (in one process, and as two
# processes), two hosts with two each -- under the inline and NCCL transports,
# through the product path. Driven by `ci/scripts/runpod_gpu_topology.sh`.
#
# COST BOUND (human-approved), from the driver's own defaults
# (`ci/scripts/test_gpu_topology_lane.sh` re-derives them and fails when this
# header and the mechanism disagree): 2 hosts x 2 GPUs x TOPOLOGY_MAX_GPU_RATE
# ($4.00/GPU/h, refused above it before any create) x RP_TTL_HOURS (4 h, baked
# into each pod's own entrypoint):
#   (i) terminate-succeeds: 4 x $4.00 x 4 h = $64.00 per run (ceiling).
#   (ii) sweep-only (every terminate fails): each pod bills to its TTL, then
#        gpu-reap.yml's 6-hourly sweep: 4 x $4.00 x (4 + 6) h = $160.00.
#
# Nothing gates on this lane: it produces `topology.json`, which a human
# reviews and commits under `crates/jammi-kernels/artifacts/cuda-runs/`.

name: GPU topology (RunPod)
'on':
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      gpu_types:
        description: 'Candidate GPU types in preference order, `|`-separated RunPod gpuTypeIds (each must map to sm_80/86/89/90). Empty: the driver''s default list.'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # The fine-tune gang at every topology on a rented two-host fleet; one attempt per run, because a retry is a second rental search and a cost decision for a human.
  gpu-topology:
    name: GPU topology on RunPod (1x1, 1x2, 2 processes, 2 hosts x 2)
    needs:
      - await-images
    if: (github.event_name == 'pull_request' && github.event.label.name == 'run-topology') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-topology-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 190
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_gpu_topology.sh
          evidence: .gpu-pull/gpu-topology/
          evidence-name: gpu-topology-${{ github.run_id }}
        env:
          RP_IMAGE: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          PROVE_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOPOLOGY_GPU_TYPES: ${{ inputs.gpu_types }}
