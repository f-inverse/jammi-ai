name: Devcontainer Image

# Build-only verification of .devcontainer/Dockerfile. This image is never
# published — there is no push trigger, no tags, and no GHCR login; the
# artifact IS the green build.
#
# The devcontainer Dockerfile carries load-bearing pinned toolchain content
# (the rich-symbol-graph nightly-2026-06-07 / build-graph 0.1.0 bake, in
# lockstep with ci/scripts/build_graph_rich.sh). This lane proves the image
# assembles — pulled base, yum layer, toolchain installs, home copies — on
# every PR that touches it, before a broken devcontainer surprises the next
# container rebuild.
#
# Standalone rather than folded under ci-summary: this lane is path-filtered
# (like server-image.yml's build-cuda-pr lane), and the required ci-summary
# context must stay path-filter-free so it never hangs a PR that doesn't
# touch the devcontainer.

on:
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer-image.yml"
  workflow_dispatch:

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: build-only verification — nothing is pushed or published.
permissions:
  contents: read

jobs:
  build-devcontainer-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/docker-publish
        with:
          file: .devcontainer/Dockerfile
          context: .devcontainer
          push: "false"
          cache-scope: devcontainer
