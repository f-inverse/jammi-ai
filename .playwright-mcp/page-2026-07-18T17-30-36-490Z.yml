            - paragraph [ref=e193]:
              - text: The breakeven sits around 35 to 40% GPU utilization. Below that, serverless wins by a landslide. Above 60%,
              - link "dedicated instances with reserved pricing" [ref=e194] [cursor=pointer]:
                - /url: /blog/avoid-ai-infrastructure-overspending-startups
              - text: start pulling ahead.
            - paragraph [ref=e195]: For what it’s worth, most internal tools, staging environments, and early-stage products sit well below that 35% threshold. If you’re paying for an always-on GPU to serve fewer than 1,000 requests a day, you’re probably burning money.
            - 'heading "Cold Starts: The Real Benchmarks" [level=2] [ref=e196]'
            - paragraph [ref=e197]: "This is the part everyone asks about. Benchmarking these platforms with a fine-tuned 7B Llama model and cached weights produces these numbers:"
