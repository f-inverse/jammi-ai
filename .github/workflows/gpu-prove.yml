name: GPU prove (RunPod)

# Runs the gated GPU suites on a REAL NVIDIA A100 (sm_80) via an ephemeral RunPod
# pod — the only place jammi's CUDA path is exercised on a device before release.
# Two suites: the served client/server GPU proof (`grpc_embedding_gpu`, the
# recommended topology over gRPC) and the engine-core GPU correctness suite
# (`gpu_capability`). It doubles as the #277 regression gate: the pod builds
# candle's kernels at the CI image's baked CUDA_COMPUTE_CAP and runs them on an
# 8.0 device, so a cap that regresses above the Ampere floor fails here.
#
# Off the merge path by default — GPU minutes cost money and A100 capacity is
# intermittent. It fires on: the `run-gpu` PR label (opt-in per PR), a nightly
# cron, and manual dispatch. Needs the `RUNPOD_API_KEY` repo secret.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  schedule:
    # Nightly at 03:47 UTC — off-peak, offset from the other crons.
    - cron: "47 3 * * *"

# Least privilege: this lane only reads the checkout; the RunPod side is
# driven by the RUNPOD_API_KEY secret, not the GitHub token.
permissions:
  contents: read

jobs:
  gpu-prove:
    name: GPU prove on RunPod A100 (sm_80)
    # Label event only runs for the `run-gpu` label; dispatch/schedule always run.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu'
    runs-on: ubuntu-latest
    # Concurrency is on the JOB, not the workflow, and never cancels.
    #
    # `on: pull_request: types: [labeled]` fires for EVERY label, so a
    # workflow-level group would admit runs whose job the `if:` above skips —
    # and those runs would still cancel an in-flight proof, or evict a pending
    # one (GitHub replaces the older pending run in a group by default). At job
    # level a skipped job never enters the group at all.
    #
    # cancel-in-progress is false because this job rents hardware and cleans up
    # in an EXIT trap. Cancelling SIGKILLs the runner, the trap never runs, and
    # the pod it already rented is orphaned — that is exactly how a toggled
    # `run-gpu` label leaked an A100 for seven days on 2026-07-24. Letting a
    # superseded run finish costs ~$0.50; cancelling one cost $187.
    concurrency:
      group: gpu-prove-${{ github.ref }}
      cancel-in-progress: false
    # A job-timeout kill is another trap bypass. The remote job is capped by
    # RP_TIMEOUT (50m); deploy itself is capped by RP_SSH_WAIT_SECS (default
    # 600s) PER CANDIDATE, and the a100 arch fails over across up to 4
    # candidates (SECURE/COMMUNITY × PCIe/SXM4) before returning 75 — so the
    # worst case (every candidate rents but none becomes reachable) is
    # 4 × 600s = 40m of deploy on top of the 50m job cap, well under this
    # ceiling but no longer under the previous 75m one (raised here for
    # exactly that reason — see runpod_lib.sh's own RP_SSH_WAIT_SECS doc).
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      # The orchestrator rents an A100, runs the gated GPU suites on it, streams
      # the output, and terminates the pod on exit — best-effort, via an EXIT
      # trap a SIGKILLed runner never reaches. The real guarantee is the deadline
      # armed inside the pod's own entrypoint, plus the gpu-reap sweep. A `75`
      # exit means no A100 capacity (SUPPLY_CONSTRAINT); the step re-exits with
      # that code, so a capacity night FAILS the workflow red — fail-closed, a
      # night with no capacity is a night with no proof, never a silent green.
      # The `::warning::` step below annotates that red as a provider-capacity
      # condition (not a code regression); operator recovery is a re-run once
      # capacity returns.
      - name: Prove GPU suites on a real A100
        id: prove
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          GIT_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          bash ci/scripts/runpod_gpu_prove.sh
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Annotate a capacity failure
        if: always() && steps.prove.outputs.rc == '75'
        run: echo "::warning::GPU prove FAILED for capacity — no A100 on RunPod (SUPPLY_CONSTRAINT), not a code regression. The run stays red (nothing was proven); re-run once capacity returns."
