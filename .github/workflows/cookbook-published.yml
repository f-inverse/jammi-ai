name: Cookbook as published

# The cookbook notebooks as a reader runs them: each notebook at a release tag,
# in a fresh environment, setup cell included, so it installs that release from
# PyPI and the cookbook from the tag (cookbook/book/scripts/run_published_notebooks.py).
# The book gate and the nightly render run the chapter sources against wheels
# built from HEAD; only this lane sees what a reader gets from PyPI.
#
# Nightly against the newest `py-v*` tag on a CPU, because what a reader
# installs changes after the tag (a dependency release, a package index
# refusing a wheel). After a release, dispatch it on the release's tag with
# `gpu` set: the GPU leg runs the same notebooks on a RunPod L4 (sm_89, the
# class of GPU a Colab reader gets), where the setup cell installs the CUDA
# wheels.

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to run (py-vX.Y.Z). Empty: the newest py-v* tag."
        required: false
        type: string
      gpu:
        description: "Also run every notebook on a RunPod L4."
        required: false
        type: boolean
        default: false

concurrency:
  group: cookbook-published-${{ inputs.tag || 'newest' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve the release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        env:
          REQUESTED: ${{ inputs.tag }}
          REPO: https://github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED" ]; then
            tag="$REQUESTED"
          else
            tag="$(git ls-remote --tags --refs "$REPO" 'py-v*' | sed 's#.*refs/tags/##' | sort -V | tail -n1)"
          fi
          case "$tag" in py-v[0-9]*) ;; *) echo "::error::'$tag' is not a py-vX.Y.Z release tag"; exit 1 ;; esac
          git ls-remote --exit-code --tags "$REPO" "refs/tags/$tag" >/dev/null \
            || { echo "::error::tag $tag does not exist"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "running the notebooks published at $tag"

  cpu:
    name: CPU, shard ${{ matrix.shard }}/8
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: cookbook/book/scripts
      - name: Check out the notebooks at ${{ needs.resolve.outputs.tag }}
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          path: published
          sparse-checkout: cookbook/notebooks
      # Colab's runtime interpreter.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the notebooks as published
        run: >
          python cookbook/book/scripts/run_published_notebooks.py
          --notebooks published/cookbook/notebooks
          --shard ${{ matrix.shard }}/8
          --work "$RUNNER_TEMP/notebooks"

  gpu:
    name: GPU (RunPod L4)
    needs: resolve
    if: ${{ inputs.gpu }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Run the notebooks as published on an L4
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          DRIVER_REF: ${{ github.sha }}
          NOTEBOOKS_TAG: ${{ needs.resolve.outputs.tag }}
        run: bash ci/scripts/runpod_cookbook_published.sh
