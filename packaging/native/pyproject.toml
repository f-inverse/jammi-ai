[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "jammi-ai-native"
requires-python = ">=3.9"
dynamic = ["version"]
description = "Compiled in-process Jammi engine — the `jammi_native` PyO3 extension"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "F-Inverse" }]
keywords = ["embeddings", "vector-search", "fine-tuning", "inference", "machine-learning"]
# The native engine is a self-contained compiled `.so`; it carries no Python
# runtime dependency. `jammi-ai` (pure-Python, `import jammi`) is the base client
# that carries this wheel via its `[embedded]` extra; the dependency edge points
# that way, never from the engine outward.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/f-inverse/jammi-ai"
Documentation = "https://f-inverse.github.io/jammi-ai/"
Repository = "https://github.com/f-inverse/jammi-ai"
"Bug Tracker" = "https://github.com/f-inverse/jammi-ai/issues"

[tool.maturin]
# The Cargo crate lives in the workspace; this dist is only its packaging shell.
# `version` is dynamic — maturin reads it from the crate's `version.workspace`,
# so `jammi-ai-native` ships in lockstep with every other workspace dist.
manifest-path = "../../crates/jammi-python/Cargo.toml"
# The compiled engine is the top-level `jammi_native` extension: `import
# jammi_native` yields the in-process engine directly. Maturin's mixed layout
# places the built `.so` beside `python/jammi_native/__init__.py` (which
# re-exports the engine surface).
module-name = "jammi_native"
# The `jammi_native` re-export shim lives HERE, under this dist's own
# `python/` source root. `python-source` must resolve at or below the project
# dir: maturin copies the `module-name` package's Python files from a local
# `python-source` but NOT from one above the project root, so co-locating the
# shim is what makes the wheel ship `jammi_native/__init__.py` (the engine
# surface) beside the compiled `.so`.
python-source = "python"
# `extension-module` is opt-in on the `jammi-python` crate so that
# `cargo test --workspace` can link the integration test against libpython.
# Maturin builds the extension module proper, so it activates the feature here.
features = ["extension-module"]
