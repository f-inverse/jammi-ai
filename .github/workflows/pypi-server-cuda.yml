name: PyPI (jammi-server-cu12, CUDA)

# Publishes the CUDA (cu12) `jammi-server-cu12` wheel to PyPI on a `py-v*` tag —
# the SAME lockstep tag as the CPU `jammi-server`, the base client `jammi-ai`,
# and the `jammi-ai-native` engine wheels. It compiles nothing: `ci.yml`
# builds the wheel on every pull request and on `main` (`_server.yml`, the
# `server-cu12` build, including the CUDA DT_NEEDED link-set verification its
# packaging carries), and this workflow publishes the one the run that proved
# the tag's tree built. Publishing is gated behind the commit's
# already-recorded GPU-prove verdict (`proof` below reads it, never starts a
# new prove run) — the build was proven on a real GPU before it is promoted
# to PyPI. The publish job lives HERE, not in a reusable — PyPI's token exchange and its attestation verification match
# different workflow-ref claims for a reusable-workflow publish and can never
# both pass (see `_server.yml`'s header). The PyPI trusted publisher for
# `jammi-server-cu12` is registered under THIS file's name (workflow
# `pypi-server-cuda.yml`, environment `pypi`).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

concurrency:
  group: pypi-server-cuda-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; only the publish job below widens to
# `id-token: write` (PyPI trusted publishing).
permissions:
  contents: read

jobs:
  # What this release publishes: the artifacts the `ci.yml` run that proved
  # the released tree built — nothing compiles here. On a branch dispatch,
  # the rehearsal: the same lookup over the branch's tree.
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      artifacts: server-cu12-x86_64-wheel

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref — a tag push, or a
    # workflow_dispatch run on the tag (recovery: PyPI rejects a re-upload of
    # an existing version, so re-running the tag is idempotent; a re-run
    # reuses the commit's already-recorded GPU-prove verdict — it never
    # re-proves). A branch dispatch is a rehearsal and can never publish.
    # Same recovery contract as `pypi.yml`/`pypi-client.yml` on this lockstep
    # surface. The `if:` is a PURE conjunction (no `||`): both `artifacts`
    # (the proving run, holding the wheel) and `proof` (the commit's verdict)
    # must have succeeded before this job runs.
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    needs: [artifacts, proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-cu12-x86_64-wheel
          path: dist
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
