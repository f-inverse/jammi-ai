# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The gated GPU suites on real NVIDIA hardware, one rented pod per shipped CUDA
# arch (`crates/jammi-kernels/build.rs` GENCODE_ARCHES): the served GPU proof
# and the engine-core correctness suite, built at the image's baked compute
# capability and run on the device. Every release gates on this lane's recorded
# verdict for the tree it promotes (`verdict.py require`), never on a fresh
# rental: prove, then tag. A dispatch on a tag ref gets the release budget --
# three attempts on a capacity exit and the matching timeout. Never cancelled:
# a cancel SIGKILLs the runner before the driver's EXIT trap returns the pod.

name: GPU prove (RunPod)
'on':
  pull_request:
    types:
      - labeled
  schedule:
    - cron: 47 3 * * *
  workflow_dispatch: {}
permissions:
  contents: read
jobs:

  # The tree's CI images, built by ci.yml's run for the same commit.
  await-images:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 ci/scripts/ci_image.py await --repo "$GITHUB_REPOSITORY" --head-sha "$HEAD_SHA" cpu cuda

  # Records the tree this run proves; every leg checks out that same commit, so the subject names the tree the pod built.
  gpu-prove-subject:
    name: Subject
    if: (github.event_name == 'pull_request' && github.event.label.name == 'run-gpu') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: subject
        uses: ./.github/actions/record-subject

  # One rented device per shipped CUDA arch runs the gated GPU suites at the image's baked compute capability; a dispatch on a tag ref gets three attempts on a capacity exit.
  gpu-prove:
    name: GPU prove on RunPod (${{ matrix.sm }})
    needs:
      - await-images
      - gpu-prove-subject
    if: (github.event_name == 'pull_request' && github.event.label.name == 'run-gpu') || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-prove-${{ matrix.sm }}-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: ${{ github.ref_type == 'tag' && 355 || 190 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - sm: sm_80
          - sm: sm_86
          - sm: sm_89
          - sm: sm_90
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_gpu_prove.sh
          max-attempts: ${{ github.ref_type == 'tag' && 3 || 1 }}
        env:
          RP_IMAGE: ghcr.io/f-inverse/jammi-ai-ci-cuda:ctx-3b6cc7ba90dcbf4a
          GPU_PROVE_ARCH: ${{ matrix.sm }}
          PROVE_EXPECT_SHA: ${{ needs.gpu-prove-subject.outputs.commit }}
