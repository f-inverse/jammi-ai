# Upstream Postgres, mirroring deploy/docker-compose.yml's `postgres` service
# -- the kind smoke's catalog backend, never a production shape.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          env:
            - { name: POSTGRES_USER, value: jammi }
            - { name: POSTGRES_PASSWORD, value: jammi }
            - { name: POSTGRES_DB, value: jammi }
          ports:
            - { containerPort: 5432, name: postgres }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "jammi"]
            periodSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  clusterIP: None # headless: stable DNS for the StatefulSet pod
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
