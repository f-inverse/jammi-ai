  ci-summary:
    needs:
      - ci-image
      - build-ci-image
      - build-ci-image-cuda
      - plan
      - check
      - clippy-gated
      - test-build
      - test
      - test-permission-fault
      - test-lanes
      - compile-check-gated
      - test-clients
      - guard
      - kube-manifests
      - arm64-floor-oracle
      - flash-attn-compile
      - test-metal
      - oss-only-build
      - dep-audit
      - ts-client
      - py-client
      - test-python
      - test-python-rust
      - test-pg
      - symbol-index-gates
      - distributed
