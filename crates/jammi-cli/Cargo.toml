[package]
name = "jammi-cli"
description = "Command-line interface for Jammi AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

# The crate is `jammi-cli`, but the shipped binary is `jammi` — that's the
# command users invoke and what the cookbook recipes / docs / smoke tests
# expect at `target/<profile>/jammi`.
[[bin]]
name = "jammi"
path = "src/main.rs"

[dependencies]
# The CLI is a strict client: it talks to a running `jammi-server` over the
# wire and never touches the catalog/DB in-process. It drives the control-plane
# verbs through `jammi-admin`'s `CatalogClient` and the data verbs (`embed`,
# `search`) through `jammi-client`'s `DataClient`, which composes that same
# `CatalogClient` over one transport. Both are candle-free: the CLI does NOT
# depend on `jammi-ai`, so the candle / tokenizers / symphonia / hf-hub stack
# never reaches the `jammi` binary.
jammi-datafusion.workspace = true
jammi-db.workspace = true
jammi-admin.workspace = true
jammi-client.workspace = true
jammi-wire.workspace = true
# Building the `tonic::transport::Endpoint` the connect path carries from the
# translated `--target` URL. Part of the transport stack `jammi-admin` already
# pulls; candle-free.
tonic.workspace = true
# The trigger-register and mutable-create paths build an Arrow `Schema` from the
# CLI's inline column spec; `search` prints its result batches as JSON lines.
arrow.workspace = true
arrow-schema.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

# docs.rs builds with default features only. The thin client carries no feature
# flags, so this pins the empty set explicitly.
[package.metadata.docs.rs]
features = []

[dev-dependencies]
# Tests reach the raw catalog backend; the seam exists only under test-hooks.
jammi-db = { workspace = true, features = ["test-hooks"] }
tempfile = "3"
assert_cmd = "2"
predicates = "3"
