name: Swarm gates

# No `paths:` filter — every gate here is a trivial, hermetic pure-Python (or
# git-diff) check with no Rust build and no toolchain, so it always runs on every
# PR and push to main. A path-filtered workflow that is later set as a required
# status check would hang unrelated PRs (the check never reports) — this is the
# #245 trap. The TOUCHED guards below therefore detect their own touched set
# *inside* the job (via `git diff`), never via a workflow `paths:` filter.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: swarm-${{ github.ref }}
  # Same rationale as ci.yml's own concurrency block: a PR ref cancels its
  # own superseded runs, but a run on `main` is evidence (the only thing a
  # ledger closure's "green on main since <sha>" can cite) and must be
  # allowed to finish rather than being cancelled by the next merge.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: every gate here only reads the checkout; nothing publishes.
permissions:
  contents: read

jobs:
  swarm-gates:
    name: Guard (swarm constitution + boundary)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the PR base ref is present for the git-diff-scoped
      # guards and the diff-scoped governance tripwire.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --- Always-run gates (fail-closed; pure-Python, no toolchain) ----------

      # Total-ownership bijection over crates/ (authored separately).
      - name: Assert the swarm domain manifests partition crates/ exactly
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_swarm_bijection.py

      # Every typed anchor in the constitution resolves; every boundary invariant
      # is wired to a gate (or honestly flagged gate_script:UNENFORCED).
      - name: Assert every constitution code anchor resolves
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_constitution_anchors.py

      # The mechanical half of the discipline test: no governance-verb leak in the
      # diff, no philosophy leak-smell token in the engine tree. Advisory-labelled.
      - name: Assert no consumer-name / governance leak in the engine tree
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 ci/scripts/check_no_consumer_names.py

      # The lead-proactivity gate's own CI leg: runs the REAL hook scripts
      # (lead-gate-{start,stop,pre}.sh) against fixture payloads in a temp
      # state dir — R1-R10 + S1 required-RED fixtures, N1-N7 must-still-count
      # negative-space fixtures, and R10's wiring assertion (settings.json
      # carries both events + every script, scripts executable).
      - name: Assert the lead-proactivity gate's hooks fire correctly on fixtures
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/check_lead_gate.py --self-test

      - name: Run check_lead_gate.py's own test suite
        if: ${{ !cancelled() }}
        run: python3 ci/scripts/test_check_lead_gate.py

      # Constitution T1: an audit-round sequence terminates only in operator
      # acceptance of an assurance-deficit register. G1-G8 + the escapes-status-
      # move trigger, always-run, fail-closed, REPO_ROOT marker-file assertion.
      - name: Assert every assurance-deficit register is internally consistent (G1-G8)
        if: ${{ !cancelled() }}
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 ci/scripts/check_ship_register.py

      - name: Run check_ship_register.py's own self-test + test suite
        if: ${{ !cancelled() }}
        run: |
          python3 ci/scripts/check_ship_register.py --self-test
          python3 ci/scripts/test_check_ship_register.py

      # --- Human-amend-only guards (git-diff-scoped; PRs only) ----------------
      # Each detects its touched set inside the job and exits green when untouched,
      # red (admin-merge required) when touched. Every constitution/gate edit —
      # tightening included — is human-amend-only (anti-Goodhart via human-in-the-
      # loop, not a nonexistent tighten-vs-weaken direction classifier).

      - name: Guard — CONSTITUTION is human-amend-only (CONSTITUTION_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- docs/swarm/CONSTITUTION.md)"
          if [ -n "$changed" ]; then
            echo "::error::CONSTITUTION_TOUCHED: docs/swarm/CONSTITUTION.md changed in this PR."
            echo "The engine constitution is human-amend-only (anti-Goodhart, ARCHITECTURE §2.7/§7):"
            echo "every edit — tightening included — must be human-reviewed and admin-merged."
            echo "This PR must be human-reviewed and admin-merged."
            exit 1
          fi
          echo "CONSTITUTION_TOUCHED: clean — constitution untouched."

      - name: Guard — swarm gate definitions are human-amend-only (SWARM_GATE_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- \
            ':(glob).claude/agents/*.md' \
            ':(glob)ci/scripts/**/check_*.py' \
            ':(glob)ci/scripts/**/check_*.sh' \
            '.claude/settings.json' \
            ':(glob).claude/evals/**' \
            ':(glob).claude/hooks/**' \
            '.github/workflows/swarm.yml')"
          if [ -n "$changed" ]; then
            echo "::error::SWARM_GATE_TOUCHED: a swarm gate definition changed in this PR:"
            echo "$changed" | sed 's/^/    /'
            echo "Gate definitions (agent cards, check_*.py gates, swarm.yml) are human-amend-only."
            echo "Autonomously adding/altering a gate touches a gate definition and is blocked by design."
            echo "This PR must be human-reviewed and admin-merged."
            exit 1
          fi
          echo "SWARM_GATE_TOUCHED: clean — no swarm gate definition changed."

      - name: Guard — swarm governance docs are human-amend-only (GOVERNANCE_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- \
            docs/swarm/SELF-FAILURE-MODES.md \
            docs/plans/53-agentic-swarm/ARCHITECTURE.md)"
          if [ -n "$changed" ]; then
            echo "::error::GOVERNANCE_TOUCHED: a swarm governance document changed in this PR:"
            echo "$changed" | sed 's/^/    /'
            echo "SELF-FAILURE-MODES.md and ARCHITECTURE.md carry the swarm's failure catalog,"
            echo "enforcement inventory, and stopping rule; they are human-amend-only for the same"
            echo "anti-Goodhart reason as CONSTITUTION_TOUCHED / SWARM_GATE_TOUCHED (ARCHITECTURE §2.7/§7)."
            echo "Measured incremental friction: zero — every historical commit to these files also"
            echo "touched a SWARM_GATE_TOUCHED path and was already admin-merged."
            echo "This PR must be human-reviewed and admin-merged."
            exit 1
          fi
          echo "GOVERNANCE_TOUCHED: clean — no governance document changed."

      - name: Guard — assurance-deficit registers are operator-accepted (REGISTER_TOUCHED)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          git fetch --quiet origin "${{ github.base_ref }}"
          base="origin/${{ github.base_ref }}"
          changed="$(git diff --name-only "$base"...HEAD -- ':(glob).jammi/registers/**')"
          if [ -n "$changed" ]; then
            echo "::error::REGISTER_TOUCHED: an assurance-deficit register changed in this PR:"
            echo "$changed" | sed 's/^/    /'
            echo "A register is a ship-with-residuals acceptance; accepting it is the OPERATOR's"
            echo "decision (constitution T1). On a conformant register, check_ship_register.py is"
            echo "GREEN and this tripwire is the SOLE red: the operator's admin-merge over it is the"
            echo "recorded acceptance, and the ONLY act that makes an operator_accepted_live residual"
            echo "effective. This PR must be admin-merged by the operator."
            exit 1
          fi
          echo "REGISTER_TOUCHED: clean — no register changed."
