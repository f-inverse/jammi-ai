# ============================================================================= ci + nightly: the distributed lanes

[lane.distributed-build]
why = "Compiles the `jammi-server` the distributed harness spawns, with the S3 driver its workers publish through, and archives each crate's distributed test binary with it."
name = "Distributed build"
workflow = ["ci", "nightly"]
rust = true
produces = ["distributed-jammi-ai", "distributed-jammi-bench"]
steps = [
  { name = "Build the jammi-server binary", run = "cargo build -p jammi-server --bin jammi-server --features storage-s3" },
  { name = "Archive the distributed test binaries", run = "for crate in jammi-ai jammi-bench; do\n  cargo nextest archive --profile distributed -p \"$crate\" --features live-distributed-tests --test distributed --archive-file \"/tmp/distributed-$crate.tar.zst\"\ndone\n" },
]

[lane.distributed]
why = "N worker processes claiming from a shared Postgres catalog and S3-class store: the fleet-safety claims, the SIGKILL crash windows and the ladder's fleet rungs, one leg per what decides its outcome (`check_distributed_legs.py` holds every distributed test to exactly one leg)."
name = "Distributed: {display}"
workflow = ["ci", "nightly"]
when = ["pr", "schedule", "dispatch"]
needs = ["postgres", "s3"]
consumes = ["distributed-jammi-ai", "distributed-jammi-bench"]
legs = [
  { name = "deterministic", display = "claim correctness", crate = "jammi-ai", tests = "one_job_n_workers_exactly_one_wins mixed_tenant_queue_completes_each_under_its_own_scope rendezvous_placed_search_over_real_worker_processes" },
  { name = "chaos", display = "SIGKILL crash windows", crate = "jammi-ai", tests = "killed_worker_job_is_reclaimed_and_completed_once crash_between_publish_and_finalize_commits_only_the_winner artifact_written_on_worker_is_readable_by_a_different_client killed_peer_job_is_reclaimed_and_completed_by_a_new_gang killed_coordinator_job_is_reclaimed_and_completed_by_a_new_gang" },
  { name = "rungs", display = "ladder rungs on a fleet", crate = "jammi-bench", tests = "every_train_run_rung_publishes_the_same_adapter every_predictor_train_run_rung_publishes_the_same_predictor" },
]
steps = [
  { download = "distributed-${{ matrix.crate }}", path = "/tmp/distributed" },
  { name = "Run the leg", env = { TESTS = "${{ matrix.tests }}", CRATE = "${{ matrix.crate }}" }, run = "read -ra tests <<< \"$TESTS\"\nbash ci/scripts/run_distributed_leg.sh \"/tmp/distributed/distributed-$CRATE.tar.zst\" \"${tests[@]}\"\n" },
  { name = "S3 store log (on failure)", if = "failure()", run = "cat /tmp/s3-test-store/.log" },
]

