          - name: fa2_ab.sh shape
            cmd: python3 ci/scripts/perf/test_fa2_ab_sh.py
          # Class closure (#482): `assert_elf_machine.sh`, `assert_glibc_floor.sh`,
          # and `assert_image_attestations.sh` each ship a `--self-test`
          # (synthetic fixtures, no ELF/Mach-O tooling, no docker, no
