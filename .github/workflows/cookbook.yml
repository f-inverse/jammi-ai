name: Cookbook

# Every recipe under cookbook/ runs against the engine built from this commit,
# on every change: a recipe is how a new user learns a verb, so a verb that
# breaks its recipe breaks here, before it merges. The recipes that talk to a
# server start one through `jammi.testing.LiveServer`, so this lane builds the
# CPU `jammi-server` and puts it on PATH; the same lane then runs the Python
# client's live-server suite, which needs exactly the two things it already has
# — the native engine and a built server.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cookbook-${{ github.ref }}
  # Same trade as ci.yml's concurrency block: a PR ref cancels its own
  # superseded runs; a RUNNING run on main is never cancelled, and a waiting
  # one is replaced by the next merge's, whose verdict covers it.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The tree's CI images (`_ci-image.yml`), by content: `ci.yml` builds them,
  # and this run waits until they exist.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  recipes:
    name: Recipes + live client suite
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # Both lockstep dists — the base client `jammi-ai` and the compiled
      # `jammi-ai-native` engine — plus the release `jammi-server` on PATH. The
      # shared setup-jammi-py action owns the venv/maturin/server mechanics.
      - name: Build wheel + jammi-server binary
        uses: ./.github/actions/setup-jammi-py
        with:
          build-server: "true"

      # The recipes resolve their fixtures through the `jammi_cookbook`
      # package, as a fresh install (a Colab runtime) does; the `cloud` extra
      # is the local S3-compatible server the cloud-storage recipe reads.
      - name: Install the cookbook package
        run: |
          . .venv/bin/activate
          pip install -e 'cookbook/book[cloud]'

      - name: Run every recipe
        run: |
          . .venv/bin/activate
          python tests/cookbook_smoke.py

      - name: Python client suite against a live server
        run: |
          . .venv/bin/activate
          JAMMI_SERVER_BIN="$GITHUB_WORKSPACE/target/release/jammi-server" make -C clients/python test-live
