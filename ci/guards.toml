# The repository's guards: hermetic commands, each holding one property of the
# tree. `ci/scripts/run_guards.py` runs them — in CI's `guard` job and locally
# (`ci/dev.sh python3 ci/scripts/run_guards.py --base origin/main`) alike.
#
#   name   what a report calls it
#   run    the command, from the repository root
#   why    the property it holds, in a sentence
#   when   scopes (below); omitted = runs on every change. A scoped guard runs
#          when a changed path matches its scope, and always on a push to main.
#   needs  host requirements (below) the runner provides before running
#
# Adding a guard: it must hold a property of the product or of the machinery
# that ships and measures it, and it must have been seen to fail for the reason
# it exists. A check of how a change was made, or of prose, does not belong.

# ---------------------------------------------------------------- scopes

# The rented-GPU rig: pod lifecycle, the prove/gang/cluster lanes, their
# committed timing evidence, and the workflows that drive them.
[scope.rig]
paths = [
  "ci/**",
  ".github/**",
  ".docker/**",
  ".cargo/**",
  "Cargo.lock",
  "**/Cargo.toml",
  "rust-toolchain.toml",
  "crates/jammi-kernels/build.rs",
  "crates/jammi-ai/tests/gpu_capability/**",
]

# The performance harnesses: Jammi-vs-PyTorch comparators, kernel census,
# corpus generators, and the evidence they commit.
[scope.perf]
paths = [
  "ci/**",
  "crates/jammi-bench/**",
  "crates/jammi-kernels/artifacts/**",
]

# The resolved dependency and feature graph, and the lanes that lint it.
[scope.cargo-graph]
paths = ["ci/**", ".github/**", ".cargo/**", "Cargo.lock", "**/Cargo.toml"]

# What a committed per-architecture kernel validation vouches for.
[scope.kernels]
paths = ["ci/**", "crates/jammi-kernels/**"]

# ----------------------------------------------------------------- needs

[need.pyyaml]
probe = "python3 -c 'import yaml'"
provide = "python3 -m pip install --user --quiet 'PyYAML==6.*'"

[need.actionlint]
probe = "command -v actionlint"
provide = "bash ci/scripts/install_actionlint.sh"

[need.safetensors]
probe = "python3 -c 'import safetensors'"
provide = "python3 -m pip install --user --quiet safetensors"

[need.ssh-keygen]
probe = "command -v ssh-keygen"
provide = "yum install -y -q openssh-clients"

[need.readelf]
probe = "command -v readelf"
provide = "yum install -y -q binutils"

# A Linux host, as root: what the CI image is. Nothing provides it — run the
# guards through `ci/dev.sh` on any other host.
[need.linux-root]
probe = "test \"$(uname -s)\" = Linux && test \"$(id -u)\" = 0"
provide = "echo 'run inside the CI image: ci/dev.sh python3 ci/scripts/run_guards.py' >&2; false"

[need.jq]
probe = "command -v jq"
provide = "yum install -y -q jq"

[need.rsync]
probe = "command -v rsync"
provide = "yum install -y -q rsync"

[need.tmux]
probe = "command -v tmux"
provide = "yum install -y -q tmux"

[need.flock]
probe = "command -v flock"
provide = "yum install -y -q util-linux"

[need.shasum]
probe = "command -v shasum"
provide = "yum install -y -q perl-Digest-SHA"

# A locale whose collation differs from C's byte order. A here-string, not
# a pipe: under the runner's pipefail, `grep -q` exiting early SIGPIPEs
# `locale -a` and reads as absent.
[need.en-us-locale]
probe = "grep -qixE 'en_US[.]utf-?8' <<< \"$(locale -a)\""
provide = "yum install -y -q glibc-langpack-en"

# `cargo metadata --frozen` reads the registry; it never builds.
[need.cargo-registry]
probe = "cargo metadata --format-version 1 --frozen >/dev/null"
provide = "cargo fetch --locked"

# Ancestry checks ask whether a recorded commit is in HEAD's history.
[need.full-history]
probe = "test \"$(git rev-parse --is-shallow-repository)\" = false"
provide = "git fetch --quiet --unshallow origin"

# ------------------------------------------------- the product's own shape

[[guard]]
name = "guard list"
run = "python3 ci/scripts/test_run_guards.py"
why = "The runner selects, provides and reports as this file's header says."

[[guard]]
name = "cookbook one-way"
run = "bash ci/scripts/check_cookbook_one_way.sh"
why = "The book consumes the engine; no engine crate references cookbook/book/."

[[guard]]
name = "SQLite-ism tripwire"
run = "python3 ci/scripts/check_sqlite_isms.py"
why = "No backend-specific SQL token in jammi-db's shared catalog code; the Postgres test matrix is the real parity proof."

[[guard]]
name = "doc↔enum parity"
run = "python3 ci/scripts/check_doc_parity.py"
why = "Every enum the docs enumerate lists exactly the variants the code has."

[[guard]]
name = "no run-time test skips"
run = "bash ci/scripts/check_no_require_flags.sh"
why = "No test reads green when its resource is missing: none reads a JAMMI_REQUIRE_* flag, because none has a skip for one to guard."

[[guard]]
name = "GPU parity matrix"
run = "python3 ci/scripts/check_gpu_parity_matrix.py"
why = "Every shipped (architecture × verb) cell is covered by a GPU parity test, structurally excluded, or named as pending."

[[guard]]
name = "engine dep-direction"
run = "cargo metadata --format-version 1 --locked | python3 ci/scripts/check_dep_direction.py"
why = "The engine's dependency closure holds no crate from outside crates.io: a consumer may depend on Jammi, never the reverse."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "flash-attn feature closure"
run = "python3 ci/scripts/check_flash_attn_closure.py"
why = "No default, release or all-features build reaches jammi-kernels/flash-attn: only a lane that asks for the CUTLASS kernels compiles them."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "flash-attn feature closure self-test"
run = "python3 ci/scripts/check_flash_attn_closure.py --self-test"
why = "The closure guard catches a leak reachable only through a workspace member's own feature selection."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "release postgres/mysql closure"
run = "python3 ci/scripts/check_release_manifest_pg_mysql_closure.py"
why = "No release lane's feature closure reaches jammi-db's postgres or mysql features: they link an OpenSSL the release images do not carry."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "release postgres/mysql closure self-test"
run = "python3 ci/scripts/check_release_manifest_pg_mysql_closure.py --self-test"
why = "The release closure guard fires on a lane that reaches either feature."
when = ["cargo-graph"]
needs = ["cargo-registry"]

[[guard]]
name = "lint-surface closure"
run = "python3 ci/scripts/check_lint_surface_closure.py"
why = "Every feature-gated target is compiled under clippy by some lane that runs on every pull request."
when = ["cargo-graph"]
needs = ["pyyaml", "cargo-registry"]

[[guard]]
name = "lint-surface closure self-test"
run = "python3 ci/scripts/check_lint_surface_closure.py --self-test"
why = "The lint-surface guard fires on a gated target no merge-path lane lints."
when = ["cargo-graph"]
needs = ["pyyaml", "cargo-registry"]

# ------------------------------------------------------ what a release ships

[[guard]]
name = "release manifest consistency"
run = "python3 ci/scripts/check_release_manifest.py"
why = "The release lanes describe one capability surface, each op classified by exactly one proof mechanism."

[[guard]]
name = "release workflow feature literals"
run = "python3 ci/scripts/check_workflow_feature_literals.py"
why = "A release workflow takes jammi-server's cargo features from the release manifest and spells none itself."

[[guard]]
name = "release workflow feature literals self-test"
run = "python3 ci/scripts/check_workflow_feature_literals.py --self-test"
why = "The feature-literal guard refuses a feature planted in a build-args line, a run string, an input default and a matrix value."

[[guard]]
name = "release manifest consistency self-test"
run = "python3 ci/scripts/check_release_manifest.py --self-test"
why = "The release-manifest guard fires on each inconsistency it names."

[[guard]]
name = "merged index platforms self-test"
run = "bash ci/scripts/check_merged_index_platforms.sh --self-test"
why = "A published multi-arch image tag carries exactly the requested platforms."
needs = ["jq"]

[[guard]]
name = "client deps self-test"
run = "bash ci/scripts/check_client_deps.sh --self-test"
why = "The check that the thin client pulls no ML dependency fires on one that does."
needs = ["jq"]

[[guard]]
name = "cu12 link-set classification"
run = "python3 ci/scripts/test_verify_link_set.py"
why = "Every shared library the cu12 binary needs is platform, driver-provided or delivered by a declared wheel component; anything else fails closed."

[[guard]]
name = "cu12 tarball bundle"
run = "bash ci/scripts/test_bundle_cuda_libs.sh"
why = "The cu12 tarball bundles exactly the CUDA libraries its binary loads."

[[guard]]
name = "cu12 tarball fixture"
run = "python3 ci/scripts/check_bundle_fixture.py"
why = "The committed cu12 loader report is the real build's, never a provisional stand-in."

[[guard]]
name = "cu12 tarball fixture self-test"
run = "python3 ci/scripts/check_bundle_fixture.py --self-test"
why = "The fixture guard refuses each provisional shape it names."

[[guard]]
name = "cu12 jail-trace driver"
run = "python3 ci/scripts/test_jail_trace.py"
why = "The loader trace that proves the cu12 tarball self-contained reports a missing library as missing."
needs = ["linux-root", "readelf"]

[[guard]]
name = "cu12 wheel component contract"
run = "python3 ci/scripts/test_cu12_component_contract.py"
why = "The cu12 wheel's three statements of its CUDA components agree."

[[guard]]
name = "ELF machine assertion self-test"
run = "bash ci/scripts/assert_elf_machine.sh --self-test"
why = "A release binary built for the wrong CPU architecture is refused."

[[guard]]
name = "glibc floor assertion self-test"
run = "bash ci/scripts/assert_glibc_floor.sh --self-test"
why = "A release binary needing a newer glibc than the published floor is refused."

[[guard]]
name = "image attestation assertion self-test"
run = "bash ci/scripts/assert_image_attestations.sh --self-test"
why = "A published image carries provenance and SBOM attestations for every platform in its index."
needs = ["jq"]

[[guard]]
name = "remote smoke oracle"
run = "python3 tests/compose/test_remote_smoke.py"
why = "The compose smoke test's pass/fail decision is a tested function of what the deployment returned."

[[guard]]
name = "held-out fixture integrity"
run = "python3 ci/scripts/perf/check_heldout_fixture_integrity.py"
why = "The committed held-out evaluation fixture's files agree with each other: ids, order, hashes and manifest."

[[guard]]
name = "held-out fixture integrity self-test"
run = "python3 ci/scripts/perf/check_heldout_fixture_integrity.py --self-test"
why = "The held-out fixture guard fires on each corruption it names."

