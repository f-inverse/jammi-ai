# ============================================================================= ci: the artifacts a release promotes

[lane.native-wheels]
why = "The `jammi-ai-native` wheels, maturin abi3 builds of the embedded engine for every platform, each held to the GLIBC floor, the machine its tag claims and PyPI's per-file limit."
name = "Native wheel ({dist})"
rust = "release"
needs = ["python"]
dir = "packaging/native"
produces = ["wheels-native-{dist}"]
legs = [
  { dist = "linux-x86_64", arch = "amd64", assert_arch = "x86_64", target_flag = "", glibc = "2.28" },
  { dist = "linux-aarch64", arch = "arm64", assert_arch = "aarch64", target_flag = "", glibc = "2.28" },
  { dist = "macos-arm64", host = "macos", assert_arch = "aarch64", rust_target = "aarch64-apple-darwin", target_flag = "--target aarch64-apple-darwin", glibc = "" },
  { dist = "macos-x86_64", host = "macos", assert_arch = "x86_64", rust_target = "x86_64-apple-darwin", target_flag = "--target x86_64-apple-darwin", glibc = "" },
]
steps = [
  { name = "Build the wheel", env = { TARGET_FLAG = "${{ matrix.target_flag }}" }, run = "# $TARGET_FLAG is a flag and its value, split on purpose.\nread -ra target <<< \"$TARGET_FLAG\"\nmaturin build --release --out dist \"${target[@]}\"\n" },
  { name = "The wheel's .so holds the GLIBC floor and the machine", env = { ASSERT_ARCH = "${{ matrix.assert_arch }}", GLIBC = "${{ matrix.glibc }}" }, run = "bash ../../ci/scripts/assert_wheel_so.sh dist/*.whl \"$ASSERT_ARCH\" \"$GLIBC\"" },
  { name = "The wheel fits PyPI's per-file limit", run = "bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl" },
]

[lane.native-wheel-cu12]
why = "The `jammi-ai-native-cu12` wheel, the embedded CUDA engine, built and checked by `ci/scripts/build_native_cu12_wheel.sh` in the CUDA image."
name = "Native wheel (CUDA)"
host = "cuda-image"
rust = "release"
needs = ["cutlass"]
produces = ["native-cu12-wheel"]
steps = [{ run = "bash ci/scripts/build_native_cu12_wheel.sh" }]

[lane.server]
why = "One `jammi-server` binary per manifest build and arch, its features read from `ci/release-feature-manifest.json`, stripped, held to the GLIBC floor and the machine, and packaged as its release tarball (a CUDA build bundles its runtime libraries and leaves its loader and jail reports)."
name = "Server ({build}, {target})"
rust = "release"
produces = ["{build}-{target}-binary", "{build}-{target}-tarball"]
legs = [
  { build = "server-cpu", arch = "amd64", cuda = false },
  { build = "server-cpu", arch = "arm64", cuda = false },
  { build = "server-cu12", arch = "amd64", host = "cuda-image", cuda = true },
]
steps = [
  { name = "Init the CUTLASS submodule (flash-attn builds its kernels from it)", if = "matrix.cuda", run = "git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass" },
  { name = "Build jammi-server (release)", env = { BUILD = "${{ matrix.build }}" }, run = "features=\"$(jq -r --arg b \"$BUILD\" '.builds[$b].cargo_features | join(\",\")' ci/release-feature-manifest.json)\"\ntest -n \"$features\" || { echo \"::error::ci/release-feature-manifest.json declares no cargo_features for build '$BUILD'\" >&2; exit 1; }\ncargo build --release -p jammi-server --bin jammi-server --features \"$features\"\n" },
  { name = "Strip the binary", run = "strip target/release/jammi-server" },
  { name = "The binary holds the GLIBC floor and the machine", env = { ARCH = "${{ matrix.target }}" }, run = "bash ci/scripts/assert_glibc_floor.sh target/release/jammi-server 2.28\nbash ci/scripts/assert_elf_machine.sh target/release/jammi-server \"$ARCH\"\n" },
  { upload = "{build}-{target}-binary" },
  { name = "Package the release tarball", id = "tarball", env = { BUILD = "${{ matrix.build }}", ARCH = "${{ matrix.target }}" }, run = "bash ci/scripts/package_server_tarball.sh \"$BUILD\" \"$ARCH\"" },
  { upload = "{build}-{target}-tarball" },
  { upload = "cu12-loader-report", if = "always() && matrix.cuda" },
  { upload = "cu12-jail-report", if = "always() && matrix.cuda" },
]

[lane.server-wheel]
why = "Each server binary as its PyPI wheel, relabelled to the platform the binary requires, its runtime link set verified against the wheel's dependency wheels where the manifest says so, and held to PyPI's per-file limit."
name = "Server wheel ({build}, {target})"
consumes = ["{build}-{target}-binary"]
produces = ["{build}-{target}-wheel"]
legs = [
  { build = "server-cpu", arch = "amd64" },
  { build = "server-cpu", arch = "arm64" },
  { build = "server-cu12", arch = "amd64" },
]
steps = [
  { download = "{build}-{target}-binary", path = "artifact" },
  { name = "Build the wheel", env = { BUILD = "${{ matrix.build }}", PLATFORM_TAG = "manylinux_2_28_${{ matrix.target }}" }, run = "bash ci/scripts/build_server_wheel.sh \"$BUILD\" artifact/jammi-server \"$PLATFORM_TAG\"" },
  { name = "The wheel fits PyPI's per-file limit", env = { BUILD = "${{ matrix.build }}" }, run = "bash ci/scripts/assert_wheel_size.sh \"packaging/$BUILD\"/dist/*.whl" },
]

[lane.cli]
why = "The `jammi` CLI release binary for every target the tree ships, packaged as its release tarball."
name = "CLI ({triple})"
rust = "release"
produces = ["jammi-{triple}"]
legs = [
  { triple = "x86_64-unknown-linux-gnu", arch = "amd64" },
  { triple = "aarch64-unknown-linux-gnu", arch = "arm64" },
  { triple = "aarch64-apple-darwin", host = "macos", rust_target = "aarch64-apple-darwin" },
]
steps = [
  { name = "Build jammi (release)", run = "cargo build --release -p jammi-cli --bin jammi" },
  { name = "Package", id = "package", env = { TARGET = "${{ matrix.triple }}" }, run = "bash ci/scripts/package_release_bin.sh jammi \"$TARGET\"" },
]

[lane.client-wheel]
why = "The pure-Python client `jammi-ai`: its proto stubs generated, its hermetic tests run from source, its import direction asserted, and the wheel built and held to PyPI's per-file limit."
name = "Client wheel"
dir = "clients/python"
produces = ["client-wheel"]
steps = [
  { name = "Install from source and generate the stubs", run = "python3 -m pip install --quiet -e '.[dev]' build\nmake generate\n" },
  { name = "Test (hermetic)", run = "make test" },
  { name = "The client imports with no engine", run = "python3 - <<'PY'\nimport sys, jammi\nbad = [m for m in sys.modules if m == \"jammi_native\" or m.startswith(\"jammi_native.\")]\nassert not bad, f\"import jammi eagerly pulled jammi_native: {bad}\"\nPY\n" },
  { name = "Build the wheel", run = "python3 -m build --wheel --outdir dist" },
  { name = "The wheel fits PyPI's per-file limit", run = "bash ../../ci/scripts/assert_wheel_size.sh dist/*.whl" },
]

[lane.ts-client]
why = "`@f-inverse/jammi-client` generated from the proto, type-checked, tested and packed: the tarball npm.yml publishes, at the Node version `.nvmrc` pins."
name = "TS client"
host = "ubuntu"
needs = ["node"]
dir = "clients/typescript"
produces = ["ts-client-package"]
steps = [
  { run = "npm ci" },
  { run = "npm run build" },
  { run = "npm run typecheck" },
  { run = "npm run test" },
  { name = "Pack", run = "mkdir -p \"$RUNNER_TEMP/ts-client\"\nnpm pack --pack-destination \"$RUNNER_TEMP/ts-client\"\n" },
]

[lane.docs]
why = "The guide, with every Rust example in it compiled and run against the workspace, and the rustdoc of every crate, laid out as the site a release publishes."
name = "Guide and API reference"
rust = true
produces = ["docs-site"]
steps = [
  { name = "Build the guide", run = "mdbook build docs/guide" },
  { name = "Build the workspace the guide's examples link against", run = "cargo build --workspace --exclude jammi-python --quiet" },
  { name = "Test the guide's examples", run = "RUSTUP_TOOLCHAIN=\"$(bash ci/scripts/rust_pin.sh)\" mdbook test docs/guide -L \"${CARGO_TARGET_DIR:-target}/debug/deps\"" },
  { name = "Build the API reference", run = "RUSTDOCFLAGS=\"-D warnings\" cargo doc --workspace --exclude jammi-python --no-deps" },
  { name = "Lay out the site", run = "mkdir -p _site\ncp -r docs/guide/book/. _site/\ncp -r \"${CARGO_TARGET_DIR:-target}/doc\" _site/api\n" },
]

# ============================================================================= ci: the artifacts, run as a user runs them

[lane.test-python]
why = "The pytest suite over the two dists that ship in lockstep: the client from source with its generated stubs, and the compiled engine this run built as its `file://` backend."
name = "Test (Python)"
when = ["pr"]
consumes = ["wheels-native-linux-x86_64"]
steps = [
  { uses = "./.github/actions/install-jammi", with = { client = "source", extra-pip-packages = "pytest", run-id = "{artifact-run}" } },
  { run = "pytest crates/jammi-python/tests -v" },
  { name = "Python client suite (with the embedded engine)", run = "make -C clients/python test-embedded" },
  { name = "The UAT shape-B/C Python scripts", run = "for script in tests/uat/shape_b_*.py tests/uat/shape_c_*.py; do\n  echo \"=== $script\"\n  python3 \"$script\"\ndone\n" },
]

[lane.client-live]
why = "The client's live-server suite over this run's engine, server and CLI, against the engine's test checkpoints."
name = "Python client against a live server"
when = ["pr"]
consumes = ["wheels-native-linux-x86_64", "server-cpu-x86_64-binary", "jammi-x86_64-unknown-linux-gnu"]
steps = [
  { uses = "./.github/actions/install-jammi", with = { client = "source", binaries = "true", run-id = "{artifact-run}" } },
  { run = "make -C clients/python test-live" },
]

[lane.book-checks]
why = "The book's checks that need no model: its API reference against the engine, its library's lint and unit tests, the no-deferral gate and its citations; the chapters run on real models in the cookbook lane."
name = "Book (static checks)"
when = ["pr"]
consumes = ["wheels-native-linux-x86_64", "client-wheel"]
dir = "cookbook/book"
steps = [
  { uses = "./.github/actions/install-jammi", with = { run-id = "{artifact-run}" } },
  { name = "Install the book", run = "pip install -e '.[book,dev]'" },
  { name = "API reference matches the engine", run = "python -m jammi.session_journal -- python scripts/check_api_reference.py" },
