name: PyPI (jammi-ai-native-cu12, CUDA)

# Publishes the CUDA (cu12, sm_80+) build of the embedded engine,
# `jammi-ai-native-cu12`, to PyPI on a `py-v*` tag — the SAME lockstep tag as
# `jammi-ai`, the CPU `jammi-ai-native` and the servers. It provides the same
# `jammi_native` module as the CPU wheel, so `jammi-ai` runs on the GPU with
# no other change. `ci.yml` builds it on every pull request and on `main`
# (`_native-wheel-cu12.yml`: in the CUDA CI image, through
# `ci/scripts/build_native_cu12_wheel.sh`, the same recipe a GPU pod verifies
# the wheel with); this workflow publishes the one the run that proved the
# tag's tree built. Its cargo features are `packaging/native-cu12`'s own
# `[tool.maturin] features`, as the CPU wheel's are. Publishing is gated on
# the commit's already-recorded GPU-prove verdict, like every release lane.
#
# NOTE (release-time, EXTERNAL — do not act in CI): the
# `jammi-ai-native-cu12` PyPI project's Trusted-Publisher config must authorize
# THIS workflow (`pypi-native-cuda.yml`, environment `pypi`).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-native-cuda-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # What this release publishes: the artifacts the `ci.yml` run that proved
  # the released tree built — nothing compiles here. On a branch dispatch,
  # the rehearsal: the same lookup over the branch's tree.
  artifacts:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      artifacts: native-cu12-wheel

  proof:
    name: Proof required
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref. PURE conjunction (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.artifacts.result == 'success' && needs.proof.result == 'success'
    needs: [artifacts, proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      # Downloads from the proving run, not this one.
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: native-cu12-wheel
          path: dist
          run-id: ${{ needs.artifacts.outputs.run }}
          github-token: ${{ github.token }}

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
