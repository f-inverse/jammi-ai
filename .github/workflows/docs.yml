name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "crates/*/src/**"
      # the READMEs the guide {{#include}}s (cookbook-recipes.md, quickstart-python.md)
      - "cookbook/recipes/**"
      - "cookbook/quickstart/**"
  pull_request:
    branches: [main]
    paths:
      - "docs/guide/**"
      - "crates/*/src/**"
      - "cookbook/recipes/**"
      - "cookbook/quickstart/**"
  # Re-publish when the Cookbook book finishes a render on main (its output is the
  # /cookbook subpath we serve). `branches` filters on the triggering run's branch,
  # so PR-branch Cookbook-book runs never fire this; the build-job `if` narrows it
  # further to the render events that actually save a fresh _book cache.
  workflow_run:
    workflows: ["Cookbook book"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: Build
    # A `workflow_run` fires for every Cookbook-book completion on main — but only
    # the render events (schedule / manual dispatch) save a fresh _book cache worth
    # republishing. A main push runs only Cookbook-book's cheap gate (no cache) and
    # already triggers this workflow directly, so skip those to avoid a redundant
    # second build. (`branches: [main]` on the trigger handles the branch filter.)
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event))
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-inverse/jammi-ai-ci:latest
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build guide
        run: mdbook build docs/guide

      - name: Build workspace (so mdbook test can resolve workspace crates)
        run: cargo build --workspace --exclude jammi-python --quiet

      - name: Test guide doctests
        run: mdbook test docs/guide -L target/debug/deps

      - name: Build rustdoc
        run: cargo doc --workspace --exclude jammi-python --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r docs/guide/book/* _site/
          cp -r target/doc _site/api

      - name: Restore the rendered cookbook
        # Published under /cookbook. The executed render lives in the Cookbook
        # book workflow (nightly / on demand); here we only restore its output by
        # prefix — so an unrelated guide or crate change never re-executes the
        # book, and the book never vanishes from the site between renders.
        id: cookbook
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: cookbook/book/_book
          key: cookbook-book-render-
          restore-keys: |
            cookbook-book-render-

      - name: Add the cookbook to the site
        if: github.event_name != 'pull_request' && steps.cookbook.outputs.cache-matched-key != ''
        run: cp -r cookbook/book/_book _site/cookbook

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
