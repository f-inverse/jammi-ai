name: _cli

# Builds the `jammi` CLI release binary for each target triple asked for and
# packages it as its release tarball (`ci/scripts/package_release_bin.sh`).
# The one definition of how the CLI is compiled: `ci.yml` calls it for every
# target the tree ships, and a release promotes the tarballs that run built.
#
# Artifact: `jammi-<target>`, the tarball `jammi-<version>-<target>.tar.gz`.

on:
  workflow_call:
    inputs:
      targets:
        description: >
          Space-separated target triples, each one of x86_64-unknown-linux-gnu,
          aarch64-unknown-linux-gnu and aarch64-apple-darwin.
        type: string
        required: true
      cpu-image:
        description: "The tree's CPU CI image (the Linux targets build in it)."
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # `fromJson` needs a real JSON value; where a target builds is
  # `ci/scripts/build_matrix.py`'s to say.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        env:
          TARGETS: ${{ inputs.targets }}
          CPU_IMAGE: ${{ inputs.cpu-image }}
        run: python3 ci/scripts/build_matrix.py cli --targets "$TARGETS" --container "$CPU_IMAGE" | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build jammi (${{ matrix.target }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The Linux targets build in the CI image, which carries the toolchain;
      # the macOS runner installs it.
      - if: runner.os == 'macOS'
        uses: ./.github/actions/setup-rust-host
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rust-ci
        with:
          # A release build, not the lint gate.
          deny-warnings: false

      - name: Build jammi (release)
        run: cargo build --release -p jammi-cli --bin jammi

      - name: Package
        id: package
        env:
          TARGET: ${{ matrix.target }}
        run: bash ci/scripts/package_release_bin.sh jammi "$TARGET"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jammi-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
