[package]
name = "jammi-kernels"
description = "Candle CustomOp scaffolding and a feature-gated CUDA build path for fused training kernels (elementwise/normalization/attention). Leaf crate: no jammi-* dependencies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# third_party/flash-attention/{src,jammi,shim,LICENSE,AUTHORS,VENDORED.md}
# is Dao-AILab's BSD-3-Clause code, vendored (not re-licensed); the crate's
# own code stays Apache-2.0. Cargo has no per-subtree license field, so the
# mix is surfaced two ways: (1) the crate-level `license` stays Apache-2.0
# (accurate for the code jammi-ai wrote) and the vendored subtree's own
# LICENSE/AUTHORS travel WITH it in the published tarball via the `include`
# list below (never `exclude` them — that would strip attribution while
# still shipping the kernels built from that source); (2) this note plus
# the one-line pointer in src/lib.rs's crate doc name the exception for
# anyone auditing the published crate. See
# third_party/flash-attention/VENDORED.md for the full provenance.
license.workspace = true
repository.workspace = true
keywords = ["candle", "cuda", "custom-op", "fused-kernel", "autodiff"]
categories = ["science"]
readme = "README.md"
build = "build.rs"
# Deterministic tarball contents. Without this list, `cargo package` ships
# whatever happens to be on the publishing checkout's disk — including the
# CUTLASS submodule when checked out (tens of MB, its own BSD-3 license,
# and never intended to publish) and the committed cuda-runs evidence
# artifacts. third_party/cutlass is a git submodule, NOT vendored into the
# published tarball at all: `flash-attn` is not a publishable-from-crates.io
# feature today (build.rs refuses, loudly, without the submodule checked
# out — build from the git repo for FA2); if that ever changes, CUTLASS's
# own BSD-3 license needs the same treatment as the flash-attention
# subtree's.
include = [
    "/src/**",
    "/build.rs",
    "/README.md",
    "/third_party/flash-attention/src/**",
    "/third_party/flash-attention/jammi/**",
    "/third_party/flash-attention/shim/**",
    "/third_party/flash-attention/LICENSE",
    "/third_party/flash-attention/AUTHORS",
    "/third_party/flash-attention/VENDORED.md",
]

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
# CustomOp2::cpu_fwd receives raw `CpuStorage`; the BF16 CPU arm reads/writes
# `half::bf16` directly. Same crate (compatible version range) candle-core
# itself depends on — not a new numeric type into the graph, just the public
# name for one already resolved.
half.workspace = true
thiserror.workspace = true
tracing.workspace = true
# `f32`/`f64` erf — GeGLU's forward/backward need the same error function
# candle-core's own `gelu_erf` uses. candle-core's `crate::cpu::erf::erf_f32`
# (`src/cpu/erf.rs`) is a private wrapper around `libm::erff`/`libm::erf`, not
# re-exported publicly, so this crate depends on `libm` directly rather than
# re-deriving a different-precision erf. `libm` was ALREADY resolved in this
# workspace's Cargo.lock (a transitive dependency of candle-core, itself
# `[dependencies.libm] version = "0.2.15"`), so this adds no new package to
# the dependency graph — only a direct (named) one this crate can call.
# `.workspace = true` (not a per-crate literal version): a single hoisted
# entry means fused-vs-eager parity can't drift between crates in this
# workspace (one lock entry moves both this crate's erf and candle-core's),
# and — since a `^`-range literal can still pick up a later `libm` PATCH
# release across `cargo update` without any commit here changing — a single
# workspace-level bump is what would visibly move this crate's own quoted
# oracle numbers (`geglu_oracles.rs`'s measured tolerances/residuals), not a
# silent per-crate drift.
libm.workspace = true
# `#[derive(VariantArray)]` for `admission::ProbedOpId` (#546 K1: the closed
# admission-op enum a definition-hash fold reads by construction). Not a
# `jammi-*` crate — this crate's own "leaf crate: no jammi-* dependencies"
# description is unaffected.
strum.workspace = true

[build-dependencies]
# Only pulled into the build-dependency graph when the `cuda` feature is
# active (`optional = true` + `dep:bindgen_cuda` below) — the default
# (laptop/CI) build never resolves or builds this crate, so it adds no
# system requirement (nvcc, a CUDA toolkit) to the non-cuda lane.
bindgen_cuda = { version = "0.1.6", optional = true }

[dev-dependencies]
approx.workspace = true
jammi-test-resources = { workspace = true, features = ["candle"] }

[features]
default = []
# candle's CUDA backend and the PTX build step in `build.rs`.
cuda = ["dep:bindgen_cuda", "candle-core/cuda", "candle-nn/cuda"]
# Vendored FlashAttention-2 (hdim64 / bf16+f16 / sm80+86+89+90, forward and
# backward) behind a torch-free C wrapper — `third_party/flash-attention/`,
# built by `build.rs::build_flash_attn` with `nvcc` (needs the CUDA toolkit and
# the CUTLASS submodule; see `third_party/flash-attention/VENDORED.md`). Depends
# on `cuda` and is not part of it: the `cuda` release lane never compiles
# CUTLASS. `ci/scripts/check_flash_attn_closure.py` asserts no consumer's
# feature closure reaches it; `tests/feature_table.rs` asserts this crate's own
# `cuda` / `default` entries do not.
flash-attn = ["cuda"]
# candle's Metal backend. This crate has no Metal kernels of its own:
# `ops::DropoutFused::metal_fwd` runs the CPU mask on the Metal device's data.
metal = ["candle-core/metal", "candle-nn/metal"]
# Compiles the tests that need CUDA device 0.
live-gpu-tests = ["cuda"]
# Compiles the tests that need a Metal device.
live-metal-tests = ["metal"]

# CPU↔CUDA parity for every fused op, forward and backward.
[[test]]
name = "cuda_parity"
path = "tests/cuda_parity.rs"
required-features = ["live-gpu-tests"]

# CPU↔Metal mask parity for `DropoutFused`.
[[test]]
name = "metal_parity"
path = "tests/metal_parity.rs"
required-features = ["live-metal-tests"]

# The FlashAttention-2 suites: FFI smoke, op oracles, torch parity (bf16, f16)
# and the decisive timing measurement.
[[test]]
name = "flash_smoke"
path = "tests/flash_smoke.rs"
required-features = ["live-gpu-tests", "flash-attn"]

[[test]]
name = "flash_op_oracles"
path = "tests/flash_op_oracles.rs"
required-features = ["live-gpu-tests", "flash-attn"]

[[test]]
name = "flash_torch_parity"
path = "tests/flash_torch_parity.rs"
required-features = ["live-gpu-tests", "flash-attn"]

[[test]]
name = "flash_torch_parity_f16"
path = "tests/flash_torch_parity_f16.rs"
required-features = ["live-gpu-tests", "flash-attn"]

[[test]]
name = "flash_decisive_timing"
path = "tests/flash_decisive_timing.rs"
required-features = ["live-gpu-tests", "flash-attn"]
