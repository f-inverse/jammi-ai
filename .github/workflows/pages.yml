# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# The documentation site of a `py-v*` release, behind the release gate: the
# guide and API reference the proving ci.yml run built, and the book the
# cookbook lane rendered on real models, so what a reader reads is what PyPI
# serves and what each chapter's Colab badge installs.

name: Pages
'on':
  push:
    tags:
      - py-v*
  workflow_dispatch: {}
concurrency:
  group: pages
  cancel-in-progress: false
permissions:
  contents: read
jobs:

  # The release gate: the tree's recorded verdicts, and the tag names its version.
  proof:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v')
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash ci/scripts/check_release_tag.sh "$GITHUB_REF_NAME"
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ci/scripts/verdict.py require --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse "$GITHUB_SHA^{tree}")"

  # The ci.yml run that proved this tree, which holds what this workflow installs.
  artifacts-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ci
          ARTIFACTS: docs-site
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # The cookbook-gpu.yml run that proved this tree, which holds what this workflow installs.
  artifacts-cookbook-gpu:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: cookbook-gpu
          ARTIFACTS: cookbook-book
        run: python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$(git rev-parse 'HEAD^{tree}')" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"

  # Lays out the site: the guide at the root, the API reference under `api/`, the book under `cookbook/`, the paths the guide, the README and every notebook link to.
  site:
    name: Lay out the site
    needs:
      - artifacts-ci
      - artifacts-cookbook-gpu
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: _site
          run-id: ${{ needs.artifacts-ci.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cookbook-book
          path: _site/cookbook
          run-id: ${{ needs.artifacts-cookbook-gpu.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  # Deploys the laid-out site to GitHub Pages; the `github-pages` environment admits only `py-v*` tags.
  deploy-pages:
    name: Deploy to GitHub Pages
    needs:
      - proof
      - site
    if: startsWith(github.ref, 'refs/tags/py-v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
