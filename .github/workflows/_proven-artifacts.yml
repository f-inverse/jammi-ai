name: _proven-artifacts

# Names the run whose artifacts a release promotes: the run of the caller's
# lane that proved the tree being released — `ci`, the `ci.yml` run whose
# `ci-summary` is the most recent green measurement, for every build; or
# `cookbook`, the `cookbook-gpu.yml` run that rendered the book on real models
# — once `ci/scripts/proven_artifacts.py` has confirmed it still holds every
# artifact the caller names. A release compiles nothing: each
# promoting job downloads those artifacts by this run id
# (`actions/download-artifact`'s `run-id`, with `actions: read`) and
# publishes the bytes that run's checks exercised.
#
# On a branch dispatch, the caller's rehearsal: the same lookup over the
# branch's tree, with nothing promoted.

on:
  workflow_call:
    inputs:
      lane:
        description: "The lane whose run holds the artifacts: ci or cookbook."
        type: string
        required: true
      artifacts:
        description: "Space-separated names of the artifacts the release promotes."
        type: string
        required: true
    outputs:
      run:
        description: "The run id holding them."
        value: ${{ jobs.resolve.outputs.run }}

permissions:
  contents: read

jobs:
  resolve:
    name: The run that proved this tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.resolve.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the run and its artifacts
        id: resolve
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANE: ${{ inputs.lane }}
          ARTIFACTS: ${{ inputs.artifacts }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          python3 ci/scripts/proven_artifacts.py --repo "$GITHUB_REPOSITORY" --tree "$tree" --lane "$LANE" --artifacts "$ARTIFACTS" >> "$GITHUB_OUTPUT"
