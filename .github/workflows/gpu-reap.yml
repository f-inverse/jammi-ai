name: GPU reap (RunPod orphans)

# Terminates RunPod pods this repo rented that have outlived their own
# deadline. Every pod carries a deadline in its entrypoint, armed before
# anything else the container does (`_rp_entrypoint_setup`, `runpod_lib.sh`);
# this sweep is the independent backstop for the deadline that never got
# armed — a pod whose container died early, or a host that stopped reporting.
# A separate workflow on purpose: the sweep also runs at the top of every paid
# lane's driver, which only helps when a lane runs. It fails when it cannot
# enumerate the account's pods: "could not check" is never "nothing to clean".

on:
  schedule:
    # Every 6h, offset off the hour to avoid the other crons.
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      force_hours:
        description: "Force-reap every jammi pod older than this many hours (empty honours each pod's own deadline)."
        type: string
        required: false

permissions:
  contents: read

jobs:
  reap:
    name: Terminate orphaned RunPod pods
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Never overlap: two sweeps racing would both try to terminate the same pod.
    concurrency:
      group: gpu-reap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Reap
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          FORCE_HOURS: ${{ inputs.force_hours }}
        run: bash ci/scripts/gpu-dev.sh reap $FORCE_HOURS
