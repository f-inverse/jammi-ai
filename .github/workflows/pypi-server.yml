name: PyPI (jammi-server, CPU)

# Publishes the CPU `jammi-server` wheel to PyPI on a `py-v*` tag — the SAME tag
# that publishes the base client `jammi-ai` and the `jammi-ai-native` engine
# wheels, so the whole Python surface ships in LOCKSTEP at one version. Thin
# caller of the shared `_pypi-server` reusable (build -> package, NO GPU
# prove-gate on this leg); the publish job lives HERE, not in the reusable —
# PyPI's token exchange and its attestation verification match different
# workflow-ref claims for a reusable-workflow publish and can never both pass
# (see `_pypi-server.yml`'s header). The PyPI trusted publisher for
# `jammi-server` is registered under THIS file's name (workflow
# `pypi-server.yml`, environment `pypi`).

on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:
  # PR gate: build-only (no publish) when the packaging or the build inputs
  # change, so a broken wheel is caught before a tag is cut.
  pull_request:
    paths:
      - "packaging/server-cpu/**"
      - ".github/workflows/pypi-server.yml"
      - ".github/workflows/_pypi-server.yml"
      - "crates/jammi-server/**"

# Serialize per ref, never cancel: a publish in flight must finish (PyPI
# uploads are not resumable), matching the other release lanes.
concurrency:
  group: pypi-server-${{ github.ref }}
  cancel-in-progress: false

# Least privilege at the workflow level; only the publish job below widens to
# `id-token: write` (PyPI trusted publishing).
permissions:
  contents: read

jobs:
  server-cpu:
    name: jammi-server (CPU)
    permissions:
      contents: read
    uses: ./.github/workflows/_pypi-server.yml
    with:
      container_image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
      cargo_features: jetstream-broker,storage-cloud
      package_dir: packaging/server-cpu
      artifact_prefix: server-cpu
      platform_tag: manylinux_2_28_x86_64
    secrets: inherit

  gpu-proof:
    name: GPU proof required
    # Any `py-v*` TAG ref — a tag push, or a recovery dispatch run on the
    # tag — requires the release commit's already-recorded GPU-prove
    # verdict before the CPU wheel is published (#454 follow-up, operator
    # direction: every release publisher gates on the prove verdict,
    # all-or-nothing — this leg used to have no GPU gate at all because the
    # CPU wheel itself never touches CUDA, but the CPU wheel still ships in
    # the SAME all-or-nothing lockstep release as the CUDA lanes, so it must
    # not promote ahead of an unproven commit either).
    if: startsWith(github.ref, 'refs/tags/py-v')
    uses: ./.github/workflows/_gpu-proof-required.yml
    permissions:
      contents: read
      actions: read
    secrets: inherit

  publish:
    name: Publish to PyPI
    # Publishes ONLY from a `py-v*` tag ref — a tag push, or a
    # workflow_dispatch run on the tag (recovery: PyPI rejects a re-upload of
    # an existing version, so re-running the tag is idempotent) — whose
    # commit's GPU-prove verdict is green. A branch dispatch or PR is an
    # artifact-only dry run and can never publish. Same recovery contract as
    # `pypi.yml`/`pypi-client.yml` on this lockstep surface. PURE conjunction
    # (no `||`).
    if: always() && startsWith(github.ref, 'refs/tags/py-v') && needs.server-cpu.result == 'success' && needs.gpu-proof.result == 'success'
    needs: [server-cpu, gpu-proof]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: server-cpu-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2 (release/v1)
        with:
          packages-dir: dist
