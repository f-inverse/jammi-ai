name: Cookbook render

# The heavy leg of the Theory↔Computation book (cookbook/book/): a full quarto
# render that runs every chapter live at `small` scale (incl. the grpc://
# live-server chapters) and checks each against its frozen goldens. Runs nightly
# (and on demand) — never on a PR — and caches the rendered `_book`, which the
# Docs workflow restores to publish the /cookbook subpath. `ci.yml` renders, on
# every change, only the chapters that change can move; this render catches what
# no change touched (an ecosystem drift under an unchanged chapter), and the Docs
# republish (keyed on this workflow via `workflow_run`) fires only on a full
# render. The published notebooks, against what PyPI serves, run in
# cookbook-published.yml.
#
# It compiles nothing. It renders against the wheels, server and CLI that the
# `ci.yml` run which proved this commit's tree built (`verdict.py probe` names
# that run), so the nightly measures the same bytes every check of that tree
# did. A tree with no green `ci.yml` run has nothing to render, and fails
# saying so.

on:
  schedule:
    # Nightly: full quarto render + live-server chapters.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: cookbook-render-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane reads the checkout and saves an actions cache
# (the cache API needs no `contents` scope); nothing publishes.
permissions:
  contents: read

env:
  # The determinism regime: jammi_cookbook also sets these on import, but
  # pinning them in the job env covers anything that reads them first.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  # The tree's CI images (`_ci-image.yml`), by content: `ci.yml` builds them,
  # and this run waits until they exist.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  render:
    name: Render + live-server (nightly)
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    permissions:
      contents: read
      # Reads the proving run's record and downloads its artifacts.
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: The run that proved this tree
        id: proof
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          python3 ci/scripts/verdict.py probe --repo "$GITHUB_REPOSITORY" --tree "$tree" | tee "$RUNNER_TEMP/probe.txt"
          run="$(sed -n 's/^run=//p' "$RUNNER_TEMP/probe.txt")"
          if [ -z "$run" ]; then
            echo "::error::tree $tree has no green ci.yml run, so there are no artifacts to render against -- the run for this commit must pass first" >&2
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      # A chapter that runs a Rust program compiles it against the workspace
      # crates, through the compile cache `main` writes.
      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: false

      - name: Install the client, the native engine, the server and the CLI
        uses: ./.github/actions/install-jammi
        with:
          client: wheel
          binaries: "true"
          run-id: ${{ steps.proof.outputs.run }}

      - name: Install the book (against the engine that tree built)
        run: |
          . .venv/bin/activate
          pip install -e 'cookbook/book[book,dev]'

      - name: Render + execute the book
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python -m jammi.session_journal -- quarto render

      - name: Cache the rendered book for the Pages deploy
        uses: actions/cache/save@v4
        with:
          path: cookbook/book/_book
          key: cookbook-book-render-${{ github.sha }}
