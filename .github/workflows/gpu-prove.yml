name: GPU prove (RunPod)

# Runs the gated GPU suites on real NVIDIA hardware via an ephemeral RunPod
# pod — the only place the CUDA path is exercised on a device before a
# release: the served client/server GPU proof (`grpc_embedding_gpu`) and the
# engine-core correctness suite (`gpu_capability`). It doubles as the
# compute-capability gate: the pod builds candle's kernels at the CI image's
# baked CUDA_COMPUTE_CAP and runs them on a real device.
#
# Matrixed over every shipped CUDA arch (`crates/jammi-kernels/build.rs`
# GENCODE_ARCHES, mirrored by `check_gpu_parity_matrix.py`): sm_80 (A100),
# sm_86 (A40-class), sm_89 (L40S), sm_90 (H100). Each leg is an independent,
# fail-closed proof (`fail-fast: false`), named "GPU prove on RunPod (<arch>)";
# `ci/scripts/runpod_gpu_prove.sh`'s `GPU_PROVE_ARCH` selects the device. The
# tree this run proves is recorded once (`subject`), and every leg checks out
# that same commit, so the subject names the tree the pod built.
#
# Off the merge path: GPU minutes cost money and capacity is intermittent. It
# fires on the `run-gpu` pull-request label, manual dispatch, and a reviewed
# nightly cron (`check_gpu_prove_once.py`'s allowlist); no `push:` or
# `workflow_call:` trigger, and nothing `uses:` it. Every release publisher
# gates on this lane's recorded verdict for the tree it promotes
# (`_proof-required.yml`), never on a fresh rental: prove, then tag. A
# dispatch on a tag ref gets the release budget — three attempts on a
# capacity exit and the matching timeout — every other ref one attempt.
#
# Concurrency is per leg and ref, and never cancels: cancelling SIGKILLs the
# runner before the driver's EXIT trap terminates the pod it rented, which
# then bills to its own deadline; letting a superseded run finish costs
# minutes. The label trigger fires for every label, and a skipped job never
# enters its group.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  schedule:
    # Nightly at 03:47 UTC — off-peak, offset from the other crons.
    - cron: "47 3 * * *"

permissions:
  contents: read

jobs:
  subject:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.subject.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: subject
        uses: ./.github/actions/record-subject

  # The tree's CUDA CI image: the pod runs the environment the tree defines.
  ci-image:
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu cuda

  gpu-prove:
    name: GPU prove on RunPod (${{ matrix.arch }})
    needs: [subject, ci-image]
    strategy:
      fail-fast: false
      matrix:
        arch: [sm_80, sm_86, sm_89, sm_90]
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-gpu'
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-prove-${{ matrix.arch }}-${{ github.ref }}
      cancel-in-progress: false
    # Above the driver's own budget, so a job-timeout kill never fires first.
    # Release budget: two retried attempts can each cost a deploy-exhaustion
    # cycle (8 candidates x 600s) plus overhead, and the final attempt the
    # full session (100m): 2 x 85m + 180m + 5m. One attempt: 80m deploy +
    # 100m session + 10m.
    timeout-minutes: ${{ github.ref_type == 'tag' && 355 || 190 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/run-paid-lane
        with:
          driver: ci/scripts/runpod_gpu_prove.sh
          max-attempts: ${{ github.ref_type == 'tag' && 3 || 1 }}
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          RP_IMAGE: ${{ needs.ci-image.outputs.cuda }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          GPU_PROVE_ARCH: ${{ matrix.arch }}
          # The pod checks out exactly this commit and echoes its sha;
          # `runpod_lib.sh` fails 77 on a disagreement.
          PROVE_EXPECT_SHA: ${{ needs.subject.outputs.commit }}
