[package]
name = "jammi-db"
description = "Vector database, SQL federation, mutable companion tables, and trigger broker for Jammi AI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = []
# `postgres` and `mysql` pull `datafusion-table-providers`'s federation
# drivers, which depend on `native-tls` unconditionally (no `rustls` option).
# Both features turn on `native-tls`'s `vendored` feature: on Linux OpenSSL is
# built from source (`openssl-src`) and linked statically, so a published
# artifact carries no `DT_NEEDED libssl` the manylinux platform tag does not
# promise, and a build host needs a C toolchain and Perl (OpenSSL's
# `Configure`, with `IPC::Cmd` and `Time::Piece`) rather than OpenSSL's
# headers. macOS and Windows use the platform TLS stack.
#
# Each source feature turns on the matching `datafusion-table-providers`
# backend (whose own `federation` default pushes the query down) plus what
# `source/{postgres,mysql}.rs` reads a connection URL with.
postgres = ["datafusion-table-providers/postgres", "dep:secrecy", "dep:native-tls"]
mysql = ["datafusion-table-providers/mysql", "dep:mysql_async", "dep:secrecy", "dep:native-tls", "dep:libz-sys"]
# Gates tests that require a live Postgres instance (JAMMI_TEST_PG_URL),
# the Postgres source's among them.
live-postgres-tests = ["postgres"]
# Compiles the mutable-sink crash-recovery checkpoint hook. Pure test
# infrastructure: the hook is a single `await` on a notifier that only
# arms when env vars are set. Off by default; the
# `mutable_crash_recovery.rs` integration test requires it.
test-hooks = []
# This build carries an accelerator backend (CUDA or Metal): the device a
# deployment runs on by default is the accelerator (`[gpu] device = 0`), not the
# CPU. Enabled by `jammi-ai`'s `cuda` / `metal` features, which are what
# compile an accelerator in; a build without one defaults to the CPU, so its
# default configuration never requests a device it cannot have.
accelerator = []
# Object-store backends. The default build only ships `file://` and
# `memory://`; cloud schemes are opt-in per provider so a tenant who
# never publishes to S3 does not pull in the AWS SDK chain.
storage-s3 = ["object_store/aws"]
storage-gcs = ["object_store/gcp"]
storage-azure = ["object_store/azure"]
# R2 is the S3 driver pointed at an R2 endpoint, so it reuses the AWS backend.
storage-r2 = ["object_store/aws"]
storage-cloud = ["storage-s3", "storage-gcs", "storage-azure", "storage-r2"]
# Live cloud tests: require credentials + JAMMI_TEST_*_BUCKET env vars.
# Each implies the matching driver feature so the live test compiles.
live-s3-tests = ["storage-s3"]
live-gcs-tests = ["storage-gcs"]
live-azure-tests = ["storage-azure"]
live-r2-tests = ["storage-r2"]
# Compiles the tests that need file permissions to apply to the test process: a
# non-root user on a filesystem that enforces mode bits.
unprivileged-tests = []

[dependencies]
# Internal
jammi-numerics.workspace = true
jammi-datafusion.workspace = true

# Query engine
datafusion.workspace = true
datafusion-federation.workspace = true
arrow.workspace = true
arrow-schema.workspace = true
arrow-array.workspace = true

# External sources (feature-gated — not a workspace dep to avoid sqlite3 links conflict)
datafusion-table-providers = { version = "0.13.1", default-features = false, optional = true }
secrecy = { version = "0.10", optional = true }
mysql_async = { version = "0.37", optional = true }
# Named only to turn on `vendored` (see `[features]`); the drivers above depend
# on it themselves.
native-tls = { version = "0.2", features = ["vendored"], optional = true }
# Named only to turn on `static`: `mysql_async`'s compression (`flate2`'s zlib
# backend) would otherwise link the system `libz.so.1`, which the manylinux
# platform tag does not promise either.
libz-sys = { version = "1", features = ["static"], optional = true }

# Storage
parquet.workspace = true
usearch.workspace = true
sqlx.workspace = true
object_store.workspace = true
bytes = "1"
# tempfile is needed by storage::sidecar_layout to bridge USearch's
# path-based FFI into object_store's byte-stream API for cloud schemes.
tempfile = "3"

# Config
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
serde_path_to_error.workspace = true

# Enum-inventory-by-construction: see the workspace manifest's comment
# on this dependency.
strum.workspace = true

# Caching
moka.workspace = true
seahash.workspace = true
bytemuck.workspace = true

# Retry
backon.workspace = true
futures.workspace = true
async-stream.workspace = true
parking_lot.workspace = true

# Utilities
uuid.workspace = true
rand.workspace = true
chrono.workspace = true
tracing.workspace = true
thiserror.workspace = true
directories.workspace = true
tokio.workspace = true
url.workspace = true
percent-encoding = "2"
async-trait.workspace = true

# Audit-record signing
hmac.workspace = true
sha2.workspace = true
hkdf.workspace = true
hex.workspace = true

# `[engine] memory_limit`'s host-memory reader (`config::host_memory`):
# `sysctlbyname("hw.memsize")` on macOS.
libc.workspace = true

[dev-dependencies]
# This crate's own test targets run with `test-hooks` on: `jammi-test-utils`
# enables the feature, and feature unification turns it on for every test
# target here. Consumers never see it.
tempfile = "3"
tokio.workspace = true
jammi-test-utils.workspace = true
jammi-test-resources.workspace = true
test-case = { workspace = true }
# `libc` is a regular dependency above, so tests use it from there.
parquet = { workspace = true }
# `materialization.rs` captures a `tracing::warn!` through a real `fmt`
# subscriber.
tracing-subscriber.workspace = true
# The `models_delete_call_sites.rs` source oracle keys its reviewed
# raw-byte-delete-call-site table by (file, enclosing fn, ordinal-within-that-fn),
# which only a real AST walk can determine (a text scan cannot tell a doc
# comment's rendered text from a real call, or find the enclosing `fn` across a
# multi-line signature). Pinned to the versions `jammi-ai`'s own `syn` /
# `proc-macro2` dev-deps already resolve in `Cargo.lock`, so this edge adds no
# new package or version. Test-only: no production code parses Rust source.
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
syn = { version = "2.0.117", features = ["full", "visit", "extra-traits"] }
