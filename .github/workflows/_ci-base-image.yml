name: _ci-base-image

# Reusable CI base-image builder. The CPU base (jammi-ai-ci) and the CUDA base
# (jammi-ai-ci-cuda) build identically — same login → metadata → build-push —
# differing only in the image name and the Dockerfile. One reusable, two thin
# callers (image.yml / image-cuda.yml), instead of two byte-identical workflows.
#
# Multi-arch shape: `build-and-push` is a matrix over the caller's `platforms`
# input, one NATIVE runner per platform (`linux/amd64` -> `ubuntu-latest`,
# `linux/arm64` -> `ubuntu-24.04-arm`; no QEMU — a QEMU-emulated Rust
# toolchain build is an order of magnitude slower and has hung before). Each
# leg pushes ONLY the `sha-<sha>-<arch>` tag; a leg never pushes a real
# (`latest`/bare `sha-<sha>`) tag on its own. That per-arch tag NAME is
# COMMIT-scoped, not run-scoped -- two DIFFERENT commits always get two
# DIFFERENT tag names, which never collide -- but the tag is NOT immutable
# within one commit: two runs BUILDING THE SAME COMMIT (e.g. a main push
# and a tag push of that same commit, different concurrency groups) each
# rebuild and re-push it, and each run's `merge-manifest` below reads back
# whatever the tag points at when IT runs -- there is no cross-run mutex on
# the per-arch tag itself.
# This is harmless here: rebuilding the SAME commit through the SAME
# Dockerfile is deterministic up to the base image an unrelated republish
# could have moved between the two runs, and this reusable workflow IS that
# base image, so for it the two builds' outputs are equivalent regardless
# of which one a given merge happens to read. The pre-create dry-run
# assertion (below) still guarantees every promoted index carries the
# EXACT requested platform set no matter which run's tag it merged.
# `merge-manifest` (`needs: [plan,
# build-and-push]`, runs for every caller including a ONE-platform caller —
# `image-cuda.yml` passes no `platforms` at all, i.e. the single-element
# default) re-derives the SAME real tags this workflow has always published,
# DRY-RUNS the merge and asserts the resulting index BEFORE promoting
# anything, then merges the per-arch immutable sources into one multi-arch
# index via `docker buildx imagetools create`, then re-inspects the pushed
# tag once to confirm.
#
# Every consumer's `container:` field (and workflow-call `container_image`
# input) resolves the image via a repo variable with a literal `:latest`
# fallback: `${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}`
# (resp. `JAMMI_CI_IMAGE_CUDA` for the CUDA base). Pulling `:latest` now
# resolves to a multi-arch INDEX, so each puller's own container runtime
# selects the manifest matching its own host arch automatically.
#
# Consumers track `:latest`, deliberately. This workflow does NOT rewrite those
# variables to the sha tag it just pushed, and a step that tried to was removed:
# GITHUB_TOKEN cannot write repo variables at all (403 "Resource not accessible
# by integration" on both create and update), and no `permissions:` block can
# grant it — repo variables need `administration: write`, which is not available
# to GITHUB_TOKEN. Re-adding sha-pinning therefore means introducing a PAT, not
# adjusting permissions. Do not "fix" the failure by making such a step
# non-fatal; that converts a broken pin into a silent one. Every consumer
# today instead pulls `:latest` directly (now a multi-arch index, so each
# puller's own runtime picks the manifest matching its own host arch --
# see the paragraph above). Nothing in this tree resolves `:latest` to a
# digest and pins it per run YET; a release-artifact-producing workflow
# that wants an IMMUTABLE base across its own several legs could do exactly
# that (`docker buildx imagetools inspect --format
# '{{.Manifest.Digest}}'` once per run, then pass `image@sha256:...`
# forward to every leg) -- still no PAT, still no repo-variable write, just
# a read -- but that is a RECOMMENDATION for a future workflow to adopt,
# not a mechanism this file or any current consumer implements.
#
# The `sha-<commit>-<arch>` tags are still published (now per-arch, merged
# under `sha-<commit>` too), so a specific build can be pinned by hand (set
# the repo variable to it) when a bisect or a reproduction needs it.

on:
  workflow_call:
    inputs:
      image_suffix:
        description: "ghcr image-name suffix appended to the repo: 'ci' or 'ci-cuda'."
        type: string
        required: true
      dockerfile:
        description: "Dockerfile to build (build context is .docker/)."
        type: string
        required: true
      platforms:
        description: >-
          Comma-separated buildx platform list, e.g. "linux/amd64,linux/arm64".
          Each entry builds NATIVELY on its own runner (no QEMU) -- see the
          `plan` job below for the platform -> runner/arch/base-image map.
        type: string
        default: "linux/amd64"
      base_image_amd64:
        description: "BASE_IMAGE build-arg for the linux/amd64 leg."
        type: string
        default: "quay.io/pypa/manylinux_2_28_x86_64"
      base_image_arm64:
        description: "BASE_IMAGE build-arg for the linux/arm64 leg."
        type: string
        default: "quay.io/pypa/manylinux_2_28_aarch64"

permissions:
  contents: read
  packages: write

jobs:
  # Turns the comma-separated `platforms` input into a matrix `include:`
  # list. A GitHub Actions matrix cannot be built from a raw string directly
  # -- `fromJson` needs a real JSON array, so this job does the one bit of
  # scripting the rest of the file stays declarative around. This is the
  # SINGLE place the platform -> runner/arch/base-image map lives:
  # `build-and-push` consumes it as its own `strategy.matrix`, and
  # `merge-manifest` reads the arch list back out of this job's `matrix`
  # output instead of re-deriving it.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Derive the per-platform build matrix
        id: plan
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          BASE_IMAGE_AMD64: ${{ inputs.base_image_amd64 }}
          BASE_IMAGE_ARM64: ${{ inputs.base_image_arm64 }}
        run: |
          set -euo pipefail
          IFS=',' read -ra platforms <<< "$PLATFORMS"
          entries=()
          for platform in "${platforms[@]}"; do
            case "$platform" in
              linux/amd64)
                runner=ubuntu-latest
                arch=amd64
                base_image="$BASE_IMAGE_AMD64"
                ;;
              linux/arm64)
                runner=ubuntu-24.04-arm
                arch=arm64
                base_image="$BASE_IMAGE_ARM64"
                ;;
              *)
                echo "unsupported platform: '$platform' (expected linux/amd64 or linux/arm64)" >&2
                exit 1
                ;;
            esac
            entries+=("{\"platform\":\"$platform\",\"runner\":\"$runner\",\"arch\":\"$arch\",\"base_image\":\"$base_image\"}")
          done
          matrix="{\"include\":[$(IFS=,; echo "${entries[*]}")]}"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [plan]
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The buildx `docker-container` driver is required for the attestation
      # manifest `merge-manifest`'s assertion below depends on: the default
      # `docker` driver builds without buildx at all and emits a plain v2
      # manifest with NO `unknown/unknown` provenance referrer, which would
      # silently fail that assertion the first time `imagetools create`
      # moves a real tag. Pinned to the same sha `docker-publish`'s own
      # `Set up Docker Buildx` step uses. Load-bearing, not cosmetic.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          # Each leg pushes ONLY the per-arch sha tag -- never `latest`,
          # never a bare `sha-<sha>` -- so `merge-manifest` below is the
          # ONLY job that ever moves a real (consumer-facing) tag. The
          # per-arch tag is commit-scoped and immutable ACROSS commits;
          # two runs building the SAME commit (e.g. main-push +
          # tag-push) each rebuild and re-push it, and each run's own
          # merge reads back whatever it points at when that merge runs --
          # see this file's own header for why that race is harmless here.
          flavor: |
            suffix=-${{ matrix.arch }},onlatest=true
          tags: |
            type=sha,format=long

      # rust-toolchain.toml is the single source of truth for the pin. The build
      # context is `.docker/`, so the file cannot be COPYed into the image —
      # it is read here and passed as a build-arg instead. Without this the
      # Dockerfile would carry its own copy of the version, and a bump to
      # rust-toolchain.toml would trigger a rebuild that faithfully reproduced
      # the OLD pin and reported success.
      - name: Resolve the pinned Rust toolchain
        id: rust-pin
        shell: bash
        run: |
          set -euo pipefail
          channel="$(bash ci/scripts/rust_pin.sh)"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "pinned Rust: $channel"

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .docker
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            RUST_VERSION=${{ steps.rust-pin.outputs.channel }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # Runs UNCONDITIONALLY -- also for a one-platform caller (image-cuda.yml
  # passes no `platforms` input at all, i.e. the single-element default) --
  # because this is now the ONLY job that ever produces the real
  # (`latest`/bare `sha-<sha>`) tags every consumer's `container:`/
  # `JAMMI_CI_IMAGE[_CUDA]` expression resolves. A one-platform run still
  # needs its single immutable source merged into a real tag; skipping this
  # job for that case would leave `:latest` stale forever.
  #
  # Verify-then-promote: the merge is DRY-RUN first and its resulting index
  # asserted against the requested platform set BEFORE anything is pushed --
  # `imagetools create --dry-run` prints the same top-level index JSON
  # `imagetools inspect --format '{{json .Manifest}}'` returns on a
  # multi-platform tag (verified against a live registry), so the identical
  # assertion script runs against both. A failed assertion here means
  # nothing was pushed and `:latest`/`sha-<sha>` never moved. Only after
  # that passes does the real (pushing) `imagetools create` run, followed by
  # one cheap re-inspect of the actually-pushed tag to confirm the push
  # matched what the dry run predicted.
  merge-manifest:
    needs: [plan, build-and-push]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Re-run metadata-action with the ORIGINAL (unsuffixed) tag rules --
      # the exact tag set this workflow published before the per-arch legs
      # existed -- so `latest` still only moves on the default branch and
      # `sha-<sha>` is still the immutable per-commit handle, now naming a
      # multi-arch index instead of a single-arch image.
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Compute the immutable per-arch sources and the real tag list
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}-${{ inputs.image_suffix }}
          SHA_TAG: sha-${{ github.sha }}
          TAGS: ${{ steps.meta.outputs.tags }}
          MATRIX_JSON: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          # `plan`'s matrix JSON is the single place the platform -> arch map
          # lives -- read the arch list back out of it instead of
          # re-deriving arch from `inputs.platforms` with a second case
          # statement. `archs_json=$(...) || exit 1` (never `mapfile <
          # <(...)`, which discards jq's own exit code into a subshell this
          # step never checks) so a malformed MATRIX_JSON input fails this
          # step loudly instead of silently producing zero sources below.
          archs_json="$(jq -r '.include[].arch' <<< "$MATRIX_JSON")" || {
            echo "::error::failed to read .include[].arch out of plan's matrix JSON" >&2
            exit 1
          }
          mapfile -t archs <<< "$archs_json"
          if [ "${#archs[@]}" -eq 0 ] || [ -z "${archs[0]}" ]; then
            echo "::error::plan's matrix JSON yielded zero archs -- refusing to compute an empty source list" >&2
            exit 1
          fi
          : > /tmp/ci-base-image-sources.txt
          for arch in "${archs[@]}"; do
            echo "${IMAGE}:${SHA_TAG}-${arch}" >> /tmp/ci-base-image-sources.txt
          done

          : > /tmp/ci-base-image-tags.txt
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            echo "$tag" >> /tmp/ci-base-image-tags.txt
          done <<< "$TAGS"

      - name: Dry-run the merge and assert the resulting index BEFORE promoting anything
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          mapfile -t sources < /tmp/ci-base-image-sources.txt
          mapfile -t tags < /tmp/ci-base-image-tags.txt
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done

          docker buildx imagetools create --dry-run "${tag_args[@]}" "${sources[@]}" \
            | bash ci/scripts/check_merged_index_platforms.sh "$PLATFORMS"

      - name: Promote -- create the real merged index
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          first_tag="$(head -n1 /tmp/ci-base-image-tags.txt)"

          # Capture the PRE-CREATE digest of the first tag BEFORE the real
          # (mutating) create below -- if the post-push confirm step fails,
          # this is the exact digest it prints a restore command for.
          #
          # Distinguish "this tag has never been published" from ANY OTHER
          # read failure (registry outage, auth, a malformed ref): only a
          # genuine not-found result is a legitimate first-publish (nothing
          # to restore to, not a problem this step should fail on). Every
          # other non-zero exit means this step cannot even confirm what it
          # would be overwriting -- refuse to promote rather than guess.
          # The exact wording ("<ref>: not found") is buildx's own, verified
          # against a real nonexistent tag on this registry
          # (`docker buildx imagetools inspect
          # ghcr.io/f-inverse/jammi-ai-ci:definitely-missing` -> `ERROR:
          # ghcr.io/f-inverse/jammi-ai-ci:definitely-missing: not found`,
          # exit 1) -- a malformed reference instead prints `ERROR: invalid
          # reference format`, a DIFFERENT string this rule must not match.
          set +e
          previous_digest="$(docker buildx imagetools inspect "$first_tag" --format '{{.Manifest.Digest}}' 2>/tmp/ci-base-image-inspect-stderr.txt)"
          inspect_rc=$?
          set -e
          inspect_stderr="$(cat /tmp/ci-base-image-inspect-stderr.txt)"

          if [ "$inspect_rc" -ne 0 ]; then
            if [[ "$inspect_stderr" == *"$first_tag: not found"* ]]; then
              echo "previous_digest=" >> "$GITHUB_OUTPUT"
              echo "pre-create digest read: $first_tag does not exist yet (first publish) -- nothing to restore to"
            else
              echo "::error::pre-create digest read for $first_tag failed with something other than a not-found result -- refusing to promote: $inspect_stderr" >&2
              exit 1
            fi
          elif [[ "$previous_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "previous_digest=$previous_digest" >> "$GITHUB_OUTPUT"
            echo "pre-create digest for $first_tag: $previous_digest"
          else
            echo "::error::pre-create digest read for $first_tag succeeded but returned an unexpected value ('$previous_digest', not a sha256 digest) -- refusing to promote" >&2
            exit 1
          fi

          mapfile -t sources < /tmp/ci-base-image-sources.txt
          mapfile -t tags < /tmp/ci-base-image-tags.txt
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(-t "$tag")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

      - name: Confirm the pushed index (cheap re-inspect of one tag)
        shell: bash
        env:
          PLATFORMS: ${{ inputs.platforms }}
          PREVIOUS_DIGEST: ${{ steps.promote.outputs.previous_digest }}
        run: |
          set -euo pipefail
          first_tag="$(head -n1 /tmp/ci-base-image-tags.txt)"

          # Two DIFFERENT failures, two different messages: the re-inspect
          # ITSELF failing (the push may or may not have actually landed --
          # unknown, so a restore command here could overwrite a GOOD push
          # with a stale digest) is never the same situation as a
          # successful re-inspect whose CONTENT fails the assertion (the
          # push definitely landed and definitely landed wrong -- a restore
          # is exactly right there).
          set +e
          manifest="$(docker buildx imagetools inspect "$first_tag" --format '{{json .Manifest}}' 2>/tmp/ci-base-image-confirm-stderr.txt)"
          confirm_inspect_rc=$?
          set -e

          if [ "$confirm_inspect_rc" -ne 0 ]; then
            confirm_stderr="$(cat /tmp/ci-base-image-confirm-stderr.txt)"
            echo "::error::could not re-read $first_tag after the promote step ($confirm_stderr) -- do NOT restore from PREVIOUS_DIGEST ($PREVIOUS_DIGEST): whether the push landed is unknown, so overwriting now could discard a GOOD push instead of a bad one; verify manually first" >&2
            exit 1
          fi

          if ! echo "$manifest" | bash ci/scripts/check_merged_index_platforms.sh "$PLATFORMS"; then
            if [ -n "$PREVIOUS_DIGEST" ]; then
              restore_ref="${first_tag%:*}@${PREVIOUS_DIGEST}"
              echo "::error::post-push confirm failed for $first_tag -- the re-read index itself is wrong; previous digest was $PREVIOUS_DIGEST; restore with: docker buildx imagetools create -t $first_tag $restore_ref" >&2
            else
              echo "::error::post-push confirm failed for $first_tag -- the re-read index itself is wrong, and this was the first publish of this tag, so there is no previous digest to restore to; investigate directly" >&2
            fi
            exit 1
          fi
