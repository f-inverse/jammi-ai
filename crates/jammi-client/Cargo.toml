[package]
name = "jammi-client"
description = "The Jammi data-plane client: a candle-free typed-RPC + Flight SQL client over the gRPC wire"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
jammi-wire.workspace = true
jammi-admin.workspace = true
jammi-db.workspace = true
arrow.workspace = true
arrow-schema.workspace = true
arrow-array.workspace = true
arrow-flight.workspace = true
tonic.workspace = true
futures.workspace = true
tokio-stream.workspace = true
uuid.workspace = true

[dev-dependencies]
# Test-only: the `grpc_timeout_header_tests` module in `src/lib.rs` spins up
# a real loopback `tonic::transport::Server` double to prove `wait_job`/
# `subscribe` send no `grpc-timeout` header while their `_with_timeout`
# siblings do -- request construction and the RPC call are not separable in
# those functions, so this needs a genuine server-side handler, not a
# hand-built `tonic::Request` inspected without ever sending it.
tokio.workspace = true
