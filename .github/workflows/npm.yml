name: npm

# Publishes @f-inverse/jammi-client (the TypeScript gRPC-web SDK) to npm, in LOCKSTEP with
# the engine: the same `v*` release tag that drives the crates.io / PyPI publish.
# It runs ONLY on a release tag push — never on a PR or a branch push — so a
# merge to `main` cannot publish.
on:
  push:
    tags: ["v*"]
  # Manual re-run to finish a release whose publish step was interrupted: run
  # the dispatch ON the `v*` tag (the publish step is tag-guarded; it also
  # no-ops if the version is already on npm). A branch dispatch is a
  # build-and-test dry run.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to (re)publish, e.g. 0.13.0. Defaults to the pushed tag."
        required: false
        type: string

concurrency:
  group: release-npm
  cancel-in-progress: false

# Least privilege at the workflow level; the publish job widens to
# `id-token: write` (npm OIDC trusted publishing) per job.
permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    permissions:
      # `id-token: write` authenticates the publish via npm OIDC Trusted
      # Publishing (no stored `NPM_TOKEN`) and mints the signed provenance
      # attestation; `contents: read` is the checkout default. The npm package
      # `@f-inverse/jammi-client` registers this repo + workflow as a trusted
      # publisher (the npm analogue of the PyPI/crates.io trusted publishers).
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing (OIDC) auto-auth needs a recent npm; Node 22 ships an
      # older npm. Upgrade so `npm publish` exchanges the GitHub OIDC token for a
      # short-lived publish credential — no long-lived secret to expire.
      #
      # PINNED, not `@latest`: a release lane must not depend on whatever floated
      # to latest today. `npm@12.0.0` shipped a `libnpmpublish` whose provenance
      # path cannot resolve `sigstore` (`MODULE_NOT_FOUND`), which broke the
      # `--provenance` publish. 11.18.0 is the newest non-broken line and the one
      # that published prior releases green. Bump deliberately after verifying a
      # newer npm publishes with provenance.
      - name: Upgrade npm (OIDC trusted publishing)
        run: npm install -g npm@11.18.0

      - name: Verify tag matches package version
        # Any `v*` tag ref — a tag push, or a recovery dispatch run on the
        # tag — must pass this; only a branch dispatch (build-only dry run)
        # skips it.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          version=$(node -p "require('./package.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match @f-inverse/jammi-client version $version"
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Build (generate + tsc)
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test (hermetic)
        run: npm run test

      # Publishes via OIDC Trusted Publishing — no `NODE_AUTH_TOKEN` / `NPM_TOKEN`.
      # `npm publish` detects the GitHub Actions OIDC environment (`id-token:
      # write`) and exchanges it for a short-lived publish credential, and emits
      # provenance automatically. Requires the npm package to register this repo
      # + workflow as a trusted publisher.
      - name: Publish
        # Publishes ONLY from a `v*` tag ref (tag push, or a recovery
        # dispatch run on the tag). The already-on-npm check below makes the
        # re-run idempotent; the tag guard is what keeps "recovery
        # re-publish" and "first publish of an untagged build" distinct
        # states — a branch dispatch builds and tests but never publishes.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # Derive the version from the tag (v0.13.0 -> 0.13.0); a dispatch
          # run on the tag may override via the input.
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION:-${GITHUB_REF_NAME#v}}"
          # Skip if this version is already on npm (idempotent re-run); `npm view`
          # exits non-zero when the exact version does not exist yet.
          if npm view "@f-inverse/jammi-client@${VERSION}" version >/dev/null 2>&1; then
            echo "@f-inverse/jammi-client ${VERSION} already on npm — skipping"
          else
            echo "Publishing @f-inverse/jammi-client ${VERSION}"
            npm publish --provenance --access public
          fi
