name: _native-wheel-cu12

# Builds the `jammi-ai-native-cu12` wheel — the embedded CUDA engine (the
# manifest's `native-cu12` build) — through `ci/scripts/build_native_cu12_wheel.sh`,
# which builds it in the CUDA image and checks it. The one definition of how
# the CUDA native wheel is built: `ci.yml` calls it on every pull request and
# on `main`; `pypi-native-cuda.yml` calls it to publish.
#
# Artifact: `native-cu12-wheel`.

on:
  workflow_call:
    inputs:
      cuda-image:
        description: "The tree's CUDA CI image."
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    name: Build jammi-ai-native-cu12 (manylinux_2_28_x86_64)
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.cuda-image }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # `flash-attn` builds its kernels from the vendored CUTLASS submodule.
      - name: Init the CUTLASS submodule
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --depth 1 crates/jammi-kernels/third_party/cutlass

      - uses: ./.github/actions/setup-rust-ci
        with:
          deny-warnings: false

      - name: Build and check the wheel
        run: bash ci/scripts/build_native_cu12_wheel.sh

      - uses: actions/upload-artifact@v4
        with:
          name: native-cu12-wheel
          path: packaging/native-cu12/dist/
