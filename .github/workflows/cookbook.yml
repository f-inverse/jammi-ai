name: Cookbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly run includes the slow + integration recipes (fine_tune, flight_sql).
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: cookbook-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTFLAGS: "-D warnings -C link-arg=-fuse-ld=mold"
  SCCACHE_GHA_ENABLED: "true"

jobs:
  smoke:
    name: Smoke (fast)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-inverse/jammi-ai-ci:latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build wheel + venv
        # The CI base image ships maturin + a system python3; venv-isolate to
        # avoid polluting site-packages and to make `python` resolve to the
        # venv's interpreter for the smoke runner. `jammi_ai.connect` needs all
        # three lockstep dists: `jammi-client` (remote arm, not on PyPI for an
        # unreleased commit — install from in-repo source with the dev extra's
        # pinned `grpcio-tools`, then generate stubs), the compiled
        # `jammi-ai-native` engine (`maturin develop` on `packaging/native`), and
        # the pure-Python `jammi-ai` front-end (editable root install, `--no-deps`
        # since its exact pins are already satisfied above).
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          pip install -e 'clients/python[dev]'
          make -C clients/python generate
          ( cd packaging/native && maturin develop --release )
          pip install -e . --no-deps

      - name: Run cookbook smoke
        run: |
          . .venv/bin/activate
          python tests/cookbook_smoke.py

  smoke-slow:
    name: Smoke (slow + integration)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/f-inverse/jammi-ai-ci:latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: mozilla-actions/sccache-action@v0.0.9

      - name: Build wheel + jammi-server binary
        # `flight_sql` shells out to `target/release/jammi-server`; build it
        # before invoking the smoke runner. `jammi_ai.connect` needs all three
        # lockstep dists: `jammi-client` (not on PyPI for an unreleased commit —
        # install from in-repo source with the dev extra's pinned `grpcio-tools`,
        # then generate stubs), the compiled `jammi-ai-native` engine (`maturin
        # develop` on `packaging/native`), and the pure-Python `jammi-ai`
        # front-end (editable root install, `--no-deps`).
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip
          pip install maturin
          pip install -e 'clients/python[dev]'
          make -C clients/python generate
          ( cd packaging/native && maturin develop --release )
          pip install -e . --no-deps
          cargo build --release -p jammi-server

      - name: Run cookbook smoke (all recipes)
        env:
          JAMMI_COOKBOOK_SLOW: "1"
        run: |
          . .venv/bin/activate
          python tests/cookbook_smoke.py
