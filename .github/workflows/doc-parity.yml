name: Doc parity

# No `paths:` filter — this is a trivial, hermetic pure-Python check (no Rust
# build, no toolchain), so it always runs on every PR and push to main. A
# path-filtered workflow that is later set as a required status check would hang
# unrelated PRs (the check never reports); running unconditionally keeps it safe
# to require in branch protection.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: doc-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  doc-parity:
    name: Guard (doc↔enum parity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A static, hermetic check: it parses the `ProducingDescriptor` enum, the
      # guide's marked variant list, and the `replay_descriptor` match arms from
      # the working tree — no build, no network, no toolchain (system python3
      # only). Fails closed if the documented variant set diverges from the code
      # enum, or if a documented replay exception no longer matches the code's
      # `NotRecomputable` arms.
      - name: Assert the guide's documented enum enumerations match the code
        run: python3 ci/scripts/check_doc_parity.py
