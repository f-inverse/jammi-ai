name: Compose smoke (Shape B)

# Packages the CPU `jammi-ai-server` image from proven binaries, brings up
# `deploy/docker-compose.yml` (Shape B: server + one Postgres serving as
# catalog and broker) with the CI fixture-mount override, and drives it with
# the client wheel (`tests/compose/shape_b_remote.py`) — proving the compose
# file, the image's env-only config resolution, and a restart's result
# durability together. One leg per arch, each on its native runner.
#
# The image packages binaries it does not compile. `ci.yml` calls this with
# its own run id, so the smoke runs the bytes that run built; the nightly and
# a dispatch resolve the run that proved `main`'s tree (`_proven-artifacts.yml`)
# and package those, catching drift with no code change at all — a runtime
# base image's update, a Postgres patch release. The image is built with
# `push: "false"` and loaded into the runner's own daemon: no registry is
# written, so this workflow is not a promotion (`check_gpu_prove_once.py`'s
# P6 rule reads that literal).

on:
  workflow_call:
    inputs:
      run-id:
        description: "The run whose binaries and client wheel the image packages."
        type: string
        required: true
  schedule:
    # 03:00 UTC nightly.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A top-level run: the binaries of the run that proved this tree.
  artifacts:
    if: inputs.run-id == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_proven-artifacts.yml
    with:
      lane: ci
      artifacts: >-
        server-cpu-x86_64-binary
        server-cpu-aarch64-binary
        jammi-x86_64-unknown-linux-gnu
        jammi-aarch64-unknown-linux-gnu
        client-wheel

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: plan
        run: python3 ci/scripts/build_matrix.py images --platforms linux/amd64,linux/arm64 | tee -a "$GITHUB_OUTPUT"

  compose-smoke:
    name: Compose smoke (Shape B, ${{ matrix.arch }})
    needs: [artifacts, plan]
    if: always() && needs.plan.result == 'success' && (inputs.run-id != '' || needs.artifacts.result == 'success')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    env:
      RUN_ID: ${{ inputs.run-id || needs.artifacts.outputs.run }}
      JAMMI_IMAGE: jammi-ai-server:smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Compose interpolates `${JAMMI_AUDIT_MASTER_KEY:?…}` on every
      # subcommand, so the key is job-wide. Synthetic, for this throwaway
      # stack.
      - name: Generate the ephemeral compose key
        run: |
          key="$(openssl rand -hex 32)"
          echo "::add-mask::${key}"
          echo "JAMMI_AUDIT_MASTER_KEY=${key}" >> "$GITHUB_ENV"

      - name: The arch's binary names
        id: arch
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in amd64) echo "target=x86_64" ;; arm64) echo "target=aarch64" ;; esac >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/stage-server-binaries
        id: binaries
        with:
          server: server-cpu-${{ steps.arch.outputs.target }}-binary
          cli: jammi-${{ steps.arch.outputs.target }}-unknown-linux-gnu
          stage: builder
          run-id: ${{ env.RUN_ID }}

      # Native: the arm64 leg loads a real arm64 image, never an emulated one.
      - uses: ./.github/actions/build-image
        with:
          load-tag: ${{ env.JAMMI_IMAGE }}
          build-contexts: ${{ steps.binaries.outputs.build-context }}
          cache-scope: cpu-generic-${{ matrix.arch }}

      - name: The pinned service images, under the names the compose file uses
        run: bash ci/scripts/pull_service_images.sh

      - name: Bring up Shape B (server + Postgres)
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml up --wait

      - name: The running container is the image this job built
        run: |
          set -euo pipefail
          built_id="$(docker image inspect --format '{{.Id}}' "$JAMMI_IMAGE")"
          container_id="$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml ps -q jammi-server)"
          running_id="$(docker inspect --format '{{.Image}}' "$container_id")"
          [ "$built_id" = "$running_id" ] \
            || { echo "::error::the running container's image ($running_id) is not the image this job built ($built_id)" >&2; exit 1; }

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: ./.github/actions/install-jammi
        with:
          native: "false"
          run-id: ${{ env.RUN_ID }}

      - name: Run the remote Shape B smoke script
        run: python3 tests/compose/shape_b_remote.py

      # The two-mode shutdown's RELEASE arm on the shipped image: SIGINT hands
      # the in-flight job's lease back, the process exits 0,
      # `restart: unless-stopped` brings it back and its worker reclaims the row.
      - name: Run the Shape B release smoke script (RELEASE via SIGINT)
        run: python3 tests/compose/shape_b_release.py

      - name: The Postgres catalog was exercised at runtime
        run: |
          set -euo pipefail
          count="$(docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml exec -T postgres \
            psql -U jammi -d jammi -tAc 'select count(*) from sources')"
          echo "postgres catalog sources rows: ${count}"
          [ "${count}" -ge 1 ] \
            || { echo "::error::no row in the Postgres 'sources' table after add_source: the compose file's JAMMI_CATALOG__POSTGRES__URL is not backing the catalog" >&2; exit 1; }

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.ci.yml down -v
