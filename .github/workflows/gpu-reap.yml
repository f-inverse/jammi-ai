# GENERATED by ci/scripts/lanes.py from ci/lanes.toml -- edit the table, then `python3 ci/scripts/lanes.py render`.
#
# Terminates RunPod pods this repository rented that have outlived their own
# deadline: the backstop for a deadline that never got armed (a container that
# died early, a host that stopped reporting). It fails when it cannot enumerate
# the account's pods: "could not check" is never "nothing to clean".

name: GPU reap (RunPod orphans)
'on':
  schedule:
    - cron: 23 */6 * * *
  workflow_dispatch:
    inputs:
      force_hours:
        description: Force-reap every jammi pod older than this many hours (empty honours each pod's own deadline).
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:

  # Terminates the pods this repository rented that outlived their own deadline; two sweeps never overlap.
  gpu-reap:
    name: Terminate orphaned RunPod pods
    runs-on: ubuntu-latest
    concurrency:
      group: gpu-reap-${{ github.ref }}
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      GIT_REPO: https://github.com/${{ github.repository }}.git
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: |
          read -ra hours <<< "$FORCE_HOURS"
          bash ci/scripts/gpu-dev.sh reap "${hours[@]}"
        env:
          FORCE_HOURS: ${{ inputs.force_hours }}
