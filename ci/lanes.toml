]

[lane.server-image-cuda-check]
why = "The CUDA image's runtime stage assembles from this run's CUDA binary before a tag publishes it; the GPU runtime itself is not testable here."
name = "Server image (CUDA) assembles"
when = ["pr"]
host = "ubuntu"
consumes = ["server-cu12-x86_64-binary", "jammi-x86_64-unknown-linux-gnu"]
steps = [
  { id = "binaries", uses = "./.github/actions/stage-server-binaries", with = { server = "server-cu12-x86_64-binary", cli = "jammi-x86_64-unknown-linux-gnu", stage = "builder-cuda", run-id = "{artifact-run}" } },
  { uses = "./.github/actions/build-image", with = { build-args = "RUNTIME_VARIANT=runtime-cuda\n", build-contexts = "${{ steps.binaries.outputs.build-context }}", platforms = "linux/amd64", cache-scope = "cu12" } },
]

[lane.compose-smoke]
why = "Shape B: the CPU image packaged from the run's binaries, `deploy/docker-compose.yml` brought up with the CI fixture overlay and driven by the client wheel, with a restart's result durability; one leg per arch on its native runner."
name = "Compose smoke (Shape B, {arch})"
workflow = ["ci", "nightly"]
when = ["pr", "schedule", "dispatch"]
host = "ubuntu"
needs = ["audit-key", "python"]
consumes = ["server-cpu-{target}-binary", "jammi-{triple}", "client-wheel"]
env = { JAMMI_IMAGE = "jammi-ai-server:smoke", COMPOSE_FILE = "deploy/docker-compose.yml:deploy/docker-compose.ci.yml" }
legs = [
  { arch = "amd64", triple = "x86_64-unknown-linux-gnu" },
  { arch = "arm64", triple = "aarch64-unknown-linux-gnu" },
]
steps = [
  { id = "binaries", uses = "./.github/actions/stage-server-binaries", with = { server = "server-cpu-${{ matrix.target }}-binary", cli = "jammi-${{ matrix.triple }}", stage = "builder", run-id = "{artifact-run}" } },
  { uses = "./.github/actions/build-image", with = { load-tag = "${{ env.JAMMI_IMAGE }}", build-contexts = "${{ steps.binaries.outputs.build-context }}", cache-scope = "cpu-generic-${{ matrix.arch }}" } },
  { name = "The pinned service images, under the names the compose file uses", run = "bash ci/scripts/pull_service_images.sh" },
  { name = "Bring up Shape B (server + Postgres)", run = "docker compose up --wait" },
  { name = "The running container is the image this job built", run = "bash ci/scripts/assert_compose_image_identity.sh \"$JAMMI_IMAGE\" jammi-server" },
  { uses = "./.github/actions/install-jammi", with = { native = "false", run-id = "{artifact-run}" } },
  { name = "The remote Shape B smoke", run = "python3 tests/compose/shape_b_remote.py" },
  { name = "The Shape B release smoke (RELEASE via SIGINT)", run = "python3 tests/compose/shape_b_release.py" },
  { name = "The Postgres catalog was exercised at runtime", run = "bash ci/scripts/assert_catalog_exercised.sh docker compose exec -T postgres" },
  { name = "Compose logs (on failure)", if = "failure()", run = "docker compose logs" },
  { name = "Tear down", if = "always()", run = "docker compose down -v" },
]

[lane.kube-smoke]
why = "Shape C: the CPU image packaged from the run's binaries, loaded into a kind cluster, `deploy/kubernetes/overlays/ci` applied and driven by the client wheel through a rollout restart; one amd64 leg, the arm64 image being proven by the compose smoke."
name = "Kubernetes smoke (kind, amd64)"
workflow = ["ci", "nightly"]
when = ["pr", "schedule", "dispatch"]
host = "ubuntu"
needs = ["audit-key", "python", "kubeconform"]
consumes = ["server-cpu-x86_64-binary", "jammi-x86_64-unknown-linux-gnu", "client-wheel"]
env = { JAMMI_IMAGE = "jammi-ai-server:smoke", KUBECONFORM_CACHE = "${{ github.workspace }}/.kubeconform-cache" }
steps = [
  { id = "binaries", uses = "./.github/actions/stage-server-binaries", with = { server = "server-cpu-x86_64-binary", cli = "jammi-x86_64-unknown-linux-gnu", stage = "builder", run-id = "{artifact-run}" } },
  { uses = "./.github/actions/build-image", with = { load-tag = "${{ env.JAMMI_IMAGE }}", build-contexts = "${{ steps.binaries.outputs.build-context }}", cache-scope = "cpu-generic-amd64" } },
  { name = "The ci overlay is valid against the pinned schema, before it is applied", run = "bash ci/scripts/check_kube_manifests.sh deploy/kubernetes/overlays/ci" },
  { name = "Render the kind cluster config", run = "envsubst < deploy/kubernetes/overlays/ci/kind-config.yaml.in > \"$RUNNER_TEMP/kind-config.yaml\"" },
  { uses = "@kind", with = { node_image = "kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d", kubectl_version = "v1.34.11", cluster_name = "kind", config = "${{ runner.temp }}/kind-config.yaml" } },
  { name = "The pinned service images, under the names the overlay uses", id = "services", run = "{ echo 'images<<EOF'; bash ci/scripts/pull_service_images.sh; echo EOF; } >> \"$GITHUB_OUTPUT\"" },
  { name = "Load the built server image and the service images into kind", env = { SERVICE_IMAGES = "${{ steps.services.outputs.images }}" }, run = "read -ra services <<< \"$(tr '\\n' ' ' <<< \"$SERVICE_IMAGES\")\"\nkind load docker-image \"$JAMMI_IMAGE\" \"${services[@]}\" --name kind\n" },
  { name = "Create the namespace and the Secret", run = "kubectl create namespace jammi-ci\nkubectl -n jammi-ci create secret generic jammi-server-secrets \\\n  --from-literal=JAMMI_AUDIT_MASTER_KEY=\"$JAMMI_AUDIT_MASTER_KEY\" \\\n  --from-literal=JAMMI_CATALOG__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi \\\n  --from-literal=JAMMI_BROKER__POSTGRES__URL=postgres://jammi:jammi@postgres:5432/jammi\n" },
  { name = "Apply the ci overlay", run = "kustomize build deploy/kubernetes/overlays/ci | kubectl apply -f -" },
  { name = "Wait for postgres and jammi-server to roll out", run = "kubectl -n jammi-ci rollout status statefulset/postgres --timeout=300s\nkubectl -n jammi-ci rollout status deploy/jammi-server --timeout=300s\n" },
  { name = "Every pod runs the image this job built", run = "bash ci/scripts/assert_kind_image_identity.sh \"$JAMMI_IMAGE\" jammi-ci app=jammi-server" },
  { uses = "./.github/actions/install-jammi", with = { native = "false", run-id = "{artifact-run}" } },
  { name = "The remote Kubernetes smoke (port-forward + rollout restart)", run = "python3 tests/compose/shape_c_kube_remote.py" },
  { name = "The Postgres catalog was exercised at runtime", run = "bash ci/scripts/assert_catalog_exercised.sh kubectl -n jammi-ci exec statefulset/postgres --" },
  { name = "Pod state and logs (on failure)", if = "failure()", run = "kubectl -n jammi-ci get pods -o wide\nkubectl -n jammi-ci describe pod -l app=jammi-server\nkubectl -n jammi-ci logs -l app=jammi-server --tail=-1 --all-containers\n" },
  { name = "Delete the kind cluster", if = "always()", run = "kind delete cluster --name kind" },
]

# ============================================================================= nightly: the cookbook as published (CPU)

[lane.cookbook-published-tag]
why = "Resolves the release tag the notebooks run at, and refuses, naming what is missing, until PyPI, crates.io, npm and the GitHub release all serve it."
name = "Resolve the release tag"
workflow = "nightly"
host = "ubuntu"
outputs = { tag = "steps.tag.outputs.tag" }
steps = [
  { id = "tag", env = { REQUESTED = "${{ inputs.tag }}" }, run = "bash ci/scripts/resolve_release_tag.sh \"$REQUESTED\" | tee -a \"$GITHUB_OUTPUT\"" },
  { name = "The release is installable", env = { TAG = "${{ steps.tag.outputs.tag }}", GITHUB_TOKEN = "${{ github.token }}" }, run = "python3 ci/scripts/release_installable.py --tag \"$TAG\"" },
]

[lane.cookbook-published]
why = "Every published notebook at the release tag, in a fresh environment with nothing installed, setup cell included: what a reader gets from PyPI, in eight shards."
name = "Cookbook as published (CPU, {shard}/8)"
workflow = "nightly"
host = "colab"
after = ["cookbook-published-tag"]
timeout = 180
legs = [{ shard = 1 }, { shard = 2 }, { shard = 3 }, { shard = 4 }, { shard = 5 }, { shard = 6 }, { shard = 7 }, { shard = 8 }]
steps = [
  { name = "Check out the notebooks at the tag", uses = "@checkout", with = { ref = "${{ needs.cookbook-published-tag.outputs.tag }}", path = "published", sparse-checkout = "cookbook/notebooks" } },
  { name = "Run the notebooks as published", env = { SHARD = "${{ matrix.shard }}" }, run = "python cookbook/book/scripts/run_published_notebooks.py --notebooks published/cookbook/notebooks --shard \"$SHARD/8\" --work \"$RUNNER_TEMP/notebooks\"" },
]

# ============================================================================= the paid GPU lanes

[lane.gpu-prove-subject]
why = "Records the tree this run proves; every leg checks out that same commit, so the subject names the tree the pod built."
name = "Subject"
workflow = "gpu-prove"
host = "ubuntu"
outputs = { commit = "steps.subject.outputs.commit" }
steps = [{ id = "subject", uses = "./.github/actions/record-subject" }]

[lane.gpu-prove]
why = "One rented device per shipped CUDA arch runs the gated GPU suites at the image's baked compute capability; a dispatch on a tag ref gets three attempts on a capacity exit."
name = "GPU prove on RunPod ({sm})"
workflow = "gpu-prove"
host = "ubuntu"
needs = ["runpod"]
after = ["gpu-prove-subject"]
timeout = "${{ github.ref_type == 'tag' && 355 || 190 }}"
legs = [{ sm = "sm_80" }, { sm = "sm_86" }, { sm = "sm_89" }, { sm = "sm_90" }]
steps = [
  { uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_gpu_prove.sh", max-attempts = "${{ github.ref_type == 'tag' && 3 || 1 }}" }, env = { RP_IMAGE = "{image:cuda}", GPU_PROVE_ARCH = "${{ matrix.sm }}", PROVE_EXPECT_SHA = "${{ needs.gpu-prove-subject.outputs.commit }}" } },
]

[lane.gpu-howwell]
why = "The how-well A/B on a rented A100, every input an operator's choice; its evidence is uploaded for the committed artifacts a merge-path guard validates."
name = "how-well A/B on RunPod A100 (sm_80)"
workflow = "gpu-howwell"
host = "ubuntu"
needs = ["runpod"]
timeout = 100
steps = [
  { uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_gpu_howwell.sh", evidence = ".gpu-pull/how-well/", evidence-name = "how-well-${{ github.run_id }}" }, env = { RP_IMAGE = "{image:cuda}", GIT_REF = "${{ github.ref_name }}", HOWWELL_MODEL_DIR = "${{ inputs.model_dir }}", HOWWELL_SEEDS = "${{ inputs.seeds }}", HOWWELL_OBJECTIVE = "${{ inputs.objective }}", HOWWELL_LR0_SEEDS = "${{ inputs.lr0_seeds }}", HOWWELL_PODS = "${{ inputs.pods }}" } },
]

[lane.gpu-perf-ab]
why = "The encode revision edge on a rented A100: the verdict is uploaded for a human, and the driver's own exit codes are named."
name = "encode revision edge on RunPod A100 (sm_80)"
workflow = "gpu-perf-ab"
host = "ubuntu"
needs = ["runpod"]
timeout = 180
steps = [
  { id = "lane", uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_gpu_perf_ab.sh", evidence = ".gpu-pull/gpu-perf-ab/", evidence-name = "gpu-perf-ab-${{ github.run_id }}" }, env = { RP_IMAGE = "{image:cuda}", GIT_REF = "${{ github.head_ref || github.ref_name }}", GPU_PERF_AB_AA_NULL = "${{ inputs.aa_null && '1' || '0' }}" } },
  { if = "always() && steps.lane.outputs.rc == '1'", run = "echo \"::error::the ladder verdict is not GREEN: RED (slower than the base by more than the rung's noise band), RED_FOR_INVESTIGATION (faster by more than the band), or INVALID (a refusal named in the verdict's causes). Read ladder_verdict.json in the uploaded evidence.\"" },
  { if = "always() && steps.lane.outputs.rc == '2'", run = "echo \"::error::a usage or infrastructure error (exit 2): a clone, checkout or fetch failure, or an unresolved sha; see the run log.\"" },
]

[lane.gpu-topology]
why = "The fine-tune gang at every topology on a rented two-host fleet; one attempt per run, because a retry is a second rental search and a cost decision for a human."
name = "GPU topology on RunPod (1x1, 1x2, 2 processes, 2 hosts x 2)"
workflow = "gpu-topology"
host = "ubuntu"
needs = ["runpod"]
timeout = 190
steps = [
  { uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_gpu_topology.sh", evidence = ".gpu-pull/gpu-topology/", evidence-name = "gpu-topology-${{ github.run_id }}" }, env = { RP_IMAGE = "{image:cuda}", GIT_REF = "${{ github.head_ref || github.ref_name }}", PROVE_EXPECT_SHA = "${{ github.event.pull_request.head.sha || github.sha }}", TOPOLOGY_GPU_TYPES = "${{ inputs.gpu_types }}" } },
]

[lane.gpu-reap]
why = "Terminates the pods this repository rented that outlived their own deadline; two sweeps never overlap."
name = "Terminate orphaned RunPod pods"
workflow = "gpu-reap"
host = "ubuntu"
needs = ["runpod"]
timeout = 10
steps = [{ env = { FORCE_HOURS = "${{ inputs.force_hours }}" }, run = "read -ra hours <<< \"$FORCE_HOURS\"\nbash ci/scripts/gpu-dev.sh reap \"${hours[@]}\"\n" }]

[lane.cookbook-subject]
why = "Records the tree this run renders the book over; the pod checks out that same commit."
name = "Subject"
workflow = "cookbook-gpu"
host = "ubuntu"
outputs = { commit = "steps.subject.outputs.commit" }
steps = [{ id = "subject", uses = "./.github/actions/record-subject" }]

[lane.cookbook]
why = "Every recipe and page on real Hub models over the proving run's builds, on a rented L4; the whole-book assembly then reads each page's record and executes nothing."
name = "Cookbook on RunPod"
workflow = "cookbook-gpu"
needs = ["runpod"]
after = ["cookbook-subject"]
consumes = ["native-cu12-wheel", "client-wheel", "server-cu12-x86_64-binary", "jammi-x86_64-unknown-linux-gnu"]
produces = ["cookbook-book"]
timeout = 280
steps = [
  { download = "native-cu12-wheel", path = "${{ runner.temp }}/artifacts/native" },
  { download = "client-wheel", path = "${{ runner.temp }}/artifacts/client" },
  { download = "server-cu12-x86_64-binary", path = "${{ runner.temp }}/artifacts/server" },
  { download = "jammi-x86_64-unknown-linux-gnu", path = "${{ runner.temp }}/artifacts/cli" },
  { uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_cookbook_gpu.sh" }, env = { RP_IMAGE = "{image:cuda}", PROVE_EXPECT_SHA = "${{ needs.cookbook-subject.outputs.commit }}", ARTIFACTS = "${{ runner.temp }}/artifacts", FREEZE_OUT = "cookbook/book/_freeze" } },
  { name = "Assemble the book", dir = "cookbook/book", run = "quarto render --profile assemble" },
]

[lane.cookbook-published-gpu]
why = "Every published notebook at the release tag on a rented L4, in a fresh environment installing the CUDA wheels from PyPI, after the release is installable everywhere."
name = "GPU (RunPod L4)"
workflow = "cookbook-published-gpu"
host = "ubuntu"
needs = ["runpod"]
timeout = 300
steps = [
  { name = "The release is installable", env = { TAG = "${{ inputs.tag }}", GITHUB_TOKEN = "${{ github.token }}" }, run = "python3 ci/scripts/release_installable.py --tag \"$TAG\"" },
  { uses = "./.github/actions/run-paid-lane", with = { driver = "ci/scripts/runpod_cookbook_published.sh" }, env = { RP_IMAGE = "{image:cuda}", DRIVER_REF = "${{ github.sha }}", NOTEBOOKS_TAG = "${{ inputs.tag }}" } },
]

# ============================================================================= the release lanes

[lane.publish-crates]
why = "Publishes the crates in topological order with a token minted and revoked around the publish; `cargo publish` verifies each crate builds, in the tree's own image."
name = "Publish to crates.io"
workflow = "crates"
when = ["tag:v"]
rust = true
needs = ["oidc"]
publishes = "release"
environment = { name = "crates-io" }
steps = [
  { name = "Mint the crates.io token", id = "token", run = "bash ci/scripts/crates_io_token.sh mint" },
  { name = "Publish crates", env = { CARGO_REGISTRY_TOKEN = "${{ steps.token.outputs.token }}" }, run = "bash ci/scripts/publish_crates.sh" },
  { name = "Revoke the crates.io token", if = "always() && steps.token.outputs.token != ''", env = { CARGO_REGISTRY_TOKEN = "${{ steps.token.outputs.token }}" }, run = "bash ci/scripts/crates_io_token.sh revoke" },
]

[lane.publish-npm]
why = "Publishes the packed tarball through npm's OIDC trusted publishing with provenance; a version already on npm is skipped, so a re-run is idempotent."
name = "Publish to npm"
workflow = "npm"
when = ["tag:v"]
host = "ubuntu"
needs = ["oidc", "node"]
publishes = "release"
consumes = ["ts-client-package"]
steps = [
  { download = "ts-client-package", path = "package" },
  { name = "Publish", run = "bash ci/scripts/publish_npm.sh \"$PWD\"/package/*.tgz" },
]

[lane.publish-pypi]
why = "One leg per PyPI project uploads every wheel of that project together: a release with one platform missing is worse than a failed release."
name = "Publish {project}"
workflow = "pypi"
when = ["tag:py-v"]
host = "ubuntu"
needs = ["oidc"]
publishes = "release"
environment = { name = "pypi" }
checkout = false
consumes = ["client-wheel", "wheels-native-linux-x86_64", "wheels-native-linux-aarch64", "wheels-native-macos-arm64", "wheels-native-macos-x86_64", "native-cu12-wheel", "server-cpu-x86_64-wheel", "server-cpu-aarch64-wheel", "server-cu12-x86_64-wheel"]
legs = [
  { project = "jammi-ai", pattern = "client-wheel" },
  { project = "jammi-ai-native", pattern = "wheels-native-*" },
  { project = "jammi-ai-native-cu12", pattern = "native-cu12-wheel" },
  { project = "jammi-server", pattern = "server-cpu-*-wheel" },
  { project = "jammi-server-cu12", pattern = "server-cu12-x86_64-wheel" },
]
steps = [
  { uses = "@download-artifact", with = { pattern = "${{ matrix.pattern }}", merge-multiple = true, path = "dist", run-id = "{artifact-run}", github-token = "${{ github.token }}" } },
  { uses = "@pypi-publish", with = { packages-dir = "dist" } },
]

[lane.release-binaries]
why = "Attaches each prebuilt asset to the GitHub release with a provenance attestation over the exact bytes; whichever asset arrives first creates the release."
name = "Attach {artifact}"
workflow = "release"
when = ["tag:v"]
host = "ubuntu"
needs = ["release-write", "attest"]
publishes = "release"
consumes = ["jammi-x86_64-unknown-linux-gnu", "jammi-aarch64-unknown-linux-gnu", "jammi-aarch64-apple-darwin", "server-cpu-x86_64-tarball", "server-cpu-aarch64-tarball", "server-cu12-x86_64-tarball"]
legs = [
  { artifact = "jammi-x86_64-unknown-linux-gnu" },
  { artifact = "jammi-aarch64-unknown-linux-gnu" },
  { artifact = "jammi-aarch64-apple-darwin" },
  { artifact = "server-cpu-x86_64-tarball" },
  { artifact = "server-cpu-aarch64-tarball" },
  { artifact = "server-cu12-x86_64-tarball" },
]
steps = [
  { download = "${{ matrix.artifact }}", path = "." },
  { name = "The one asset the artifact holds", id = "asset", run = "assets=(*.tar.gz)\n[ \"${#assets[@]}\" -eq 1 ] || { echo \"::error::expected one tarball, found: ${assets[*]}\" >&2; exit 1; }\necho \"asset=${assets[0]}\" >> \"$GITHUB_OUTPUT\"\n" },
  { uses = "./.github/actions/release-upload", with = { asset = "${{ steps.asset.outputs.asset }}" } },
]

[lane.server-image-cpu]
why = "The CPU image's variant x arch legs, each packaging the proving run's binaries and pushing only its own immutable commit tag, attested and verified."
name = "Push {variant} ({arch})"
workflow = "release"
when = ["tag:v"]
host = "ubuntu"
needs = ["ghcr", "attest"]
publishes = "release"
consumes = ["server-cpu-{target}-binary", "jammi-{triple}"]
env = { IMAGE = "ghcr.io/${{ github.repository_owner }}/jammi-ai-server" }
legs = [
  { variant = "generic", arch = "amd64", triple = "x86_64-unknown-linux-gnu" },
  { variant = "generic", arch = "arm64", triple = "aarch64-unknown-linux-gnu" },
  { variant = "selfcontained", arch = "amd64", triple = "x86_64-unknown-linux-gnu" },
  { variant = "selfcontained", arch = "arm64", triple = "aarch64-unknown-linux-gnu" },
]
steps = [
  { name = "The leg's tag", id = "leg", env = { VARIANT = "${{ matrix.variant }}" }, run = "{ echo 'tags<<EOF'; bash ci/scripts/image_tags.sh \"$VARIANT\" --immutable; echo EOF; } >> \"$GITHUB_OUTPUT\"" },
  { id = "binaries", uses = "./.github/actions/stage-server-binaries", with = { server = "server-cpu-${{ matrix.target }}-binary", cli = "jammi-${{ matrix.triple }}", stage = "builder", run-id = "{artifact-run}" } },
  { uses = "./.github/actions/push-image-leg", with = { image = "${{ env.IMAGE }}", tags-spec = "${{ steps.leg.outputs.tags }}", tag-suffix = "${{ matrix.arch }}", build-args = "RUNTIME_VARIANT=runtime-${{ matrix.variant }}\n", build-contexts = "${{ steps.binaries.outputs.build-context }}", platforms = "${{ matrix.platform }}", cache-scope = "cpu-${{ matrix.variant }}-${{ matrix.arch }}" } },
]

[lane.server-image-cpu-merge]
why = "Merges each CPU variant's per-arch legs into the real tags through the one verify-then-promote definition, and attests the merged digest."
name = "Merge {variant}"
workflow = "release"
when = ["tag:v"]
host = "ubuntu"
needs = ["ghcr", "attest"]
publishes = "release"
after = ["server-image-cpu"]
env = { IMAGE = "ghcr.io/${{ github.repository_owner }}/jammi-ai-server" }
legs = [{ variant = "generic" }, { variant = "selfcontained" }]
steps = [
  { name = "The variant's tag policy", id = "policy", env = { VARIANT = "${{ matrix.variant }}" }, run = "{ echo 'tags<<EOF'; bash ci/scripts/image_tags.sh \"$VARIANT\"; echo EOF; } >> \"$GITHUB_OUTPUT\"" },
  { uses = "./.github/actions/merge-index", with = { image = "${{ env.IMAGE }}", platforms = "linux/amd64,linux/arm64", tags-spec = "${{ steps.policy.outputs.tags }}", variant = "${{ matrix.variant }}", attest = "true" } },
]

[lane.server-image-cuda]
why = "The CUDA image, one amd64 leg (its runtime base publishes no arm64), packaging the proving run's CUDA binary under the one tag policy, attested and verified."
name = "Push CUDA image"
workflow = "release"
when = ["tag:v"]
host = "ubuntu"
needs = ["ghcr", "attest"]
publishes = "release"
consumes = ["server-cu12-x86_64-binary", "jammi-x86_64-unknown-linux-gnu"]
env = { IMAGE = "ghcr.io/${{ github.repository_owner }}/jammi-ai-server-cu12" }
steps = [
  { id = "binaries", uses = "./.github/actions/stage-server-binaries", with = { server = "server-cu12-x86_64-binary", cli = "jammi-x86_64-unknown-linux-gnu", stage = "builder-cuda", run-id = "{artifact-run}" } },
  { name = "The image's tags", id = "tags", run = "{ echo 'tags<<EOF'; bash ci/scripts/image_tags.sh cuda; echo EOF; } >> \"$GITHUB_OUTPUT\"" },
  { uses = "./.github/actions/push-image-leg", with = { image = "${{ env.IMAGE }}", tags-spec = "${{ steps.tags.outputs.tags }}", build-args = "RUNTIME_VARIANT=runtime-cuda\n", build-contexts = "${{ steps.binaries.outputs.build-context }}", platforms = "linux/amd64", cache-scope = "cu12" } },
]

[lane.site]
why = "Lays out the site: the guide at the root, the API reference under `api/`, the book under `cookbook/`, the paths the guide, the README and every notebook link to."
name = "Lay out the site"
workflow = "pages"
host = "ubuntu"
checkout = false
consumes = ["docs-site", "cookbook-book"]
steps = [
  { download = "docs-site", path = "_site", from = "ci" },
  { download = "cookbook-book", path = "_site/cookbook", from = "cookbook-gpu" },
  { uses = "@upload-pages-artifact", with = { path = "_site" } },
]

[lane.deploy-pages]
why = "Deploys the laid-out site to GitHub Pages; the `github-pages` environment admits only `py-v*` tags."
name = "Deploy to GitHub Pages"
workflow = "pages"
when = ["tag:py-v"]
host = "ubuntu"
needs = ["pages"]
publishes = "release"
after = ["site"]
checkout = false
environment = { name = "github-pages", url = "${{ steps.deployment.outputs.page_url }}" }
steps = [{ id = "deployment", uses = "@deploy-pages" }]
