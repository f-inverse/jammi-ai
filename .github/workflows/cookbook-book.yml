name: Cookbook book

# The fast PR/push gate for the in-repo Theory↔Computation book (cookbook/book/),
# checked against the engine at HEAD: build the HEAD embed wheel, verify the API
# reference matches it, lint, run the shared-lib unit tests, the no-deferral /
# citation guards, and — the forward half of the engine<->cookbook co-evolution
# loop (constitution-cited #351 review origin) — a SCOPED, fail-closed quarto
# render of exactly the chapters this diff could move. This is a mechanized
# floor under the lead-dispatched phase 6.5 (cookbook-emit) re-emit, which stays
# discipline (F10-unreliable: it only fires if a human/agent remembers to
# dispatch it); this job runs on every PR, no dispatch required.
#
# Still deliberately NOT a full-book render: `ci/scripts/select_render_chapters.py`
# classifies every chapter (LIVE_COMPUTE / CACHE_READ / STATIC — see its own
# docstring) and returns only the O(affected) subset a GIVEN diff could move —
# today that is exactly one LIVE_COMPUTE chapter
# (chapters/22-precision/compute-precision.qmd) on an engine-code diff, plus
# whichever CACHE_READ chapters a touched `build_*_cache.py` script feeds. The
# full nightly render (every chapter, incl. the grpc://-live-server chapters no
# server exists for here, + the release-recipe leg) stays in the separate
# `cookbook-render.yml` — full-book quarto render is not something a PR gate
# should pay for on every push; the selector is what keeps this gate
# cost-bounded instead of reverting to "render everything". No skip flag, no
# continue-on-error on the render step: a flaky chapter under this gate is a
# chapter bug to fix, not a gate to soften. The engine's own SDK-recipes smoke
# (cookbook.yml) and it/cookbook.rs are separate and unchanged.
#
# The return half — chapter-coverage accounting (which chapters a merged PR's
# diff SHOULD have moved, closing the loop the other direction) — is built
# separately on cookbook/chapter-coverage-gate; together the two mechanize the
# co-evolution doctrine end to end.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: cookbook-book-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  # The determinism regime (K0 §3): jammi_cookbook also sets these on import, but
  # pinning them in the job env covers anything that reads them first.
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  gate:
    name: Book gate (HEAD wheel, scoped render)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.JAMMI_CI_IMAGE || 'ghcr.io/f-inverse/jammi-ai-ci:latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The scale-tier vector cache (cookbook/book/artifacts/scale/) lives in
          # Git LFS; pull it so the gate reads the real cache, not LFS pointers.
          lfs: true
          # fetch-depth: 0 so the PR base ref (or the pre-push `before` SHA) is
          # present for select_render_chapters.py's `git diff <base>...HEAD` —
          # same rationale/pattern as swarm.yml's own TOUCHED guards.
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust-ci
        with:
          rustflags: "-C link-arg=-fuse-ld=mold"

      # The book runs against two lockstep dists — the base client `jammi-ai`
      # (import `jammi`) and the compiled `jammi-ai-native` wheel, built fresh
      # and force-reinstalled (mode: wheel — a fresh wheel, never a copy) so
      # the book runs the engine built from THIS commit. The shared
      # setup-jammi-py action owns the venv/maturin mechanics.
      - name: Build + install the HEAD wheels
        uses: ./.github/actions/setup-jammi-py
        with:
          mode: wheel

      - name: Install the book (against the HEAD wheel)
        run: |
          . .venv/bin/activate
          pip install -e 'cookbook/book[book,dev]'

      - name: API reference matches the HEAD wheel
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python scripts/check_api_reference.py

      # The RETURN half of the engine<->cookbook co-evolution loop (#351
      # review doctrine): check_api_reference.py above guards that a shipped
      # surface's signature hasn't drifted out from under a chapter; this
      # guards that every shipped surface HAS a chapter (or a reviewed,
      # dated deferral) exercising it in the first place, so a new public
      # capability cannot ship with silently-unaccounted cookbook coverage.
      - name: Chapter-coverage gate
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python scripts/check_chapter_coverage.py

      - name: Lint
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          ruff check jammi_cookbook scripts tests

      - name: Shared-lib unit tests
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          pytest -q

      - name: No-deferral gate
        working-directory: cookbook/book
        run: bash scripts/no_deferral_grep.sh

      - name: No dangling citations
        working-directory: cookbook/book
        run: |
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          python scripts/check_citations.py

      # The selector's own house-guard self-test: RED-proves the misclassification
      # shapes named in its docstring (a live-compute call in an otherwise
      # cache-read chapter, a live call in prose-only, a grpc://-live-server
      # chapter correctly excluded from THIS gate, etc.) against synthetic
      # fixtures — never against the real book, so it keeps proving something
      # even the day the real book stops containing an edge case. Runs before
      # the classifier is trusted with a real diff below.
      - name: Forward-render selector self-test
        run: python3 ci/scripts/select_render_chapters.py --self-test

      # The forward render gate itself: classify every chapter and print the
      # subset THIS diff could move (LIVE_COMPUTE chapters on any engine-code
      # diff, plus CACHE_READ chapters whose build_*_cache.py producer or
      # committed artifact directory changed).
      - name: Select the chapters this diff must render (forward render gate)
        id: select
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --quiet origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] \
                && git cat-file -e "$before" 2>/dev/null; then
              base="$before"
            else
              base="HEAD~1"
            fi
          fi
          selected="$(python3 ci/scripts/select_render_chapters.py --base "$base" --head HEAD)"
          {
            echo "chapters<<RENDER_SET_EOF"
            echo "$selected"
            echo "RENDER_SET_EOF"
          } >> "$GITHUB_OUTPUT"

      # Render exactly the selected set with the PR wheel already installed
      # above — the chapter asserts against a frozen golden ARE the check; a
      # nonzero `quarto render` (an assertion failure, an artifact-shape
      # mismatch, a live-compute call that now behaves differently) fails this
      # step, and this step carries no `continue-on-error` and no skip flag: a
      # flaky chapter here is a chapter bug to fix, not a gate to soften.
      # Cost today: one LIVE_COMPUTE chapter (compute-precision.qmd, a
      # CPU-only local-BERT generate_embeddings call) — its own render span in
      # the nightly full-book run (cookbook-render.yml, 2026-08-31 run
      # 33385889616, chapter [29/32]) measured ~3.5s
      # (2026-08-31T11:37:32.564Z -> 11:37:36.018Z, next-chapter-start delta).
      # This step pays that render cost once more, plus this job's own
      # already-paid-for cold-start (wheel install, jammi_cookbook import) —
      # low seconds, not minutes. The selector is what keeps this O(affected)
      # as more chapters/scripts are added, not O(book): a future LIVE_COMPUTE
      # or newly-touched CACHE_READ chapter widens this set, never the whole
      # book at once.
      - name: Render this diff's selected chapters (forward render gate)
        if: ${{ steps.select.outputs.chapters != '' }}
        working-directory: cookbook/book
        run: |
          set -euo pipefail
          . "$GITHUB_WORKSPACE/.venv/bin/activate"
          while IFS= read -r chapter; do
            [ -z "$chapter" ] && continue
            rel="${chapter#cookbook/book/}"
            echo "::group::quarto render $rel"
            quarto render "$rel"
            echo "::endgroup::"
          done <<< "${{ steps.select.outputs.chapters }}"
