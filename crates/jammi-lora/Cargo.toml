[package]
name = "jammi-lora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Static-dispatch PEFT-style LoRA primitives for candle. Closed-enum dispatch, immutable construction, candle-native."
keywords = ["lora", "peft", "fine-tuning", "candle", "transformer"]
categories = ["science"]
readme = "README.md"

[dependencies]
# The candle-free compute-precision vocabulary (`ComputePrecision`) that
# `AdapterConfig::backbone_dtype` is typed on — the same "what dtype does this
# backbone run at" concept the inference engine's compute-precision knob uses,
# so both share one enum rather than duplicating it. Unconditional: it carries
# no tensor-library dependency of its own.
jammi-numerics.workspace = true
# The candle tensor stack backs every LoRA *primitive* (the linear layers, the
# adapter save/load). It is gated behind the default-on `candle` feature so a
# consumer that only needs the LoRA *config vocabulary* — `LoraInitMode`,
# `LoraBuildConfig`, `AdapterConfig` and the module-matching helpers, the
# fields a `FineTuneConfig` is built from — can depend on this crate without
# pulling candle. Every existing consumer keeps the default and is
# byte-unchanged.
candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
# The fused LoRA-site epilogue (`ScaledCastAdd`) and the shared admission
# scaffolding (`device_is_supported`, `admission_mode`, the op-keyed
# dispatch-counter registry) — a leaf crate with no `jammi-*` dependency of
# its own, so this adds no new dependency direction. Optional, gated behind
# the same `candle` feature as `candle-core`/`candle-nn` above: it is a
# candle-backed crate (its CPU `CustomOp` implementations need
# `candle-core` unconditionally), so it can never be pulled without candle
# already being pulled.
jammi-kernels = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"

[features]
default = ["candle"]
# The candle-backed LoRA primitives: the `LoraLinear` / `MaybeLoraLinear` layers,
# adapter save/load, and the candle tensor-error arm of `LoraError`. Default-on;
# turning it off leaves the candle-free config vocabulary (`LoraInitMode`,
# `LoraBuildConfig`, `AdapterConfig`, `should_apply_lora`, `effective_rank`).
# The `ComputePrecision -> candle DType` mapping lives at the candle boundary
# in `jammi-encoders`, not here — `jammi-numerics` (this crate's dependency for
# `ComputePrecision`) stays candle-free either way.
candle = ["dep:candle-core", "dep:candle-nn", "dep:jammi-kernels"]
# Forwards to `jammi-kernels/cuda` (the .cu build + CUDA `CustomOp` arms) —
# same chain `jammi-encoders/cuda` forwards through, so the fused LoRA
# epilogue's CUDA kernel builds under the identical top-level `cuda`
# feature (`jammi-ai`'s `cuda` list gains `jammi-lora/cuda` alongside
# `jammi-encoders/cuda`). Never required by a plain `cargo build`.
cuda = ["jammi-kernels/cuda"]
# Forwards to `jammi-kernels/metal` (which itself forwards to
# `candle-core/metal` + `candle-nn/metal`) — mirrors `cuda` above, one level
# down: `jammi-lora` has no Metal kernel-launch infrastructure of its own
# (the fused LoRA site's `device_is_supported` gate stays CPU/CUDA-only —
# see `jammi_kernels::admission::device_is_supported`'s own doc — so a
# Metal training forward always takes the eager-fallback arm, which is what
# dispatches `jammi_kernels::ops::DropoutFused` through its Metal
# host-fallback `metal_fwd`, issue #433). This feature exists purely so
# `tests/metal_dropout_position.rs` has an explicit, named,
# `required-features` gate to build against, mirroring
# `jammi-kernels`'s own `metal`/`metal_parity` pattern. Not default; never
# required by a plain `cargo build`.
metal = ["jammi-kernels/metal"]

# Real-hardware Metal dropout-position/resume oracle (esc-070 conjunct 5):
# `tests/fused_epilogue.rs`'s dropout-position/resume oracles hardcode
# `Device::Cpu`, so nothing in this crate ever proved
# `dropout_position`/`restore_dropout_position` on a real Metal device.
# `required-features` means this test target is not even built by a plain
# `cargo test -p jammi-lora`; it exists (and can compile) only when the
# `metal` feature is active — mirrors `jammi-kernels`'s own
# `metal`/`metal_parity` `[[test]]` entry.
[[test]]
name = "metal_dropout_position"
path = "tests/metal_dropout_position.rs"
required-features = ["metal"]
