name: Dep-DAG freshness

# ADVISORY-BY-STANDING, not a required gate: this lane is path-filtered and is
# deliberately NOT in ci.yml's `ci-summary` needs — the required ci-summary
# context must stay path-filter-free so it never hangs a PR that doesn't touch
# the DAG's inputs (same reasoning as devcontainer-image.yml).
# It cannot be folded into ci.yml either: the generator's source of truth is
# `cargo build-graph` (a third-party tool the CI image carries at its pin),
# whose `build` extracts the graph from real `cargo build` artifacts — a full extra workspace-build-shaped cost
# no ci.yml job carries. So a stale committed DAG block on a PR that dodges
# the filter surfaces on the next run that touches these paths, not on that
# PR itself — accepted, and stated here rather than discovered.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/*/src/**"
      - "ci/tools/*/Cargo.toml"
      - "ci/tools/*/src/**"
      - "docs/maintainer/**"
      - "ci/scripts/gen_dep_dag.py"
  pull_request:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/*/Cargo.toml"
      - "crates/*/src/**"
      - "ci/tools/*/Cargo.toml"
      - "ci/tools/*/src/**"
      - "docs/maintainer/**"
      - "ci/scripts/gen_dep_dag.py"
  workflow_dispatch:

concurrency:
  group: dep-dag-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this lane only reads the checkout; nothing publishes.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The tree's CI images (`_ci-image.yml`), by content: `ci.yml` builds them,
  # and this run waits until they exist.
  ci-image:
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/_ci-image.yml
    with:
      await: cpu

  dep-dag:
    name: Guard (dep-DAG freshness)
    needs: ci-image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.ci-image.outputs.cpu }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-rust-ci

      # The maintainer guide's crate-dependency DAG is generated from
      # build-graph (the maintainer-chosen source of truth, extracted from
      # `cargo build` artifacts — not `cargo metadata`). Re-render it from the
      # current workspace; if the committed block is stale the `git diff` below
      # reds the PR, naming the doc to regenerate.
      - name: Regenerate the dep-DAG block
        run: python3 ci/scripts/gen_dep_dag.py

      # A bare `git` in a container `run:` step hits "fatal: detected dubious
      # ownership" (exit 128) because the checkout is owned by a different user
      # than the container's git; the safe.directory actions/checkout sets is not
      # visible here. Mark the workspace safe before diffing.
      - name: Assert the committed dep-DAG block is fresh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git diff --exit-code -- docs/maintainer/MAINTAINER-GUIDE.md \
            || { echo "::error::docs/maintainer/MAINTAINER-GUIDE.md dep-DAG block is stale — run 'python3 ci/scripts/gen_dep_dag.py' and commit the result"; exit 1; }
