[package]
name = "jammi-encoders"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Candle-native BERT-family encoders for sentence embeddings, with built-in PEFT support via jammi-lora."
keywords = ["bert", "sentence-embeddings", "lora", "candle", "transformer"]
categories = ["science"]
readme = "README.md"

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
# The fused-kernel CustomOp scaffolding (bias-free LayerNorm fwd+bwd, this
# commit's first real consumer). Non-optional: the CPU implementations are
# always present (one call path, no cfg forest at call sites) — only the
# `cuda` feature below adds the CUDA build.
jammi-kernels.workspace = true
# Needs the candle-backed LoRA primitives (`LoraLinear` / `MaybeLoraLinear` /
# `LoraError`), so enable jammi-lora's `candle` feature (off at the workspace root).
jammi-lora = { workspace = true, features = ["candle"] }
# The candle-free `ComputePrecision` vocabulary. This crate is the candle
# boundary for it: `compute_precision_to_dtype` is the one place in the
# workspace that maps `ComputePrecision -> candle_core::DType` (a plain
# function, not a `From` impl — neither type is local here, so an orphan-rule
# -legal trait impl cannot exist anywhere but `jammi-numerics` or `candle`
# itself, and `jammi-numerics` must stay candle-free).
jammi-numerics.workspace = true
# `half::f16::MIN` / `half::bf16::MIN` — the dtype-following additive-mask
# sentinels (`clip_text::dtype_min_sentinel`). candle-core 0.11 does NOT
# re-export `half`, and these two constants are the whole reason a mask
# built for an F16/BF16 backbone is a large finite number rather than the
# `-inf` an `f32::MIN` cast would produce. A REGULAR dependency, not a
# dev-dependency: the mask sentinels are shipped library code, not test
# scaffolding.
half.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
candle-transformers.workspace = true
jammi-test-resources = { workspace = true, features = ["candle"] }
hf-hub.workspace = true
# `dirs::home_dir()` -- the live-hub-tests harness's non-panicking root
# fallback (HF_HUB_CACHE -> HF_HOME/hub -> dirs::home_dir() -> a named test
# failure), so it never reaches `hf_hub::Cache::from_env()`'s own
# `Cache::default()` panic path. Already resolved transitively through
# hf-hub 0.5 in Cargo.lock (6.0.0) -- pinned here as a direct dev-dependency
# only because this test harness calls it by name.
dirs = "6"
# NO `half` here: it is a regular dependency above (the dtype-following mask
# sentinels), and a `[dependencies]` entry is already visible to tests,
# benches and examples. A duplicate `[dev-dependencies]` line only invites
# the two to drift apart on features or version.
serde_json.workspace = true
tempfile = "3"

[features]
default = []
# Forwards to candle's own `cuda` feature chain via jammi-kernels. Adds
# jammi-kernels' CUDA build (nvcc/PTX) — never required
# by a plain `cargo build` (see jammi-kernels/build.rs's early-return gate).
cuda = ["jammi-kernels/cuda"]
# Forwards to `jammi-kernels`'s `flash-attn` feature — one link of the
# `jammi-kernels -> jammi-encoders -> jammi-ai -> jammi-bench` chain.
# `crate::modernbert`'s flash-cascade admission predicate reads
# `jammi_kernels::admission::FLASH_COMPILED` (a plain,
# unconditionally-compiled `bool`, NOT this local feature) so it stays
# correct whether or not `jammi-ai`/`jammi-bench` forward this feature — see
# `FLASH_COMPILED`'s own doc. This feature gives a dependency on
# `jammi_kernels::flash` types (`CuSeqlens`/`flash_attention_varlen`) a
# declared forwarding path, and gives `rustc`'s `unexpected_cfgs` lint a
# declared feature name for a `#[cfg(feature = "flash-attn")]` call site
# (never a bare `cfg!()` runtime check around a `jammi_kernels::flash` type
# reference — see `FLASH_COMPILED`'s doc for why that would fail to compile
# with this feature off).
flash-attn = ["jammi-kernels/flash-attn"]
# Enables tests/parity.rs which depends on candle-transformers as a numerical
# oracle for the Bert frozen forward pass.
parity-test = []
# Enables tests/golden_parity.rs, which checks the HTSAT-Swin CLAP audio tower
# against committed per-boundary golden activations (dumped from PyTorch
# transformers by tests/fixtures/generate_htsat_clap.py). Needs no torch and no
# network — the goldens are committed binaries.
golden-parity = []
# Enables tests/live_real_clap.rs, which downloads the REAL
# `laion/clap-htsat-fused` checkpoint from the HF Hub and asserts the HTSAT-Swin
# tower reproduces its audio embedding on the committed pinned input. Live: makes
# a network call, so the default `cargo test` stays hermetic.
live-hub-tests = []
# Compiles the tests that need CUDA device 0.
live-gpu-tests = ["cuda"]
# Compiles the encoder-level FlashAttention oracles over a real ModernBERT-large
# checkpoint: an 80GB-class CUDA device in the validated arch set, and the
# checkpoint directory at JAMMI_FLASH_ORACLE_MODEL_DIR.
live-flash-oracle-tests = ["live-gpu-tests", "flash-attn"]

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"

[[test]]
name = "golden_parity"
path = "tests/golden_parity.rs"

[[test]]
name = "live_real_clap"
path = "tests/live_real_clap.rs"

# Long-shape training memory on CUDA: sequence-length bucketing keeps a
# variable-shape run within the fixed-shape run's memory. Its reference shapes
# are calibrated for an 80GB-class device 0; it refuses a smaller one by name,
# so a lane names this target only where device 0 is that large.
[[test]]
name = "eager_training_memory"
path = "tests/eager_training_memory.rs"
required-features = ["live-gpu-tests"]
