name: GPU cluster (RunPod)

# Runs the two-HOST NCCL leg (`gang_nccl_two_hosts_reduce_a_known_vector`) on
# a RunPod CLUSTER — two pods, one A100 each, joined over the cluster's own
# private overlay network. Driven by `ci/scripts/runpod_gpu_cluster.sh` (see
# that script's own header for the exit contract, the cost derivation, and
# the artifact it assembles and pulls back). NEVER `gpu-gang.yml` — a
# separate driver, a separate RunPod object type (a cluster is retired by
# deleting the CLUSTER, never a member pod).
#
# COST BOUND (human-approved, S4's measured $1.908/GPU/h for a SECURE
# cluster GPU):
#
#   2 GPUs x $1.908/GPU/h = $3.816/h.
#
#   (i) terminate-succeeds (the ordinary path): ONE create (a cluster names
#       its data center directly -- no candidate walk), billing to
#       RP_TTL_HOURS=1:
#         1 h x $3.816/h = $3.82 per run.
#   (ii) sweep-only (the worst path -- member self-removal is UNMEASURED,
#       see runpod_lib.sh's own cluster-primitives header, and the EXIT
#       trap's own delete fails too): the cluster bills to its own TTL, then
#       gpu-reap.yml's 6-hourly `rp_cluster_sweep` is the backstop:
#         (1 + 6) h x $3.816/h = $26.71.
#
# `ci/scripts/test_gpu_cluster_lane.sh` re-derives both figures from the
# driver's own RP_TTL_HOURS and the $1.908 rate and fails if the printed
# figure and the mechanism disagree. Standing spend authorization
# (2026-09-13): <= 1 h billed, <= 2 runs.
#
# Off the merge path, and NEVER in the critical path of an automated
# workflow (the same doctrine gpu-prove.yml/gpu-gang.yml both state): GPU
# minutes cost money and capacity is intermittent. It fires on: the
# `run-cluster` PR label (opt-in per PR) and manual dispatch --
# deliberately NO `push:`, NO `schedule:`, and NO `workflow_call:` trigger,
# and nothing may `uses:` it: `ci/scripts/check_gpu_prove_once.py`'s P7/P8
# rules pin this `on:` block, and this workflow's exclusive ownership of the
# driver script, by name. Needs the `RUNPOD_API_KEY` repo secret.
#
# Nothing gates a release on this lane: the release verdict is
# `gpu-prove.yml`'s, consumed via `_gpu-proof-required.yml`. This lane
# produces EVIDENCE -- the cluster-leg gang artifact a human reviews and
# commits under `crates/jammi-kernels/artifacts/cuda-runs/`, where
# `ci/scripts/check_cuda_run_artifacts.py`'s `gang` kind (rule (k),
# `gang.leg == "cluster"`) is the schema gate for it.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

# Least privilege: this lane only reads the checkout; the RunPod side is
# driven by the RUNPOD_API_KEY secret, not the GitHub token.
permissions:
  contents: read

jobs:
  gpu-cluster:
    name: GPU cluster on RunPod (2 hosts x 1 A100)
    # Label event only runs for the `run-cluster` label; dispatch always
    # runs -- the same shape gpu-gang.yml's own `run-gang` gate uses.
    if: github.event_name != 'pull_request' || github.event.label.name == 'run-cluster'
    runs-on: ubuntu-latest
    # Concurrency is on the JOB (not the workflow) and NEVER cancels, for
    # the exact reason gpu-gang.yml's own header states: this job rents
    # hardware and cleans up in an EXIT trap; cancelling SIGKILLs the
    # runner, the trap never runs, and the CLUSTER it already rented is
    # orphaned (two GPUs, not one).
    concurrency:
      group: gpu-cluster-${{ github.ref }}
      cancel-in-progress: false
    # A job-timeout kill is another trap bypass, so this budget sits ABOVE
    # the driver's own T-10m internal budget cut. Derived from the SAME
    # terms as the cost bound above: the member-readiness poll
    # (RP_SSH_WAIT_SECS=300s=5m) + the id-file poll (another
    # RP_SSH_WAIT_SECS=5m) + the remote job's own RP_TIMEOUT (50m,
    # runpod_lib.sh's library default -- this lane declares no second one)
    # + 10m runner overhead = 70m. The cluster's own 1h entrypoint deadline
    # is what actually bounds the spend; this only bounds the runner.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      # The driver creates the cluster, waits for both members, ships the
      # NCCL id out of band, runs the two-host proof, assembles and pulls
      # the artifact, scans it for the id, and deletes the cluster on exit
      # via an EXIT trap -- best-effort, the same "SIGKILLed runner never
      # runs it" caveat every RunPod lane here carries. The real guarantee
      # is the deadline armed inside each member's own entrypoint plus the
      # gpu-reap sweep. Exit codes are the driver's own contract (its
      # header): 75 no cluster capacity, 76 inactivity kill, 77 wrong tree,
      # 97 wrong shape (a member's read-back failed), 124 budget cut. Every
      # one of them leaves this leg RED -- a leg that proved nothing is
      # never a silent green.
      #
      # The retry loop is capacity-only (rc 75) and bounded by
      # MAX_ATTEMPTS, "1" here: exactly one cluster create per run. A
      # cluster create names its data center directly (this driver's own
      # per-data-center availability read), so there is no candidate walk
      # to double the way the pod lane's does -- raising this is still a
      # deliberate, human cost decision, not a default.
      - name: Run the two-host NCCL proof on a real 2x1 A100 cluster (retry on capacity, fail closed)
        id: cluster
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GIT_REPO: https://github.com/${{ github.repository }}.git
          GIT_REF: ${{ github.head_ref || github.ref_name }}
          PROVE_EXPECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MAX_ATTEMPTS: "1"
        run: |
          set +e
          attempt=1
          while :; do
            bash ci/scripts/runpod_gpu_cluster.sh
            rc=$?
            if [ "$rc" -ne 75 ]; then
              echo "rc=$rc" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
            if [ "$attempt" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::no cluster capacity on RunPod (SUPPLY_CONSTRAINT) after ${attempt} attempt(s) -- this run is NOT cluster-proven. Operator action: re-run this workflow's failed job once capacity returns."
              echo "rc=$rc" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
            echo "::warning::no cluster capacity (SUPPLY_CONSTRAINT), attempt ${attempt}/${MAX_ATTEMPTS} -- retrying in 300s."
            sleep 300
            attempt=$((attempt + 1))
          done

      - name: Annotate a capacity failure
        if: always() && steps.cluster.outputs.rc == '75'
        run: echo "::warning::GPU cluster FAILED for capacity -- no data center offered the requested shape on RunPod (SUPPLY_CONSTRAINT), not a code regression. The run stays red (nothing was proven); re-run once capacity returns."

      - name: Annotate an inactivity-watchdog kill
        if: always() && steps.cluster.outputs.rc == '76'
        run: echo "::warning::GPU cluster FAILED for inactivity -- no new output on either rank's log for the watchdog threshold (a genuine hang, or the NCCL id never crossed hosts). A hung collective or a stuck id ship is exactly the failure mode this lane exists to surface -- read the run log before re-running."

      - name: Annotate a wrong-tree failure
        if: always() && steps.cluster.outputs.rc == '77'
        run: echo "::warning::GPU cluster FAILED for wrong tree -- a rank's own PROVE_SHA disagreed with PROVE_EXPECT_SHA (the ref moved between run creation and clone). Nothing was proven at the expected commit; re-run once the ref is stable."

      - name: Annotate a wrong-shape failure
        if: always() && steps.cluster.outputs.rc == '97'
        run: echo "::error::GPU cluster FAILED before proving anything -- a member's launch-time read-back failed (its Pod.args does not echo the shared entrypoint text, or neither a direct ssh endpoint nor an overlay-ip proxy path reaches it). Not a code regression; re-run, and if it repeats, RunPod's own CreateClusterRequest response is what needs looking at."

      - name: Annotate a budget cut
        if: always() && steps.cluster.outputs.rc == '124'
        run: echo "::error::GPU cluster was CUT by its own T-10m internal budget with a gating group unresolved -- the build plus the two-host proof did not fit inside this lane's approved 1h TTL. Raising RP_TTL_HOURS raises the bound and is a deliberate cost decision, never an automatic one."

      - name: Upload the pulled cluster artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-cluster-artifact-${{ github.run_id }}
          path: .gpu-pull/gpu-cluster/
          if-no-files-found: warn
          retention-days: 14
